# 카드뉴스 렌더 → PR 에 모아보기 붙이기
#
# 왜: 카드뉴스 렌더에는 한글 폰트(Noto CJK)와 크로미움이 필요하다. 로컬 PC 의 폰트가
#     기존 20편을 렌더한 것과 달라(지침: "21편부터 카드 질감이 갈린다") 사람 PC 에
#     의존하면 결과가 갈린다. 러너에서 매번 같은 환경을 깔아 쓴다.
#
# 사람 게이트: 지침이 "모아보기 PNG 를 반드시 눈으로 확인한다. 자동검사는 지저분한
#     줄바꿈을 못 잡는다" 고 못 박고 있다. 그래서 이 워크플로는 배포하지 않고
#     PR 만 만든다. 사람이 모아보기를 보고 머지해야 서가에 올라간다.
#
# 흐름: 루틴이 카피(studio/contents/**)와 편 메타(cardnews/cardnews.yaml)를 브랜치에
#     push → 이 워크플로가 렌더·반입해 같은 브랜치에 커밋하고 PR 을 연다
#     → 사람이 모아보기 확인 후 머지 → cardnews-sync 가 배포한다.
name: 카드뉴스 렌더

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'studio/contents/**'
      - 'cardnews/cardnews.yaml'
  workflow_dispatch:
    inputs:
      series:
        description: '시리즈 (예: 숫자노트)'
        required: true
      episode:
        description: '편 (예: EP4)'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cardnews-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # 렌더할 편을 push 범위(before..sha)의 diff 로 정하므로 이력이 있어야 한다.
      # 기본값(fetch-depth: 1)은 얕은 클론이라 before 가 없어 `fatal: bad object` 가 나고,
      # 그 실패가 빈 문자열로 삼켜져 skip=1 → 아무것도 렌더하지 않은 채 success 로 끝났다
      # (32793901152, 2026-08-25 확인).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f
          echo "설치된 Noto CJK:"; fc-list | grep -i "noto.*cjk" | head -5
          # 설치가 조용히 실패하면 폴백으로 그려진 카드가 그대로 자동 커밋된다.
          # 발행본과 글자가 통째로 달라지므로 여기서 끊는다.
          fc-list | grep -qi "noto.*cjk" || { echo "::error::Noto CJK 폰트 설치 실패"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r studio/requirements.txt

      # doctor 는 크로미움을 실제로 띄워 한글 폭을 재기 때문에 브라우저가 먼저 있어야 한다.
      # #110 에서 이 검사를 넣으면서 doctor 를 install 앞에 두는 바람에
      # "Executable doesn't exist ... chrome-headless-shell" 로 매번 여기서 끊겼다
      # (32568229306 · 32791931044 · 32793565614 — 3회 연속 실패, 2026-08-25 확인).
      - name: 크로미움 설치
        run: |
          pip install -q pyyaml
          python -m playwright install --with-deps chromium

      - name: 환경 점검 (크로미움이 CJK 폰트를 잡는지)
        run: |
          cd studio
          python cardnews.py doctor

      - name: 렌더할 편 결정
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.series }}" ]; then
            echo "series=${{ github.event.inputs.series }}" >> $GITHUB_OUTPUT
            echo "episode=${{ github.event.inputs.episode }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # push 로 들어온 경우: 이번 push 에서 바뀐 contents 파일에서 시리즈를 읽고
          # 그 파일의 마지막 EP 를 대상으로 잡는다.
          # before 를 못 쓰는 경우가 둘 있다 — 브랜치를 새로 만든 push(0000…)와
          # 강제 푸시 뒤. 그때는 마지막 커밋만 본다. 어느 쪽이든 git 실패를 빈 문자열로
          # 삼켜서는 안 된다(그러면 렌더 없이 success 로 끝난다).
          # core.quotepath=false 가 없으면 git 이 한글 경로를 "\354\210\253…" 으로 이스케이프해
          # 돌려준다. contents 파일은 전부 한글 이름이라(contents_숫자노트.py) 이게 없으면
          # basename·grep 이 파일을 못 찾고 시리즈·EP 가 쓰레기값이 된다.
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "범위: ${BEFORE}..${{ github.sha }}"
            CHANGED=$(git -c core.quotepath=false diff --name-only "$BEFORE" "${{ github.sha }}" -- studio/contents/ | head -1)
          else
            echo "::notice::before(${BEFORE:-없음})를 찾을 수 없어 마지막 커밋만 본다"
            CHANGED=$(git -c core.quotepath=false show --name-only --format= "${{ github.sha }}" -- studio/contents/ | head -1)
          fi
          if [ -z "$CHANGED" ]; then
            echo "::warning::studio/contents 에 바뀐 파일이 없어 렌더할 편을 정하지 못했다 — 렌더를 건너뛴다"
            echo "skip=1" >> $GITHUB_OUTPUT; exit 0
          fi
          SERIES=$(basename "$CHANGED" .py | sed 's/^contents_//')
          EP=$(grep -oE '^EP[0-9]+' "$CHANGED" | tail -1)
          # 여기서 비어 있으면 다음 단계가 빈 인자로 렌더를 부른다. 조용히 넘기지 않는다.
          if [ -z "$SERIES" ] || [ -z "$EP" ]; then
            echo "::error::시리즈·편을 못 읽었다 (파일=$CHANGED · 시리즈='$SERIES' · 편='$EP')"
            exit 1
          fi
          echo "series=$SERIES" >> $GITHUB_OUTPUT
          echo "episode=$EP" >> $GITHUB_OUTPUT
          echo "대상: $SERIES $EP"

      - name: 렌더 + 자동검사 + 모아보기
        if: steps.pick.outputs.skip != '1'
        run: python studio/cardnews.py render "${{ steps.pick.outputs.series }}" "${{ steps.pick.outputs.episode }}"

      - name: 갤러리로 반입 (webp 변환 포함)
        if: steps.pick.outputs.skip != '1'
        run: |
          sudo apt-get install -y -qq webp
          python tools/ingest_cardnews_from_studio.py "${{ steps.pick.outputs.series }}" "${{ steps.pick.outputs.episode }}"
          python tools/build_link_index.py

      # main 에서 workflow_dispatch 로 돌리면 산출물이 PR 없이 바로 배포된다.
      # 이 파이프라인의 유일한 사람 게이트를 우회하므로 커밋 자체를 막는다.
      # (실제로 2026-08-22 첫 시험에서 이렇게 main 에 들어가 되돌렸다.)
      - name: 커밋
        if: steps.pick.outputs.skip != '1' && github.ref != 'refs/heads/main'
        run: |
          if git diff --quiet -- cardnews/ link-index.json backlog.json; then
            echo "산출물 변화 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cardnews/ link-index.json backlog.json
          git commit -m "chore(cardnews): ${{ steps.pick.outputs.series }} ${{ steps.pick.outputs.episode }} 렌더 반입 [skip ci]"
          git push

      - name: 모아보기를 아티팩트로
        if: steps.pick.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: 모아보기-${{ steps.pick.outputs.series }}-${{ steps.pick.outputs.episode }}
          path: studio/out/**/*모아보기*
          if-no-files-found: warn

      - name: PR 본문 준비
        if: steps.pick.outputs.skip != '1' && github.ref != 'refs/heads/main'
        run: |
          {
            echo "자동 렌더 결과입니다. **모아보기를 눈으로 확인한 뒤 머지**해 주세요."
            echo ""
            echo "- 자동검사는 규격·세로 넘침·안전여백만 봅니다. **지저분한 줄바꿈은 못 잡습니다.**"
            echo "- 이상하면 머지하지 말고 코멘트만 남겨 주세요 → 카피를 줄여 다시 렌더합니다."
            echo "- 머지하면 서가(cardnews/)에 반영되고 Pages 가 배포합니다."
            echo ""
            echo "모아보기는 이 실행의 Artifacts 에서 받을 수 있고, Files changed 에서 컷 10장을 바로 볼 수 있습니다."
          } > /tmp/pr-body.md

      - name: PR 열기 (없으면)
        if: steps.pick.outputs.skip != '1' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="${GITHUB_REF#refs/heads/}"
          if gh pr view "$BR" >/dev/null 2>&1; then
            echo "PR 이미 있음 — 갱신됨"
          else
            TITLE="카드뉴스 ${{ steps.pick.outputs.series }} ${{ steps.pick.outputs.episode }}"
            gh pr create --base main --head "$BR" --title "$TITLE" --body-file /tmp/pr-body.md
          fi

      - name: main 에서 돌린 경우 안내
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "### ⚠️ main 에서 실행됨 — 렌더만 하고 커밋하지 않았습니다"
            echo ""
            echo "이 워크플로는 **PR 을 통해서만** 배포합니다. 사람이 모아보기를 보고"
            echo "머지하는 것이 유일한 품질 게이트이기 때문입니다."
            echo ""
            echo "렌더 결과는 이 실행의 **Artifacts** 에서 받아 확인하실 수 있습니다."
            echo "실제로 반영하시려면 브랜치를 만들어 카피를 올리거나,"
            echo "그 브랜치에서 이 워크플로를 다시 실행해 주세요."
          } >> $GITHUB_STEP_SUMMARY

      - name: 실패 알림용 요약
        if: always()
        run: |
          {
            echo "### 카드뉴스 렌더"
            echo "- 대상: ${{ steps.pick.outputs.series }} ${{ steps.pick.outputs.episode }}"
            echo "- 결과: ${{ job.status }}"
          } >> $GITHUB_STEP_SUMMARY
