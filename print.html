<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>담기함 모아보기 — 이룬 서재</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<style>
  :root{
    --bg:#FFF8F0; --card:#FFFFFF; --line:#EFE6DA; --line2:#F1E9DD;
    --ink:#2B2622; --muted:#8A7E72; --accent:#E8743B; --accent-soft:#FCEDE1;
    --chip:#F7F1E8; --maxw:820px;
  }
  :root[data-theme=dark]{
    --bg:#1a1613; --card:#241f1a; --line:#3a322a; --line2:#332c25;
    --ink:#f0e8de; --muted:#a99d8e; --accent:#F2894C; --accent-soft:#3a2a1e;
    --chip:#2c251e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Nunito,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.75}
  a{color:inherit}
  .bar{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:12px 20px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .bar .home{font-weight:800;text-decoration:none;font-size:.95rem}
  .bar .home span{color:var(--accent)}
  .bar .sp{flex:1}
  .btn{border:1.3px solid var(--accent);background:var(--accent);color:#fff;
    border-radius:999px;padding:7px 16px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:28px 20px 70px}
  h1.pt{font-size:1.6rem;margin:0 0 4px}
  .lead{color:var(--muted);font-size:.9rem;margin:0 0 6px}
  .toc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:14px 18px;margin:18px 0 26px}
  .toc h2{font-size:.95rem;margin:0 0 8px}
  .toc ol{margin:0;padding-left:20px;font-size:.9rem}
  .toc li{margin:3px 0}
  .toc .sec{font-size:.72rem;font-weight:800;color:var(--muted);margin-right:6px}
  .doc{border-top:2px solid var(--line);padding-top:22px;margin-top:34px}
  .doc:first-of-type{border-top:none;margin-top:0}
  .dhead{margin:0 0 14px}
  .dhead .sec{font-size:.72rem;font-weight:800;color:var(--accent)}
  .dhead h2{font-size:1.35rem;margin:3px 0 4px;line-height:1.35}
  .dhead .meta{font-size:.8rem;color:var(--muted)}
  .body h1{font-size:1.35rem;margin:18px 0 10px}
  .body h2{font-size:1.1rem;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line2)}
  .body h3{font-size:1rem;margin:16px 0 6px}
  .body p{margin:0 0 12px}
  .body ul,.body ol{margin:0 0 12px;padding-left:22px}
  .body blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--accent);
    background:var(--accent-soft);border-radius:0 8px 8px 0}
  .body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
  .body th,.body td{border:1px solid var(--line);padding:7px 10px;text-align:left}
  .body th{background:var(--chip);font-weight:800}
  .body img{max-width:100%;height:auto;border-radius:10px}
  .body pre{background:var(--chip);border:1px solid var(--line);border-radius:10px;
    padding:12px;overflow-x:auto;font-size:.85rem}
  .body code{background:var(--chip);border-radius:4px;padding:1px 4px}
  .body pre code{background:none;padding:0}
  .cuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
  .cuts img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
  .wl{color:var(--accent);text-decoration:none}
  .wl-pending{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.9}
  .err{color:var(--muted);font-size:.86rem;background:var(--chip);
    border-radius:8px;padding:10px 14px}

  @media print{
    .bar{display:none !important}
    body{background:#fff;color:#000;font-size:10.5pt}
    .wrap{max-width:none;padding:0}
    .toc{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
    .doc{break-before:page;border-top:none;padding-top:0;margin-top:0}
    .doc:first-of-type{break-before:auto}
    .dhead h2{font-size:16pt}
    .body h2{font-size:12pt;break-after:avoid}
    .body img,.body table,.cuts{break-inside:avoid}
    .body pre{white-space:pre-wrap}
    a{text-decoration:none;color:#000}
    .wl::after{content:" (" attr(data-t) ")";font-size:.8em;color:#555}
  }
</style>
</head>
<body>
<div class="bar">
  <a class="home" href="./">이룬 <span>서재</span></a>
  <span class="sp"></span>
  <button class="btn" onclick="window.print()">인쇄</button>
  <button class="btn ghost" id="copy">마크다운 복사</button>
  <button class="btn ghost" id="clear">비우기</button>
</div>

<div class="wrap" id="wrap">
  <h1 class="pt">담기함 모아보기</h1>
  <p class="lead" id="lead">불러오는 중…</p>
  <div id="out"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
(function(){ try{ if(localStorage.getItem("stTheme")==="dark")
  document.documentElement.setAttribute("data-theme","dark"); }catch(e){} })();

var KEY="stBasket";
var LABEL={research:"리서치",videos:"영상노트",guides:"가이드",math:"수학사",
           blog:"블로그",cardnews:"카드뉴스",concept:"개념노트"};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function nrm(s){ return String(s||"").replace(/\s+/g," ").trim(); }

var ITEMS=[], LINKIDX={}, LINKENT=[], MD={};

function load(){
  try{ var v=JSON.parse(localStorage.getItem(KEY)||"[]"); return Array.isArray(v)?v:[]; }
  catch(e){ return []; }
}

/* 위키링크는 인쇄본에서도 무엇을 가리키는지 남긴다 — 종이에서는 링크가 죽으므로
   제목을 괄호로 덧붙인다(@media print 의 .wl::after). */
function renderWikilinks(md){
  return md.replace(/\[\[([^\]\[|]+?)(?:\|([^\]\[]*))?\]\]/g,function(m,t,l){
    var key=nrm(t), disp=esc(l?nrm(l):key);
    var i=LINKIDX[key], e=(typeof i==="number")?LINKENT[i]:null;
    /* 종이에서는 링크가 죽으므로 어느 서가인지를 괄호로 남긴다(@media print) */
    if(e) return '<a class="wl" data-t="'+esc(LABEL[e["섹션"]]||e["섹션"]||"")+'" href="'+esc(e.url)+'">'+disp+'</a>';
    return '<span class="wl-pending">'+disp+'</span>';
  });
}

function renderMD(md){
  md=md.replace(/\r\n/g,"\n");
  var defs={};
  md=md.replace(/^\[\^([^\]]+)\]:[ \t]*(.*(?:\n(?!\s*$)(?!\[\^).*)*)/gm,function(m,id,txt){
    defs[id.trim()]=txt.replace(/\s*\n\s*/g," ").trim(); return "";
  });
  var num={}, order=[];
  md=md.replace(/\[\^([^\]]+)\]/g,function(m,id){
    id=id.trim(); if(!(id in defs)) return m;
    if(!(id in num)){ order.push(id); num[id]=order.length; }
    return '<sup>['+num[id]+']</sup>';
  });
  md=renderWikilinks(md);
  var html=marked.parse(md);
  if(order.length){
    html+='<hr><p style="font-size:.86rem"><b>용어 주석</b></p><ol style="font-size:.86rem">'+
      order.map(function(id){ return '<li><b>'+esc(id)+'</b> '+marked.parseInline(defs[id])+'</li>'; }).join("")+
      '</ol>';
  }
  return html;
}

/* 서가 갤러리는 자기 폴더 안에서 열리므로 본문의 상대 경로가 그대로 맞지만,
   이 페이지는 루트에 있어 한 칸 어긋난다(블로그 썸네일이 이렇게 깨졌다).
   담을 때 받아 둔 기준 폴더(b)에 맞춰 다시 붙인다. */
function rebase(html, base){
  if(!base) return html;
  var d=document.createElement("div");
  d.innerHTML=html;
  d.querySelectorAll("img[src], a[href]").forEach(function(el){
    /* 위키링크 주소는 link-index 가 준 루트 기준이라 손대면 깨진다 */
    if(el.classList.contains("wl")) return;
    var at=el.tagName==="IMG"?"src":"href", v=el.getAttribute(at)||"";
    if(!v || /^(https?:|data:|mailto:|#|\/)/.test(v)) return;
    el.setAttribute(at, base+v);
  });
  return d.innerHTML;
}

/* 서가마다 본문이 다르다 — 마크다운, 이미 HTML 인 것, 이미지 묶음. */
function renderDoc(it, i){
  var head='<div class="dhead"><div class="sec">'+esc(LABEL[it.s]||it.s)+'</div>'+
    '<h2 id="d'+i+'">'+esc(it.t)+'</h2>'+
    (it.m?'<div class="meta">'+esc(it.m)+'</div>':'')+'</div>';

  if(it.kind==="cuts"){
    var imgs=(it.imgs||[]).map(function(src){
      /* 인쇄본에서는 lazy 를 쓰지 않는다 — 화면 밖 컷이 빈칸으로 인쇄된다 */
      return '<img loading="eager" src="'+esc(src)+'" alt="">';
    }).join("");
    return '<section class="doc">'+head+'<div class="cuts">'+imgs+'</div>'+
      (it.cap?'<p style="white-space:pre-wrap;font-size:.88rem">'+esc(it.cap)+'</p>':'')+'</section>';
  }
  var raw=MD[it.p];
  if(raw==null) return '<section class="doc">'+head+
    '<p class="err">본문을 불러오지 못했습니다 — <code>'+esc(it.p)+'</code></p></section>';
  var base = it.b || (it.p ? it.p.slice(0, it.p.lastIndexOf("/")+1) : "");
  var body = rebase(it.kind==="html" ? raw : renderMD(raw), base);
  return '<section class="doc">'+head+'<div class="body">'+body+'</div></section>';
}

function paint(){
  var out=document.getElementById("out"), lead=document.getElementById("lead");
  if(!ITEMS.length){
    lead.textContent="";
    out.innerHTML='<p class="empty">담기함이 비어 있습니다.<br>'+
      '서가에서 <b>담기</b>를 눌러 모은 뒤 다시 오세요.<br>'+
      '<a href="./">이룬 서재로 돌아가기</a></p>';
    return;
  }
  var by={};
  ITEMS.forEach(function(i){ by[i.s]=(by[i.s]||0)+1; });
  lead.textContent = ITEMS.length+"편 · "+
    Object.keys(by).map(function(s){return (LABEL[s]||s)+" "+by[s];}).join(" · ");

  var toc='<div class="toc"><h2>담긴 것</h2><ol>'+
    ITEMS.map(function(it,i){
      return '<li><span class="sec">'+esc(LABEL[it.s]||it.s)+'</span>'+
        '<a href="#d'+i+'">'+esc(it.t)+'</a></li>';
    }).join("")+'</ol></div>';

  out.innerHTML = toc + ITEMS.map(renderDoc).join("");
  if(window.renderMathInElement){
    try{ renderMathInElement(out,{delimiters:[
      {left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}
    ],throwOnError:false}); }catch(e){}
  }
}

document.getElementById("clear").addEventListener("click",function(){
  if(!confirm("담기함을 비울까요?")) return;
  try{ localStorage.setItem(KEY,"[]"); }catch(e){}
  ITEMS=[]; paint();
});
document.getElementById("copy").addEventListener("click",function(){
  var md=ITEMS.map(function(it){
    var raw=MD[it.p];
    return "# "+it.t+"\n\n> "+(LABEL[it.s]||it.s)+(it.m?" · "+it.m:"")+"\n\n"+
      (it.kind==="cuts" ? "(카드뉴스 "+((it.imgs||[]).length)+"장)\n" : (raw||"(본문 없음)"));
  }).join("\n\n---\n\n");
  navigator.clipboard.writeText(md).then(function(){
    alert("복사됐습니다 ("+md.length.toLocaleString()+"자)");
  }).catch(function(){ alert("복사 실패 — 브라우저 권한을 확인해 주세요"); });
});

(async function(){
  ITEMS=load();
  try{
    var li=await (await fetch("link-index.json",{cache:"no-store"})).json();
    LINKIDX=li.alias||{}; LINKENT=li.entries||[];
  }catch(e){}
  await Promise.all(ITEMS.filter(function(i){return i.p;}).map(function(i){
    return fetch(i.p,{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){ MD[i.p]=t; })
      .catch(function(){ MD[i.p]=null; });
  }));
  paint();
})();
</script>
</body>
</html>
