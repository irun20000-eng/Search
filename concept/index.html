<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>개념노트 — 이룬 서재</title>
<meta name="description" content="카드뉴스에서 나온 개념을 한 장 그림과 한 편의 글로 정리했습니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/topbar.css" />
<link rel="stylesheet" href="../assets/basket.css" />
<style>
  :root{
    --bg:#FFF8F0; --card:#FFFFFF; --line:#EFE6DA; --line2:#F1E9DD;
    --ink:#2B2622; --muted:#8A7E72; --accent:#E8743B; --accent-soft:#FCEDE1;
    --chip:#F7F1E8; --maxw:1080px;
    --shadow:0 6px 22px rgba(120,90,60,.08);
    --barbg:rgba(255,248,240,.92);
  }
  :root[data-theme=dark]{
    --bg:#1a1613; --card:#241f1a; --line:#3a322a; --line2:#332c25;
    --ink:#f0e8de; --muted:#a99d8e; --accent:#F2894C; --accent-soft:#3a2a1e;
    --chip:#2c251e;
    --shadow:0 6px 22px rgba(0,0,0,.35);
    --barbg:rgba(26,22,19,.92);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Nunito,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.75}
  a{color:inherit}
  .tbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:5px 12px;font:inherit;font-size:.8rem;cursor:pointer}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:32px 20px 60px}
  h1{font-size:2rem;margin:0 0 6px;letter-spacing:-.02em}
  .lead{color:var(--muted);margin:0 0 22px;font-size:.95rem}
  .sbar{display:flex;gap:8px;align-items:center;margin:0 0 14px}
  .sbar input{flex:1;min-width:0;border:1.4px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:.9rem}
  .sbar input:focus{outline:none;border-color:var(--accent)}
  .sbar .cnt{font-size:.82rem;color:var(--muted);white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .nc{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;
    cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;
    box-shadow:var(--shadow);transition:transform .14s,border-color .14s}
  .nc:hover{transform:translateY(-3px);border-color:var(--accent)}
  .nc .pic{aspect-ratio:1536/1024;background:var(--chip);border-bottom:1.5px solid var(--line);overflow:hidden}
  .nc .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .nc .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:7px;flex:1}
  .nc h3{margin:0;font-size:1.06rem;font-weight:800;line-height:1.45;letter-spacing:-.01em}
  .nc .from{font-size:.79rem;color:var(--muted)}
  .nc .foot{font-size:.76rem;color:var(--muted);margin-top:auto;padding-top:8px;
    display:flex;align-items:center;gap:6px}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:.72rem;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 8px}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  /* ── 글 보기 ── */
  .ov{position:fixed;inset:0;z-index:60;background:rgba(20,14,8,.5);backdrop-filter:blur(3px);
    display:none;overflow:auto;padding:28px 16px}
  .ov.on{display:block}
  .sheet{max-width:820px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);
    border-radius:20px;padding:34px 34px 46px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sheet .close{float:right;border:1px solid var(--line);background:var(--bg);color:var(--muted);
    border-radius:999px;width:34px;height:34px;font-size:1.1rem;cursor:pointer;line-height:1}
  .meta{color:var(--muted);font-size:.85rem;margin:0 0 10px}
  .hero{width:100%;border-radius:14px;border:1px solid var(--line);margin:0 0 6px;display:block;cursor:zoom-in}
  .herocap{font-size:.79rem;color:var(--muted);margin:0 0 22px;text-align:center}
  /* 개념한장 확대 — 원본 1536x1024 를 화면 가득 */
  .zoom{position:fixed;inset:0;z-index:80;background:rgba(12,8,4,.88);display:none;
    align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .zoom.on{display:flex}
  .zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .zoom .zclose{position:absolute;top:16px;right:18px;border:1px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.4);color:#fff;border-radius:999px;width:38px;height:38px;
    font-size:1.15rem;cursor:pointer;line-height:1}
  .zoom .zdl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:.85rem;text-decoration:none;border:1px solid rgba(255,255,255,.4);
    border-radius:999px;padding:7px 16px;background:rgba(0,0,0,.4)}
  .post h1{font-size:1.66rem;line-height:1.35;margin:4px 0 12px}
  .post h2{font-size:1.2rem;margin:30px 0 10px;padding-top:16px;border-top:1px solid var(--line2)}
  .post h3{font-size:1.03rem;margin:22px 0 8px}
  .post p{margin:0 0 14px}
  .post ul,.post ol{margin:0 0 14px;padding-left:22px}
  .post li{margin:4px 0}
  .post blockquote{margin:16px 0;padding:12px 16px;border-left:3px solid var(--accent);
    background:var(--accent-soft);border-radius:0 10px 10px 0}
  .post blockquote p:last-child{margin:0}
  .post table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.92rem;display:block;overflow-x:auto}
  .post th,.post td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  .post th{background:var(--chip);font-weight:800}
  .post code{background:var(--chip);border-radius:5px;padding:1px 5px;font-size:.9em}
  .post pre{background:var(--chip);border:1px solid var(--line);border-radius:12px;
    padding:14px;overflow-x:auto}
  .post pre code{background:none;padding:0}
  .post img{max-width:100%;height:auto;border-radius:12px}
  .wl{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
  .wl-pending{color:var(--muted);border-bottom:1px dotted var(--muted)}
  .fnref a{color:var(--accent);text-decoration:none;font-weight:800}
  .fnsep{border:none;border-top:1px solid var(--line);margin:30px 0 14px}
  .fntitle{font-size:1rem;margin:0 0 8px}
  .fnlist{font-size:.9rem;color:var(--muted);padding-left:20px}
  .fnlist li{margin:6px 0}
  .fnterm{font-weight:800;color:var(--ink);margin-right:6px}
  .fnback{text-decoration:none;color:var(--accent)}
  footer{border-top:1px solid var(--line);color:var(--muted);font-size:.83rem;
    padding:22px 20px 40px;text-align:center}
  footer code{background:var(--chip);border-radius:5px;padding:1px 5px}
  @media(max-width:640px){.wrap{padding:24px 15px 50px}.sheet{padding:24px 18px 36px}h1{font-size:1.6rem}}
  /* 담기는 카드 내용 길이와 무관하게 늘 카드 오른쪽 아래 같은 자리에 온다.
     grid 는 같은 행의 카드 높이를 맞춰 주므로 margin-top:auto 면 눈높이가 맞는다. */
  .cardfoot{display:flex;justify-content:flex-end;align-items:center;
    margin-top:auto;padding-top:10px}
  .fspacer{flex:1}
</style>
</head>
<body>
<script src="../assets/topbar.js" data-section="concept" data-root="../"></script>
<span data-itb-slot><button class="tbtn" id="tbtn" onclick="toggleTheme()">🌙 다크</button></span>

<div class="wrap">
  <h1>개념노트</h1>
  <p class="lead">카드뉴스로 다 담지 못한 개념을 한 장 그림과 한 편의 글로 정리했습니다. 이름과 정의가 있고, 출처로 확인되는 개념만 다룹니다.</p>
  <div class="sbar"><input id="sq" type="search" placeholder="이 서가에서 찾기 — 제목·태그" aria-label="개념노트 검색"><span class="cnt" id="scnt"></span></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">아직 글이 없습니다.</div>
</div>

<footer>글은 <code>concept/notes/&lt;슬러그&gt;.md</code>에 한 편씩 저장되고, 이 페이지는 <code>concept/manifest.json</code>을 읽어 카드를 산출합니다. 정본은 옵시디언 볼트이며 <code>tools/ingest_concept.py</code>로 반입합니다.</footer>

<div class="zoom" id="zoom" onclick="if(event.target===this||event.target.tagName==='IMG')closeZoom()">
  <button class="zclose" onclick="closeZoom()" aria-label="닫기">✕</button>
  <img id="zimg" alt="개념 한 장 확대" />
  <a class="zdl" id="zdl" download>원본 내려받기</a>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)closeNote()">
  <div class="sheet">
    <button class="close" onclick="closeNote()">✕</button>
    <div class="meta" id="nmeta"></div>
    <img class="hero" id="nhero" alt="개념 한 장" style="display:none" onclick="openZoom()" />
    <p class="herocap" id="nherocap" style="display:none">그림을 누르면 크게 볼 수 있습니다</p>
    <div class="post" id="nbody"></div>
  </div>
</div>

<script src="../assets/basket.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
/* 테마 저장 키는 이룬 서재 전체가 stTheme 하나로 통일돼 있다(CLAUDE.md). */
function applyTheme(t){
  var de=document.documentElement;
  if(t==="dark"){ de.setAttribute("data-theme","dark"); } else { de.removeAttribute("data-theme"); }
  var b=document.getElementById("tbtn"); if(b) b.textContent=(t==="dark"?"☀️ 라이트":"🌙 다크");
}
function initTheme(){ var t="light"; try{ t=localStorage.getItem("stTheme")||"light"; }catch(e){} applyTheme(t); }
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
  var nt=cur==="dark"?"light":"dark";
  try{ localStorage.setItem("stTheme",nt); }catch(e){}
  applyTheme(nt);
}
initTheme();
Basket.init({section:"concept", root:"../"});

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function nrm(s){ return String(s||"").replace(/\s+/g," ").trim(); }

var NOTES=[], LINKIDX={}, LINKENT=[];

/* 위키링크를 살린다 — link-index.json 이 서가 경계를 넘게 해 준다.
   볼트에서 [[최적 정지]] 로 이동하듯 웹에서도 이동한다. */
function renderWikilinks(md){
  return md.replace(/\[\[([^\]\[|]+?)(?:\|([^\]\[]*))?\]\]/g, function(m,t,l){
    var key=nrm(t), disp=esc(l?nrm(l):key);
    var i=LINKIDX[key], e=(typeof i==="number")?LINKENT[i]:null;
    if(e) return '<a class="wl" href="../'+esc(e.url)+'">'+disp+'</a>';
    return '<span class="wl-pending" title="아직 작성되지 않은 문서">'+disp+'</span>';
  });
}

/* 마크다운 + 용어 주석([^라벨]). [n]·[국내1] 같은 출처 표기는 건드리지 않는다. */
function renderMD(md){
  md=md.replace(/\r\n/g,"\n");
  var defs={};
  md=md.replace(/^\[\^([^\]]+)\]:[ \t]*(.*(?:\n(?!\s*$)(?!\[\^).*)*)/gm, function(m,id,txt){
    defs[id.trim()]=txt.replace(/\s*\n\s*/g," ").trim(); return "";
  });
  var num={}, order=[];
  md=md.replace(/\[\^([^\]]+)\]/g, function(m,id){
    id=id.trim(); if(!(id in defs)) return m;
    if(!(id in num)){ order.push(id); num[id]=order.length; }
    var n=num[id];
    return '<sup class="fnref"><a id="fnref-'+n+'" href="#fn-'+n+'">'+n+'</a></sup>';
  });
  md=renderWikilinks(md);
  var html=marked.parse(md);
  if(order.length){
    var items=order.map(function(id,i){
      return '<li id="fn-'+(i+1)+'"><span class="fnterm">'+esc(id)+'</span>'+
      marked.parseInline(defs[id])+' <a href="#fnref-'+(i+1)+'" class="fnback" title="본문으로">↩</a></li>';
    }).join("");
    html+='<hr class="fnsep"><section class="footnotes" aria-label="용어 주석">'+
      '<h3 class="fntitle">용어 주석</h3><ol class="fnlist">'+items+'</ol></section>';
  }
  return html;
}

function cardHTML(n){
  return '<div class="nc" role="button" tabindex="0" data-slug="'+esc(n.slug)+'">'+
    (n.pic ? '<div class="pic"><img loading="lazy" src="assets/'+esc(n.pic)+'" alt=""></div>' : '')+
    '<div class="body"><h3>'+esc(n.title.split(" — ")[0])+'</h3>'+
    (n.cardnews ? '<div class="from">'+esc(n.cardnews)+'</div>' : '')+
    '<div class="tags">'+(n.tags||[]).slice(0,4).map(function(t){
      return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>'+
    '<div class="foot">'+esc(n.date)+' · '+n.chars.toLocaleString()+'자'+
    '<span class="fspacer"></span>'+Basket.button({k:n.slug})+'</div>'+
    '</div></div>';
}

function matches(n, q){
  if(!q) return true;
  var hay=(n.title+" "+(n.tags||[]).join(" ")+" "+(n.cardnews||"")).toLowerCase();
  return hay.indexOf(q)>=0;
}
function paint(){
  var q=(document.getElementById("sq").value||"").trim().toLowerCase();
  var list=NOTES.filter(function(n){ return matches(n,q); });
  document.getElementById("scnt").textContent = q ? list.length+"편" : "";
  document.getElementById("grid").innerHTML=list.map(cardHTML).join("");
  var em=document.getElementById("empty");
  em.textContent = q ? '"'+q+'" — 찾는 글이 없습니다' : "아직 글이 없습니다.";
  em.style.display=list.length?"none":"";
  Array.prototype.forEach.call(document.querySelectorAll(".nc"),function(b){
    b.addEventListener("click",function(){ openNote(b.dataset.slug); });
  });
  Basket.keyable(document, ".nc");
  Basket.wire(document, function(k){
    var n=NOTES.filter(function(x){return x.slug===k})[0];
    if(!n) return null;
    return { t:n.title.split(" — ")[0], m:(n.level||n.depth||"")+" · "+n.date,
             u:"concept/#n="+k, p:"concept/notes/"+k+".md", b:"concept/", kind:"md" };
  });
}

function openNote(slug){
  var n=NOTES.filter(function(x){return x.slug===slug})[0];
  if(!n) return;
  var ov=document.getElementById("ov"), body=document.getElementById("nbody");
  document.getElementById("nmeta").textContent=(n.level||n.depth)+" · "+n.date+(n.cardnews?" · "+n.cardnews:"");
  var hero=document.getElementById("nhero");
  var hcap=document.getElementById("nherocap");
  if(n.pic){
    hero.src="assets/"+n.pic; hero.style.display=""; hcap.style.display="";
    document.getElementById("zimg").src="assets/"+n.pic;
    document.getElementById("zdl").href="assets/"+n.pic;
  } else { hero.style.display="none"; hcap.style.display="none"; }
  body.innerHTML='<p class="meta">불러오는 중…</p>';
  ov.classList.add("on"); document.body.style.overflow="hidden";
  location.hash="n="+slug;
  fetch("notes/"+slug+".md",{cache:"no-store"}).then(function(r){
    if(!r.ok) throw 0; return r.text();
  }).then(function(t){
    body.innerHTML=renderMD(t);
    ov.scrollTop=0;
  }).catch(function(){
    body.innerHTML='<p class="meta">글을 불러오지 못했습니다.</p>';
  });
}
function closeNote(){
  document.getElementById("ov").classList.remove("on");
  document.body.style.overflow="";
  if(location.hash.indexOf("#n=")===0) history.replaceState(null,"",location.pathname);
}
function openZoom(){
  var z=document.getElementById("zoom");
  if(!document.getElementById("zimg").src) return;
  z.classList.add("on");
}
function closeZoom(){ document.getElementById("zoom").classList.remove("on"); }
/* Esc 는 확대가 열려 있으면 확대부터 닫는다 — 글까지 함께 닫히면 성가시다 */
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(document.getElementById("zoom").classList.contains("on")) closeZoom();
  else closeNote();
});
window.addEventListener("hashchange",function(){
  var h=location.hash;
  if(h.indexOf("#n=")===0){ openNote(decodeURIComponent(h.slice(3))); }
  else if(document.getElementById("ov").classList.contains("on")){
    document.getElementById("ov").classList.remove("on");
    document.body.style.overflow="";
  }
});

document.getElementById("sq").addEventListener("input", paint);
/* / 를 누르면 검색창으로 — 허브와 같은 규약 */
document.addEventListener("keydown", function(e){
  if(e.key!=="/" || e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA") return;
  e.preventDefault(); document.getElementById("sq").focus();
});

Promise.all([
  fetch("manifest.json",{cache:"no-store"}).then(function(r){return r.json()}),
  fetch("../link-index.json",{cache:"no-store"}).then(function(r){return r.json()}).catch(function(){return {};})
]).then(function(res){
  NOTES=res[0].notes||[];
  LINKIDX=res[1].alias||{}; LINKENT=res[1].entries||[];
  paint();
  var h=location.hash;
  if(h.indexOf("#n=")===0) openNote(decodeURIComponent(h.slice(3)));
}).catch(function(){
  document.getElementById("grid").innerHTML='<p class="empty">manifest.json 을 불러오지 못했습니다.</p>';
});
</script>
</body>
</html>
