<script>
/* ---------- 자체 마크다운 렌더러 ----------
   노트가 쓰는 문법만 처리한다: ## 제목 / > 인용 / - 불릿(2칸 중첩) /
   **굵게** *기울임* `코드` [링크](url) / --- / 문단.
   외부 CDN에 의존하지 않아 오프라인·차단 환경에서도 노트가 열린다. */

/* ── 인용 [n] → 출처 잇기 ────────────────────────────────
   가이드는 자체 렌더러를 쓰므로 렌더 결과 DOM 을 후처리한다.
   문자열 치환이 아니라 텍스트 노드를 걸어, 이미 만들어진 태그를 건드리지 않는다.
   출처 섹션에 실제로 있는 번호만 링크화한다 — 배열 인덱스 같은 걸 오탐하지 않기 위해서다. */
function gLinkCites(root){
  // 두 가이드가 각각 [1]..[n] 을 쓰므로 문서 슬러그를 붙여 id 를 고유하게 만든다
  var post=root.closest('.post');
  var uid='src-'+((post&&post.dataset.slug)||'g')+'-';
  var map={}, lists=[];
  [].slice.call(root.querySelectorAll('h1,h2,h3'))
    .filter(function(h){ return /^출처/.test((h.textContent||'').trim()); })
    .forEach(function(h){
      var el=h.nextElementSibling;
      while(el && !/^H[123]$/.test(el.tagName)){
        if(/^(UL|OL)$/.test(el.tagName)){
          lists.push(el); el.classList.add('srclist');
          [].slice.call(el.children).forEach(function(li){
            var m=/^\s*\[(\d{1,3})\]\s*([\s\S]*)$/.exec(li.textContent||'');
            if(!m) return;
            li.id=uid+m[1];
            var u=/(https?:\/\/\S+)/.exec(m[2]);
            map[m[1]]={ text:m[2].replace(/\s*[\u00b7\u2014-]?\s*https?:\/\/[\s\S]*$/,'').trim(),
                        url:u?u[1]:'' };
          });
        }
        el=el.nextElementSibling;
      }
    });
  if(!Object.keys(map).length) return;

  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue || n.nodeValue.indexOf('[')<0) return NodeFilter.FILTER_REJECT;
    var p=n.parentElement;
    while(p && p!==root){
      if(p.tagName==='A'||p.tagName==='CODE'||p.tagName==='PRE') return NodeFilter.FILTER_REJECT;
      if(lists.indexOf(p)>=0) return NodeFilter.FILTER_REJECT;
      p=p.parentElement;
    }
    return NodeFilter.FILTER_ACCEPT;
  }});
  var nodes=[],nd;
  while((nd=walker.nextNode())) nodes.push(nd);

  nodes.forEach(function(node){
    var v=node.nodeValue, re=/\[(\d{1,3})\]/g, m, last=0;
    var frag=document.createDocumentFragment(), any=false;
    while((m=re.exec(v))){
      if(!map[m[1]]) continue;
      if(m.index>last) frag.appendChild(document.createTextNode(v.slice(last,m.index)));
      var a=document.createElement('a');
      a.className='cite'; a.href='#'+uid+m[1]; a.setAttribute('data-s',m[1]); a.textContent='['+m[1]+']';
      frag.appendChild(a); last=m.index+m[0].length; any=true;
    }
    if(!any) return;
    if(last<v.length) frag.appendChild(document.createTextNode(v.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });

  var tip=document.getElementById('gtip');
  if(!tip){ tip=document.createElement('div'); tip.id='gtip'; document.body.appendChild(tip); }
  [].slice.call(root.querySelectorAll('a.cite')).forEach(function(c){
    var src=map[c.getAttribute('data-s')];
    c.addEventListener('mouseenter',function(){
      if(!src) return;
      var host=''; try{ host=new URL(src.url).hostname.replace(/^www\./,''); }catch(e){}
      tip.innerHTML='<b>'+esc(src.text)+'</b>'+(host?'<span>'+esc(host)+'</span>':'');
      tip.classList.add('show');
      var r=c.getBoundingClientRect();
      var top=r.bottom+8, left=Math.min(r.left, window.innerWidth-352);
      if(top+tip.offsetHeight>window.innerHeight-10) top=Math.max(10,r.top-tip.offsetHeight-8);
      tip.style.top=top+'px'; tip.style.left=Math.max(10,left)+'px';
    });
    c.addEventListener('mouseleave',function(){ tip.classList.remove('show'); });
    c.addEventListener('click',function(ev){
      ev.preventDefault();
      var el=root.querySelector('#'+uid+c.getAttribute('data-s'));
      if(!el) return;
      el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); },1500);
    });
  });
}
function mdEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function mdInline(s){
  s=mdEsc(s);
  // 코드 스팬을 먼저 빼둔다. 안 그러면 `a*b*c` 안까지 강조가 먹는다.
  var spans=[];
  s=s.replace(/`([^`]+)`/g,function(m,c){spans.push(c);return '\u0000'+(spans.length-1)+'\u0000'});
  // URL은 괄호 1단계 중첩까지 허용 (예: .../wiki/함수_(수학) )
  // 스킴은 http/https/mailto/상대경로/앵커만 허용 — javascript: 등 실행 스킴 차단
  s=s.replace(/\[([^\]]+)\]\(((?:[^()\s]|\([^()]*\))+)\)/g,function(m0,txt,url){
    var u=url.trim();
    var sch=u.match(/^([A-Za-z][A-Za-z0-9+.-]*):/);           // 스킴이 있을 때만 검사
    if(sch&&!/^(https?|mailto)$/i.test(sch[1])) return mdEsc('['+txt+']('+url+')');
    if(/[<>"]/.test(u)) return mdEsc('['+txt+']('+url+')');      // 속성 탈출 방지
    return '<a href="'+u.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+txt+'</a>';
  });
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // 여는 * 뒤에 공백이 오면 강조로 보지 않는다 ("5 * 3 회", "src/*.md" 같은 문장 보호)
  s=s.replace(/\*([^*\s][^*]*?)\*/g,'<em>$1</em>');
  // 맨 URL 자동 링크 — 출처 목록의 주소를 모바일에서 눌러 열 수 있게 한다.
  // 이미 만들어진 <a> 태그는 자리표시자로 빼둬야 href 안의 URL이 중복 처리되지 않는다.
  var anchors=[];
  s=s.replace(/<a\s[^>]*>.*?<\/a>/g,function(m){anchors.push(m);return '\u0001'+(anchors.length-1)+'\u0001'});
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<>"'`)\]]+)/g,function(m,pre,u){
    var tail=''; 
    while(/[.,;:]$/.test(u)){tail=u.slice(-1)+tail;u=u.slice(0,-1)}   // 문장부호는 링크에서 뺀다
    return pre+'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'+tail;
  });
  s=s.replace(/\u0001(\d+)\u0001/g,function(m,i){return anchors[+i]});
  s=s.replace(/\u0000(\d+)\u0000/g,function(m,i){return '<code>'+spans[+i]+'</code>'});
  return s;
}
function mdEmitList(items,i,level,out){
  out.push('<ul>');
  while(i<items.length&&items[i].lvl>=level){
    if(items[i].lvl>level){i++;continue}
    out.push('<li>'+items[i].html);
    if(i+1<items.length&&items[i+1].lvl>level){
      i=mdEmitList(items,i+1,items[i+1].lvl,out);
    } else { i++; }
    out.push('</li>');
  }
  out.push('</ul>');
  return i;
}
function mdRender(md){
  var lines=String(md).replace(/\r/g,'').split('\n'),out=[],buf=[],items=[];
  function flushPara(){if(buf.length){out.push('<p>'+mdInline(buf.join(' '))+'</p>');buf=[]}}
  function flushList(){if(items.length){
    var min=items[0].lvl; for(var k=1;k<items.length;k++) if(items[k].lvl<min) min=items[k].lvl;
    mdEmitList(items,0,min,out); items=[]}}
  function flushAll(){flushPara();flushList()}
  for(var i=0;i<lines.length;i++){
    var ln=lines[i],t=ln.trim();
    if(!t){flushAll();continue}
    var m;
    // 코드블록 (``` … ```)
    if(t.slice(0,3)==='\u0060\u0060\u0060'){
      flushAll();var code=[];i++;
      while(i<lines.length&&lines[i].trim().slice(0,3)!=='\u0060\u0060\u0060'){code.push(lines[i]);i++}
      out.push('<pre><code>'+mdEsc(code.join('\n'))+'</code></pre>');continue;
    }
    // 표 (| a | b | / |---|---| / …)
    if(t.charAt(0)==='|'&&i+1<lines.length&&/^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])){
      flushAll();
      var cells=function(r){var s=r.trim().replace(/^\|/,'').replace(/\|$/,'');return s.split('|').map(function(x){return mdInline(x.trim())})};
      var th=cells(lines[i]);i+=2;var rows=[];
      while(i<lines.length&&lines[i].trim().charAt(0)==='|'){rows.push(cells(lines[i]));i++}
      i--;
      out.push('<table><thead><tr>'+th.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr></thead><tbody>'
        +rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')
        +'</tbody></table>');continue;
    }
    if((m=ln.match(/^(\s*)[-*]\s+(.*)$/))){
      flushPara();
      items.push({lvl:Math.floor(m[1].replace(/\t/g,'  ').length/2),html:mdInline(m[2])});
      continue;
    }
    flushList();
    if((m=t.match(/^(#{1,6})\s+(.*)$/))){flushPara();out.push('<h'+m[1].length+'>'+mdInline(m[2])+'</h'+m[1].length+'>');continue}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){flushPara();out.push('<hr>');continue}
    if((m=t.match(/^>\s?(.*)$/))){flushPara();
      var q=[m[1]];
      while(i+1<lines.length&&/^>\s?/.test(lines[i+1].trim())){i++;q.push(lines[i].trim().replace(/^>\s?/,''))}
      out.push('<blockquote>'+mdInline(q.join(' '))+'</blockquote>');continue}
    if(/^\d+\.\s/.test(t)){flushPara();out.push('<p>'+mdInline(t)+'</p>');continue}  // TL;DR 번호줄은 각각 한 문단
    buf.push(t);
  }
  flushAll();
  return out.join('\n');
}

Basket.init({section:"guides", root:"../"});
var MANIFEST="manifest.json", GUIDES=[];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function thumb(id){return 'https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg'}
function thumbFb(id){return 'https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/mqdefault.jpg'}
function fmtDur(s){s=+s||0;var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?(h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')):(String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'))}
function hay(g){return (g.title+' '+g.summary+' '+(g.tags||[]).join(' ')).toLowerCase()}
function cover(g){return (g.videos&&g.videos.length)?thumb(g.videos[0].id):''}

function vidCards(vs){
  if(!vs||!vs.length)return '';
  return '<div class="vidgrid">'+vs.map(function(v){
    return '<a class="vidcard" href="https://youtu.be/'+esc(v.id)+'" target="_blank" rel="noopener">'
      +'<img loading="lazy" src="'+thumb(v.id)+'" onerror="this.onerror=null;this.src=\''+thumbFb(v.id)+'\'" alt="">'
      +'<div class="vt">'+esc(v.title)+'</div>'
      +'<div class="vm"><span>'+esc(v.channel)+'</span><span>⏱ '+fmtDur(v.duration)+'</span></div></a>'}).join('')+'</div>';
}
function buildTabs(){
  var n={},order=['입문','중급','고급'];
  GUIDES.forEach(function(g){n[g.level]=(n[g.level]||0)+1});
  var h='<button class="tab on" data-lv="*">전체 <span class="n">'+GUIDES.length+'</span></button>';
  order.forEach(function(l){if(n[l])h+='<button class="tab" data-lv="'+l+'">'+l+' <span class="n">'+n[l]+'</span></button>'});
  document.getElementById('tabs').innerHTML=h;
}
function buildTags(){
  var seen={},list=[];
  GUIDES.forEach(function(g){(g.tags||[]).forEach(function(t){if(!seen[t]){seen[t]=1;list.push(t)}})});
  list.sort();
  document.getElementById('filters').innerHTML='<button class="tagf on" data-tag="*">전체</button>'
    +list.map(function(t){return '<button class="tagf" data-tag="'+esc(t)+'">#'+esc(t)+'</button>'}).join('');
}
function buildCards(){
  document.getElementById('grid').innerHTML=GUIDES.map(function(g){
    var c=cover(g);
    return '<a class="gcard gd" href="#g-'+esc(g.slug)+'" data-lv="'+esc(g.level)+'" data-tags="'+esc((g.tags||[]).join('|'))
      +'" data-date="'+esc(g.date)+'" data-min="'+(+g.minutes||0)+'" data-title="'+esc(g.title)+'" data-search="'+esc(hay(g))+'">'
      +(c?'<img class="thumb" loading="lazy" src="'+c+'" alt="">':'<div class="thumb"></div>')
      +'<div class="body"><div class="gmeta"><span class="lv" data-lv="'+esc(g.level)+'">'+esc(g.level)+'</span>'
      +'<span class="tm">⏱ 약 '+esc(g.minutes)+'분 · 영상 '+((g.videos||[]).length)+'편</span></div>'
      +'<div class="ttl">'+esc(g.title)+'</div>'
      +'<div class="one">'+esc(g.summary)+'</div>'
      +'<div class="cardfoot">'+Basket.button({k:g.slug})+'</div></div></a>'}).join('');
  Basket.wire(document.getElementById('grid'), function(k){
    var g=GUIDES.filter(function(x){return x.slug===k})[0];
    if(!g) return null;
    return { t:g.title, m:g.level+(g.date?" · "+g.date:""),
             u:"guides/#g="+k, p:"guides/"+g.path, kind:"md" };
  });
}
function buildPosts(){
  document.getElementById('posts').innerHTML=GUIDES.map(function(g){
    var chips=(g.tags||[]).slice(0,6).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');
    return '<details class="post" id="g-'+esc(g.slug)+'" data-src="'+esc(g.path)+'" data-slug="'+esc(g.slug)+'">'
      +'<summary><div class="phead">'+(cover(g)?'<img loading="lazy" src="'+cover(g)+'" alt="">':'')+'<div>'
      +'<span class="eyebrow"><span class="dot"></span>'+esc(g.level)+' · 약 '+esc(g.minutes)+'분</span>'
      +'<h2 class="ptitle">'+esc(g.title)+'</h2>'
      +'<div class="pmeta"><span class="chip">📅 '+esc(g.date)+'</span>'+chips+'</div>'
      +'</div></div><span class="caret">▾</span></summary>'
      +'<div class="pbody"><div class="pactions"><button class="copyb" data-anchor="g-'+esc(g.slug)+'">🔗 링크 복사</button>'
      +'<a class="watch" href="'+esc(g.path)+'" target="_blank" rel="noopener">📄 원문 .md ↗</a></div>'
      +'<div class="note"><div class="skel">가이드를 불러오는 중…</div></div>'
      +'<a class="top" href="#top">↑ 갤러리로</a></div></details>'}).join('');
}
function loadGuide(d){
  if(d.dataset.loaded)return; d.dataset.loaded='1';
  var box=d.querySelector('.note'), g=GUIDES.filter(function(x){return x.slug===d.dataset.slug})[0];
  fetch(d.dataset.src,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
  .then(function(md){
    md=md.replace(/^---[\s\S]*?\n---\s*/,'').replace(/^#\s+.*\n/,'');
    box.innerHTML=mdRender(md);
    gLinkCites(box);
    // '## 관련 영상' 자리에 검증된 영상 카드 삽입
    var hs=box.querySelectorAll('h2');
    for(var i=0;i<hs.length;i++){
      if(/관련 영상/.test(hs[i].textContent)){
        var w=document.createElement('div'); w.innerHTML=vidCards(g&&g.videos);
        hs[i].parentNode.insertBefore(w,hs[i].nextSibling); break;
      }
    }
  }).catch(function(e){
    box.innerHTML='<div class="err">가이드를 불러오지 못했습니다 ('+esc(e.message)+'). '
      +'<a href="'+esc(d.dataset.src)+'" target="_blank" rel="noopener">원문 .md 열기 ↗</a></div>';
  });
}
var st={q:'',tag:'*',lv:'*',sort:'new'};
var cmp={'new':function(a,b){return (b.dataset.date||'').localeCompare(a.dataset.date||'')},
 'time':function(a,b){return (+a.dataset.min||0)-(+b.dataset.min||0)},
 'title':function(a,b){return (a.dataset.title||'').localeCompare(b.dataset.title||'','ko')}};
function apply(){
  var grid=document.getElementById('grid'),cards=[].slice.call(grid.children);
  cards.sort(cmp[st.sort]); cards.forEach(function(c){grid.appendChild(c)});
  var n=0;
  cards.forEach(function(c){
    var tags=(c.dataset.tags||'').split('|');
    var show=(st.lv==='*'||c.dataset.lv===st.lv)&&(st.tag==='*'||tags.indexOf(st.tag)>=0)
      &&(st.q===''||(c.dataset.search||'').indexOf(st.q)>=0);
    c.style.display=show?'':'none'; if(show)n++;
  });
  document.getElementById('cnt').textContent='표시 '+n+'개';
}
function wire(){
  var qEl=document.getElementById('q');
  qEl.addEventListener('input',function(){st.q=this.value.toLowerCase().trim();apply()});
  document.getElementById('sortSel').addEventListener('change',function(){st.sort=this.value;apply()});
  document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});t.classList.add('on');
    st.lv=t.dataset.lv;apply()}});
  document.querySelectorAll('.tagf').forEach(function(t){t.onclick=function(){
    document.querySelectorAll('.tagf').forEach(function(x){x.classList.remove('on')});t.classList.add('on');
    st.tag=t.dataset.tag;apply()}});
  document.addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus()}});
  document.querySelectorAll('.gcard').forEach(function(c){c.addEventListener('click',function(e){
    e.preventDefault();var d=document.querySelector(c.getAttribute('href'));
    if(d){d.open=true;loadGuide(d);d.scrollIntoView({behavior:'smooth',block:'start'})}})});
  document.querySelectorAll('details.post').forEach(function(d){
    d.addEventListener('toggle',function(){if(d.open)loadGuide(d)})});
  document.querySelectorAll('.copyb').forEach(function(btn){btn.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();var url=location.origin+location.pathname+'#'+btn.dataset.anchor;
    var ok=function(){var o=btn.textContent;btn.textContent='✓ 복사됨';setTimeout(function(){btn.textContent=o},1400)};
    if(navigator.clipboard){navigator.clipboard.writeText(url).then(ok).catch(function(){prompt('링크 복사:',url)})}else{prompt('링크 복사:',url)}})});
  (function(){var f=document.querySelector('.filters');if(!f)return;
    var chips=[].slice.call(f.querySelectorAll('.tagf')),N=17,exp=false;
    if(chips.length<=N)return;
    var more=document.createElement('button');more.className='tagf more';more.type='button';
    function ap(){f.classList.toggle('expanded',exp);chips.forEach(function(c,i){c.style.display=(i<N||exp||c.classList.contains('on'))?'':'none'});
      if(exp){f.insertBefore(more,f.firstChild)}else{f.appendChild(more)}
      more.textContent=exp?'접기 ▲':('＋'+(chips.length-N)+'개 더보기 ▾');if(exp)f.scrollTop=0}
    more.onclick=function(){exp=!exp;ap()};f.appendChild(more);ap();
    f.addEventListener('click',function(e){if(e.target.classList.contains('tagf')&&!e.target.classList.contains('more'))setTimeout(ap,0)})})();
}
function openHash(){if(!location.hash)return;
  var d=null; try{ d=document.querySelector(location.hash); }catch(e){ return; }
  if(d&&d.tagName==='DETAILS'){d.open=true;loadGuide(d);d.scrollIntoView({block:'start'})}}
var bar=document.getElementById('bar'),fab=document.getElementById('fabTop');
function sc(){var h=document.documentElement;bar.style.width=((h.scrollTop)/(h.scrollHeight-h.clientHeight)*100)+'%';if(fab){fab.classList.toggle('show',h.scrollTop>400)}}
document.addEventListener('scroll',sc,{passive:true});sc();
if(fab){fab.onclick=function(){window.scrollTo({top:0,behavior:'smooth'})}}
var tb=document.getElementById('themeBtn'),bd=document.body;
try{var sv=localStorage.getItem('stTheme')||localStorage.getItem('vgTheme');if(sv){bd.setAttribute('data-theme',sv)}}catch(e){}
function syncTb(){tb.textContent=bd.getAttribute('data-theme')==='dark'?'◐ 라이트':'◑ 다크'}
syncTb();
tb.onclick=function(){var d=bd.getAttribute('data-theme')==='dark';var nt=d?'light':'dark';bd.setAttribute('data-theme',nt);try{localStorage.setItem('stTheme',nt);localStorage.setItem('vgTheme',nt)}catch(e){}syncTb()};
fetch(MANIFEST,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  GUIDES=d.guides||[];
  document.getElementById('countLine').innerHTML='총 '+GUIDES.length+'개 · 최종 갱신 '+esc(d.generated||'')+' · <span id="cnt">표시 '+GUIDES.length+'개</span>';
  buildTabs();buildTags();buildCards();buildPosts();wire();apply();openHash();
  window.addEventListener('hashchange',openHash);sc();
}).catch(function(e){
  var g=document.getElementById('grid');
  if(!GUIDES.length){ g.innerHTML='<div class="err">가이드 데이터를 불러오지 못했습니다: '+esc(e.message)+'</div>'; }
  else { console.error('렌더 오류:',e); }});
</script>
