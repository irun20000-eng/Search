<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>블로그 — 이룬 서재</title>
<meta name="description" content="바깥에 발행한 글을 여기서 전문으로 읽습니다. 수학 개념 · AI 활용 · 입시를 다룹니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<!-- 도해 전용. 블로그 SVG 는 Pretendard 로 조판돼(brand.css) 좌표가 그 폭에 맞춰져 있다.
     다른 폰트로 그리면 글자가 상자를 넘어 잘린다 — 본문 폰트(Nunito)는 그대로 둔다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/topbar.css" />
<link rel="stylesheet" href="../assets/basket.css" />
<style>
  :root{
    --bg:#FFF8F0; --card:#FFFFFF; --line:#EFE6DA; --line2:#F1E9DD;
    --ink:#2B2622; --muted:#8A7E72; --accent:#E8743B; --accent-soft:#FCEDE1;
    --chip:#F7F1E8;
    --p-math:#1F7A4D; --p-math-bg:#E4F1EA;
    --p-ai:#0A6B7D; --p-ai-bg:#E2F0F3;
    --p-adm:#8A6212; --p-adm-bg:#F6EEDC;
    --maxw:1080px;
    --shadow:0 6px 22px rgba(120,90,60,.08);
    --barbg:rgba(255,248,240,.92);
  }
  :root[data-theme=dark]{
    --bg:#1a1613; --card:#241f1a; --line:#3a322a; --line2:#332c25;
    --ink:#f0e8de; --muted:#a99d8e; --accent:#F2894C; --accent-soft:#3a2a1e;
    --chip:#2c251e;
    --p-math:#6FCB9F; --p-math-bg:#1d3129;
    --p-ai:#72B7C6; --p-ai-bg:#182e33;
    --p-adm:#D9B268; --p-adm-bg:#332a18;
    --shadow:0 6px 22px rgba(0,0,0,.35);
    --barbg:rgba(26,22,19,.92);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Nunito,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7}
  a{color:inherit}
  .tbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:5px 12px;font:inherit;font-size:.8rem;cursor:pointer}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:32px 20px 60px}
  h1{font-size:2rem;margin:0 0 6px;letter-spacing:-.02em}
  .lead{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  .sbar{display:flex;gap:8px;align-items:center;margin:0 0 14px}
  .sbar input{flex:1;min-width:0;border:1.4px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:.9rem}
  .sbar input:focus{outline:none;border-color:var(--accent)}
  .sbar .cnt{font-size:.82rem;color:var(--muted);white-space:nowrap}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
  .f{border:1.4px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}
  .f.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .pc{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px;
    cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:9px;
    box-shadow:var(--shadow);transition:transform .14s,border-color .14s}
  .pc:hover{transform:translateY(-3px);border-color:var(--accent)}
  .pc .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{font-size:.72rem;font-weight:800;border-radius:999px;padding:2px 9px}
  .pill.math{color:var(--p-math);background:var(--p-math-bg)}
  .pill.ai{color:var(--p-ai);background:var(--p-ai-bg)}
  .pill.admissions{color:var(--p-adm);background:var(--p-adm-bg)}
  .pc .d{font-size:.78rem;color:var(--muted)}
  .pc h3{margin:0;font-size:1.06rem;font-weight:800;line-height:1.45;letter-spacing:-.01em}
  .pc .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .tag{font-size:.72rem;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 8px}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  .ov{position:fixed;inset:0;z-index:60;background:rgba(20,14,8,.5);backdrop-filter:blur(3px);
    display:none;overflow:auto;padding:28px 16px}
  .ov.on{display:block}
  .sheet{max-width:820px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);
    border-radius:20px;padding:34px 34px 46px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sheet .close{float:right;border:1px solid var(--line);background:var(--bg);color:var(--muted);
    border-radius:999px;width:34px;height:34px;font-size:1.1rem;cursor:pointer;line-height:1}
  .post h1{font-size:1.7rem;line-height:1.35;margin:6px 0 10px}
  .post h2{font-size:1.2rem;margin:30px 0 10px;padding-top:16px;border-top:1px solid var(--line2)}
  .post p{margin:0 0 14px}
  .post ul,.post ol{margin:0 0 14px;padding-left:22px}
  .post li{margin:4px 0}
  .post blockquote{margin:16px 0;padding:12px 16px;border-left:3px solid var(--accent);
    background:var(--accent-soft);border-radius:0 10px 10px 0}
  .post blockquote p:last-child{margin:0}
  .post table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.92rem;display:block;overflow-x:auto}
  .post th,.post td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  .post th{background:var(--chip);font-weight:800}
  .post img{max-width:100%;height:auto;border-radius:12px;margin:8px 0}
  .post svg{max-width:100%;height:auto}
  .post pre{background:var(--chip);border:1px solid var(--line);border-radius:12px;
    padding:14px;overflow-x:auto;font-size:.86rem}
  .post .fig{margin:18px 0;text-align:center}
  .post .caption{font-size:.83rem;color:var(--muted);margin-top:6px}

  /* ── 도해 팔레트 — 원천 Blog 리포 published/2026/<슬러그>/brand.css 가 정본 ──
     노트 SVG 는 색을 var(--green) 류로 부른다. ingest_blog.py 가 본문·이미지만
     가져오고 brand.css 를 안 가져와서 이 변수들이 미정의였다. 미정의 var() 는
     SVG 에서 검정으로 떨어지므로 도해가 통째로 새까맣게 뭉갰다 — 19/22편·499자리,
     라이트·다크 양쪽. 값은 필라별로 갈리고 openPost 가 .post 에 data-pillar 를 심는다.
     ※ 손으로 고치지 말 것. brand.css 가 바뀌면 거기서 다시 옮겨 온다. */
  .post .fig{--ink:#131a12;--ink-soft:#5a6356;--green:#3d6600;--green-deep:#243b00;
    --green-soft:#f1f8dc;--amber:#6b5a00;--amber-soft:#fbf6dc;--line:#e0e6d5;--paper:#fafbf6}
  .post[data-pillar=ai] .fig{--ink:#101e22;--ink-soft:#4e6167;--green:#06657a;--green-deep:#00323d;
    --green-soft:#e4f6fa;--amber:#0a7c94;--amber-soft:#e4f6fa;--line:#d6e7ec;--paper:#f7fcfd}
  .post[data-pillar=admissions] .fig{--ink:#1e1a10;--ink-soft:#625a48;--green:#7a5a00;--green-deep:#3a2a00;
    --green-soft:#fcf3d8;--amber:#8a6a00;--amber-soft:#fcf3d8;--line:#ebe3cc;--paper:#fdfbf3}
  .post .fig svg{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}

  /* 도해는 흰 지면 전제로 그려졌다(brand.css --bg:#ffffff). 다크에서 색을 뒤집으면
     --green-deep 처럼 글자 58회·배경 12회로 겸용된 변수가 뒤집혀 읽히므로,
     색은 그대로 두고 도해에만 제 지면을 깔아 준다 — math/ 수학사 도해와 같은 규약. */
  :root[data-theme=dark] .post .fig{background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:16px 14px 12px}
  :root[data-theme=dark] .post .fig .caption{color:var(--ink-soft)}
  .meta{color:var(--muted);font-size:.85rem;margin:0 0 4px}
  footer{border-top:1px solid var(--line);color:var(--muted);font-size:.83rem;
    padding:22px 20px 40px;text-align:center}
  footer code{background:var(--chip);border-radius:5px;padding:1px 5px}
  @media(max-width:640px){.wrap{padding:24px 15px 50px}.sheet{padding:24px 18px 36px}h1{font-size:1.6rem}}
  /* 담기는 카드 내용 길이와 무관하게 늘 카드 오른쪽 아래 같은 자리에 온다.
     grid 는 같은 행의 카드 높이를 맞춰 주므로 margin-top:auto 면 눈높이가 맞는다. */
  .cardfoot{display:flex;justify-content:flex-end;align-items:center;
    margin-top:auto;padding-top:10px}
  .fspacer{flex:1}
</style>
</head>
<body>
<script src="../assets/topbar.js" data-section="blog" data-root="../"></script>
<span data-itb-slot><button class="tbtn" id="tbtn" onclick="toggleTheme()">🌙 다크</button></span>

<div class="wrap">
  <h1>블로그</h1>
  <p class="lead">바깥에 발행한 글을 여기서 전문으로 읽습니다. 원고는 옵시디언 볼트와 같은 파일입니다.</p>
  <div class="sbar"><input id="sq" type="search" placeholder="이 서가에서 찾기 — 제목·태그" aria-label="블로그 검색"><span class="cnt" id="scnt"></span></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">해당하는 글이 없습니다.</div>
</div>

<footer>글은 <code>blog/notes/&lt;슬러그&gt;.md</code>에 한 편씩 저장되고, 이 페이지는 <code>blog/manifest.json</code>을 읽어 카드·필터를 산출합니다. 원천은 <code>irun20000-eng/Blog</code> 리포이며 <code>tools/ingest_blog.py</code>로 반입합니다.</footer>

<div class="ov" id="ov" onclick="if(event.target===this)closePost()">
  <div class="sheet">
    <button class="close" onclick="closePost()">✕</button>
    <div class="meta" id="pmeta"></div>
    <div class="post" id="pbody"></div>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../assets/basket.js"></script>
<script>
/* 테마 저장 키는 이룬 서재 전체가 stTheme 하나로 통일돼 있다(CLAUDE.md). */
function applyTheme(t){
  var de=document.documentElement;
  if(t==="dark"){ de.setAttribute("data-theme","dark"); } else { de.removeAttribute("data-theme"); }
  var b=document.getElementById("tbtn"); if(b) b.textContent = (t==="dark"?"☀️ 라이트":"🌙 다크");
}
function initTheme(){ var t="light"; try{ t=localStorage.getItem("stTheme")||"light"; }catch(e){} applyTheme(t); }
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
  var nt=cur==="dark"?"light":"dark";
  try{ localStorage.setItem("stTheme",nt); }catch(e){}
  applyTheme(nt);
}
initTheme();
Basket.init({section:"blog", root:"../"});

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var POSTS=[], PILLARS=[], filt="all";

function cardHTML(p){
  return '<div class="pc" role="button" tabindex="0" data-slug="'+esc(p.slug)+'">'+
    '<div class="top"><span class="pill '+esc(p.pillar)+'">'+esc(p.pillar_ko)+'</span>'+
    '<span class="d">'+esc(p.date)+'</span></div>'+
    '<h3>'+esc(p.title)+'</h3>'+
    '<div class="tags">'+(p.tags||[]).slice(0,3).map(function(t){
      return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>'+
    '<div class="cardfoot">'+Basket.button({k:p.slug})+'</div>'+
    '</div>';
}

function matches(p, q){
  if(!q) return true;
  var hay=(p.title+" "+(p.tags||[]).join(" ")+" "+(p.series||"")).toLowerCase();
  return hay.indexOf(q)>=0;
}
function paint(){
  var q=(document.getElementById("sq").value||"").trim().toLowerCase();
  var list = (filt==="all" ? POSTS : POSTS.filter(function(p){return p.pillar===filt}))
             .filter(function(p){ return matches(p,q); });
  var c=document.getElementById("scnt");
  c.textContent = q ? list.length+"편" : "";
  document.getElementById("grid").innerHTML = list.map(cardHTML).join("");
  var em=document.getElementById("empty");
  em.textContent = q ? '"'+q+'" — 찾는 글이 없습니다' : "해당하는 글이 없습니다.";
  em.style.display = list.length ? "none" : "";
  Array.prototype.forEach.call(document.querySelectorAll(".pc"), function(b){
    b.addEventListener("click", function(){ openPost(b.dataset.slug); });
  });
  Basket.keyable(document, ".pc");
  Basket.wire(document, function(k){
    var p=POSTS.filter(function(x){return x.slug===k})[0];
    if(!p) return null;
    return { t:p.title, m:p.pillar_ko+" · "+p.date,
             u:"blog/#b="+k, p:"blog/notes/"+k+".md", b:"blog/", kind:"html" };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".f"), function(b){
    b.classList.toggle("on", b.dataset.k===filt);
  });
}

function openPost(slug){
  var p = POSTS.filter(function(x){return x.slug===slug})[0];
  if(!p) return;
  var ov=document.getElementById("ov"), body=document.getElementById("pbody");
  /* 도해 팔레트가 필라별로 갈린다 — CSS 가 .post[data-pillar=…] 로 골라 쓴다. */
  body.dataset.pillar = p.pillar || "math";
  document.getElementById("pmeta").textContent = p.pillar_ko + " · " + p.date + (p.series ? " · " + p.series : "");
  body.innerHTML = '<p class="meta">불러오는 중…</p>';
  ov.classList.add("on"); document.body.style.overflow="hidden";
  location.hash = "b=" + slug;
  fetch("notes/"+slug+".md", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw 0; return r.text();
  }).then(function(t){
    body.innerHTML = t;
    if(window.renderMathInElement){
      try{ renderMathInElement(body, {delimiters:[
        {left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}
      ], throwOnError:false}); }catch(e){}
    }
    ov.scrollTop = 0;
  }).catch(function(){
    body.innerHTML = '<p class="meta">글을 불러오지 못했습니다.</p>';
  });
}
function closePost(){
  document.getElementById("ov").classList.remove("on");
  document.body.style.overflow="";
  if(location.hash.indexOf("#b=")===0) history.replaceState(null,"",location.pathname);
}
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closePost(); });

/* 뒤로가기·앞으로가기로 해시가 바뀌면 따라간다 — 없으면 글을 연 뒤 뒤로가기가 먹지 않는다 */
window.addEventListener("hashchange", function(){
  var h=location.hash;
  if(h.indexOf("#b=")===0){ openPost(decodeURIComponent(h.slice(3))); }
  else if(document.getElementById("ov").classList.contains("on")){
    document.getElementById("ov").classList.remove("on");
    document.body.style.overflow="";
  }
});

document.getElementById("sq").addEventListener("input", paint);
/* / 를 누르면 검색창으로 — 허브와 같은 규약 */
document.addEventListener("keydown", function(e){
  if(e.key!=="/" || e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA") return;
  e.preventDefault(); document.getElementById("sq").focus();
});

fetch("manifest.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
  POSTS = d.posts||[]; PILLARS = d.pillars||[];
  document.getElementById("filters").innerHTML =
    '<button class="f on" data-k="all">전체 '+POSTS.length+'</button>' +
    PILLARS.map(function(p){
      var n = POSTS.filter(function(x){return x.pillar===p.key}).length;
      return '<button class="f" data-k="'+esc(p.key)+'">'+esc(p.label)+' '+n+'</button>';
    }).join("");
  document.getElementById("filters").addEventListener("click", function(e){
    var b=e.target.closest(".f"); if(!b) return;
    filt=b.dataset.k; paint();
  });
  paint();
  var h=location.hash;
  if(h.indexOf("#b=")===0) openPost(decodeURIComponent(h.slice(3)));
}).catch(function(){
  document.getElementById("grid").innerHTML =
    '<p class="empty">manifest.json 을 불러오지 못했습니다.</p>';
});
</script>
</body>
</html>
