<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>쓸 거리 — 이룬 서재</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/basket.css" />
<style>
  :root{
    --bg:#FFF8F0; --card:#FFFFFF; --line:#EFE6DA; --ink:#2B2622; --muted:#8A7E72;
    --accent:#E8743B; --accent-soft:#FCEDE1; --chip:#F7F1E8;
    --shadow:0 4px 16px rgba(120,90,60,.07);
    --c-research:#C2703A; --c-videos:#3E7D6B; --c-guides:#4A6FA5;
    --c-math:#7A5EA8; --c-concept:#B0562F;
  }
  :root[data-theme=dark]{
    --bg:#1a1613; --card:#241f1a; --line:#3a322a; --ink:#f0e8de; --muted:#a99d8e;
    --accent:#F2894C; --accent-soft:#3a2a1e; --chip:#2c251e;
    --shadow:0 4px 16px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Nunito,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7}
  a{color:inherit}
  .bar{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:12px 20px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .bar .home{font-weight:800;text-decoration:none;font-size:.95rem}
  .bar .home span{color:var(--accent)}
  .bar .sp{flex:1}
  .tbtn{border:1.4px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}

  .wrap{max-width:940px;margin:0 auto;padding:30px 20px 80px}
  h1{font-size:1.75rem;margin:0 0 8px;letter-spacing:-.02em}
  .lead{color:var(--muted);font-size:.95rem;margin:0 0 4px}
  .stat{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
  .s{background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:10px 16px;box-shadow:var(--shadow)}
  .s b{display:block;font-size:1.3rem;line-height:1.2}
  .s span{font-size:.76rem;color:var(--muted)}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 8px}
  .kt{border:1.4px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:7px 15px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
  .kt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .note{font-size:.86rem;color:var(--muted);margin:0 0 18px;line-height:1.65}

  .sbar{display:flex;gap:10px;align-items:center;margin:0 0 16px}
  .sbar input{flex:1;min-width:0;border:1.4px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:.9rem}
  .sbar input:focus{outline:none;border-color:var(--accent)}
  .sbar .cnt{font-size:.82rem;color:var(--muted);white-space:nowrap}

  .row{background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
  .rh{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;
    width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left}
  .rh:hover{background:var(--chip)}
  .cnum{flex:none;min-width:52px;text-align:right;font-weight:800;font-size:1.05rem;
    color:var(--accent);font-variant-numeric:tabular-nums}
  .cnum i{font-style:normal;font-size:.72rem;color:var(--muted);font-weight:700;margin-left:2px}
  .nm{flex:1;min-width:0;font-weight:700;font-size:1rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kd{flex:none;font-size:.72rem;font-weight:800;border-radius:999px;padding:2px 9px;
    background:var(--chip);color:var(--muted)}
  .kd.companion{background:var(--accent-soft);color:var(--accent)}
  .kd.gap{background:#FDE7E1;color:#C0392B}
  :root[data-theme=dark] .kd.gap{background:#4a2018;color:#F08A72}
  .ar{flex:none;color:var(--muted);font-size:.8rem;transition:transform .16s}
  .row.open .ar{transform:rotate(90deg)}
  .rb{display:none;padding:2px 16px 14px 80px;border-top:1px solid var(--line)}
  .row.open .rb{display:block}
  .rb p{margin:10px 0 8px;font-size:.83rem;color:var(--muted)}
  .rb ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  .rb li{display:flex;align-items:baseline;gap:8px;font-size:.88rem}
  .shelf{flex:none;font-size:.71rem;font-weight:800;padding:1px 8px;border-radius:999px;
    background:var(--chip);color:var(--muted);white-space:nowrap}
  .shelf.research{color:var(--c-research)} .shelf.videos{color:var(--c-videos)}
  .shelf.guides{color:var(--c-guides)} .shelf.math{color:var(--c-math)}
  .shelf.concept{color:var(--c-concept)}
  .rb li a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rb li em{flex:none;font-style:normal;font-size:.76rem;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:50px 0}
  footer{border-top:1px solid var(--line);margin-top:44px;padding:22px 0 0;
    font-size:.8rem;color:var(--muted);line-height:1.8}
  footer code{background:var(--chip);border-radius:4px;padding:1px 6px;font-size:.95em}
</style>
</head>
<body>
<div class="bar">
  <a class="home" href="./">이룬 <span>서재</span></a>
  <span class="sp"></span>
  <button class="tbtn" id="tbtn" onclick="toggleTheme()">🌙 다크</button>
</div>

<div class="wrap">
  <h1>쓸 거리</h1>
  <p class="lead">글 속에서 <b>이미 불러 놓고 아직 안 쓴 이름</b>들입니다.
    여러 글이 반복해서 부를수록 먼저 쓸 값이 있습니다.</p>

  <div class="stat" id="stat"></div>
  <p class="note" id="gen"></p>

  <div class="tabs" id="tabs"></div>
  <p class="note" id="kindnote"></p>

  <div class="sbar">
    <input id="q" type="search" placeholder="이름·부르는 글로 찾기" autocomplete="off" />
    <span class="cnt" id="cnt"></span>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty" style="display:none"></p>

  <footer>
    <code>tools/build_backlog.py</code> 가 일곱 서가의 <code>[[위키링크]]</code> 를 훑어
    <code>backlog.json</code> 을 만듭니다. 새 글을 쓰고
    <code>build_link_index.py</code> 를 돌리면 그 이름은 이 목록에서 사라집니다.
  </footer>
</div>

<script src="assets/basket.js"></script>
<script>
"use strict";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t==="dark"?"dark":"light");
  var b=document.getElementById("tbtn"); if(b) b.textContent = t==="dark" ? "☀️ 라이트" : "🌙 다크";
}
function toggleTheme(){
  var t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  applyTheme(t); try{ localStorage.setItem("stTheme", t); }catch(e){}
}
(function(){ var t="light"; try{ t=localStorage.getItem("stTheme")||"light"; }catch(e){} applyTheme(t); })();
Basket.init({root:"./"});

var LABEL={research:"리서치",videos:"영상노트",guides:"가이드",math:"수학사",
           blog:"블로그",cardnews:"카드뉴스",concept:"개념노트"};
/* 무더기마다 해야 할 일이 다르다 — 섞어 두면 목록이 쓸모없어진다. */
var KIND={
  new:{label:"새로 쓸 것",
       note:"아직 문서가 없는 이름입니다. 참조가 많을수록 여러 글이 그 설명을 필요로 한다는 뜻입니다."},
  companion:{label:"짝 문서",
       note:"이해편은 있고 확장편이 없는 것들입니다. 새 주제를 파는 것보다 품이 덜 듭니다."},
  gap:{label:"별칭 구멍",
       note:"문서는 있는데 이름이 안 맞아 못 찾는 경우입니다. 글을 쓸 게 아니라 build_link_index.py 의 별칭을 고쳐야 합니다."}
};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var DATA=null, kind="new";

function rowHTML(it,i){
  var refs=it.refs.map(function(r){
    return '<li><span class="shelf '+esc(r.s)+'">'+esc(LABEL[r.s]||r.s)+'</span>'+
      '<a href="'+esc(r.u)+'">'+esc(r.t)+'</a>'+
      (r.n>1?'<em>'+r.n+'회</em>':'')+'</li>';
  }).join("");
  var tag = it.kind==="gap"
      ? '<span class="kd gap">→ '+esc(it.target)+'</span>'
      : (it.kind==="companion" ? '<span class="kd companion">'+esc(it.base)+' 의 짝</span>' : '');
  return '<div class="row" data-i="'+i+'">'+
    '<button class="rh" type="button">'+
      '<span class="cnum">'+it.count+'<i>회</i></span>'+
      '<span class="nm">'+esc(it.name)+'</span>'+ tag +
      '<span class="ar">›</span>'+
    '</button>'+
    '<div class="rb"><p>이 이름을 부르는 글 '+it.refs.length+'편</p><ul>'+refs+'</ul></div>'+
    '</div>';
}

function paint(){
  var q=(document.getElementById("q").value||"").trim().toLowerCase();
  var list=DATA.items.filter(function(it){
    if(it.kind!==kind) return false;
    if(!q) return true;
    if(it.name.toLowerCase().indexOf(q)>=0) return true;
    return it.refs.some(function(r){ return r.t.toLowerCase().indexOf(q)>=0; });
  });
  document.getElementById("cnt").textContent = list.length+"종";
  document.getElementById("list").innerHTML = list.map(rowHTML).join("");
  var em=document.getElementById("empty");
  em.textContent = q ? '"'+q+'" — 찾는 이름이 없습니다' : "이 무더기는 비어 있습니다.";
  em.style.display = list.length ? "none" : "";
  Array.prototype.forEach.call(document.querySelectorAll(".rh"),function(b){
    b.addEventListener("click",function(){ b.parentElement.classList.toggle("open"); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#tabs .kt"),function(b){
    b.classList.toggle("on", b.dataset.k===kind);
  });
  document.getElementById("kindnote").textContent = KIND[kind].note;
}

fetch("backlog.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
  DATA=d;
  document.getElementById("stat").innerHTML =
    [["새로 쓸 것", d.counts.new],["짝 문서", d.counts.companion],
     ["별칭 구멍", d.counts.gap],["부른 횟수", d.pending],["훑은 글", d.scanned]]
    .map(function(p){ return '<div class="s"><b>'+p[1]+'</b><span>'+p[0]+'</span></div>'; }).join("");
  document.getElementById("gen").textContent =
    d.generated+" 기준 · 해결된 링크 "+d.resolved+"회는 이미 서로 이어져 있습니다.";
  document.getElementById("tabs").innerHTML =
    ["new","companion","gap"].map(function(k){
      return '<button class="kt" data-k="'+k+'">'+KIND[k].label+' '+d.counts[k]+'</button>';
    }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#tabs .kt"),function(b){
    b.addEventListener("click",function(){ kind=b.dataset.k; paint(); });
  });
  document.getElementById("q").addEventListener("input", paint);
  paint();
}).catch(function(e){
  document.getElementById("list").innerHTML =
    '<p class="empty">backlog.json 을 불러오지 못했습니다 — '+esc(e.message)+
    '<br><code>python tools/build_backlog.py</code> 를 먼저 돌리세요.</p>';
});
</script>
</body>
</html>
