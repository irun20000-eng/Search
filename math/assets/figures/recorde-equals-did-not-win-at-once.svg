<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 539" width="700" height="539" role="img" aria-label="그림 위쪽에 「등호는 곧바로 이기지 않았다 — 레코드」라는 표제가 있고 그 아래에 두 줄로 된 부호표가 있다. 띠는 인쇄본에 나온 해(=)와 널리 쓰인 때(ae · oe — 왼쪽이 열린 것은 시작을 모른다), 점선 띠는 「1700년대」 — 끝이 드는 백 년, 괄호는 노트가 적은 경쟁 햇수다. 가로축은 1550년부터 1800년까지 50년 눈금이고, 줄이 셋 있다. 줄 이름은 왼쪽 끝에 = (레코드), ||, ae 또는 oe라고 적혀 있다. 첫째 줄에는 1557년에 좁은 띠가 있고 그 아래 오른쪽에 두 줄로 1557 『Whetstone of Witte』, 곧바로 인기를 얻지 못했다라고 적혀 있다. 둘째 줄에는 띠가 없고 줄 머리 아래에 일부가 썼다 — 해가 없다라고 적혀 있다. 셋째 줄에는 왼쪽 끝이 옅어지며 열린 띠가 1700년까지 이어지고, 이어서 1700년부터 1800년까지 점선 띠가 있다. 그 아래 왼쪽에 왼쪽 끝 — 시작은 노트가 적지 않는다, 오른쪽에 1700년대까지 널리라고 적혀 있다. 1557년 띠 위에서 괄호 둘이 오른쪽으로 뻗는다. 아래 괄호는 1700년까지 가고 그 위에 적어도 백사십 년, 위 괄호는 1800년까지 가고 그 위에 길게는 이백 년 넘게라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 1557은 출처 6번과 9번을 따랐고, 10번 네이버 지식백과(수학백과) 「등호」는 레코드가 처음 쓴 것으로 추측된다고 한정한다. 둘째, ae · oe 띠의 왼쪽 끝과 점선 안의 끝 자리는 노트에 없고, 노트는 1700년대까지 널리만 적는다. 셋째, ||는 일부가 썼다뿐이고 해가 없어 띠를 그리지 않았다. 넷째, 빈 칸은 쓰이지 않았다는 뜻이 아니다. =가 언제 이겼는지도 노트가 적지 않는다. 다섯째, 두 괄호의 말은 노트의 말이다. 여섯째, 해는 노트의 출처 6번 MacTutor, Robert Recorde, 9번 Wikipedia, The Whetstone of Witte를 따랐다.">
<title>등호는 곧바로 이기지 않았다 레코드</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
