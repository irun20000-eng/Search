<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 504" width="700" height="504" role="img" aria-label="그림 위쪽에 「등호는 곧바로 이기지 않았다 — 레코드」라는 표제가 있고 그 아래에 띠는 인쇄본에 나온 해, 점선 띠는 「1700년대까지」 널리 쓰인 때, 괄호는 노트가 적은 햇수라는 부호표가 있다. 가로축은 1550년부터 1800년까지 50년 눈금이고, 줄이 셋 있다. 줄 이름은 왼쪽 끝에 = (레코드), ||, ae 또는 oe라고 적혀 있다. 첫째 줄에는 1557년에 좁은 띠가 있고 그 아래 오른쪽에 두 줄로 1557 『Whetstone of Witte』, 곧바로 인기를 얻지 못했다라고 적혀 있다. 둘째 줄에는 띠가 없고 그 아래에 일부가 썼다 — 해가 없다라고 적혀 있다. 셋째 줄에는 1700년부터 1800년 앞까지 점선 띠가 있고 그 아래에 1700년대까지 널리라고 적혀 있다. 1557년 띠 위에서 괄호 둘이 오른쪽으로 뻗는다. 아래 괄호는 1700년까지 가고 그 위에 적어도 백사십 년, 위 괄호는 1800년까지 가고 그 위에 길게는 이백 년 넘게라고 적혀 있다. 두 괄호의 오른쪽 끝에서 점선 안내선이 셋째 줄의 점선 띠 양 끝으로 내려온다. 아래에 단서가 다섯 줄 있다. 첫째, 1557은 출처 6번과 9번을 따랐고, 국내 자료는 누가 처음 썼는지 분명하지 않다며 레코드를 추측된다고 한정한다. 둘째, ae · oe가 언제부터 쓰였는지, =가 언제 이겼는지는 노트가 적지 않아 그리지 않았다. 셋째, ||는 일부가 썼다뿐이고 해가 없어 띠를 그리지 않았다. 넷째, 1700년대까지는 1700~1799 점선으로 그렸고, 두 괄호의 말은 노트의 말이다. 다섯째, 해는 노트의 출처 6번 MacTutor 레코드, 9번 위키백과 The Whetstone of Witte, 10번 수학백과 등호를 따랐다.">
<title>등호는 곧바로 이기지 않았다 레코드</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .sm{font-size:11px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .dash{fill:#F4EADC;fill-opacity:.5;stroke:#9C5A2C;stroke-width:1;stroke-dasharray:4 3;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .guide{stroke:#8A7F6E;stroke-width:.8;stroke-dasharray:2 3;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="504"/>
<text class="h1" x="56" y="44">등호는 곧바로 이기지 않았다 — 레코드</text>
<text class="h2" x="56" y="66">띠 = 인쇄본에 나온 해 · 점선 띠 = 「1700년대까지」 널리 쓰인 때 · 괄호 = 노트가 적은 햇수</text>
  <line class="lane" x1="200" y1="160" x2="640" y2="160"/>
  <text class="grp" x="56.0" y="164" text-anchor="start">= (레코드)</text>
  <line class="lane" x1="200" y1="236" x2="640" y2="236"/>
  <text class="grp" x="56.0" y="240" text-anchor="start">||</text>
  <line class="lane" x1="200" y1="294" x2="640" y2="294"/>
  <text class="grp" x="56.0" y="298" text-anchor="start">ae 또는 oe</text>
  <rect class="band" x="211.8" y="154" width="3.0" height="12" rx="1"/>
  <text class="ev" x="211.8" y="182" text-anchor="start">1557 『Whetstone of Witte』 [6][9]</text>
  <text class="ev" x="211.8" y="200" text-anchor="start">곧바로 인기를 얻지 못했다 [6]</text>
  <text class="sm" x="211.8" y="258" text-anchor="start">일부가 썼다 [6] — 해가 없다</text>
  <rect class="dash" x="453.8" y="288" width="169.2" height="12" rx="2"/>
  <text class="ev" x="453.8" y="318" text-anchor="start">1700년대까지 널리 [6]</text>
  <path class="brk" d="M213.3,152 V130 H453.8 V136"/>
  <text class="ev" x="333.6" y="123" text-anchor="middle">적어도 백사십 년</text>
  <path class="brk" d="M213.3,130 V98 H623.1 V104"/>
  <text class="ev" x="418.2" y="91" text-anchor="middle">길게는 이백 년 넘게</text>
  <line class="guide" x1="453.8" y1="140" x2="453.8" y2="285"/>
  <line class="guide" x1="623.1" y1="108" x2="623.1" y2="285"/>
  <line class="axis" x1="200" y1="362" x2="640" y2="362"/>
  <line class="axis" x1="200.0" y1="362" x2="200.0" y2="367"/>
  <text class="yr" x="200.0" y="380" text-anchor="middle">1550</text>
  <line class="axis" x1="284.6" y1="362" x2="284.6" y2="367"/>
  <text class="yr" x="284.6" y="380" text-anchor="middle">1600</text>
  <line class="axis" x1="369.2" y1="362" x2="369.2" y2="367"/>
  <text class="yr" x="369.2" y="380" text-anchor="middle">1650</text>
  <line class="axis" x1="453.8" y1="362" x2="453.8" y2="367"/>
  <text class="yr" x="453.8" y="380" text-anchor="middle">1700</text>
  <line class="axis" x1="538.5" y1="362" x2="538.5" y2="367"/>
  <text class="yr" x="538.5" y="380" text-anchor="middle">1750</text>
  <line class="axis" x1="623.1" y1="362" x2="623.1" y2="367"/>
  <text class="yr" x="623.1" y="380" text-anchor="middle">1800</text>
<text class="warn" x="56" y="412">⚠ 1557은 [6][9]를 따랐다. 국내 자료는 누가 처음 썼는지 분명하지 않다며 레코드를 「추측된다」고 한정한다 [10].</text>
<text class="warn" x="56" y="429">⚠ ae · oe 가 언제부터 쓰였는지, = 가 언제 이겼는지는 노트가 적지 않아 그리지 않았다.</text>
<text class="warn" x="56" y="446">⚠ || 는 「일부가 썼다」뿐이고 해가 없어 띠를 그리지 않았다 [6].</text>
<text class="warn" x="56" y="463">⚠ 「1700년대까지」는 1700~1799 점선으로 그렸다. 두 괄호의 말은 노트의 말이다(1557 → 1700년대).</text>
<text class="warn" x="56" y="480">⚠ 해는 노트의 출처 [6] MacTutor 레코드 · [9] 위키백과 The Whetstone of Witte · [10] 수학백과 등호를 따랐다.</text>
</svg>
