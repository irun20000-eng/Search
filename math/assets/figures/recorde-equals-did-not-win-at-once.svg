    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .sm{font-size:11px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .dash{fill:#F4EADC;fill-opacity:.5;stroke:#9C5A2C;stroke-width:1;stroke-dasharray:4 3;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .edge{fill:none;stroke:#9C5A2C;stroke-width:1;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<defs><linearGradient id="fadeL" gradientUnits="userSpaceOnUse" x1="200.0" y1="0" x2="240.0" y2="0"><stop offset="0" stop-color="#F4EADC" stop-opacity="0"/><stop offset="1" stop-color="#F4EADC" stop-opacity="1"/></linearGradient></defs>
<rect class="bg" x="0" y="0" width="700" height="539"/>
<text class="h1" x="56" y="44">등호는 곧바로 이기지 않았다 — 레코드</text>
<text class="h2" x="56" y="66">띠 = 인쇄본에 나온 해(=) · 널리 쓰인 때(ae · oe — 왼쪽이 열린 것은 시작을 모른다)</text>
<text class="h2" x="56" y="84">점선 띠 = 「1700년대」 — 끝이 드는 백 년 · 괄호 = 노트가 적은 경쟁 햇수</text>
  <line class="lane" x1="200" y1="178" x2="640" y2="178"/>
  <text class="grp" x="56.0" y="182" text-anchor="start">= (레코드)</text>
  <line class="lane" x1="200" y1="254" x2="640" y2="254"/>
  <text class="grp" x="56.0" y="258" text-anchor="start">||</text>
  <line class="lane" x1="200" y1="312" x2="640" y2="312"/>
  <text class="grp" x="56.0" y="316" text-anchor="start">ae 또는 oe</text>
  <rect class="band" x="212.3" y="172" width="3.0" height="12" rx="1"/>
  <text class="ev" x="212.3" y="200" text-anchor="start">1557 『Whetstone of Witte』 [6][9]</text>
  <text class="ev" x="212.3" y="218" text-anchor="start">곧바로 인기를 얻지 못했다 [6]</text>
  <text class="sm" x="200.0" y="276" text-anchor="start">일부가 썼다 [6] — 해가 없다</text>
  <rect x="200.0" y="306" width="264.0" height="12" fill="url(#fadeL)"/>
  <path class="edge" d="M240.0,306 H464.0 V318 H240.0"/>
  <rect class="dash" x="464.0" y="306" width="176.0" height="12" rx="2"/>
  <text class="sm" x="200.0" y="336" text-anchor="start">왼쪽 끝 — 시작은 노트가 적지 않는다</text>
  <text class="ev" x="640.0" y="336" text-anchor="end">1700년대까지 널리 [6]</text>
  <path class="brk" d="M213.8,170 V148 H464.0 V154"/>
  <text class="ev" x="338.9" y="141" text-anchor="middle">적어도 백사십 년</text>
  <path class="brk" d="M213.8,148 V116 H640.0 V122"/>
  <text class="ev" x="426.9" y="109" text-anchor="middle">길게는 이백 년 넘게</text>
  <line class="axis" x1="200" y1="380" x2="640" y2="380"/>
  <line class="axis" x1="200.0" y1="380" x2="200.0" y2="385"/>
  <text class="yr" x="200.0" y="398" text-anchor="middle">1550</text>
  <line class="axis" x1="288.0" y1="380" x2="288.0" y2="385"/>
  <text class="yr" x="288.0" y="398" text-anchor="middle">1600</text>
  <line class="axis" x1="376.0" y1="380" x2="376.0" y2="385"/>
  <text class="yr" x="376.0" y="398" text-anchor="middle">1650</text>
  <line class="axis" x1="464.0" y1="380" x2="464.0" y2="385"/>
  <text class="yr" x="464.0" y="398" text-anchor="middle">1700</text>
  <line class="axis" x1="552.0" y1="380" x2="552.0" y2="385"/>
  <text class="yr" x="552.0" y="398" text-anchor="middle">1750</text>
  <line class="axis" x1="640.0" y1="380" x2="640.0" y2="385"/>
  <text class="yr" x="640.0" y="398" text-anchor="middle">1800</text>
<text class="warn" x="56" y="430">⚠ 1557은 [6][9]를 따랐다. [10] 네이버 지식백과(수학백과) 「등호」는 레코드가 처음 쓴 것으로 「추측된다」고 한정한다.</text>
<text class="warn" x="56" y="447">⚠ ae · oe 띠의 왼쪽 끝과 점선 안의 끝 자리는 노트에 없다 — 노트는 「1700년대까지 널리」만 적는다 [6].</text>
<text class="warn" x="56" y="464">⚠ || 는 「일부가 썼다」뿐이고 해가 없어 띠를 그리지 않았다 [6].</text>
<text class="warn" x="56" y="481">⚠ 빈 칸은 쓰이지 않았다는 뜻이 아니다. = 가 언제 이겼는지도 노트가 적지 않는다.</text>
<text class="warn" x="56" y="498">⚠ 두 괄호의 말은 노트의 말이다(1557 → 1700년대).</text>
<text class="warn" x="56" y="515">⚠ 해는 노트의 출처 [6] MacTutor, Robert Recorde · [9] Wikipedia, The Whetstone of Witte를 따랐다.</text>
</svg>
