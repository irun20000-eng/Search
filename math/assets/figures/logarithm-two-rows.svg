<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 478" role="img" aria-label="그림 위쪽에 「로그의 착상 — 두 줄을 나란히 놓는다」라는 표제가 있고 그 아래에 곱셈을 덧셈으로 내렸다가 다시 올라온다고 적혀 있다. 가운데에 칸 여덟 개짜리 줄이 위아래로 둘 있다. 윗줄은 등비이고 곱의 세계이며 1, 2, 4, 8, 16, 32, 64, 128 이 적혀 있다. 아랫줄은 등차이고 합의 세계이며 0, 1, 2, 3, 4, 5, 6, 7 이 적혀 있다. 윗줄의 4 와 8 이 칠해져 있고 그 두 칸에서 아랫줄로 화살표가 내려간다. 화살표 왼쪽에 동그라미 1 과 내려간다고 적혀 있다. 아랫줄에서는 2 와 3 이 칠해져 있고 그 둘을 묶는 꺾쇠 아래에 동그라미 2 와 2 더하기 3 은 5 라고 적혀 있다. 거기서 점선이 오른쪽으로 뻗어 아랫줄의 5 가 적힌 칸을 가리킨다. 그 칸에서 윗줄로 화살표가 올라가고 오른쪽에 동그라미 3 과 올라온다고 적혀 있다. 화살표가 닿는 윗줄 칸은 32 이고 시에나색 테두리로 둘러 있다. 그 아래에는 1부터 16까지의 눈금이 한 줄 있고, 1 과 2 와 4 와 8 과 16 만 채운 점이며 나머지 열한 개는 빈 점이다. 눈금 아래에 채운 점만 윗줄에 있고 그 사이를 메우려면 촘촘한 표가 필요했으며 그 표를 계산용으로 실제로 만든 것은 네이피어와 뷔르기 둘뿐이라고 적혀 있다. 맨 아래에는 단서가 셋 있다. 첫째는 이 표가 밑이 2인 보기이며 네이피어의 표에는 밑이 적혀 있지 않고 그는 로그를 두 거리의 비라는 기하학적 형태로 정의했다는 것이고, 둘째는 아래 눈금을 16까지만 그렸으며 네이피어 표의 촘촘함을 그린 것이 아니라는 것이고, 셋째는 두 줄의 대응 자체는 네이피어 이전에도 알려져 있었고 이 그림은 그 대응만 보일 뿐 누가 먼저였는지는 말하지 않는다는 것이다">
  <title>로그의 착상 — 두 줄을 나란히 놓는다</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .cell{fill:#FFFDF7;stroke:#D8CDBB;stroke-width:1;}
    .hit{fill:#E6D5BD;stroke:#D8CDBB;stroke-width:1;}
    .ans{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1.6;}
    .arw{stroke:#9C5A2C;stroke-width:1.6;fill:none;stroke-linecap:round;}
    .dot{stroke:#9C5A2C;stroke-width:1.2;fill:none;stroke-dasharray:3 3;}
    .brc{stroke:#9C5A2C;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#9C5A2C"/></marker></defs>
  <rect width="700" height="478" fill="#FFFDF7"/>
  <text x="56" y="30" font-size="16">로그의 착상 — 두 줄을 나란히 놓는다</text>
  <text x="56" y="52" font-size="12" class="dim">곱셈을 덧셈으로 내렸다가 다시 올라온다.</text>
  <text x="184" y="118.0" font-size="13" text-anchor="end">등비</text>
  <text x="184" y="136.0" font-size="11" text-anchor="end" class="ax">곱의 세계</text>
  <rect x="196.0" y="100.0" width="54.0" height="44.0" class="cell"/>
  <text x="223.0" y="128.0" font-size="17" text-anchor="middle">1</text>
  <rect x="255.0" y="100.0" width="54.0" height="44.0" class="cell"/>
  <text x="282.0" y="128.0" font-size="17" text-anchor="middle">2</text>
  <rect x="314.0" y="100.0" width="54.0" height="44.0" class="hit"/>
  <text x="341.0" y="128.0" font-size="17" text-anchor="middle">4</text>
  <rect x="373.0" y="100.0" width="54.0" height="44.0" class="hit"/>
  <text x="400.0" y="128.0" font-size="17" text-anchor="middle">8</text>
  <rect x="432.0" y="100.0" width="54.0" height="44.0" class="cell"/>
  <text x="459.0" y="128.0" font-size="17" text-anchor="middle">16</text>
  <rect x="491.0" y="100.0" width="54.0" height="44.0" class="ans"/>
  <text x="518.0" y="128.0" font-size="17" text-anchor="middle">32</text>
  <rect x="550.0" y="100.0" width="54.0" height="44.0" class="cell"/>
  <text x="577.0" y="128.0" font-size="17" text-anchor="middle">64</text>
  <rect x="609.0" y="100.0" width="54.0" height="44.0" class="cell"/>
  <text x="636.0" y="128.0" font-size="17" text-anchor="middle">128</text>
  <text x="184" y="214.0" font-size="13" text-anchor="end">등차</text>
  <text x="184" y="232.0" font-size="11" text-anchor="end" class="ax">합의 세계</text>
  <rect x="196.0" y="196.0" width="54.0" height="44.0" class="cell"/>
  <text x="223.0" y="224.0" font-size="17" text-anchor="middle">0</text>
  <rect x="255.0" y="196.0" width="54.0" height="44.0" class="cell"/>
  <text x="282.0" y="224.0" font-size="17" text-anchor="middle">1</text>
  <rect x="314.0" y="196.0" width="54.0" height="44.0" class="hit"/>
  <text x="341.0" y="224.0" font-size="17" text-anchor="middle">2</text>
  <rect x="373.0" y="196.0" width="54.0" height="44.0" class="hit"/>
  <text x="400.0" y="224.0" font-size="17" text-anchor="middle">3</text>
  <rect x="432.0" y="196.0" width="54.0" height="44.0" class="cell"/>
  <text x="459.0" y="224.0" font-size="17" text-anchor="middle">4</text>
  <rect x="491.0" y="196.0" width="54.0" height="44.0" class="ans"/>
  <text x="518.0" y="224.0" font-size="17" text-anchor="middle">5</text>
  <rect x="550.0" y="196.0" width="54.0" height="44.0" class="cell"/>
  <text x="577.0" y="224.0" font-size="17" text-anchor="middle">6</text>
  <rect x="609.0" y="196.0" width="54.0" height="44.0" class="cell"/>
  <text x="636.0" y="224.0" font-size="17" text-anchor="middle">7</text>
  <line x1="341.0" y1="148.0" x2="341.0" y2="192.0" class="arw" marker-end="url(#ah)"/>
  <line x1="400.0" y1="148.0" x2="400.0" y2="192.0" class="arw" marker-end="url(#ah)"/>
  <text x="333.0" y="174" font-size="12" text-anchor="end" class="sien">① 내려간다</text>
  <line x1="518.0" y1="192.0" x2="518.0" y2="148.0" class="arw" marker-end="url(#ah)"/>
  <text x="526.0" y="174" font-size="12" class="sien">③ 올라온다</text>
  <path d="M341.0 244.0 L341.0 252.0 L400.0 252.0 L400.0 244.0" class="brc"/>
  <text x="370.5" y="270.0" font-size="13" text-anchor="middle" class="sien">② 2 + 3 = 5</text>
  <path d="M426.0 266.0 L518.0 266.0 L518.0 244.0" class="dot" marker-end="url(#ah)"/>
  <text x="56" y="306" font-size="12" class="ax">윗줄에 있는 수와 없는 수 — 1부터 16까지</text>
  <line x1="196.0" y1="336.0" x2="663.0" y2="336.0" class="axis"/>
  <circle cx="196.0" cy="336.0" r="4.5" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1"/>
  <text x="196.0" y="354.0" font-size="10" text-anchor="middle" class="sien">1</text>
  <circle cx="227.1" cy="336.0" r="4.5" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1"/>
  <text x="227.1" y="354.0" font-size="10" text-anchor="middle" class="sien">2</text>
  <circle cx="258.3" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="258.3" y="354.0" font-size="10" text-anchor="middle" class="ax">3</text>
  <circle cx="289.4" cy="336.0" r="4.5" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1"/>
  <text x="289.4" y="354.0" font-size="10" text-anchor="middle" class="sien">4</text>
  <circle cx="320.5" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="320.5" y="354.0" font-size="10" text-anchor="middle" class="ax">5</text>
  <circle cx="351.7" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="351.7" y="354.0" font-size="10" text-anchor="middle" class="ax">6</text>
  <circle cx="382.8" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="382.8" y="354.0" font-size="10" text-anchor="middle" class="ax">7</text>
  <circle cx="413.9" cy="336.0" r="4.5" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1"/>
  <text x="413.9" y="354.0" font-size="10" text-anchor="middle" class="sien">8</text>
  <circle cx="445.1" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="445.1" y="354.0" font-size="10" text-anchor="middle" class="ax">9</text>
  <circle cx="476.2" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="476.2" y="354.0" font-size="10" text-anchor="middle" class="ax">10</text>
  <circle cx="507.3" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="507.3" y="354.0" font-size="10" text-anchor="middle" class="ax">11</text>
  <circle cx="538.5" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="538.5" y="354.0" font-size="10" text-anchor="middle" class="ax">12</text>
  <circle cx="569.6" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="569.6" y="354.0" font-size="10" text-anchor="middle" class="ax">13</text>
  <circle cx="600.7" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="600.7" y="354.0" font-size="10" text-anchor="middle" class="ax">14</text>
  <circle cx="631.9" cy="336.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1"/>
  <text x="631.9" y="354.0" font-size="10" text-anchor="middle" class="ax">15</text>
  <circle cx="663.0" cy="336.0" r="4.5" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1"/>
  <text x="663.0" y="354.0" font-size="10" text-anchor="middle" class="sien">16</text>
  <text x="56" y="376" font-size="12" class="dim">채운 점만 윗줄에 있다 — 그 사이를 메우려면 촘촘한 표가 필요했다.</text>
  <text x="56" y="394" font-size="12" class="dim">그 표를 계산용으로 실제로 만든 것은 네이피어와 뷔르기 둘뿐이다[3].</text>
  <text x="56" y="424.0" font-size="11" class="ax">⚠ 이 표는 밑이 2인 보기다. 네이피어의 표에는 밑이 적혀 있지 않다 — 그는 두 거리의 비로 정의했다.</text>
  <text x="56" y="442.0" font-size="11" class="ax">⚠ 아래 눈금은 16까지만 그렸다. 네이피어 표의 촘촘함을 그린 것이 아니다.</text>
  <text x="56" y="460.0" font-size="11" class="ax">⚠ 두 줄의 대응 자체는 네이피어 이전에도 알려져 있었다. 이 그림은 대응만 보이고 우선권은 말하지 않는다.</text>
</svg>
