<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 559" width="700" height="559" role="img" aria-label="그림 위쪽에 「라틴어가 30년을 따라온다 — 디리클레」라는 표제가 있고 그 아래에 빈 띠는 라틴어에 걸린 해, 갈색 띠는 넘은 해, 파선은 미룬 동안, 푸른 띠는 그동안 한 일, 괄호는 해의 차라는 부호표가 있다. 가로축은 1819년부터 1857년까지의 해이고, 줄이 둘 있다. 줄 이름은 왼쪽 끝에 라틴어 요건, 그동안이라고 적혀 있다. 위 줄 라틴어 요건에는 1821년에 속이 빈 띠가 있고 그 위에 두 줄로 1821 아비투어, 라틴어 때문에 수료증만이라고 적혀 있다. 1827년에 갈색 띠가 있고 그 아래에 두 줄로 1827 박사학위, 라틴어 토론 대신 명예박사라고 적혀 있다. 1831년에 속이 빈 띠가 있고 그 위에 1831~ 정교수 요건, 라틴어 강의라고 적혀 있으며, 그 띠에서 파선이 1851년 갈색 띠까지 이어진다. 1851년 띠 위 왼쪽에 1851 라틴어 강의를 하다라고 적혀 있다. 1827년 라벨 아래에는 1831년 띠 가운데에서 1851년 띠 가운데까지 걸친 괄호가 있고 20년을 미뤘다라고 적혀 있다. 위 줄 위에는 1821년 띠 가운데에서 1851년 띠 가운데까지 걸친 괄호가 있고 30년이라고 적혀 있다. 아래 줄 그동안에는 푸른 띠가 셋 있다. 1837년 띠 아래 왼쪽에 1837 등차수열의 소수 정리, 1846년 띠 위에 두 줄로 1846 하이델베르크의 부름, 봉급 두 배로 붙잡힘, 1855년 띠 아래 왼쪽에 1855 괴팅겐, 가우스의 자리라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 띠는 해만 아는 일이라 띠 안 어디인지는 모른다. 둘째, 교수자격의 라틴어 토론은 교육부 장관이 면제했고, 해를 노트가 적지 않아 그리지 않았다. 셋째, 명예박사를 준 대학은 출처가 갈려 1번은 쾰른, 2번은 본 대학 1827년 2월이라고 적는다. 넷째, 20년은 2번 출처의 말이고, 30년은 노트가 1821 아비투어부터 1851 라틴어 강의까지로 잰 수다. 다섯째, 1846년 봉급이 두 배가 된 뒤에도 정교수 봉급은 아니었고 군사학교를 떠날 수 없었다. 여섯째, 해는 노트의 출처 1번 MacTutor 디리클레, 2번 위키백과, 3번 수학백과 디리클레 급수를 따랐다.">
<title>라틴어가 30년을 따라온다 디리클레</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#9C5A2C;}
    .ev{font-size:11px;} .sm{font-size:10.5px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .band2{fill:#CEDCE6;stroke:#3A5C77;stroke-width:1;}
    .hollow{fill:#FFFDF7;stroke:#9C5A2C;stroke-width:1.4;}
    .unk{stroke:#9C5A2C;stroke-width:1.4;stroke-dasharray:4 3;}
    .brk{stroke:#9C5A2C;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="559"/>
<text class="h1" x="56" y="44">라틴어가 30년을 따라온다 — 디리클레</text>
<text class="h2" x="56" y="66">빈 띠 = 라틴어에 걸린 해 · 갈색 띠 = 넘은 해 · 파선 = 미룬 동안 · 푸른 띠 = 그동안 한 일 · 괄호 = 해의 차</text>
  <line class="lane" x1="210" y1="196" x2="640" y2="196"/>
  <text class="grp" x="56.0" y="200" text-anchor="start">라틴어 요건</text>
  <line class="lane" x1="210" y1="330" x2="640" y2="330"/>
  <text class="grp" x="56.0" y="334" text-anchor="start">그동안</text>
  <rect class="hollow" x="232.6" y="190" width="11.3" height="12" rx="2"/>
  <text class="ev" x="232.6" y="166" text-anchor="start">1821 아비투어</text>
  <text class="sm" x="232.6" y="184" text-anchor="start">라틴어 때문에 수료증만 [2]</text>
  <rect class="band" x="300.5" y="190" width="11.3" height="12" rx="2"/>
  <text class="ev" x="300.5" y="218" text-anchor="start">1827 박사학위 — 라틴어 토론 대신</text>
  <text class="ev" x="300.5" y="236" text-anchor="start">명예박사 [1][2]</text>
  <rect class="hollow" x="345.8" y="190" width="11.3" height="12" rx="2"/>
  <line class="unk" x1="357.1" y1="196" x2="571.1" y2="196"/>
  <rect class="band" x="572.1" y="190" width="11.3" height="12" rx="2"/>
  <text class="ev" x="345.8" y="166" text-anchor="start">1831~ 정교수 요건 — 라틴어 강의 [2]</text>
  <text class="ev" x="583.4" y="184" text-anchor="end">1851 라틴어 강의를 하다 [2]</text>
  <path class="brk" d="M351.4,254 V260 H577.8 V254"/>
  <text class="ev" x="464.6" y="276" text-anchor="middle">20년을 미뤘다 [2]</text>
  <path class="brk" d="M238.3,144 V138 H577.8 V144"/>
  <text class="ev" x="408.0" y="131" text-anchor="middle">30년</text>
  <rect class="band2" x="413.7" y="324" width="11.3" height="12" rx="2"/>
  <text class="ev" x="425.0" y="352" text-anchor="end">1837 등차수열의 소수 정리 [1][3]</text>
  <rect class="band2" x="515.5" y="324" width="11.3" height="12" rx="2"/>
  <text class="ev" x="521.2" y="300" text-anchor="middle">1846 하이델베르크의 부름 [2]</text>
  <text class="ev" x="521.2" y="318" text-anchor="middle">봉급 두 배로 붙잡힘 [2]</text>
  <rect class="band2" x="617.4" y="324" width="11.3" height="12" rx="2"/>
  <text class="ev" x="628.7" y="352" text-anchor="end">1855 괴팅겐, 가우스의 자리 [1][2]</text>
  <line class="axis" x1="210" y1="400" x2="640" y2="400"/>
  <line class="axis" x1="221.3" y1="400" x2="221.3" y2="405"/>
  <text class="yr" x="221.3" y="418" text-anchor="middle">1820</text>
  <line class="axis" x1="277.9" y1="400" x2="277.9" y2="405"/>
  <text class="yr" x="277.9" y="418" text-anchor="middle">1825</text>
  <line class="axis" x1="334.5" y1="400" x2="334.5" y2="405"/>
  <text class="yr" x="334.5" y="418" text-anchor="middle">1830</text>
  <line class="axis" x1="391.1" y1="400" x2="391.1" y2="405"/>
  <text class="yr" x="391.1" y="418" text-anchor="middle">1835</text>
  <line class="axis" x1="447.6" y1="400" x2="447.6" y2="405"/>
  <text class="yr" x="447.6" y="418" text-anchor="middle">1840</text>
  <line class="axis" x1="504.2" y1="400" x2="504.2" y2="405"/>
  <text class="yr" x="504.2" y="418" text-anchor="middle">1845</text>
  <line class="axis" x1="560.8" y1="400" x2="560.8" y2="405"/>
  <text class="yr" x="560.8" y="418" text-anchor="middle">1850</text>
  <line class="axis" x1="617.4" y1="400" x2="617.4" y2="405"/>
  <text class="yr" x="617.4" y="418" text-anchor="middle">1855</text>
<text class="warn" x="56" y="450">⚠ 띠는 해만 아는 일이다 — 띠 안 어디인지는 모른다.</text>
<text class="warn" x="56" y="467">⚠ 교수자격의 라틴어 토론은 교육부 장관이 면제했다 [2] — 해를 노트가 적지 않아 그리지 않았다.</text>
<text class="warn" x="56" y="484">⚠ 명예박사를 준 대학은 출처가 갈린다 — [1]은 쾰른, [2]는 본 대학(1827년 2월).</text>
<text class="warn" x="56" y="501">⚠ 「20년」은 [2]의 말이고, 「30년」은 노트가 1821 아비투어부터 1851 라틴어 강의까지로 잰 수다.</text>
<text class="warn" x="56" y="518">⚠ 1846년 봉급이 두 배가 된 뒤에도 정교수 봉급은 아니었고 군사학교를 떠날 수 없었다 [2].</text>
<text class="warn" x="56" y="535">⚠ 해는 노트의 출처 [1] MacTutor 디리클레 · [2] 위키백과 · [3] 수학백과 디리클레 급수를 따랐다.</text>
</svg>
