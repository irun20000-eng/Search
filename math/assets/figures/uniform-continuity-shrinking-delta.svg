  <text x="426.0" y="94.0" font-size="12" class="ax">같은 ε — 상자 높이는 셋 다 같다</text>
  <text x="456.0" y="138.0" font-size="12">x</text>
  <text x="518.0" y="138.0" font-size="12">통하는 δ</text>
  <text x="456.0" y="160.0" font-size="12" class="dim">0.6</text>
  <text x="518.0" y="160.0" font-size="12" class="sien">0.225</text>
  <text x="456.0" y="180.0" font-size="12" class="dim">0.3</text>
  <text x="518.0" y="180.0" font-size="12" class="sien">0.069</text>
  <text x="456.0" y="200.0" font-size="12" class="dim">0.15</text>
  <text x="518.0" y="200.0" font-size="12" class="sien">0.020</text>
  <text x="56" y="384.0" font-size="12" class="dim">x 를 0 에 붙일수록 δ 는 한없이 작아진다 — 점마다 δ 가 있지만 <tspan font-weight="600">모든 점에 한꺼번에 통하는 δ 는 없다.</tspan></text>
  <text x="56" y="404.0" font-size="12" class="dim">구간을 [a, 1] 로 닫으면 가장 좁은 상자가 x = a 에서 생기고, 그것이 모든 점에 통한다 — 그때가 균등연속이다.</text>
  <text x="56" y="436.0" font-size="11" class="ax">⚠ ε 를 1 로 두고 그린 값이다. ε 를 바꾸면 δ 도 바뀌지만, 0 에 가까워질수록 작아지는 것은 같다.</text>
  <text x="56" y="454.0" font-size="11" class="ax">⚠ 왼쪽이 먼저 걸리므로 δ = εx² ÷ (1 + εx) 로 잡았다. 오른쪽으로는 더 가도 된다.</text>
  <text x="56" y="472.0" font-size="11" class="ax">⚠ x 는 0.1 부터 그렸다. 0 쪽은 화면 밖이고, 곡선이 세로축에서 끊긴 것은 그 때문이다.</text>
  <text x="56" y="490.0" font-size="11" class="ax">⚠ 세 점만 보인다. 「모든 점에 통하는 δ 가 없다」는 식이 0 으로 간다는 데서 나오고, 닫힌 구간 쪽은 글로만 적었다.</text>
</svg>
