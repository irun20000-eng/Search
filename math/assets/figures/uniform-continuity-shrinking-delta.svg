  <text x="56" y="30" font-size="16">연속과 균등연속 — 같은 ε 에 통하는 δ 가 점마다 줄어든다</text>
  <text x="56" y="52" font-size="12" class="dim">f(x) = 1/x 를 (0, 1) 에서 본다.</text>
