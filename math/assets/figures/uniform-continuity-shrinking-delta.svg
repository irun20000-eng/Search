<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 514" role="img" aria-label="그림 위쪽에 「연속과 균등연속 — 같은 ε 에 통하는 δ 가 점마다 줄어든다」라는 표제가 있고 그 아래에 x 분의 1 을 0 과 1 사이에서 본다고 적혀 있다. 가운데에 좌표축이 있고 오른쪽으로 갈수록 낮아지는 곡선이 하나 그려져 있다. 세로축 왼쪽에는 0.1 이라고 적혀 있는데 곡선을 거기서부터 그렸다는 뜻이다. 곡선 위의 세 점에 각각 직사각형 상자가 하나씩 얹혀 있다. 세 상자는 높이가 모두 같고 이것이 같은 ε 를 뜻한다. 그런데 폭은 왼쪽으로 갈수록 좁아진다 — 오른쪽 점의 상자가 가장 넓고, 가운데 점의 상자가 그보다 좁으며, 왼쪽 끝 점의 상자는 아주 가늘다. 각 상자 아래에는 그 상자가 어느 점의 것인지가 적혀 있는데 왼쪽부터 x = 0.15, x = 0.3, x = 0.6 이다. δ 값은 오른쪽 표에만 있다. 그 표에는 x 가 0.6 일 때 통하는 δ 가 0.225, 0.3 일 때 0.069, 0.15 일 때 0.020 이라고 적혀 있고, 표 위에 같은 ε 이며 상자 높이는 셋 다 같다고 적혀 있다. 그림 아래에는 x 를 0 에 붙일수록 δ 가 한없이 작아지며 점마다 δ 가 있지만 모든 점에 한꺼번에 통하는 δ 는 없다고 적혀 있고, 구간을 대괄호 a 쉼표 1 로 닫으면 가장 좁은 상자가 x = a 에서 생기고 그것이 모든 점에 통하며 그때가 균등연속이라고 적혀 있다. 맨 아래에는 단서가 넷 있다. 첫째는 ε 를 1 로 두고 그린 값이며 ε 를 바꾸면 δ 도 바뀌지만 0 에 가까워질수록 작아지는 것은 같다는 것이고, 둘째는 왼쪽이 먼저 걸리므로 δ 를 엡실론 곱하기 x 제곱 나누기 괄호 1 더하기 엡실론 곱하기 x 로 잡았으며 오른쪽으로는 더 가도 된다는 것이고, 셋째는 x 를 0.1 부터 그렸고 0 쪽은 화면 밖이며 곡선이 세로축에서 끊긴 것이 그 때문이라는 것이고, 넷째는 이 그림이 세 점만 보이며 모든 점에 통하는 δ 가 없다는 것은 그 식이 0 으로 간다는 데서 나오고 닫힌 구간 쪽은 글로만 적었을 뿐 그 상자는 그리지 않았다는 것이다">
  <title>연속과 균등연속 — 같은 ε 에 통하는 δ 가 점마다 줄어든다</title>
