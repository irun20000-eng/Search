  <text x="83" y="352" font-size="13" class="sien">4 → 8 → 16각형, 변을 배로</text>

  <line x1="378" y1="159.2" x2="668" y2="159.2" stroke="#3A5C77" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="646" y="151.2" font-size="13" class="blue">π</text>
  <line x1="378" y1="336" x2="668" y2="336" stroke="#8A7F6E" stroke-width="1"/>
  <polyline points="392,315.8 442,199.3 492,169.3 542,161.7 592,159.8 642,159.4" fill="none" stroke="#9C5A2C" stroke-width="1.4"/>
  <circle cx="392" cy="315.8" r="3.2" fill="#9C5A2C"/>
  <circle cx="442" cy="199.3" r="3.2" fill="#9C5A2C"/>
  <circle cx="492" cy="169.3" r="3.2" fill="#9C5A2C"/>
  <circle cx="542" cy="161.7" r="3.2" fill="#9C5A2C"/>
  <circle cx="592" cy="159.8" r="3.2" fill="#9C5A2C"/>
  <circle cx="642" cy="159.4" r="3.2" fill="#9C5A2C"/>
  <text x="452" y="252" font-size="12" class="dim">항 1 · 8각형 · 2.828</text>
  <text x="452" y="274" font-size="12" class="dim">항 2 · 16각형 · 3.061</text>
  <text x="452" y="296" font-size="12" class="dim">항 3 · 32각형 · 3.121</text>
  <text x="378" y="352" font-size="13" class="ax">항 수</text>
  <text x="46" y="374" font-size="13" class="dim">항을 k 개 곱하면 2 ÷ (누적곱) 이 곧 그 다각형의 넓이다. ⚠ 이 대응은 [12] 의 넓이비를 이 도해가 풀어 쓴 것이다</text>
</svg>
