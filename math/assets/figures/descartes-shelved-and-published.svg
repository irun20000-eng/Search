  </style>
<rect class="bg" x="0" y="0" width="700" height="520"/>
<text class="h1" x="56" y="44" text-anchor="start">접은 책과 낸 책 — 네덜란드의 데카르트</text>
<text class="h2" x="56" y="66" text-anchor="start">점선 칸 = 쓰고 안 낸 책 · 갈색 점 = 낸 책 · 칸 = 머문 곳 · 검은 점 = 데카르트가 죽은 날</text>
<line class="lane" x1="200" y1="180" x2="640" y2="180"/>
<text class="grp" x="56" y="184" text-anchor="start">쓴 것</text>
