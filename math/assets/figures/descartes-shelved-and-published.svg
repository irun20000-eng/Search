<text class="ev" x="336.5" y="162" text-anchor="end">『세계론』 — 쓰고 내지 않았다 [1]</text>
<text class="ev" x="342.5" y="206" text-anchor="start">1633 갈릴레오 소식에 접다 [1]</text>
<circle class="mk" cx="403.7" cy="180" r="3.5"/>
<text class="ev" x="407.7" y="145" text-anchor="start">1637 『방법서설』 +</text>
<text class="ev" x="407.7" y="162" text-anchor="start">『기하학』 [1][4]</text>
<circle class="mk" cx="517.8" cy="180" r="3.5"/>
<text class="ev" x="521.8" y="206" text-anchor="start">1644 『철학의 원리』 [1]</text>
<rect class="seg" x="200.0" y="271" width="48.9" height="18"/>
<rect class="seg2" x="248.9" y="271" width="342.2" height="18"/>
<rect class="seg" x="591.1" y="271" width="18.1" height="18"/>
<text class="ev" x="224.4" y="306" text-anchor="middle">파리 [1]</text>
<text class="ev" x="420.0" y="284" text-anchor="middle">네덜란드 1628~1649 [1]</text>
<text class="ev" x="591.1" y="306" text-anchor="start">스톡홀름 [1]</text>
<circle class="pt" cx="609.2" cy="350" r="4"/>
<text class="ev" x="603.2" y="338" text-anchor="end">1650.2.11 스톡홀름에서 데카르트가 죽다 [1]</text>
