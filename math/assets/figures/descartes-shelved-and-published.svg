<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img" aria-label="그림 위쪽에 「접은 책과 낸 책 — 네덜란드의 데카르트」라는 표제가 있고 그 아래에 점선 칸은 쓰고 안 낸 책, 갈색 점은 낸 책, 칸은 머문 곳, 검은 점은 데카르트가 죽은 날이라는 부호표가 있다. 가로축은 1625년부터 1652년까지 한 해마다 눈금이 있고 다섯 해마다 숫자가 적혀 있다. 줄이 둘 있고 줄 이름은 왼쪽 끝에 쓴 것, 머문 곳이라고 적혀 있다. 쓴 것 줄에는 1629년부터 1633년 가운데까지 테두리만 점선인 칸이 있고, 그 왼쪽 위에 세계론, 쓰고 내지 않았다, 칸 끝 오른쪽 아래에 1633 갈릴레오 소식에 접다라고 적혀 있다. 갈색 점이 둘 있다. 1637년 점 오른쪽 위에 두 줄로 1637 방법서설 + 기하학, 1644년 점 오른쪽 아래에 1644 철학의 원리라고 적혀 있다. 머문 곳 줄에는 칸이 셋 이어져 있다. 1625년부터 1628년까지 옅은 칸이 있고 그 아래에 파리, 1628년부터 1649년까지 진한 칸이 있고 칸 안에 네덜란드 1628~1649, 1649년부터 1650년 2월 11일까지 옅은 칸이 있고 그 아래 오른쪽에 스톡홀름이라고 적혀 있다. 가로축 위 1650년 2월 11일 자리에 검은 점이 있고 그 왼쪽 위에 1650.2.11 스톡홀름에서 데카르트가 죽다라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 해만 아는 일은 해의 가운데, 칸 끝은 해의 첫머리에 두었고 1650.2.11 만 날짜 자리다. 둘째, 1625 앞, 곧 1618 브레다와 1620~1625 유럽 여행은 축 밖이라 그리지 않았다. 셋째, 세계론 칸은 쓰기 시작한 1629 부터 갈릴레오 소식이 닿은 1633 까지이고, 그 책은 죽은 뒤에 일부만 나왔다. 넷째, 점은 골라 찍었고 1641 성찰은 뺐다. 다섯째, 21년은 노트 3절의 1628~1649 이고 1번은 그 뒤 스무 해라 적는다. 여섯째, 해와 날짜는 1번 MacTutor History of Mathematics, René Descartes 를, 1637 은 4번 Britannica, La Géométrie 도 따랐다">
<title>접은 책과 낸 책 네덜란드의 데카르트</title>
<style>
