<text class="warn" x="56" y="396">⚠ 해만 아는 일은 해의 가운데, 칸 끝은 해의 첫머리에 두었다 — 1650.2.11 만 날짜 자리다.</text>
<text class="warn" x="56" y="413">⚠ 1625 앞(1618 브레다, 1620~1625 유럽 여행)은 축 밖이라 그리지 않았다 [1].</text>
<text class="warn" x="56" y="430">⚠ 『세계론』 칸은 쓰기 시작한 1629 부터 갈릴레오 소식이 닿은 1633 까지다 — 그 책은 죽은 뒤에 일부만 나왔다 [1].</text>
<text class="warn" x="56" y="447">⚠ 점은 골라 찍었다 — 1641 『성찰』은 뺐다 (노트 연보).</text>
<text class="warn" x="56" y="464">⚠ 「21년」은 노트 §3 의 1628~1649 다. [1] 은 「그 뒤 스무 해」라 적는다.</text>
<text class="warn" x="56" y="481">⚠ 해와 날짜는 [1] MacTutor History of Mathematics, René Descartes 를, 1637 은 [4] Britannica, La Géométrie 도 따랐다.</text>
</svg>
