<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="그림 위쪽에 「실물 없는 기계, 남이 적은 값 장형」이라는 표제가 있고 그 아래 두 줄에 위는 지진계가 어떻게 전해졌나(해), 아래는 자료마다 그의 것이라 적는 원주율 값(수직선)이며 갈색은 장형 자신의 때, 푸른 점은 뒤 사람의 기록, 빈 점은 복원 모형이라고 적혀 있다. 위쪽 지진계 줄에는 가로축 100 부터 1900 까지의 해 위에 132 만들다와 138 서쪽 지진을 알리다라는 갈색 점, 5세기 『후한서』의 기록과 1290 무렵 저우미, 남지 않았다라는 푸른 점, 1939 이마무라 복원과 1950년대 복원 모형이라는 빈 점이 있다. 아래쪽 원주율 수직선은 3.10 부터 3.20 까지이고, π (유휘 3.14159) 자리에 세로 점선이 있으며, 갈색 점 셋 730/232 ≈ 3.1466, √10 ≈ 3.1623, 736/232 ≈ 3.1724 와 푸른 점 유흠 3.154 (그보다 앞)이 있다. 맨 아래에 단서가 셋 있다. 첫째, √10 은 MacTutor · 위키백과, 736/232 는 위키백과(130 무렵), 730/232 는 국내 「세상의 모든 지식」(『산망론』)이 적고 세 값의 소수는 이 노트의 셈이며 유휘의 3.14159 는 위키백과를 따랐다. 둘째, 『후한서』는 5세기 범엽의 책이라 그 가운데 430 에 두었고 복원 모형이 기록만큼 정확한지는 자료가 갈린다(본문 §4). 셋째, 1950년대 모형은 국내 「중국사 다이제스트」, 1939 · 1290 은 위키백과를 따랐고 1950년대는 1955 에 두었다">
  <title>실물 없는 기계, 남이 적은 값 — 장형</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;} .blue{fill:#3A5C77;}
    .row{stroke:#C9BBA6;stroke-width:1;} .axis{stroke:#8A7F6E;stroke-width:1;}
    .sd{fill:#9C5A2C;} .bd{fill:#3A5C77;} .ring{fill:#FFFDF7;stroke:#3A5C77;stroke-width:1.4;} .pi{stroke:#221E18;stroke-width:1;stroke-dasharray:2 3;}
  </style>
  <rect width="720" height="540" fill="#FFFDF7"/>
  <text x="30" y="30" font-size="16">실물 없는 기계, 남이 적은 값 — 장형</text>
  <text x="30" y="50" font-size="11" class="dim">위는 지진계가 어떻게 전해졌나(해), 아래는 자료마다 그의 것이라 적는 원주율 값(수직선)이다.</text>
  <text x="30" y="66" font-size="11" class="dim">갈색은 장형 자신의 때, 푸른 점은 뒤 사람의 기록, 빈 점은 복원 모형이다.</text>

  <text x="30" y="110" font-size="11">지진계</text>
  <line x1="60" y1="150" x2="650" y2="150" class="row"/>
  <circle cx="69.9" cy="150" r="5" class="sd"/><text x="69.9" y="116" font-size="10" class="sien" text-anchor="start">132 만들다</text>
  <circle cx="71.8" cy="150" r="3" class="sd"/><text x="71.8" y="172" font-size="10" class="sien" text-anchor="start">138 서쪽 지진을 알리다</text>
  <circle cx="162.5" cy="150" r="5" class="bd"/><text x="190" y="136" font-size="10" class="blue" text-anchor="start">5세기 『후한서』의 기록</text>
  <circle cx="429.5" cy="150" r="5" class="bd"/><text x="429.5" y="136" font-size="10" class="blue" text-anchor="middle">1290 무렵 저우미: 남지 않았다</text>
  <circle cx="631" cy="150" r="5" class="ring"/><text x="631" y="172" font-size="10" class="blue" text-anchor="end">1939 이마무라 복원</text>
  <circle cx="636" cy="150" r="5" class="ring"/><text x="636" y="136" font-size="10" class="blue" text-anchor="end">1950년대 복원 모형</text>
  <line x1="60" y1="200" x2="650" y2="200" class="axis"/>
  <line x1="60" y1="196" x2="60" y2="204" class="axis"/><text x="60" y="217" font-size="10" class="ax" text-anchor="middle">100</text><line x1="184.2" y1="196" x2="184.2" y2="204" class="axis"/><text x="184.2" y="217" font-size="10" class="ax" text-anchor="middle">500</text><line x1="339.4" y1="196" x2="339.4" y2="204" class="axis"/><text x="339.4" y="217" font-size="10" class="ax" text-anchor="middle">1000</text><line x1="494.7" y1="196" x2="494.7" y2="204" class="axis"/><text x="494.7" y="217" font-size="10" class="ax" text-anchor="middle">1500</text><line x1="618.9" y1="196" x2="618.9" y2="204" class="axis"/><text x="618.9" y="217" font-size="10" class="ax" text-anchor="middle">1900</text>

  <text x="30" y="304" font-size="11">원주율 — 누가 무엇을 그의 값으로 적나</text>
  <line x1="60" y1="360" x2="650" y2="360" class="axis"/>
  <line x1="60" y1="356" x2="60" y2="364" class="axis"/><text x="60" y="378" font-size="10" class="ax" text-anchor="middle">3.10</text><line x1="178" y1="356" x2="178" y2="364" class="axis"/><text x="178" y="378" font-size="10" class="ax" text-anchor="middle">3.12</text><line x1="296" y1="356" x2="296" y2="364" class="axis"/><text x="296" y="378" font-size="10" class="ax" text-anchor="middle">3.14</text><line x1="414" y1="356" x2="414" y2="364" class="axis"/><text x="414" y="378" font-size="10" class="ax" text-anchor="middle">3.16</text><line x1="532" y1="356" x2="532" y2="364" class="axis"/><text x="532" y="378" font-size="10" class="ax" text-anchor="middle">3.18</text><line x1="650" y1="356" x2="650" y2="364" class="axis"/><text x="650" y="378" font-size="10" class="ax" text-anchor="middle">3.20</text>
  <line x1="305.4" y1="320" x2="305.4" y2="360" class="pi"/><text x="296" y="316" font-size="10" class="dim" text-anchor="end">π (유휘 3.14159)</text>
  <circle cx="334.9" cy="360" r="5" class="sd"/><text x="334.9" y="398" font-size="10" class="sien" text-anchor="end">730/232 ≈ 3.1466</text>
  <circle cx="427.6" cy="360" r="5" class="sd"/><text x="427.6" y="346" font-size="10" class="sien" text-anchor="middle">√10 ≈ 3.1623</text>
  <circle cx="487.2" cy="360" r="5" class="sd"/><text x="487.2" y="398" font-size="10" class="sien" text-anchor="start">736/232 ≈ 3.1724</text>
  <circle cx="378.6" cy="360" r="4" class="bd"/><text x="378.6" y="326" font-size="10" class="blue" text-anchor="start">유흠 3.154 (그보다 앞)</text>

  <text x="30" y="456" font-size="10" class="ax">⚠ √10 은 MacTutor · 위키백과, 736/232 는 위키백과(130 무렵), 730/232 는 국내 「세상의 모든 지식」(『산망론』)이 적는다.</text>
  <text x="30" y="472" font-size="10" class="ax">   세 값의 소수는 이 노트의 셈이고, 유휘의 3.14159 는 위키백과를 따랐다.</text>
  <text x="30" y="490" font-size="10" class="ax">⚠ 『후한서』는 5세기 범엽의 책이라 그 가운데 430 에 두었다. 복원 모형이 기록만큼 정확한지는 자료가 갈린다(본문 §4).</text>
  <text x="30" y="508" font-size="10" class="ax">⚠ 1950년대 모형은 국내 「중국사 다이제스트」, 1939 · 1290 은 위키백과를 따랐다. 1950년대는 1955 에 두었다.</text>
</svg>
