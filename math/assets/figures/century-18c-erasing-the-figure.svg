<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 532" width="700" height="532" role="img" aria-label="그림 위쪽에 「그림을 지우다」라는 표제가 있고 그 아래에 쪽은 모식도, 사선 칸은 그림, 가로줄은 식과 글이라는 부호표가 있다. 가로로 쪽 셋이 나란히 있다. 왼쪽 쪽은 위에 사선 칸 하나가 있고 그 아래로 화살표가 내려와 가로줄 여섯으로 이어진다. 쪽 아래에 데카르트, 도형을 식으로 번역이라고 적혀 있다. 가운데 쪽은 사선 칸 둘이 지면 대부분을 차지하고 그 사이와 아래에 가로줄이 몇 줄 있다. 쪽 아래에 뉴턴 프린키피아, 대부분 기하학적으로라고 적혀 있다. 오른쪽 쪽은 사선 칸이 하나도 없고 가로줄만 위에서 아래까지 채워져 있다. 쪽 아래에 라그랑주 해석 역학 1788, 그림 하나 없이라고 적혀 있다. 쪽들 위에 괄호가 둘 있다. 가운데 쪽에서 오른쪽 쪽까지 묶는 낮은 괄호에 101년, 왼쪽 쪽에서 오른쪽 쪽까지 묶는 높은 괄호에 약 150년이라고 적혀 있다. 쪽들 아래에 라그랑주의 서문 한 줄, 이 책에서는 그림을 하나도 찾을 수 없을 것이다가 인용되어 있다. 아래에 단서가 다섯 줄 있다. 첫째, 쪽은 모식도라서 실제 지면을 옮기지 않았고 그림과 식의 비율도 재지 않았다. 둘째, 세 쪽이 보이는 것은 노트가 적은 방향뿐이다. 셋째, 쪽 사이 간격은 햇수에 비례하지 않고 햇수는 위 괄호에 적은 것이 전부다. 넷째, 약 150년은 노트 본문의 말이라 데카르트 쪽에는 해를 적지 않았다. 다섯째, 101년과 뉴턴과 라그랑주의 방식, 서문 인용은 출처 3번을 따랐다.">
<title>그림을 지우다</title>
<defs>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#9C5A2C" stroke-width="1.2"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B5245"/></marker>
</defs>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
