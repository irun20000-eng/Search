  <text class="ev" x="155.0" y="360" text-anchor="middle">데카르트</text>
  <text class="sm" x="155.0" y="375" text-anchor="middle">도형을 식으로 번역</text>
  <text class="ev" x="350.0" y="360" text-anchor="middle">뉴턴 『프린키피아』</text>
  <text class="sm" x="350.0" y="375" text-anchor="middle">대부분 기하학적으로</text>
  <text class="ev" x="545.0" y="360" text-anchor="middle">라그랑주 『해석 역학』 1788</text>
  <text class="sm" x="545.0" y="375" text-anchor="middle">그림 하나 없이</text>
  <path class="brk" d="M350.0,140 V134 H545.0 V140"/>
  <text class="ev" x="447.5" y="128" text-anchor="middle">101년</text>
  <path class="brk" d="M155.0,110 V104 H545.0 V110"/>
  <text class="ev" x="350.0" y="98" text-anchor="middle">약 150년</text>
  <text class="qt" x="56.0" y="404" text-anchor="start">「이 책에서는 그림을 하나도 찾을 수 없을 것이다.」 — 라그랑주, 『해석 역학』 서문</text>
<text class="warn" x="56" y="440">⚠ 쪽은 모식도다 — 실제 지면을 옮기지 않았고, 그림과 식의 비율도 재지 않았다.</text>
<text class="warn" x="56" y="457">⚠ 세 쪽이 보이는 것은 노트가 적은 방향뿐이다 — 번역 · 대부분 기하학적 · 그림 없음.</text>
<text class="warn" x="56" y="474">⚠ 쪽 사이 간격은 햇수에 비례하지 않는다. 햇수는 위 괄호에 적은 것이 전부다.</text>
<text class="warn" x="56" y="491">⚠ 「약 150년」은 노트 본문의 말이라 데카르트 쪽에는 해를 적지 않았다.</text>
<text class="warn" x="56" y="508">⚠ 「101년」 · 뉴턴과 라그랑주의 방식 · 서문 인용은 출처 [3]을 따랐다.</text>
</svg>
