    .ev{font-size:11px;} .sm{font-size:10.5px;fill:#5B5245;} .qt{font-size:11.5px;}
    .bg{fill:#FFFDF7;}
    .page{fill:#FFFDF7;stroke:#8A7F6E;stroke-width:1;}
