<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 468" role="img" aria-label="그림 위쪽에 「면의 점을 선의 점으로 — 자릿수를 엮는다」라는 표제가 있고 그 아래에 정사각형의 한 점을 선분의 한 점으로 보내며 두 좌표의 자릿수를 번갈아 엮는다고 적혀 있다. 왼쪽에는 눈금이 그어진 정사각형이 있고 그 안에 점이 하나 찍혀 있다. 가로가 0.5183, 세로가 0.2794 다. 오른쪽에는 그 두 수의 자릿수가 두 줄로 놓여 있다. 위 줄이 x 의 자릿수 5·1·8·3 이고 아래 줄이 y 의 자릿수 2·7·9·4 인데 두 줄의 자리가 서로 어긋나 있다. 가는 세로선이 두 줄에서 번갈아 내려와 한 줄로 모이고, 그 줄에 0.52178934 가 적혀 있다. 그 아래에는 0 에서 1 까지의 선분이 있고 0.52178934 자리에 점이 찍혀 있다. 맨 아래에는 선분이 하나 더 있다. 세로를 0.2794 로 고정하고 가로만 0.4999 와 0.5000 으로 둔 두 점을 엮으면 0.42979994 와 0.52070904 가 되어 선분에서 멀찍이 떨어진다. 두 점 사이가 0.0909 로 가로로 옮긴 0.0001 의 909 배이며 이 대응은 연속이 아니라고 적혀 있다. 맨 아래에는 단서가 셋 있다. 첫째는 이 엮기가 대응을 눈으로 보이려는 장치이며 칸토어의 증명이 쓴 방법인지는 이 그림이 말하지 않는다는 것이고, 둘째는 엮기만으로는 아직 일대일 대응이 아니며 0.5 가 0.5000… 로도 0.4999… 로도 적히는데 엮으면 갈라진다는 것이고, 셋째는 네 자리까지만 그렸으며 실제로는 자릿수가 끝없이 이어지고 엮은 것도 끝이 없다는 것이다">
  <title>면의 점을 선의 점으로 — 자릿수를 엮는다</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .blue{fill:#3A5C77;} .ax{fill:#8A7F6E;}
    .box{fill:none;stroke:#8A7F6E;stroke-width:1.1;}
    .grid{stroke:#E6D5BD;stroke-width:0.7;}
    .gd{stroke:#8A7F6E;stroke-width:0.8;stroke-dasharray:3 3;}
    .tie{stroke:#8A7F6E;stroke-width:0.7;}
    .seg{stroke:#221E18;stroke-width:1.6;stroke-linecap:round;}
    .tick{stroke:#8A7F6E;stroke-width:1.2;}
  </style>
  <rect width="700" height="468" fill="#FFFDF7"/>
  <text x="56" y="30" font-size="16">면의 점을 선의 점으로 — 자릿수를 엮는다</text>
  <text x="56" y="52" font-size="12" class="dim">정사각형의 한 점을 선분의 한 점으로 — 두 좌표의 자릿수를 번갈아 엮는다.</text>
  <line x1="69.20" y1="84.00" x2="69.20" y2="216.00" class="grid"/>
  <line x1="56.00" y1="202.80" x2="188.00" y2="202.80" class="grid"/>
