<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-label="x제곱 더하기 10x 는 39 을 정사각형을 완성해 푸는 그림">
  <title>완전제곱 — 비어 있는 네 귀퉁이를 채운다</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
  </style>
  <rect width="700" height="430" fill="#FFFDF7"/>

  <text x="60" y="27" font-size="16">x² + 10x = 39 — 알콰리즈미의 유형 4</text>

  <!-- 채워진 부분: x² 과 네 조각의 10x -->
  <rect x="280" y="140" width="120" height="120" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.6"/>
  <rect x="280" y="40"  width="120" height="100" fill="#F2E7D6" stroke="#9C5A2C" stroke-width="1.4"/>
  <rect x="280" y="260" width="120" height="100" fill="#F2E7D6" stroke="#9C5A2C" stroke-width="1.4"/>
  <rect x="180" y="140" width="100" height="120" fill="#F2E7D6" stroke="#9C5A2C" stroke-width="1.4"/>
  <rect x="400" y="140" width="100" height="120" fill="#F2E7D6" stroke="#9C5A2C" stroke-width="1.4"/>

  <!-- 비어 있는 네 귀퉁이 — 채워 넣는 25 -->
  <rect x="180" y="40"  width="100" height="100" fill="#FFFDF7" stroke="#3A5C77" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="400" y="40"  width="100" height="100" fill="#FFFDF7" stroke="#3A5C77" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="180" y="260" width="100" height="100" fill="#FFFDF7" stroke="#3A5C77" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="400" y="260" width="100" height="100" fill="#FFFDF7" stroke="#3A5C77" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- 큰 정사각형 테두리 -->
  <rect x="180" y="40" width="320" height="320" fill="none" stroke="#221E18" stroke-width="2.2"/>

  <!-- 칸 이름 -->
  <text x="340" y="207" font-size="21" font-style="italic" text-anchor="middle">x²</text>
  <text x="340" y="96"  font-size="15" text-anchor="middle">2.5x</text>
  <text x="340" y="316" font-size="15" text-anchor="middle">2.5x</text>
  <text x="230" y="207" font-size="15" text-anchor="middle">2.5x</text>
  <text x="450" y="207" font-size="15" text-anchor="middle">2.5x</text>
  <text x="230" y="96"  font-size="13" text-anchor="middle" class="blue">6.25</text>
  <text x="450" y="96"  font-size="13" text-anchor="middle" class="blue">6.25</text>
  <text x="230" y="316" font-size="13" text-anchor="middle" class="blue">6.25</text>
  <text x="450" y="316" font-size="13" text-anchor="middle" class="blue">6.25</text>

  <!-- 한 변 = 8 -->
  <line x1="180" y1="378" x2="500" y2="378" stroke="#8A7F6E" stroke-width="1.2"/>
  <line x1="180" y1="372" x2="180" y2="384" stroke="#8A7F6E" stroke-width="1.2"/>
  <line x1="500" y1="372" x2="500" y2="384" stroke="#8A7F6E" stroke-width="1.2"/>
  <text x="340" y="397" font-size="14" text-anchor="middle" class="ax">한 변 = x + 5 = 8</text>

  <!-- 오른쪽 셈 -->
  <text x="528" y="150" font-size="13.5" class="blue">비어 있는 네 귀퉁이</text>
  <text x="528" y="172" font-size="13.5" class="blue">6.25 × 4 = 25</text>
  <text x="528" y="212" font-size="13.5" class="sien">39 + 25 = 64</text>
  <text x="528" y="234" font-size="13.5" class="sien">√64 = 8</text>
  <text x="528" y="256" font-size="13.5" class="sien">x + 5 = 8 → x = 3</text>

  <text x="60" y="419" font-size="13" class="dim">기호가 없었으므로 왜 맞는지를 보이는 수단은 그림뿐이었다. 「완전제곱」이 글자 그대로인 자리다.</text>
</svg>
