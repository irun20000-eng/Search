<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 456" role="img" aria-label="그림 위쪽에 「단위근 — n개의 근이 원 위에 고르게 박힌다」라는 표제가 있고 그 아래에 z의 n제곱이 1인 방정식의 해가 정n각형의 꼭짓점이라고 적혀 있다. 가운데에 같은 크기의 원이 셋 나란히 있다. 왼쪽은 n이 3인 경우로 원 위에 점이 셋 있고 그 셋을 이은 정삼각형이 파선으로 그려져 있다. 가운데는 n이 4인 경우로 점이 넷이고 정사각형이며, 네 점에 각각 1과 i와 마이너스 1과 마이너스 i가 적혀 있다. 오른쪽은 n이 6인 경우로 점이 여섯이고 정육각형이다. 세 원 모두 오른쪽 끝 점에 1이 적혀 있고 그 점이 시에나색으로 칠해져 있으며, 거기서부터 반시계 방향으로 이웃한 점까지의 각이 표시돼 있다 — 왼쪽부터 120도, 90도, 60도다. 세 원 아래에는 수를 늘어놓은 직선이 하나 있고 마이너스 1과 0과 1이 눈금으로 적혀 있는데, 채워진 점은 1 하나뿐이다. 그 옆에 z의 세제곱이 1인 방정식의 실근은 1 하나이며 평면으로 넓히면 셋이 된다고 적혀 있다. 맨 아래에는 단서가 셋 있다. 첫째는 점의 각도를 눈대중이 아니라 2파이 곱하기 k 나누기 n 으로 찍었다는 것이고, 둘째는 n이 3과 4와 6인 경우만 그렸으며 다른 n도 고르게 박히는 것은 같다는 것이고, 셋째는 이 그림이 근의 자리를 보일 뿐 n차 방정식의 근이 n개라는 정리를 증명하지는 않는다는 것이다">
  <title>단위근 — n개의 근이 원 위에 고르게 박힌다</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .circ{fill:none;stroke:#8A7F6E;stroke-width:1.2;}
    .axis{stroke:#D8CDBB;stroke-width:1;}
    .poly{fill:none;stroke:#9C5A2C;stroke-width:1.4;stroke-dasharray:5 4;}
    .arc{fill:none;stroke:#3A5C77;stroke-width:1.4;}
    .nl{stroke:#8A7F6E;stroke-width:1.2;}
  </style>
  <rect width="700" height="456" fill="#FFFDF7"/>
  <text x="56" y="30" font-size="16">단위근 — n개의 근이 원 위에 고르게 박힌다</text>
  <text x="56" y="52" font-size="12" class="dim">zⁿ = 1 의 해는 정n각형의 꼭짓점이다.</text>
  <text x="160.0" y="98.0" font-size="13" text-anchor="middle">n = 3 — 정삼각형</text>
  <line x1="74.0" y1="198.0" x2="246.0" y2="198.0" class="axis"/>
  <line x1="160.0" y1="112.0" x2="160.0" y2="284.0" class="axis"/>
  <circle cx="160.0" cy="198.0" r="74.0" class="circ"/>
  <polygon points="234.00,198.00 123.00,133.91 123.00,262.09" class="poly"/>
  <circle cx="234.00" cy="198.00" r="4" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="123.00" cy="133.91" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="123.00" cy="262.09" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <text x="241.0" y="191.0" font-size="12" class="sien">1</text>
  <path d="M189.60 198.00 A29.60 29.60 0 0 0 145.20 172.37" class="arc"/>
  <text x="206.00" y="122.33" font-size="11" text-anchor="middle" fill="#3A5C77">120°</text>
  <text x="350.0" y="98.0" font-size="13" text-anchor="middle">n = 4 — 정사각형</text>
  <line x1="264.0" y1="198.0" x2="436.0" y2="198.0" class="axis"/>
  <line x1="350.0" y1="112.0" x2="350.0" y2="284.0" class="axis"/>
  <circle cx="350.0" cy="198.0" r="74.0" class="circ"/>
  <polygon points="424.00,198.00 350.00,124.00 276.00,198.00 350.00,272.00" class="poly"/>
  <circle cx="424.00" cy="198.00" r="4" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="350.00" cy="124.00" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="276.00" cy="198.00" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="350.00" cy="272.00" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <text x="431.0" y="191.0" font-size="12" class="sien">1</text>
  <text x="359.0" y="119.0" font-size="12" text-anchor="start">i</text>
  <text x="269.0" y="191.0" font-size="12" text-anchor="end">−1</text>
  <text x="359.0" y="286.0" font-size="12" text-anchor="start">−i</text>
  <path d="M379.60 198.00 A29.60 29.60 0 0 0 350.00 168.40" class="arc"/>
  <text x="415.05" y="136.95" font-size="11" text-anchor="middle" fill="#3A5C77">90°</text>
  <text x="540.0" y="98.0" font-size="13" text-anchor="middle">n = 6 — 정육각형</text>
  <line x1="454.0" y1="198.0" x2="626.0" y2="198.0" class="axis"/>
  <line x1="540.0" y1="112.0" x2="540.0" y2="284.0" class="axis"/>
  <circle cx="540.0" cy="198.0" r="74.0" class="circ"/>
  <polygon points="614.00,198.00 577.00,133.91 503.00,133.91 466.00,198.00 503.00,262.09 577.00,262.09" class="poly"/>
  <circle cx="614.00" cy="198.00" r="4" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="577.00" cy="133.91" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="503.00" cy="133.91" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="466.00" cy="198.00" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="503.00" cy="262.09" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <circle cx="577.00" cy="262.09" r="4" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="1.2"/>
  <text x="621.0" y="191.0" font-size="12" class="sien">1</text>
  <path d="M569.60 198.00 A29.60 29.60 0 0 0 554.80 172.37" class="arc"/>
  <text x="619.67" y="156.00" font-size="11" text-anchor="middle" fill="#3A5C77">60°</text>
  <line x1="56.0" y1="330.0" x2="256.0" y2="330.0" class="nl"/>
  <circle cx="70.0" cy="330.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1.2"/>
  <text x="70.0" y="348.0" font-size="11" text-anchor="middle" class="ax">−1</text>
  <circle cx="156.0" cy="330.0" r="3.0" fill="#FFFDF7" stroke="#8A7F6E" stroke-width="1.2"/>
  <text x="156.0" y="348.0" font-size="11" text-anchor="middle" class="ax">0</text>
  <circle cx="242.0" cy="330.0" r="4.5" fill="#9C5A2C" stroke="#9C5A2C" stroke-width="1.2"/>
  <text x="242.0" y="348.0" font-size="11" text-anchor="middle" class="sien">1</text>
  <text x="56" y="372.0" font-size="12" class="dim">z³ = 1 의 실근은 1 하나뿐이다 — 평면으로 넓히면 셋이 고르게 박힌다.</text>
  <text x="56" y="398.0" font-size="11" class="ax">⚠ 점의 각은 눈대중이 아니라 2πk ÷ n 으로 찍었다.</text>
  <text x="56" y="416.0" font-size="11" class="ax">⚠ n = 3·4·6 만 그렸다. 다른 n 도 고르게 박히는 것은 같다.</text>
  <text x="56" y="434.0" font-size="11" class="ax">⚠ 이 그림은 근의 자리를 보일 뿐, 「n차 방정식의 근이 n개」를 증명하지는 않는다.</text>
</svg>
