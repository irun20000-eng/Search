<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 412" role="img" aria-label="그림 위쪽에 「정의가 그림이 된다 — 복소평면과 i 를 곱하는 일」이라는 표제가 있다. 그 아래 왼쪽과 오른쪽 두 그림이 나란히 있다. 왼쪽은 복소평면이다. 가로축이 실수축, 세로축이 허수축이고 원점에서 만난다. 실수축에 1, 2, 3 눈금이 있고 셋 다 숫자가 붙어 있으며, 허수축에 i 와 2i 눈금이 있다. 실수 3, 허수 2 자리에 큰 점이 하나 찍혀 있고 거기서 두 축으로 파선 안내선이 내려가 있으며, 그 점 옆에 3 더하기 2i 는 좌표 3, 2 라고 적혀 있다. 오른쪽은 반지름 1 인 원을 파선으로 그린 것이다. 원 위의 오른쪽 끝에 1, 위쪽 끝에 i, 왼쪽 끝에 마이너스 1 이 점으로 찍혀 있다. 원 안에는 옅은 파선 십자 안내선이 있고, 원점에는 1 방향과 i 방향 사이의 각을 표시한 작은 호가 있으며 90도라고 적혀 있다. 원 바깥에는 굽은 화살표가 둘 있고 사이가 벌어져 있어 따로따로 세어진다. 하나는 1 이 있는 방향에서 시작해 i 가 있는 방향에서 끝나고, 다른 하나는 i 가 있는 방향에서 시작해 마이너스 1 이 있는 방향에서 끝난다. 둘 다 4분의 1 바퀴이고 각각 i 를 곱한다는 표시가 붙어 있다. 그림 아래에는 부호 설명이 있다. 왼쪽은 큰 점이 3 더하기 2i 이고 파선이 그 점에서 두 축으로 내린 안내선이라는 것, 오른쪽은 파선 원이 반지름 1 인 원이고 그 안 파선 십자가 두 축이며 원 위의 점 셋이 1 과 i 와 마이너스 1 이라는 것, 그리고 원 바깥의 굽은 화살표 둘이 i 를 한 번씩 곱하는 것이고 원점의 작은 호가 두 방향 사이의 각이라는 것이다. 맨 아래에는 두 그림의 축척이 다르다는 단서가 있다. 오른쪽은 단위원을 크게 그린 것이다">
  <title>정의가 그림이 된다 — 복소평면과 i 를 곱하는 일</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .axis{stroke:#8A7F6E;stroke-width:1.4;}
    .guide{stroke:#8A7F6E;stroke-width:1;stroke-dasharray:4 4;}
    .circ{fill:none;stroke:#3A5C77;stroke-width:1.4;stroke-dasharray:6 4;}
    .rot{fill:none;stroke:#9C5A2C;stroke-width:2;}
  </style>
  <rect width="700" height="412" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">정의가 그림이 된다 — 복소평면과 i 를 곱하는 일</text>
  <line x1="88" y1="206" x2="286" y2="206" class="axis"/>
  <polygon points="292,206 281,201.5 281,210.5" fill="#8A7F6E"/>
  <line x1="150" y1="264" x2="150" y2="112" class="axis"/>
  <polygon points="150,106 145.5,117 154.5,117" fill="#8A7F6E"/>
  <line x1="178" y1="202" x2="178" y2="210" class="axis"/>
  <line x1="206" y1="202" x2="206" y2="210" class="axis"/>
  <line x1="234" y1="202" x2="234" y2="210" class="axis"/>
  <line x1="146" y1="178" x2="154" y2="178" class="axis"/>
  <line x1="146" y1="150" x2="154" y2="150" class="axis"/>
  <line x1="234" y1="150" x2="234" y2="206" class="guide"/>
  <line x1="150" y1="150" x2="234" y2="150" class="guide"/>
  <circle cx="234" cy="150" r="6" fill="#9C5A2C"/>
  <text x="174" y="224" font-size="12" class="ax">1</text>
  <text x="202" y="224" font-size="12" class="ax">2</text>
  <text x="230" y="224" font-size="12" class="ax">3</text>
  <text x="134" y="182" font-size="12" class="ax">i</text>
  <text x="128" y="154" font-size="12" class="ax">2i</text>
  <text x="252" y="196" font-size="12" class="ax">실수축</text>
  <text x="160" y="110" font-size="12" class="ax">허수축</text>
  <text x="246" y="144" font-size="13" class="sien">3 + 2i ↔ (3, 2)</text>
  <line x1="404" y1="208" x2="596" y2="208" class="guide"/>
  <line x1="500" y1="304" x2="500" y2="112" class="guide"/>
  <circle cx="500" cy="208" r="90" class="circ"/>
  <path d="M552,208 A52,52 0 0 0 500,156" fill="none" stroke="#8A7F6E" stroke-width="1.2"/>
  <text x="514" y="196" font-size="11" class="ax">90°</text>
  <path d="M603.7,200.7 A104,104 0 0 0 507.3,104.3" class="rot"/>
  <polygon points="507.3,104.3 518.7,99.6 517.9,110.6" fill="#9C5A2C"/>
  <path d="M492.7,104.3 A104,104 0 0 0 396.3,200.7" class="rot"/>
  <polygon points="396.3,200.7 391.6,189.3 402.6,190.1" fill="#9C5A2C"/>
  <circle cx="590" cy="208" r="6" fill="#3A5C77"/>
  <circle cx="500" cy="118" r="6" fill="#3A5C77"/>
  <circle cx="410" cy="208" r="6" fill="#3A5C77"/>
  <text x="572" y="228" font-size="13" class="blue">1</text>
  <text x="510" y="136" font-size="13" class="blue">i</text>
  <text x="416" y="228" font-size="13" class="blue">−1</text>
  <text x="600" y="122" font-size="13" class="sien">× i</text>
  <text x="382" y="122" font-size="13" class="sien">× i</text>
  <text x="46" y="340" font-size="13" class="dim">왼쪽 — 큰 점이 3 + 2i, 파선이 그 점에서 두 축으로 내린 안내선.</text>
  <text x="46" y="362" font-size="13" class="dim">오른쪽 — 파선 원이 반지름 1 인 원, 그 안 파선 십자가 두 축, 원 위의 점 셋이 1 과 i 와 −1.</text>
  <text x="46" y="384" font-size="13" class="dim">원 바깥의 굽은 화살표 둘은 i 를 한 번씩 곱하는 것이고, 원점의 작은 호는 두 방향 사이의 각이다.</text>
  <text x="46" y="406" font-size="13" class="sien">⚠ 두 그림의 축척이 다르다 — 오른쪽은 단위원을 크게 그린 것이다.</text>
</svg>
