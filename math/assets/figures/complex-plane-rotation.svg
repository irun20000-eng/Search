<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 396" role="img" aria-label="왼쪽과 오른쪽 두 그림이 나란히 있다. 왼쪽은 복소평면이다. 가로축이 실수축, 세로축이 허수축이고 원점에서 만난다. 실수축에 1, 2, 3 눈금이 있고 1 과 3 에 숫자가 붙어 있으며, 허수축에 i 와 2i 눈금이 있다. 실수 3, 허수 2 자리에 점이 하나 찍혀 있고 거기서 두 축으로 파선 안내선이 내려가 있으며, 그 점 옆에 3 더하기 2i 는 좌표 3, 2 라고 적혀 있다. 오른쪽은 반지름 1 인 원이다. 원 위의 오른쪽 끝에 1, 위쪽 끝에 i, 왼쪽 끝에 마이너스 1 이 표시되어 있고 세 점 모두 찍혀 있다. 원 바깥에 굽은 화살표가 둘 있는데 하나는 1 에서 i 로, 다른 하나는 i 에서 마이너스 1 로 향하고 각각 i 를 곱한다는 표시가 붙어 있다. 두 화살표는 각각 90도씩이다. 원 안쪽 원점에는 1 방향과 i 방향 사이의 직각을 표시한 작은 호가 있고 90도라고 적혀 있다. 아래에는 왼쪽 그림이 수 하나가 평면의 점 하나라는 것이고, 오른쪽 그림은 1 에 i 를 곱하면 i 가 되고 i 에 i 를 곱하면 마이너스 1 이 되며 두 번 다 90도라는 것이라고 적혀 있다. 맨 아래에는 제곱해서 마이너스 1 이 되는 수라는 정의가 두 번 돌면 반대편이라는 그림이 된다고 적혀 있다">
  <title>정의가 그림이 된다 — 복소평면과 i 를 곱하는 일</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .axis{stroke:#8A7F6E;stroke-width:1.4;}
    .guide{stroke:#8A7F6E;stroke-width:1;stroke-dasharray:4 4;}
    .circ{fill:none;stroke:#3A5C77;stroke-width:1.4;stroke-dasharray:6 4;}
    .rot{fill:none;stroke:#9C5A2C;stroke-width:2;}
  </style>
  <rect width="700" height="396" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">정의가 그림이 된다 — 복소평면과 i 를 곱하는 일</text>

  <!-- ══ 왼쪽: 복소평면 위의 한 점 ══ -->
  <line x1="56" y1="206" x2="286" y2="206" class="axis"/>
  <polygon points="292,206 281,201.5 281,210.5" fill="#8A7F6E"/>
  <line x1="150" y1="292" x2="150" y2="112" class="axis"/>
  <polygon points="150,106 145.5,117 154.5,117" fill="#8A7F6E"/>
  <line x1="178" y1="202" x2="178" y2="210" class="axis"/>
  <line x1="206" y1="202" x2="206" y2="210" class="axis"/>
  <line x1="234" y1="202" x2="234" y2="210" class="axis"/>
  <line x1="146" y1="178" x2="154" y2="178" class="axis"/>
  <line x1="146" y1="150" x2="154" y2="150" class="axis"/>
  <line x1="234" y1="150" x2="234" y2="206" class="guide"/>
  <line x1="150" y1="150" x2="234" y2="150" class="guide"/>
  <circle cx="234" cy="150" r="6" fill="#9C5A2C"/>
  <text x="172" y="224" font-size="12" class="ax">1</text>
  <text x="228" y="224" font-size="12" class="ax">3</text>
  <text x="134" y="182" font-size="12" class="ax">i</text>
  <text x="128" y="154" font-size="12" class="ax">2i</text>
  <text x="252" y="196" font-size="12" class="ax">실수축</text>
  <text x="160" y="110" font-size="12" class="ax">허수축</text>
  <text x="246" y="144" font-size="13" class="sien">3 + 2i ↔ (3, 2)</text>

  <!-- ══ 오른쪽: 1 → i → −1 ══ -->
  <line x1="398" y1="208" x2="602" y2="208" class="axis"/>
  <line x1="500" y1="306" x2="500" y2="110" class="axis"/>
  <circle cx="500" cy="208" r="90" class="circ"/>
  <path d="M612.9,192.1 A114,114 0 0 0 515.9,95.1" class="rot"/>
  <polygon points="515.9,95.1 527.5,91.2 526.0,102.1" fill="#9C5A2C"/>
  <path d="M484.1,95.1 A114,114 0 0 0 387.1,192.1" class="rot"/>
  <polygon points="387.1,192.1 383.2,180.5 394.1,182.0" fill="#9C5A2C"/>
  <circle cx="590" cy="208" r="6" fill="#3A5C77"/>
  <circle cx="500" cy="118" r="6" fill="#3A5C77"/>
  <circle cx="410" cy="208" r="6" fill="#3A5C77"/>
  <text x="600" y="228" font-size="13" class="blue">1</text>
  <text x="510" y="114" font-size="13" class="blue">i</text>
  <text x="380" y="228" font-size="13" class="blue">−1</text>
  <text x="578" y="122" font-size="13" class="sien">× i</text>
  <text x="396" y="122" font-size="13" class="sien">× i</text>
  <path d="M536,208 A36,36 0 0 0 500,172" fill="none" stroke="#8A7F6E" stroke-width="1.2"/>
  <text x="540" y="180" font-size="12" class="ax">90°</text>

  <text x="56" y="340" font-size="13" class="dim">a + bi ↔ (a, b) — 수 하나가 평면의 점 하나다 [3][8]</text>
  <text x="380" y="340" font-size="13" class="dim">1 · i = i, i · i = −1 — 두 번 다 90° 다</text>
  <text x="46" y="372" font-size="13" class="sien">제곱해서 −1 이 되는 수라는 정의 [6] 가, 두 번 돌면 반대편이라는 그림이 된다.</text>
</svg>
