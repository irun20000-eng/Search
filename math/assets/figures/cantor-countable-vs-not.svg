<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 364" role="img" aria-label="왼쪽에는 번호 1, 2, 3, 4 가 붙은 칸 넷이 세로로 놓여 있고 그 아래로 점 세 개가 이어진다. 칸 위에는 대수적 수라고 적혀 있고 칸마다 화살표가 자연수 번호에서 나와 그 칸을 가리켜, 번호를 하나씩 붙일 수 있다는 것을 보인다. 오른쪽에는 속이 꽉 찬 굵은 가로 띠 하나가 있고 그 위에 실수라고 적혀 있다. 띠 왼쪽 끝에서 번호 1, 2, 3 이 붙은 화살표 셋이 띠 안쪽을 가리키지만 띠에는 화살표가 닿지 않은 자리가 그대로 남아 있다. 두 그림 사이에는 세로 구분선이 있다. 그림 아래에는 목록을 만들 수 있는 쪽과 어떤 목록을 만들어도 빠지는 자리가 남는 쪽이 갈린다는 설명과, 그래서 초월수가 예외가 아니라 다수가 된다는 문장, 그리고 이 그림은 결론을 보일 뿐 증명의 방법을 보이지는 않는다는 단서가 붙어 있다">
  <title>셀 수 있는 것과 셀 수 없는 것 — 1874년의 결론</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
  </style>
  <rect width="700" height="364" fill="#FFFDF7"/>
  <text x="46" y="28" font-size="16">번호를 붙일 수 있는 쪽과, 붙여도 자리가 남는 쪽</text>

  <text x="112" y="62" font-size="14" class="sien">대수적 수</text>
  <text x="452" y="62" font-size="14" class="blue">실수</text>
  <line x1="350" y1="48" x2="350" y2="268" stroke="#8A7F6E" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="72" y="101" font-size="13" class="ax">1</text>
  <line x1="90" y1="96" x2="120" y2="96" stroke="#9C5A2C" stroke-width="1.2"/>
  <polygon points="120,96 113,92 113,100" fill="#9C5A2C"/>
  <rect x="126" y="88" width="130" height="18" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <text x="72" y="135" font-size="13" class="ax">2</text>
  <line x1="90" y1="130" x2="120" y2="130" stroke="#9C5A2C" stroke-width="1.2"/>
  <polygon points="120,130 113,126 113,134" fill="#9C5A2C"/>
  <rect x="126" y="122" width="130" height="18" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <text x="72" y="169" font-size="13" class="ax">3</text>
  <line x1="90" y1="164" x2="120" y2="164" stroke="#9C5A2C" stroke-width="1.2"/>
  <polygon points="120,164 113,160 113,168" fill="#9C5A2C"/>
  <rect x="126" y="156" width="130" height="18" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <text x="72" y="203" font-size="13" class="ax">4</text>
  <line x1="90" y1="198" x2="120" y2="198" stroke="#9C5A2C" stroke-width="1.2"/>
  <polygon points="120,198 113,194 113,202" fill="#9C5A2C"/>
  <rect x="126" y="190" width="130" height="18" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <text x="176" y="248" font-size="15" class="sien">⋮</text>
  <text x="74" y="280" font-size="12" class="dim">하나씩 번호가 간다</text>

  <rect x="396" y="88" width="238" height="120" fill="#CBD8E2" stroke="#3A5C77" stroke-width="1.4"/>
  <text x="372" y="109" font-size="13" class="ax">1</text>
  <line x1="386" y1="104" x2="430" y2="104" stroke="#3A5C77" stroke-width="1.2"/>
  <circle cx="430" cy="104" r="3" fill="#3A5C77"/>
  <text x="372" y="145" font-size="13" class="ax">2</text>
  <line x1="386" y1="140" x2="456" y2="140" stroke="#3A5C77" stroke-width="1.2"/>
  <circle cx="456" cy="140" r="3" fill="#3A5C77"/>
  <text x="372" y="181" font-size="13" class="ax">3</text>
  <line x1="386" y1="176" x2="482" y2="176" stroke="#3A5C77" stroke-width="1.2"/>
  <circle cx="482" cy="176" r="3" fill="#3A5C77"/>
  <text x="500" y="238" font-size="12" class="dim">닿지 않은 자리가 남는다</text>

  <text x="46" y="300" font-size="13" class="dim">한쪽은 목록이 되고, 다른 쪽은 어떤 목록을 만들어도 빠지는 자리가 남는다.</text>
  <text x="46" y="324" font-size="13" class="dim">그래서 초월수가 예외가 아니라 다수다.</text>
  <text x="46" y="350" font-size="12" class="dim">⚠ 이 그림은 1874년의 결론만 보인다 — 증명의 방법은 보이지 않는다.</text>
</svg>
