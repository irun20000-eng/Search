<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 314" width="700" height="314" role="img" aria-label="그림 위쪽에 「『추측술』, 죽고 8년 뒤에 — 야코프 베르누이」라는 표제가 있고 그 아래에 띠는 나온 해, 점은 죽은 날, 괄호는 해의 차라는 부호표가 있다. 가로축은 1700년부터 1715년까지의 해이고, 줄이 하나 있다. 줄 이름은 왼쪽 끝에 『추측술』이라고 적혀 있다. 줄 위 1705년 8월 16일 자리에 검은 점이 있고 그 왼쪽 위에 1705.8.16 야코프가 죽다 — 책은 아직 미완성이라고 적혀 있다. 같은 줄 1713년에 띠가 있고 그 아래 왼쪽에 1713 바젤에서 나오다라고 적혀 있다. 검은 점에서 1713년 띠 가운데까지 걸친 괄호가 있고 그 위에 8년이라고 적혀 있다. 아래에 단서가 세 줄 있다. 첫째, 띠는 해로만 그렸고 점은 날짜까지 그렸다. 점은 책이 아직 미완성이던 날이라 『추측술』 줄에 두었다. 둘째, 8년은 노트의 말이다. 괄호는 죽은 날부터 1713 띠 가운데까지 그렸다. 셋째, 해와 날짜는 노트의 출처 1번 MacTutor 야코프 베르누이를 따랐다.">
<title>추측술 죽고 8년 뒤에 야코프 베르누이</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .pt{fill:#221E18;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="314"/>
<text class="h1" x="56" y="44">『추측술』, 죽고 8년 뒤에 — 야코프 베르누이</text>
<text class="h2" x="56" y="66">띠 = 나온 해 · 점 = 죽은 날 · 괄호 = 해의 차</text>
  <line class="lane" x1="200" y1="150" x2="640" y2="150"/>
  <text class="grp" x="56.0" y="154" text-anchor="start">『추측술』</text>
  <rect class="band" x="581.3" y="144" width="29.3" height="12" rx="2"/>
  <text class="ev" x="610.7" y="174" text-anchor="end">1713 바젤에서 나오다 [1]</text>
  <circle class="pt" cx="364.9" cy="150" r="4"/>
  <text class="ev" x="356.9" y="138" text-anchor="end">1705.8.16 야코프가 죽다 — 책은 아직 미완성 [1]</text>
  <path class="brk" d="M364.9,144 V110 H596.0 V142"/>
  <text class="ev" x="480.5" y="103" text-anchor="middle">8년 [1]</text>
  <line class="axis" x1="200" y1="206" x2="640" y2="206"/>
  <line class="axis" x1="200.0" y1="206" x2="200.0" y2="211"/>
  <text class="yr" x="200.0" y="224" text-anchor="middle">1700</text>
  <line class="axis" x1="346.7" y1="206" x2="346.7" y2="211"/>
  <text class="yr" x="346.7" y="224" text-anchor="middle">1705</text>
  <line class="axis" x1="493.3" y1="206" x2="493.3" y2="211"/>
  <text class="yr" x="493.3" y="224" text-anchor="middle">1710</text>
  <line class="axis" x1="640.0" y1="206" x2="640.0" y2="211"/>
  <text class="yr" x="640.0" y="224" text-anchor="middle">1715</text>
<text class="warn" x="56" y="256">⚠ 띠는 해로만 그렸고, 점은 날짜까지 그렸다. 점은 책이 아직 미완성이던 날이라 『추측술』 줄에 두었다.</text>
<text class="warn" x="56" y="273">⚠ 「8년」은 노트의 말이다 [1]. 괄호는 죽은 날부터 1713 띠 가운데까지 그렸다.</text>
<text class="warn" x="56" y="290">⚠ 해와 날짜는 노트의 출처 [1] MacTutor 야코프 베르누이를 따랐다.</text>
</svg>
