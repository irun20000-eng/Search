    .pt{fill:#3A5C77;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .band2{fill:#CEDCE6;stroke:#3A5C77;stroke-width:1;}
    .unk{stroke:#9C5A2C;stroke-width:1.4;stroke-dasharray:4 3;}
    .brk{stroke:#9C5A2C;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="535"/>
<text class="h1" x="56" y="44">상을 받고도 11년 — 푸리에의 열 논문</text>
<text class="h2" x="56" y="66">점 = 날짜 · 띠 = 그 해 · 파선 = 무렵 · 괄호 = 해의 차</text>
  <line class="lane" x1="210" y1="176" x2="640" y2="176"/>
  <text class="grp" x="56.0" y="162" text-anchor="start">논문</text>
  <line class="lane" x1="210" y1="318" x2="640" y2="318"/>
  <text class="grp" x="56.0" y="304" text-anchor="start">과학원의 자리</text>
  <line class="unk" x1="210.0" y1="176" x2="284.0" y2="176"/>
  <text class="sm" x="202.0" y="180" text-anchor="end">연구 — 1804 무렵부터</text>
  <text class="ev" x="291.3" y="198" text-anchor="middle">1807.12.21 낭독</text>
  <rect class="band" x="291.9" y="170" width="20.5" height="12" rx="2"/>
  <text class="sm" x="293.9" y="166" text-anchor="start">1808 반대</text>
  <text class="sm" x="293.9" y="152" text-anchor="start">라그랑주·라플라스</text>
  <circle class="pt" cx="291.3" cy="176" r="4"/>
  <rect class="band" x="353.3" y="170" width="20.5" height="12" rx="2"/>
  <text class="ev" x="363.6" y="198" text-anchor="middle">1811 상</text>
  <text class="sm" x="353.3" y="214" text-anchor="start">보고서가 어정쩡해</text>
  <text class="sm" x="353.3" y="228" text-anchor="start">파리에서는 출판하려는</text>
  <text class="sm" x="353.3" y="242" text-anchor="start">움직임이 없었다 [1]</text>
  <rect class="band2" x="578.6" y="170" width="20.5" height="12" rx="2"/>
  <text class="ev" x="588.8" y="164" text-anchor="middle">1822 『열의 해석적 이론』</text>
  <text class="sm" x="680.0" y="148" text-anchor="end">들랑브르가 죽기 전에 이미 인쇄를 준비해 두었다 [1]</text>
  <path class="brk" d="M363.6,265 V270 H588.8 V265"/>
  <text class="ev" x="476.2" y="285" text-anchor="middle">11년</text>
  <path class="brk" d="M291.3,130 V124 H588.8 V130"/>
  <text class="ev" x="440.0" y="118" text-anchor="middle">15년</text>
  <rect class="band" x="455.7" y="312" width="20.5" height="12" rx="2"/>
  <rect class="band" x="476.2" y="312" width="20.5" height="12" rx="2"/>
  <text class="sm" x="466.0" y="308" text-anchor="middle">1816 회원 [2]</text>
  <text class="sm" x="486.4" y="340" text-anchor="middle">1817 회원 [1]</text>
  <rect class="band2" x="578.6" y="312" width="20.5" height="12" rx="2"/>
  <text class="ev" x="588.8" y="340" text-anchor="middle">1822 종신서기</text>
  <line class="axis" x1="210" y1="376" x2="640" y2="376"/>
  <line class="axis" x1="230.5" y1="376" x2="230.5" y2="381"/>
  <text class="yr" x="230.5" y="394" text-anchor="middle">1805</text>
  <line class="axis" x1="332.9" y1="376" x2="332.9" y2="381"/>
  <text class="yr" x="332.9" y="394" text-anchor="middle">1810</text>
  <line class="axis" x1="435.2" y1="376" x2="435.2" y2="381"/>
  <text class="yr" x="435.2" y="394" text-anchor="middle">1815</text>
  <line class="axis" x1="537.6" y1="376" x2="537.6" y2="381"/>
  <text class="yr" x="537.6" y="394" text-anchor="middle">1820</text>
  <line class="axis" x1="640.0" y1="376" x2="640.0" y2="381"/>
  <text class="yr" x="640.0" y="394" text-anchor="middle">1825</text>
<text class="warn" x="56" y="426">⚠ 점은 날짜까지 아는 일이고, 띠는 해만 아는 일이다 — 띠 안 어디인지는 모른다.</text>
<text class="warn" x="56" y="443">⚠ 과학원 회원이 된 해는 출처가 갈린다 — [1]은 1817, [2]는 1816. 둘 다 그렸다.</text>
<text class="warn" x="56" y="460">⚠ 1822년에 종신서기와 출판이 겹친다 — 출처는 「정치적 술수가 아니었다」고 적는다 [1].</text>
<text class="warn" x="56" y="477">⚠ 「15년」 「11년」은 노트가 해끼리 뺀 값이다(1822−1807 · 1822−1811).</text>
<text class="warn" x="56" y="494">⚠ 연구의 시작은 「1804년 무렵」이라 파선이다.</text>
<text class="warn" x="56" y="511">⚠ 해와 날짜는 노트의 출처 [1] MacTutor 푸리에 · [2] 인명사전 · [6] MacTutor 라플라스를 따랐다.</text>
</svg>
