<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 535" width="700" height="535" role="img" aria-label="그림 위쪽에 「상을 받고도 11년 — 푸리에의 열 논문」이라는 표제가 있고 그 아래에 점은 날짜, 띠는 그 해, 파선은 무렵, 괄호는 해의 차라는 부호표가 있다. 가로축은 1804년부터 1825년까지의 해이고, 줄이 둘 있다. 줄 이름은 왼쪽 끝에 논문, 과학원의 자리라고 적혀 있다. 위 줄 논문에는 연구, 1804 무렵부터라는 글 바로 오른쪽에서 파선이 시작해 1807년 끝까지 이어지고, 1807년 끝의 점 아래에 1807년 12월 21일 낭독이라고 적혀 있다. 점은 곧바로 이어지는 1808년 띠의 왼쪽 끝에 걸쳐 있고, 그 띠 위에 두 줄로 라그랑주와 라플라스, 1808 반대라고 적혀 있다. 1811년 띠 아래에 1811 상, 그 아래에 세 줄로 보고서가 어정쩡해 파리에서는 출판하려는 움직임이 없었다고 적혀 있다. 1822년 띠 위에 열의 해석적 이론이, 그 위 오른쪽에 들랑브르가 죽기 전에 이미 인쇄를 준비해 두었다고 적혀 있다. 1811년 띠와 1822년 띠 사이는 비어 있고, 그 세 줄보다 더 아래에 두 띠의 가운데를 잇는 괄호에 11년이라고 적혀 있다. 위 줄 위에는 낭독 점에서 1822년 띠 가운데까지 걸친 괄호가 있고 15년이라고 적혀 있다. 아래 줄 과학원의 자리에는 1816년 띠와 1817년 띠가 붙어 있고, 1816년 띠 위에 1816 회원 출처 2번, 1817년 띠 아래에 1817 회원 출처 1번이라고 따로 적혀 있으며, 1822년 띠 아래에 1822 종신서기라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 점은 날짜까지 아는 일이고 띠는 해만 아는 일이라 띠 안 어디인지는 모른다. 둘째, 과학원 회원이 된 해는 출처가 갈려 1번은 1817, 2번은 1816이라 둘 다 그렸다. 셋째, 1822년에 종신서기와 출판이 겹치는데, 출처는 정치적 술수가 아니었다고 적는다. 넷째, 15년과 11년은 노트가 해끼리 뺀 값이다. 다섯째, 연구의 시작은 1804년 무렵이라 파선이다. 여섯째, 해와 날짜는 노트의 출처 1번 MacTutor 푸리에, 2번 인명사전, 6번 MacTutor 라플라스를 따랐다.">
<title>상을 받고도 11년 푸리에의 열 논문</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#9C5A2C;}
    .ev{font-size:11px;} .sm{font-size:10.5px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
