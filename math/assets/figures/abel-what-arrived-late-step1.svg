<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 426" width="700" height="426" role="img" aria-label="1단계, 살아 있던 해 가까이. 그림 위쪽에 「늦게 도착한 것들 — 아벨」이라는 표제가 있고 그 아래에 갈색 점은 그가 보낸 것, 푸른 점은 그에게 온 것, 검은 점은 아벨이 죽은 날, 칸은 산 해라는 부호표가 있다. 이 단계 칸에는 살아 있던 해 가까이, 한 해가 넓다, 1824에서 1831이라는 제목이 있고, 가로축은 1824년부터 1831년까지 한 해마다 눈금이 있다. 줄이 둘 있고 줄 이름은 왼쪽 끝에 보낸 것, 온 것이라고 적혀 있다. 보낸 것 줄에는 갈색 점이 셋 있다. 1824년 점 왼쪽 위에 두 줄로 1824 5차 불가능성 소책자, 자비 여섯 쪽, 1826년 초 점 왼쪽 아래에 두 줄로 1826 초 크렐레 학술지, 첫 글, 증명 확장판, 1826년 10월 말 점 오른쪽 아래에 1826.10 말 파리 논문 제출이라고 적혀 있다. 가로축 위 1829년 4월 6일 자리에 검은 점이 있고 그 왼쪽 위에 1829.4.6 아벨이 죽다라고 적혀 있다. 그 점에서 점선이 위로 올라가 온 것 줄의 푸른 점에 닿는다. 그 푸른 점 왼쪽 위에 두 줄로 1829.4.8 크렐레의 편지, 베를린 임용, 이틀 뒤 쓰이다라고 적혀 있다. 온 것 줄 1830년 가운데에도 푸른 점이 있고 그 아래에 1830 학사원 대상이라고 적혀 있다. 아래에 단서가 다섯 줄 있다. 첫째, 위 칸과 아래 칸은 눈금이 다르고 위는 일곱 해, 아래는 두 세기 남짓을 같은 폭에 담았다. 둘째, 해만 아는 일은 해의 가운데에, 1826 초는 해의 앞쪽에 찍었고 1829.4.6, 4.8, 10월 말은 날짜 자리다. 셋째, 4월 8일은 편지를 쓴 날이고 국내 자료 둘은 그날 닿았다고 적는다. 넷째, 해와 날짜는 1번 MacTutor, Niels Henrik Abel과 5번부터 7번까지 The Abel Prize, The Biography of Niels Henrik Abel을 따랐다. 다섯째, 생몰은 8번 The Abel Prize, About Niels Henrik Abel도 받친다">
<title>늦게 도착한 것들 아벨</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;} .h3{font-size:12.5px;}
    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .seg{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .mk{fill:#9C5A2C;} .bl{fill:#3A5C77;} .pt{fill:#221E18;}
    .dash{stroke:#5B5245;stroke-width:1;stroke-dasharray:3 3;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="426"/>
<text class="h1" x="56" y="44">늦게 도착한 것들 — 아벨</text>
<text class="h2" x="56" y="66">갈색 점 = 그가 보낸 것 · 푸른 점 = 그에게 온 것 · 검은 점 = 아벨이 죽은 날 · 칸 = 산 해</text>
<text class="h3" x="56" y="100" text-anchor="start">살아 있던 해 가까이 — 한 해가 넓다 (1824~1831)</text>
<line class="lane" x1="200" y1="146" x2="640" y2="146"/>
<text class="grp" x="56" y="150">보낸 것</text>
<line class="lane" x1="200" y1="232" x2="640" y2="232"/>
<text class="grp" x="56" y="236">온 것</text>
<circle class="mk" cx="231.4" cy="146" r="3.5"/>
<text class="ev" x="227.4" y="117" text-anchor="end">1824 5차 불가능성 소책자</text>
<text class="ev" x="227.4" y="134" text-anchor="end">— 자비 여섯 쪽 [1]</text>
<circle class="mk" cx="332.0" cy="146" r="3.5"/>
<text class="ev" x="328.0" y="168" text-anchor="end">1826 초 『크렐레 학술지』</text>
<text class="ev" x="328.0" y="185" text-anchor="end">첫 글 — 증명 확장판 [5]</text>
<circle class="mk" cx="377.4" cy="146" r="3.5"/>
<text class="ev" x="381.4" y="168" text-anchor="start">1826.10 말 파리 논문 제출 [5]</text>
<circle class="pt" cx="530.6" cy="292" r="4"/>
<text class="ev" x="524.6" y="282" text-anchor="end">1829.4.6 아벨이 죽다 [1][8]</text>
<circle class="bl" cx="531.0" cy="232" r="3.5"/>
<line class="dash" x1="530.6" y1="287" x2="531.0" y2="237"/>
<text class="ev" x="525.0" y="207" text-anchor="end">1829.4.8 크렐레의 편지</text>
<text class="ev" x="525.0" y="224" text-anchor="end">— 베를린 임용, 이틀 뒤 쓰이다 [1][6]</text>
<circle class="bl" cx="608.6" cy="232" r="3.5"/>
<text class="ev" x="608.6" y="252" text-anchor="middle">1830 학사원 대상 [1]</text>
<line class="axis" x1="200" y1="292" x2="640" y2="292"/>
<line class="axis" x1="200.0" y1="292" x2="200.0" y2="297"/>
<text class="yr" x="200.0" y="310" text-anchor="middle">1824</text>
<line class="axis" x1="262.9" y1="292" x2="262.9" y2="297"/>
<text class="yr" x="262.9" y="310" text-anchor="middle">1825</text>
<line class="axis" x1="325.7" y1="292" x2="325.7" y2="297"/>
<text class="yr" x="325.7" y="310" text-anchor="middle">1826</text>
<line class="axis" x1="388.6" y1="292" x2="388.6" y2="297"/>
<text class="yr" x="388.6" y="310" text-anchor="middle">1827</text>
<line class="axis" x1="451.4" y1="292" x2="451.4" y2="297"/>
<text class="yr" x="451.4" y="310" text-anchor="middle">1828</text>
<line class="axis" x1="514.3" y1="292" x2="514.3" y2="297"/>
<text class="yr" x="514.3" y="310" text-anchor="middle">1829</text>
<line class="axis" x1="577.1" y1="292" x2="577.1" y2="297"/>
<text class="yr" x="577.1" y="310" text-anchor="middle">1830</text>
<line class="axis" x1="640.0" y1="292" x2="640.0" y2="297"/>
<text class="yr" x="640.0" y="310" text-anchor="middle">1831</text>
<text class="warn" x="56" y="344">⚠ 위 칸과 아래 칸은 눈금이 다르다 — 위는 일곱 해, 아래는 두 세기 남짓을 같은 폭에 담았다.</text>
<text class="warn" x="56" y="360">⚠ 해만 아는 일은 해의 가운데에, 1826 초는 해의 앞쪽에 찍었다 — 1829.4.6 · 4.8 · 10월 말은 날짜 자리다.</text>
<text class="warn" x="56" y="376">⚠ 4월 8일은 편지를 쓴 날이다 [1][6] — 국내 자료 둘은 그날 닿았다고 적는다 [2][3] (노트 §8).</text>
<text class="warn" x="56" y="392">⚠ 해와 날짜는 [1] MacTutor, Niels Henrik Abel 과 [5]~[7] The Abel Prize, The Biography of Niels Henrik Abel 을 따랐다.</text>
<text class="warn" x="56" y="408">⚠ 생몰은 [8] The Abel Prize, About Niels Henrik Abel 도 받친다.</text>
</svg>
