<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 506" width="700" height="506" role="img" aria-label="그림 위쪽에 「두 갈래가 1872에서 만나다」라는 표제가 있고 그 아래에 위 갈래는 바닥을 놓는 일, 아래 갈래는 직관을 무너뜨리는 일, 세로 파선은 1872라는 부호표가 있다. 가로축은 1810년부터 1880년까지의 해다. 위 갈래의 이름은 바닥을 놓는 일, 엄밀화이고, 그 줄에 점이 넷 있다. 1817 볼차노 그림을 빼고 증명, 1821 코시 극한을 앞세우다와 그 아래 실수는 아는 것으로 전제, 그리고 1858에는 속이 빈 점이 있어 데데킨트의 착상이라고 적혀 있다. 그 빈 점에서 오른쪽으로 파선 호가 1872의 점까지 이어지고 호 위에 14년 묵힘이라고 적혀 있다. 1872의 점 왼쪽 아래에 1872 데데킨트, 칸토어, 하이네 실수를 구성하다라고 적혀 있다. 아래 갈래의 이름은 직관을 무너뜨리는 일, 정의 확장이고, 1837 디리클레 함수에 식을 요구하지 않다라는 점이 있다. 그 오른쪽 1872와 1874 두 자리에 점이 하나씩 있고 두 점 아래가 괄호로 묶여 있다. 1872 점의 왼쪽 위에 바이어슈트라스 함수, 왼쪽 아래에 1872 출처 5번, 1874 점의 오른쪽 위에 1874 출처 8번이라고 적혀 있다. 1872 자리에 두 갈래를 모두 가로지르는 세로 파선이 있고 맨 위에 1872라고 적혀 있다. 1874의 점은 이 선의 오른쪽에 있다. 아래에 단서가 일곱 줄 있다. 첫째, 점은 그 해의 일이고 1858년 점만 속이 빈 것은 착상이지 발표가 아니기 때문이다. 둘째, 바이어슈트라스 함수의 해는 출처가 갈려 5번은 1872, 8번은 1874라서 두 점을 다 찍었다. 셋째, 두 갈래가 같은 자각에서 나왔다는 것은 노트 5절의 해석이고 출처가 적는 것은 해와 일이다. 넷째, 출처 1번은 1872 전의 이름으로 한켈 1867과 메레 1869도 적지만 노트 본문이 다루지 않아 그리지 않았다. 다섯째, 리만 1854와 칸토어의 편지 1873은 이 두 갈래 밖이라 넣지 않았다. 여섯째, 3절의 바이어슈트라스의 걸음, 곧 코시의 그다음은 노트가 해를 적지 않아 찍지 않았다. 일곱째, 해는 노트의 출처 1, 3, 4, 5, 8, 14, 15번을 따랐다.">
<title>두 갈래가 1872에서 만나다</title>
<style>
