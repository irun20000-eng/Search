<text class="warn" x="56" y="380">⚠ 점은 그 해의 일이다. 1858년 점만 속이 비었다 — 착상이지 발표가 아니다.</text>
<text class="warn" x="56" y="397">⚠ 바이어슈트라스 함수의 해는 출처가 갈린다 — [5]는 1872, [8]은 1874. 두 점을 다 찍었다.</text>
<text class="warn" x="56" y="414">⚠ 두 갈래가 「같은 자각에서 나왔다」는 것은 노트 §5의 해석이다. 출처가 적는 것은 해와 일이다.</text>
<text class="warn" x="56" y="431">⚠ [1]은 1872 전의 이름(한켈 1867 · 메레 1869)도 적는다 — 노트 본문이 다루지 않아 그리지 않았다.</text>
<text class="warn" x="56" y="448">⚠ 리만(1854)과 칸토어의 편지(1873)는 이 두 갈래 밖이라 넣지 않았다.</text>
<text class="warn" x="56" y="465">⚠ §3의 바이어슈트라스의 걸음(코시 「그다음」)은 노트가 해를 적지 않아 찍지 않았다.</text>
<text class="warn" x="56" y="482">⚠ 해는 노트의 출처 [1]·[3]·[4]·[5]·[8]·[14]·[15]를 따랐다.</text>
