<rect class="bg" x="0" y="0" width="700" height="506"/>
<text class="h1" x="56" y="44">두 갈래가 1872에서 만나다</text>
<text class="h2" x="56" y="66">위 = 바닥을 놓는 일 · 아래 = 직관을 무너뜨리는 일 · 세로 파선 = 1872</text>
  <line class="lane" x1="180" y1="158" x2="650" y2="158"/>
  <text class="grp" x="56.0" y="156" text-anchor="start">바닥을 놓는 일</text>
  <text class="sm" x="56.0" y="171" text-anchor="start">엄밀화</text>
  <line class="lane" x1="180" y1="268" x2="650" y2="268"/>
  <text class="grp" x="56.0" y="266" text-anchor="start">직관을 무너뜨리는 일</text>
  <text class="sm" x="56.0" y="281" text-anchor="start">정의 확장</text>
  <line class="cut" x1="596.3" y1="100" x2="596.3" y2="324"/>
  <text class="ev" x="596.3" y="94" text-anchor="middle">1872</text>
  <circle class="pt" cx="227.0" cy="158" r="4"/>
  <text class="ev" x="225.0" y="132" text-anchor="start">1817 볼차노</text>
  <text class="sm" x="225.0" y="146" text-anchor="start">그림을 빼고 증명</text>
  <circle class="pt" cx="253.9" cy="158" r="4"/>
  <text class="ev" x="251.9" y="178" text-anchor="start">1821 코시 — 극한을 앞세우다</text>
  <text class="sm" x="251.9" y="192" text-anchor="start">실수는 아는 것으로 전제</text>
  <circle class="hol" cx="502.3" cy="158" r="4"/>
  <text class="sm" x="502.3" y="146" text-anchor="end">1858 데데킨트의 착상</text>
  <path class="arc" d="M502.3,153 Q549.3,118 596.3,153"/>
  <text class="sm" x="549.3" y="130" text-anchor="middle">14년 묵힘</text>
  <circle class="pt" cx="596.3" cy="158" r="4"/>
  <text class="ev" x="588.3" y="178" text-anchor="end">1872 데데킨트 · 칸토어 · 하이네</text>
  <text class="sm" x="588.3" y="192" text-anchor="end">실수를 구성하다</text>
  <circle class="pt" cx="361.3" cy="268" r="4"/>
  <text class="ev" x="361.3" y="256" text-anchor="middle">1837 디리클레</text>
  <text class="sm" x="361.3" y="288" text-anchor="middle">함수에 식을 요구하지 않다</text>
  <circle class="pt" cx="596.3" cy="268" r="4"/>
  <circle class="pt" cx="609.7" cy="268" r="4"/>
  <path class="brk" d="M596.3,276 V280 H609.7 V276"/>
  <text class="ev" x="588.3" y="256" text-anchor="end">바이어슈트라스 함수</text>
  <text class="sm" x="588.3" y="288" text-anchor="end">1872 [5]</text>
  <text class="sm" x="616.7" y="260" text-anchor="start">1874 [8]</text>
  <line class="axis" x1="180" y1="330" x2="650" y2="330"/>
  <line class="axis" x1="180.0" y1="330" x2="180.0" y2="335"/>
  <text class="yr" x="180.0" y="348" text-anchor="middle">1810</text>
  <line class="axis" x1="247.1" y1="330" x2="247.1" y2="335"/>
  <text class="yr" x="247.1" y="348" text-anchor="middle">1820</text>
  <line class="axis" x1="314.3" y1="330" x2="314.3" y2="335"/>
  <text class="yr" x="314.3" y="348" text-anchor="middle">1830</text>
  <line class="axis" x1="381.4" y1="330" x2="381.4" y2="335"/>
