    .dash{stroke:#5B5245;stroke-width:1;stroke-dasharray:3 3;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="520"/>
<text class="h1" x="56" y="44" text-anchor="start">주교가 된 해에 『해석학자』를 냈다 — 버클리</text>
<text class="h2" x="56" y="66" text-anchor="start">옅은 칸 = 학생 · 진한 칸 = 자리 · 갈색 점 = 쓴 것 · 세로 띠 = 1734년 · 검은 점 = 버클리가 죽은 날</text>
