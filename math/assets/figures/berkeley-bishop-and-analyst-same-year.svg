<text class="warn" x="56" y="396">⚠ 해만 아는 일은 해의 가운데, 칸 끝은 해의 첫머리에 — 1707.6.9 · 1731.10 · 1753.1.14 는 날짜 자리다.</text>
<text class="warn" x="56" y="413">⚠ 『해석학자』는 출처가 「1734년」까지만 적어 그 한 해 전체에 걸쳐 굵은 선으로 그렸다 [6].</text>
<text class="warn" x="56" y="430">⚠ 펠로 칸의 옅은 뒤쪽은 1713~1724 대부분 더블린 밖에 있던 때다 [4].</text>
<text class="warn" x="56" y="447">⚠ 주교 칸은 죽은 날까지 그렸다 — 1752년 7월 옥스퍼드로 옮겨 거기서 죽었다 [1].</text>
<text class="warn" x="56" y="464">⚠ 버뮤다 계획은 시작한 해를 노트가 적지 않아 칸으로 그리지 않았다 [5].</text>
<text class="warn" x="56" y="481">⚠ 해와 날짜는 [1]~[6] MacTutor, George Berkeley 를, 1744 는 [10] Wikipedia, George Berkeley 를 따랐다.</text>
</svg>
