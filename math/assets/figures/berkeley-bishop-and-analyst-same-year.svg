<rect class="seg2" x="486.0" y="251" width="139.6" height="18"/>
<circle class="mk" cx="469.5" cy="260" r="3.5"/>
<text class="ev" x="267.8" y="286" text-anchor="end">트리니티 학생 [2]</text>
<text class="ev" x="311.6" y="303" text-anchor="middle">1707.6.9 펠로 [3]</text>
<text class="ev" x="373.6" y="286" text-anchor="middle">1713~1724 대부분 더블린 밖 [4]</text>
<text class="ev" x="473.5" y="303" text-anchor="start">1731.10 버뮤다 계획을 접고 런던으로 [5]</text>
<text class="ev" x="555.8" y="264" text-anchor="middle">클로인 주교 [6]</text>
<circle class="pt" cx="625.6" cy="350" r="4"/>
<text class="ev" x="619.6" y="338" text-anchor="end">1753.1.14 버클리가 죽다 [1]</text>
<line class="axis" x1="200" y1="350" x2="640" y2="350"/>
<line class="axis" x1="200.0" y1="350" x2="200.0" y2="355"/>
