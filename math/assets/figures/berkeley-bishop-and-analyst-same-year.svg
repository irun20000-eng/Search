<text class="ev" x="567.0" y="209" text-anchor="start">— 타르물 [10]</text>
<rect class="seg" x="237.9" y="251" width="29.9" height="18"/>
<rect class="seg2" x="291.2" y="251" width="40.8" height="18"/>
<rect class="seg2" x="332.0" y="251" width="83.1" height="18"/>
