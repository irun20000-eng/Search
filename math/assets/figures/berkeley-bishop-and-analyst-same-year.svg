<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img" aria-label="그림 위쪽에 「주교가 된 해에 『해석학자』를 냈다 — 버클리」라는 표제가 있고 그 아래에 옅은 칸은 학생, 진한 칸은 자리, 갈색 점은 쓴 것, 세로 띠는 1734년, 검은 점은 버클리가 죽은 날이라는 부호표가 있다. 가로축은 1695년부터 1755년까지 다섯 해마다 눈금이 있고 열 해마다 숫자가 적혀 있다. 줄이 둘 있고 줄 이름은 왼쪽 끝에 쓴 것, 자리라고 적혀 있다. 1734년 한 해 너비의 옅은 세로 띠가 두 줄을 위아래로 지나고, 띠 위에 1734, 1월 클로인 주교 임명, 5.19 서품, 해석학자라고 적혀 있다. 쓴 것 줄에는 갈색 점이 셋 있다. 1709년 점 왼쪽 위에 1709 시각 신론, 1710년 점 오른쪽 아래에 1710 인간 지식의 원리론, 1744년 점 오른쪽 아래에 두 줄로 1744 시리스, 타르물이라고 적혀 있다. 1734년 띠 안에는 쓴 것 줄 위에 굵은 갈색 선이 그 한 해에 걸쳐 있다. 자리 줄에는 칸이 넷 있다. 1700년 3월부터 1704년까지 옅은 칸이 있고 그 아래 왼쪽에 트리니티 학생이라고 적혀 있다. 1707년 6월 9일부터 1724년까지 진한 칸이 있는데 1713년부터 뒤쪽은 옅게 덮여 있고, 아래에 1707.6.9 펠로, 1713~1724 대부분 더블린 밖이라고 적혀 있다. 1731년 10월 자리에 갈색 점이 있고 그 오른쪽 아래에 1731.10 버뮤다 계획을 접고 런던으로라고 적혀 있다. 1734년부터 1753년 1월 14일까지 진한 칸이 있고 칸 안에 클로인 주교라고 적혀 있다. 가로축 위 1753년 1월 14일 자리에 검은 점이 있고 그 왼쪽 위에 1753.1.14 버클리가 죽다라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 해만 아는 일은 해의 가운데, 칸 끝은 해의 첫머리에 두었고 1707.6.9, 1731.10, 1753.1.14 는 날짜 자리다. 둘째, 해석학자는 출처가 1734년까지만 적어 그 한 해 전체에 걸쳐 굵은 선으로 그렸다. 셋째, 펠로 칸의 옅은 뒤쪽은 1713~1724 대부분 더블린 밖에 있던 때다. 넷째, 주교 칸은 죽은 날까지 그렸고 1752년 7월 옥스퍼드로 옮겨 거기서 죽었다. 다섯째, 버뮤다 계획은 시작한 해를 노트가 적지 않아 칸으로 그리지 않았다. 여섯째, 해와 날짜는 1번부터 6번까지 MacTutor, George Berkeley 를, 1744 는 10번 Wikipedia, George Berkeley 를 따랐다">
<title>주교가 된 해에 해석학자를 냈다 버클리</title>
