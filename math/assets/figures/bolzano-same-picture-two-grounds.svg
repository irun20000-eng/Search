<text class="warn" x="56" y="376">⚠ 곡선은 y = x<tspan baseline-shift="super" font-size="8">2</tspan> − 2 이고 구간은 1 ≤ x ≤ 2 다. 양 끝의 부호가 다르다 — f(1) = −1, f(2) = 2.</text>
<text class="warn" x="56" y="393">⚠ 이 예시는 노트가 든 것이 아니라 「부호가 다른 두 값」을 보이려고 고른 것이다. 노트 §4 는 정리만 말한다.</text>
<text class="warn" x="56" y="410">⚠ 유리수만 있는 바탕에서는 그래프가 이어진 선이 아니라 촘촘한 점들이다.</text>
<text class="warn" x="56" y="427">⚠ 그런데 그려 놓으면 둘이 구별되지 않는다 — 이 그림이 말하려는 것이 그것이다.</text>
<text class="warn" x="56" y="444">⚠ 두 판의 곡선은 좌표가 같다. 다른 것은 가로지르는 자리에 수가 있느냐뿐이다.</text>
<text class="warn" x="56" y="461">⚠ 같은 구멍을 다섯 형태로 본 것은 개념 노트 『해석학의 엄밀화(확장편)』 §10 에 있다.</text>
