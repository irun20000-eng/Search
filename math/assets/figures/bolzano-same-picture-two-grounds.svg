<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 496" width="700" height="496" role="img" aria-label="그림 위쪽에 「같은 그림, 다른 바탕 — 1817년에 볼차노가 치운 것」이라는 표제가 있고 그 아래에 연속함수가 부호가 다른 두 값을 가지면 그 사이에 근이 있다 — 그림은 이것을 증명하지 못한다고 적혀 있다. 아래에 똑같이 생긴 그림 두 개가 나란히 있다. 둘 다 왼쪽 아래에서 오른쪽 위로 올라가는 같은 곡선이고 왼쪽 끝의 값은 마이너스 1, 오른쪽 끝의 값은 2 이며 가운데에서 가로축을 가로지른다. 왼쪽 그림의 표제는 바탕이 실수, 오른쪽 그림의 표제는 바탕이 유리수다. 다른 것은 가로축을 가로지르는 자리 하나뿐이다 — 왼쪽은 속이 찬 점이고 그 아래에 근이 여기 있다고 적혀 있으며, 오른쪽은 속이 빈 동그라미이고 그 아래에 그 자리에 수가 없다고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 곡선은 x 제곱 빼기 2 이고 구간은 1 이상 2 이하이며 양 끝의 부호가 다르다. 둘째, 이 예시는 노트가 든 것이 아니라 부호가 다른 두 값을 보이려고 고른 것이고 노트 4절은 정리만 말한다. 셋째, 유리수만 있는 바탕에서는 그래프가 이어진 선이 아니라 촘촘한 점들이다. 넷째, 그런데 그려 놓으면 둘이 구별되지 않고 이 그림이 말하려는 것이 그것이다. 다섯째, 두 그림의 곡선은 좌표가 같고 다른 것은 가로지르는 자리에 수가 있느냐뿐이다. 여섯째, 같은 구멍을 다섯 형태로 본 것은 개념 노트 해석학의 엄밀화 확장편 10절에 있다.">
<title>같은 그림 다른 바탕 — 1817년에 볼차노가 치운 것</title>
