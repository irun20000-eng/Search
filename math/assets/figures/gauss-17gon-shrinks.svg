<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="그림 위쪽에 「작아지면 동그라미가 된다 — 가우스의 정십칠각형」이라는 표제가 있다. 정십칠각형이 크기를 달리해 셋 그려져 있다. 왼쪽 것은 크고 변 열일곱 개가 하나하나 보인다. 가운데 것은 훨씬 작아 변이 겨우 보인다. 오른쪽 것은 더 작아 동그라미처럼 보인다. 그 오른쪽 옆에는 같은 크기, 같은 색, 같은 선으로 그린 진짜 원이 하나 더 있다. 두 도형은 똑같이 그려져 있어 눈으로 구분되지 않으며, 아래에 왼쪽이 정십칠각형이고 오른쪽이 원이라고만 적혀 있다. 그림 아래에는 부호 설명이 있다. 세 도형은 모두 같은 정십칠각형이고 지름만 다르며, 맨 오른쪽 하나만 진짜 원이고 나머지와 똑같이 그렸다는 것이다. 맨 아래에는 단서가 있다. 묘비에 정십칠각형을 새겨 달라는 유언이 있었다는 것은 전해지는 이야기이며, 이 그림은 그 이야기가 드는 이유만을 보인다는 것이다">
  <title>작아지면 동그라미가 된다 — 가우스의 정십칠각형</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .pg{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1.6;}
  </style>
  <rect width="700" height="360" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">작아지면 동그라미가 된다 — 가우스의 정십칠각형</text>
  <polygon points="150.0,84.0 183.2,90.2 212.0,108.0 232.4,135.0 241.6,167.5 238.5,201.2 223.4,231.4 198.4,254.2 166.9,266.4 133.1,266.4 101.6,254.2 76.6,231.4 61.5,201.2 58.4,167.5 67.6,135.0 88.0,108.0 116.8,90.2" class="pg"/>
  <polygon points="392.0,148.0 402.1,149.9 410.9,155.3 417.1,163.5 419.9,173.4 418.9,183.7 414.3,192.9 406.7,199.8 397.1,203.5 386.9,203.5 377.3,199.8 369.7,192.9 365.1,183.7 364.1,173.4 366.9,163.5 373.1,155.3 381.9,149.9" class="pg"/>
  <polygon points="556.0,160.0 561.8,161.1 566.8,164.2 570.3,168.9 571.9,174.5 571.4,180.4 568.8,185.6 564.4,189.6 558.9,191.7 553.1,191.7 547.6,189.6 543.2,185.6 540.6,180.4 540.1,174.5 541.7,168.9 545.2,164.2 550.2,161.1" class="pg"/>
  <circle cx="620" cy="176" r="16" class="pg"/>
  <text x="104" y="298" font-size="12" class="ax">변 열일곱이 보인다</text>
  <text x="358" y="298" font-size="12" class="ax">겨우 보인다</text>
  <text x="514" y="298" font-size="12" class="ax">정십칠각형</text>
  <text x="612" y="298" font-size="12" class="ax">원</text>
  <text x="46" y="326" font-size="13" class="dim">셋 다 같은 정십칠각형이고 지름만 다르다 — 맨 오른쪽 하나만 진짜 원이고, 나머지와 똑같이 그렸다.</text>
  <text x="46" y="346" font-size="13" class="sien">⚠ 묘비에 새겨 달라는 유언은 전해지는 이야기다 — 이 그림은 그 이야기가 드는 이유만 보인다.</text>
</svg>
