<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 492" width="700" height="492" role="img" aria-label="그림 위쪽에 「무모순성 — 1900년의 문제, 1931년의 불가능 · 힐베르트」라는 표제가 있고 그 아래에 갈색 띠는 힐베르트 쪽, 푸른 띠는 괴델, 점은 힐베르트가 죽은 날, 괄호는 해의 차라는 부호표가 있다. 가로축은 1895년부터 1945년까지의 해이고, 줄이 둘 있다. 줄 이름은 왼쪽 끝에 힐베르트 — 무모순성, 괴델이라고 적혀 있다. 위 줄에는 1900년에 갈색 띠가 있고 그 위 오른쪽에 두 줄로 1900 파리 — 문제 2번, 산술 공리의 무모순성이라고 적혀 있다. 같은 줄 1934년과 1939년에 갈색 띠가 하나씩 있고 그 위 왼쪽에 두 줄로 1934 · 1939 『수학의 기초』 두 권, 겨냥한 것 — 직접적 무모순성 증명이라고 적혀 있다. 아래 줄에는 1931년에 푸른 띠가 있고 그 아래 왼쪽에 1931 괴델의 논문 — 그의 목표를 불가능하게 하다라고 적혀 있다. 1900년 띠에서 아래로 내려와 두 줄 사이를 지나 1931년 띠까지 가는 괄호가 있고 그 위에 31년이라고 적혀 있다. 가로축 위 1943년 자리에 검은 점이 있고 그 왼쪽 위에 힐베르트 1943.2.14 죽다라고 적혀 있다. 아래에 단서가 다섯 줄 있다. 첫째, 띠는 해로만 그렸고 점은 날짜까지 그렸다. 둘째, 띠는 1900 파리 강연의 해다. 강연은 23개 중 10개를 말했고, 문제 2번이 그중인지는 노트가 적지 않는다. 셋째, 두 권이 겨냥한 목표를 1931년 논문이 불가능하게 했다는 것은 출처 1번의 말이다. 넷째, 괄호는 그림이 잰 해의 차다. 노트가 31년 뒤에 흔들린다고 한 것은 문제 2번보다 넓은 강연의 확신이다, 4절. 다섯째, 해와 날짜는 노트의 출처 1번 MacTutor, David Hilbert, 2번 MacTutor, Hilbert's Problems, 6번 MacTutor, Kurt Gödel을 따랐다.">
<title>무모순성 1900년의 문제 1931년의 불가능 힐베르트</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .pt{fill:#221E18;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .band2{fill:#CEDCE6;stroke:#3A5C77;stroke-width:1;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="492"/>
<text class="h1" x="56" y="44">무모순성 — 1900년의 문제, 1931년의 불가능 · 힐베르트</text>
<text class="h2" x="56" y="66">갈색 띠 = 힐베르트 쪽 · 푸른 띠 = 괴델 · 점 = 힐베르트가 죽은 날 · 괄호 = 해의 차</text>
  <line class="lane" x1="200" y1="150" x2="640" y2="150"/>
  <text class="grp" x="56.0" y="154" text-anchor="start">힐베르트 — 무모순성</text>
  <line class="lane" x1="200" y1="262" x2="640" y2="262"/>
  <text class="grp" x="56.0" y="266" text-anchor="start">괴델</text>
  <rect class="band" x="244.0" y="144" width="8.8" height="12" rx="2"/>
  <text class="ev" x="244.0" y="118" text-anchor="start">1900 파리 — 문제 2번</text>
  <text class="ev" x="244.0" y="136" text-anchor="start">산술 공리의 무모순성 [2]</text>
  <rect class="band" x="543.2" y="144" width="8.8" height="12" rx="2"/>
  <rect class="band" x="587.2" y="144" width="8.8" height="12" rx="2"/>
  <text class="ev" x="596.0" y="118" text-anchor="end">1934 · 1939 『수학의 기초』 두 권 [1]</text>
  <text class="ev" x="596.0" y="136" text-anchor="end">겨냥한 것 — 직접적 무모순성 증명</text>
  <rect class="band2" x="516.8" y="256" width="8.8" height="12" rx="2"/>
  <text class="ev" x="525.6" y="286" text-anchor="end">1931 괴델의 논문 — 그의 목표를 불가능하게 하다 [1][6]</text>
  <path class="brk" d="M248.4,158 V194 H521.2 V254"/>
  <text class="ev" x="384.8" y="187" text-anchor="middle">31년</text>
  <circle class="pt" cx="623.5" cy="350" r="4"/>
  <text class="ev" x="640.0" y="338" text-anchor="end">힐베르트 1943.2.14 죽다 [1]</text>
  <line class="axis" x1="200" y1="350" x2="640" y2="350"/>
  <line class="axis" x1="200.0" y1="350" x2="200.0" y2="355"/>
  <line class="axis" x1="244.0" y1="350" x2="244.0" y2="355"/>
  <text class="yr" x="244.0" y="368" text-anchor="middle">1900</text>
  <line class="axis" x1="288.0" y1="350" x2="288.0" y2="355"/>
  <line class="axis" x1="332.0" y1="350" x2="332.0" y2="355"/>
  <text class="yr" x="332.0" y="368" text-anchor="middle">1910</text>
  <line class="axis" x1="376.0" y1="350" x2="376.0" y2="355"/>
  <line class="axis" x1="420.0" y1="350" x2="420.0" y2="355"/>
  <text class="yr" x="420.0" y="368" text-anchor="middle">1920</text>
  <line class="axis" x1="464.0" y1="350" x2="464.0" y2="355"/>
  <line class="axis" x1="508.0" y1="350" x2="508.0" y2="355"/>
  <text class="yr" x="508.0" y="368" text-anchor="middle">1930</text>
  <line class="axis" x1="552.0" y1="350" x2="552.0" y2="355"/>
  <line class="axis" x1="596.0" y1="350" x2="596.0" y2="355"/>
  <text class="yr" x="596.0" y="368" text-anchor="middle">1940</text>
  <line class="axis" x1="640.0" y1="350" x2="640.0" y2="355"/>
<text class="warn" x="56" y="400">⚠ 띠는 해로만 그렸고, 점은 날짜까지 그렸다.</text>
<text class="warn" x="56" y="417">⚠ 띠는 1900 파리 강연의 해다 [2]. 강연은 23개 중 10개를 말했고, 문제 2번이 그중인지는 노트가 적지 않는다.</text>
<text class="warn" x="56" y="434">⚠ 두 권이 겨냥한 목표를 1931년 논문이 불가능하게 했다는 것은 [1]의 말이다.</text>
<text class="warn" x="56" y="451">⚠ 괄호는 그림이 잰 해의 차다. 노트가 「31년 뒤에」 흔들린다고 한 것은 문제 2번보다 넓은 강연의 확신이다(§4).</text>
<text class="warn" x="56" y="468">⚠ 해와 날짜는 노트의 출처 [1] MacTutor, David Hilbert · [2] MacTutor, Hilbert's Problems · [6] MacTutor, Kurt Gödel을 따랐다.</text>
</svg>
