<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img" aria-label="그림 위쪽에 「앞사람의 것을 다시 꺼내다 — 야코비」라는 표제가 있고 그 아래에 푸른 점은 앞사람(또는 같은 무렵의 사람), 갈색 점은 야코비라고 적혀 있다. 가로축은 1760년부터 1860년까지 스무 해마다 눈금이 있고, 줄은 위에서부터 넷이다. 첫째 줄 ∂ 편미분 기호에는 1770년 푸른 점 아래에 1770 콩도르세, 1786년 푸른 점 아래에 1786 르장드르가 있고, 1786년 점에서 1841년 점까지 푸른 점선이 이어지며 그 아래에 르장드르가 그만 쓰다라고 적혀 있다. 1841년 갈색 점 위에는 1841 다시 꺼내다 널리 쓰이다가 있다. 둘째 줄 함수 행렬식 오늘의 「야코비안」에는 1815년 푸른 점 아래에 1815 코시 처음, 1841년 갈색 점 아래에 1841 긴 논문이 적혀 있다. 셋째 줄 타원적분에서 타원함수로에는 1786년 푸른 점 아래에 1786 르장드르의 첫 논문, 1827년 푸른 점 아래에 1827 아벨 따로가 있고, 바로 오른쪽 1829년 갈색 점 위에 1829 『새 기초』 · 역함수를 「타원함수」로가 적혀 있다. 넷째 줄 제곱 판정 기호에는 1797년과 1798년 사이 푸른 점 아래에 1797/98 르장드르 기호 소수 법, 1837년 갈색 점 아래에 1837 야코비 기호 홀수 법이 적혀 있다. 그 아래에 1804년부터 1851년까지 옅은 갈색 막대가 있고 그 왼쪽에 야코비 1804~1851 이라고 적혀 있다. 맨 아래에 단서가 넷 있다. 첫째, ∂ 줄은 3번, 함수 행렬식 줄은 1번, 타원 줄의 1786 은 9번 · 1827 아벨은 1번 · 1829 는 1 · 9번, 기호 줄의 1797/98 은 5번 · 1837 은 4 · 10번을 따랐다. 둘째, ∂ 는 「야코비의 델타」로도 불리고(3번) 함수 행렬식은 그보다 먼저 1815년 코시의 논문에 나온다(1번). 셋째, 1797/98 은 두 해의 가운데에 두었고, 아벨은 1번이 「거의 같은 때, 따로」라 적어 야코비가 르장드르에게 처음 쓴 1827년에 두었다. 넷째, 점선은 그 기호가 쓰이지 않은 사이이고 생애 막대는 1804년 12월 10일부터 1851년 2월 18일까지(1번)이다">
  <title>앞사람의 것을 다시 꺼내다 — 야코비</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;} .blue{fill:#3A5C77;}
    .axis{stroke:#8A7F6E;stroke-width:1;} .tick{stroke:#8A7F6E;stroke-width:1;}
    .row{stroke:#C9BBA6;stroke-width:1.2;fill:none;}
    .bd{fill:#3A5C77;} .sd{fill:#9C5A2C;}
    .gap{stroke:#3A5C77;stroke-width:1.2;stroke-dasharray:3 4;fill:none;}
    .life{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
  </style>
  <rect width="720" height="570" fill="#FFFDF7"/>
  <text x="30" y="30" font-size="16">앞사람의 것을 다시 꺼내다 — 야코비</text>
  <text x="30" y="50" font-size="11" class="dim">푸른 점은 앞사람(또는 같은 무렵의 사람), 갈색 점은 야코비.</text>

  <!-- x = 70 + (year - 1760) * 6 -->
  <text x="30" y="84" font-size="12">∂ — 편미분 기호</text>
  <line x1="70" y1="108" x2="670" y2="108" class="row"/>
  <circle cx="130" cy="108" r="4.5" class="bd"/>
  <circle cx="226" cy="108" r="4.5" class="bd"/>
  <path d="M232,108 L550,108" class="gap"/>
  <circle cx="556" cy="108" r="4.5" class="sd"/>
  <text x="130" y="126" font-size="10" class="blue" text-anchor="middle">1770 콩도르세</text>
  <text x="226" y="126" font-size="10" class="blue" text-anchor="middle">1786 르장드르</text>
  <text x="330" y="126" font-size="10" class="blue" text-anchor="middle">르장드르가 그만 쓰다</text>
  <text x="670" y="100" font-size="10" class="sien" text-anchor="end">1841 다시 꺼내다 — 널리 쓰이다</text>

  <text x="30" y="160" font-size="12">함수 행렬식 — 오늘의 「야코비안」</text>
  <line x1="70" y1="184" x2="670" y2="184" class="row"/>
  <circle cx="400" cy="184" r="4.5" class="bd"/>
  <circle cx="556" cy="184" r="4.5" class="sd"/>
  <text x="400" y="202" font-size="10" class="blue" text-anchor="middle">1815 코시 — 처음</text>
  <text x="560" y="202" font-size="10" class="sien">1841 긴 논문</text>

  <text x="30" y="236" font-size="12">타원적분 → 타원함수</text>
  <line x1="70" y1="260" x2="670" y2="260" class="row"/>
  <circle cx="226" cy="260" r="4.5" class="bd"/>
  <circle cx="472" cy="260" r="4.5" class="bd"/>
  <circle cx="484" cy="260" r="4.5" class="sd"/>
  <text x="226" y="278" font-size="10" class="blue" text-anchor="middle">1786 르장드르의 첫 논문</text>
  <text x="466" y="278" font-size="10" class="blue" text-anchor="end">1827 아벨 — 따로</text>
  <text x="670" y="252" font-size="10" class="sien" text-anchor="end">1829 『새 기초』 · 역함수를 「타원함수」로</text>

  <text x="30" y="312" font-size="12">제곱 판정 기호</text>
  <line x1="70" y1="336" x2="670" y2="336" class="row"/>
  <circle cx="295" cy="336" r="4.5" class="bd"/>
  <circle cx="532" cy="336" r="4.5" class="sd"/>
  <text x="295" y="354" font-size="10" class="blue" text-anchor="middle">1797/98 르장드르 기호 — 소수 법</text>
  <text x="536" y="354" font-size="10" class="sien">1837 야코비 기호 — 홀수 법</text>

  <rect x="339.6" y="383" width="277.2" height="10" class="life"/>
  <text x="331" y="392" font-size="11" class="sien" text-anchor="end">야코비 1804~1851</text>

  <line x1="70" y1="420" x2="670" y2="420" class="axis"/>
  <line x1="70" y1="416" x2="70" y2="424" class="tick"/><text x="70" y="438" font-size="10" class="ax" text-anchor="middle">1760</text>
  <line x1="190" y1="416" x2="190" y2="424" class="tick"/><text x="190" y="438" font-size="10" class="ax" text-anchor="middle">1780</text>
  <line x1="310" y1="416" x2="310" y2="424" class="tick"/><text x="310" y="438" font-size="10" class="ax" text-anchor="middle">1800</text>
  <line x1="430" y1="416" x2="430" y2="424" class="tick"/><text x="430" y="438" font-size="10" class="ax" text-anchor="middle">1820</text>
  <line x1="550" y1="416" x2="550" y2="424" class="tick"/><text x="550" y="438" font-size="10" class="ax" text-anchor="middle">1840</text>
  <line x1="670" y1="416" x2="670" y2="424" class="tick"/><text x="670" y="438" font-size="10" class="ax" text-anchor="middle">1860</text>

  <text x="30" y="468" font-size="10" class="ax">⚠ ∂ 줄은 3번, 함수 행렬식 줄은 1번, 타원 줄의 1786 은 9번 · 1827 아벨은 1번 · 1829 는 1 · 9번, 기호 줄의 1797/98 은 5번 · 1837 은 4 · 10번을 따랐다.</text>
  <text x="30" y="484" font-size="10" class="ax">⚠ ∂ 는 「야코비의 델타」로도 불린다(3번). 함수 행렬식은 그보다 먼저 1815년 코시의 논문에 나온다(1번).</text>
  <text x="30" y="500" font-size="10" class="ax">⚠ 1797/98 은 두 해의 가운데에 두었다. 아벨은 1번이 「거의 같은 때, 따로」라 적어 야코비가 르장드르에게 처음 쓴 1827년에 두었다.</text>
  <text x="30" y="516" font-size="10" class="ax">⚠ 점선은 그 기호가 쓰이지 않은 사이다. 생애 막대는 1804년 12월 10일부터 1851년 2월 18일까지(1번)이다.</text>
</svg>
