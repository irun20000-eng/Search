<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 424" role="img" aria-label="그림 위쪽에 「같은 나무를 두 방향으로 읽는다 — A 는 1판, B 는 2판 남았을 때」라는 표제가 있다. 그 아래 왼쪽과 오른쪽에 똑같이 생긴 나무가 하나씩 있다. 나무는 꼭대기에 점 하나가 있고 거기서 두 갈래로 갈라져 점 둘이 되며, 그 둘이 다시 두 갈래씩 갈라져 맨 아래에 점 넷이 된다. 왼쪽에는 페르마, 남은 판을 끝까지 나열한다 라고 적혀 있다. 맨 아래 네 점에 두 판의 결과가 차례로 AA, AB, BA, BB 로 적혀 있고 그 아래에 그때의 승자가 차례로 A, A, A, B 로 적혀 있다. 그 아래에 A 가 이기는 경우가 셋, B 가 이기는 경우가 하나라고 적혀 있다. 오른쪽에는 파스칼, 끝에서 거꾸로 따진다 라고 적혀 있다. 맨 아래 네 점에 차례로 1, 1, 1, 0 이 적혀 있고, 그 위 두 점에 왼쪽부터 1 과 2분의 1 이, 꼭대기 점에 4분의 3 이 적혀 있다. 그 아래에 판돈을 4분의 3 대 4분의 1 로 나눈다고 적혀 있다. 그림 아래에는 부호 설명이 있다. 왼쪽은 점이 판의 갈림이고 점 아래 두 글자가 남은 두 판의 결과이며 그 아래 한 글자가 그때의 승자라는 것, 오른쪽은 같은 나무의 각 점에 적힌 수가 그 자리에서 A 가 이길 가능성이라는 것이다. 맨 아래에는 단서가 있다. 몇 판이 남았는가 하는 이 예는 이 노트가 고른 것이라는 내용이다">
  <title>같은 나무를 두 방향으로 읽는다 — 파스칼과 페르마</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .br{stroke:#3A5C77;stroke-width:1.6;}
  </style>
  <rect width="700" height="424" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">같은 나무를 두 방향으로 읽는다 — A 는 1판, B 는 2판 남았을 때</text>
  <text x="46" y="76" font-size="13" class="dim">페르마 — 남은 판을 끝까지 나열한다</text>
  <line x1="160" y1="110" x2="110" y2="180" class="br"/><line x1="160" y1="110" x2="210" y2="180" class="br"/><line x1="110" y1="180" x2="85" y2="250" class="br"/><line x1="110" y1="180" x2="135" y2="250" class="br"/><line x1="210" y1="180" x2="185" y2="250" class="br"/><line x1="210" y1="180" x2="235" y2="250" class="br"/><circle cx="160" cy="110" r="6" fill="#3A5C77"/><circle cx="110" cy="180" r="6" fill="#3A5C77"/><circle cx="210" cy="180" r="6" fill="#3A5C77"/><circle cx="85" cy="250" r="6" fill="#3A5C77"/><circle cx="135" cy="250" r="6" fill="#3A5C77"/><circle cx="185" cy="250" r="6" fill="#3A5C77"/><circle cx="235" cy="250" r="6" fill="#3A5C77"/>
  <text x="85" y="272" font-size="12" text-anchor="middle" class="ax">AA</text><text x="85" y="292" font-size="13" text-anchor="middle" class="sien">A</text><text x="135" y="272" font-size="12" text-anchor="middle" class="ax">AB</text><text x="135" y="292" font-size="13" text-anchor="middle" class="sien">A</text><text x="185" y="272" font-size="12" text-anchor="middle" class="ax">BA</text><text x="185" y="292" font-size="13" text-anchor="middle" class="sien">A</text><text x="235" y="272" font-size="12" text-anchor="middle" class="ax">BB</text><text x="235" y="292" font-size="13" text-anchor="middle" class="blue">B</text>
  <text x="46" y="324" font-size="13" class="sien">A 가 이기는 경우 셋, B 가 이기는 경우 하나</text>
  <text x="392" y="76" font-size="13" class="dim">파스칼 — 끝에서 거꾸로 따진다</text>
  <line x1="520" y1="110" x2="470" y2="180" class="br"/><line x1="520" y1="110" x2="570" y2="180" class="br"/><line x1="470" y1="180" x2="445" y2="250" class="br"/><line x1="470" y1="180" x2="495" y2="250" class="br"/><line x1="570" y1="180" x2="545" y2="250" class="br"/><line x1="570" y1="180" x2="595" y2="250" class="br"/><circle cx="520" cy="110" r="6" fill="#3A5C77"/><circle cx="470" cy="180" r="6" fill="#3A5C77"/><circle cx="570" cy="180" r="6" fill="#3A5C77"/><circle cx="445" cy="250" r="6" fill="#3A5C77"/><circle cx="495" cy="250" r="6" fill="#3A5C77"/><circle cx="545" cy="250" r="6" fill="#3A5C77"/><circle cx="595" cy="250" r="6" fill="#3A5C77"/>
  <text x="445" y="272" font-size="13" text-anchor="middle" class="sien">1</text><text x="495" y="272" font-size="13" text-anchor="middle" class="sien">1</text><text x="545" y="272" font-size="13" text-anchor="middle" class="sien">1</text><text x="595" y="272" font-size="13" text-anchor="middle" class="sien">0</text><text x="444" y="185" font-size="13" text-anchor="middle" class="sien">1</text><text x="598" y="185" font-size="13" text-anchor="middle" class="sien">1/2</text><text x="552" y="115" font-size="14" text-anchor="middle" class="sien">3/4</text>
  <text x="392" y="324" font-size="13" class="sien">판돈을 3/4 대 1/4 로 나눈다</text>
  <text x="46" y="360" font-size="13" class="dim">왼쪽 — 점이 판의 갈림, 점 아래 두 글자가 남은 두 판의 결과, 그 아래 한 글자가 그때의 승자다.</text>
  <text x="46" y="382" font-size="13" class="dim">오른쪽 — 같은 나무의 각 점에 적힌 수가 그 자리에서 A 가 이길 가능성이다.</text>
  <text x="46" y="408" font-size="13" class="sien">⚠ 몇 판이 남았는가 하는 이 예는 이 노트가 고른 것이다.</text>
</svg>
