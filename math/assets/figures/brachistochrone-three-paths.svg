<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 506" role="img" aria-label="그림 위쪽에 「가장 빠른 길은 가장 짧은 길이 아니다 — 최속강하선」이라는 표제가 있고 그 아래에 직선도 갈릴레오의 원호도 아니며 답은 사이클로이드라고 적혀 있다. 가운데에는 왼쪽 위의 점 A 에서 오른쪽 아래의 점 B 로 내려가는 길이 셋 그려져 있다. 가장 위를 곧게 가로지르는 것이 직선이고, 그 아래로 두 곡선이 아래로 불룩하게 휘어 내려간다. 둘 가운데 더 깊이 처지는 것이 사이클로이드이고 그보다 얕은 것이 이 원호인데, 왼쪽에서 조금 벌어졌다가 오른쪽으로 갈수록 붙어 거의 겹쳐 보인다. 두 곡선은 B 에 수평으로 닿고 직선만 비스듬히 닿는다. 오른쪽 위에는 내려오는 데 걸린 시간이 적혀 있다. 사이클로이드를 1 로 놓고 원호가 1.012, 직선이 1.185 다. 맨 아래에는 단서가 여섯 있다. 첫째는 B 를 사이클로이드의 최저점에 두었으므로 B 를 옮기면 세 수의 비도 달라진다는 것이고, 둘째는 원호를 B 가 최저점이 되는 원의 호로 잡았으며 갈릴레오가 어느 원호를 뜻했는지는 이 그림이 정하지 않는다는 것이고, 셋째는 범례의 원호 값이 그 선택에 달렸으며 가장 빠른 원호라야 1.005 고 나쁘게 잡으면 직선보다 느리다는 것이고, 넷째는 사이클로이드보다 깊이 처지는 원호도 있어 위아래 순서 또한 이 선택의 성질이라는 것이고, 다섯째는 원호와 사이클로이드가 가장 크게 벌어지는 자리가 같은 가로 자리에서 세로로 재어 전체 낙하 높이의 8 퍼센트라는 것이고, 여섯째는 마찰과 공기저항이 없다고 보았으며 세 수는 이 그림이 계산한 것이고 어느 길이 가장 빠른가는 출처 1 이 받친다는 것이다">
  <title>가장 빠른 길은 가장 짧은 길이 아니다 — 최속강하선</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
