  <text x="80.00" y="84.00" font-size="13">A</text>
  <text x="482.99" y="337.00" font-size="13">B</text>

  <text x="500" y="112" font-size="12" class="ax">내려오는 데 걸린 시간</text>
  <line x1="500" y1="130" x2="528" y2="130" class="c lin"/>
  <text x="536" y="134" font-size="12" class="dim">직선 1.185</text>
  <line x1="500" y1="156" x2="528" y2="156" class="c arc"/>
  <text x="536" y="160" font-size="12" class="blue">원호 1.012</text>
  <line x1="500" y1="182" x2="528" y2="182" class="c cyc"/>
  <text x="536" y="186" font-size="12" class="sien">사이클로이드 1</text>

  <text x="46" y="368" font-size="13" class="dim">세 길은 같은 A 에서 같은 B 로 간다 — 오른쪽 위의 수는 사이클로이드를 1 로 놓고 잰 것이다.</text>
  <text x="46" y="392" font-size="12" class="sien">⚠ B 는 사이클로이드의 최저점에 두었다 — B 를 옮기면 세 수의 비도 달라진다.</text>
  <text x="46" y="410" font-size="12" class="sien">⚠ 원호는 B 가 최저점이 되는 원의 호로 잡았다 — 갈릴레오가 어느 원호를 뜻했는지는 이 그림이 정하지 않는다.</text>
  <text x="46" y="428" font-size="12" class="sien">⚠ 범례의 원호 값은 그 선택에 달렸다 — 가장 빠른 원호라야 1.005 고, 나쁘게 잡으면 직선보다 느리다.</text>
  <text x="46" y="446" font-size="12" class="sien">⚠ 사이클로이드보다 깊이 처지는 원호도 있다 — 위아래 순서도 이 선택의 성질이다.</text>
  <text x="46" y="464" font-size="12" class="sien">⚠ 원호와 사이클로이드가 가장 크게 벌어지는 자리는 같은 가로 자리에서 세로로 재어 전체 낙하 높이의 8% 다.</text>
  <text x="46" y="482" font-size="12" class="sien">⚠ 마찰·공기저항은 없다고 보았다. 세 수는 이 그림이 계산했고, 어느 길이 가장 빠른가는 [1] 이 받친다.</text>
</svg>
