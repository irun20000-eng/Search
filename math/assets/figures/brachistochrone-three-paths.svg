    .cyc{stroke:#9C5A2C;stroke-width:2.2;}
  </style>
  <rect width="700" height="506" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">가장 빠른 길은 가장 짧은 길이 아니다 — 최속강하선</text>
  <text x="46" y="52" font-size="12" class="dim">직선도, 갈릴레오의 원호도 아니다 — 답은 사이클로이드다.</text>

