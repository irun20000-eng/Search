<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 488" width="700" height="488" role="img" aria-label="그림 위쪽에 「리만 재배열 — 같은 항, 다른 순서, 다른 값」이라는 표제가 있고 그 아래에 교대조화급수의 항을 하나도 더하거나 빼지 않고 순서만 바꿨다고 적혀 있다. 가운데에 가로로 긴 좌표평면이 하나 있다. 가로축은 더한 항의 수이고 눈금은 10과 20과 30과 40과 50과 60이며, 세로축 눈금은 0.6과 0.8과 1.0과 1.2다. 지그재그로 오르내리는 꺾은선이 둘 그려져 있는데, 둘 다 왼쪽에서는 크게 흔들리다가 오른쪽으로 갈수록 폭이 줄어든다. 파란 선은 아래쪽 0.69 근처로 잦아들고 갈색 선은 위쪽 1.04 근처로 잦아들어, 두 선이 서로 다른 높이에 자리를 잡는다. 각 선이 잦아드는 높이에 같은 색 파선이 가로로 그어져 있고, 파선 위에 값이 적혀 있다 — 아래쪽은 ln 2 는 0.6931, 위쪽은 ln 2 더하기 2분의 1 곱하기 ln 2 는 1.0397 이다. 좌표평면 아래에 범례가 둘 있다. 위는 파란 선이 원래 순서로 1 빼기 2분의 1 더하기 3분의 1 빼기 4분의 1 로 이어지며 ln 2 로 간다는 것이고, 아래는 갈색 선이 양수 둘과 음수 하나를 번갈아 놓아 1 더하기 3분의 1 빼기 2분의 1 더하기 5분의 1 더하기 7분의 1 빼기 4분의 1 로 이어지며 ln 2 더하기 2분의 1 곱하기 ln 2 로 간다는 것이다. 맨 아래에는 단서가 넷 있다. 첫째는 두 급수가 같은 항으로 이뤄지며 하나도 더하거나 빼지 않았고 바꾼 것은 순서뿐이라는 것이고, 둘째는 다만 앞 60항만 그렸으므로 같은 가로 자리의 두 점이 같은 항들의 합은 아니며 잘라 보면 항 집합이 갈린다는 것이고, 셋째는 그림이 1항부터 60항까지이며 4,000항에서 원래 순서가 0.693022, 9,000항에서 재배열이 1.039637 로 각각 예측값에 붙는다는 것이고, 넷째는 이 그림이 p 와 q 를 2 와 1 로 잡은 한 경우이며 아무 실수로나 갈 수 있다는 정리 자체를 보이지는 않는다는 것이다">
<title>리만 재배열 — 같은 항, 다른 순서, 다른 값</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .ax{font-size:10.5px;fill:#5B5245;} .lg{font-size:11.5px;}
    .sien{fill:#9C5A2C;} .blue{fill:#3A5C77;}
    .bg{fill:#FFFDF7;} .panel{fill:#F4EADC;stroke:#D8CDBB;stroke-width:1;}
    .grid{stroke:#D8CDBB;stroke-width:0.8;fill:none;}
    .o{stroke:#3A5C77;stroke-width:1.5;fill:none;}
    .r{stroke:#9C5A2C;stroke-width:1.5;fill:none;}
    .lim{stroke-width:1;fill:none;stroke-dasharray:4 3;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="488"/>
<text class="h1" x="56" y="44">리만 재배열 — 같은 항, 다른 순서, 다른 값</text>
<text class="h2" x="56" y="66">교대조화급수의 항을 하나도 더하거나 빼지 않고 순서만 바꿨다.</text>
<rect class="panel" x="74.0" y="116.0" width="492.0" height="184.0"/>
  <line class="grid" x1="74.0" y1="270.9" x2="566.0" y2="270.9"/>
  <text class="ax" x="66.0" y="274.4" text-anchor="end">0.6</text>
  <line class="grid" x1="74.0" y1="232.2" x2="566.0" y2="232.2"/>
  <text class="ax" x="66.0" y="235.7" text-anchor="end">0.8</text>
  <line class="grid" x1="74.0" y1="193.5" x2="566.0" y2="193.5"/>
  <text class="ax" x="66.0" y="197.0" text-anchor="end">1.0</text>
  <line class="grid" x1="74.0" y1="154.7" x2="566.0" y2="154.7"/>
  <text class="ax" x="66.0" y="158.2" text-anchor="end">1.2</text>
  <text class="ax" x="156.0" y="316.0" text-anchor="middle">10</text>
  <text class="ax" x="238.0" y="316.0" text-anchor="middle">20</text>
  <text class="ax" x="320.0" y="316.0" text-anchor="middle">30</text>
  <text class="ax" x="402.0" y="316.0" text-anchor="middle">40</text>
  <text class="ax" x="484.0" y="316.0" text-anchor="middle">50</text>
  <text class="ax" x="566.0" y="316.0" text-anchor="middle">60</text>
  <text class="ax" x="320.0" y="333.0" text-anchor="middle">더한 항의 수</text>
  <polyline class="o" points="82.2,193.47 90.4,290.32 98.6,225.75 106.8,274.18 115.0,235.44 123.2,267.72 131.4,240.05 139.6,264.26 147.8,242.74 156.0,262.11 164.2,244.50 172.4,260.64 180.6,245.74 188.8,259.58 197.0,246.66 205.2,258.77 213.4,247.38 221.6,258.14 229.8,247.94 238.0,257.63 246.2,248.40 254.4,257.21 262.6,248.79 270.8,256.86 279.0,249.11 287.2,256.56 295.4,249.39 303.6,256.30 311.8,249.62 320.0,256.08 328.2,249.83 336.4,255.89 344.6,250.02 352.8,255.71 361.0,250.18 369.2,255.56 377.4,250.32 385.6,255.42 393.8,250.45 402.0,255.30 410.2,250.57 418.4,255.18 426.6,250.68 434.8,255.08 443.0,250.78 451.2,254.99 459.4,250.87 467.6,254.90 475.8,250.95 484.0,254.82 492.2,251.03 500.4,254.75 508.6,251.10 516.8,254.68 525.0,251.16 533.2,254.62 541.4,251.22 549.6,254.56 557.8,251.28 566.0,254.51"/>
  <polyline class="r" points="82.2,193.47 90.4,128.91 98.6,225.75 106.8,187.02 115.0,159.35 123.2,207.77 131.4,186.25 139.6,168.64 147.8,200.92 156.0,186.02 164.2,173.11 172.4,197.32 180.6,185.93 188.8,175.73 197.0,195.10 205.2,185.88 213.4,177.46 221.6,193.60 229.8,185.85 238.0,178.68 246.2,192.51 254.4,185.83 262.6,179.59 270.8,191.69 279.0,185.82 287.2,180.29 295.4,191.05 303.6,185.81 311.8,180.85 320.0,190.53 328.2,185.81 336.4,181.30 344.6,190.11 352.8,185.80 361.0,181.68 369.2,189.75 377.4,185.80 385.6,182.00 393.8,189.45 402.0,185.80 410.2,182.28 418.4,189.19 426.6,185.79 434.8,182.51 443.0,188.97 451.2,185.79 459.4,182.72 467.6,188.77 475.8,185.79 484.0,182.90 492.2,188.60 500.4,185.79 508.6,183.06 516.8,188.44 525.0,185.79 533.2,183.21 541.4,188.30 549.6,185.79 557.8,183.34 566.0,188.18"/>
  <line class="lim" style="stroke:#22405A" x1="74.0" y1="252.9" x2="566.0" y2="252.9"/>
  <line class="lim" style="stroke:#7A4520" x1="74.0" y1="185.8" x2="566.0" y2="185.8"/>
  <text class="ax blue" x="560.0" y="245.9" text-anchor="end">ln 2 = 0.6931</text>
  <text class="ax sien" x="560.0" y="178.8" text-anchor="end">ln 2 + (1/2)ln 2 = 1.0397</text>
<line class="o" x1="70" y1="352.0" x2="98" y2="352.0"/>
<text class="lg" x="106" y="356.0">원래 순서  1 − 1/2 + 1/3 − 1/4 + …   →  ln 2</text>
<line class="r" x1="70" y1="373.0" x2="98" y2="373.0"/>
<text class="lg" x="106" y="377.0">양수 둘 · 음수 하나  1 + 1/3 − 1/2 + 1/5 + 1/7 − 1/4 + …   →  ln 2 + (1/2)ln 2</text>
<text class="warn" x="56" y="404.0">⚠ 두 급수는 같은 항으로 이뤄진다 — 하나도 더하지 않고 빼지 않았다. 바꾼 것은 순서뿐이다.</text>
<text class="warn" x="56" y="423.0">⚠ 다만 앞 60항만 그렸으므로 같은 가로 자리의 두 점이 같은 항들의 합은 아니다. 잘라 보면 항 집합이 갈린다.</text>
<text class="warn" x="56" y="442.0">⚠ 그림은 1항부터 60항까지다. 4,000항에서 원래 순서가 0.693022, 9,000항에서 재배열이 1.039637 로 각각 예측값에 붙는다.</text>
<text class="warn" x="56" y="461.0">⚠ 이 그림은 p 와 q 를 2 와 1 로 잡은 한 경우다 — 아무 실수로나 갈 수 있다는 정리 자체를 보이지는 않는다.</text>
</svg>