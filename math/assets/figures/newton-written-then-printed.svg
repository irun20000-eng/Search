<text class="warn" x="56" y="430">⚠ 띠는 해로만 그렸다. 두 동그라미는 죽은 해의 가운데에 찍었다 — 노트가 해만 적는다.</text>
<text class="warn" x="56" y="447">⚠ 1684~86은 노트 표의 해다 — 출처가 받치는 것은 1684 핼리의 방문 [1]뿐이다.</text>
<text class="warn" x="56" y="464">⚠ 『프린키피아』의 두 띠가 붙어 있어도 곧바로 이어졌다는 뜻은 아니다.</text>
<text class="warn" x="56" y="481">⚠ 『광학』의 집필 해는 노트의 표가 「—」로 비워 두어 그리지 않았다.</text>
<text class="warn" x="56" y="498">⚠ 줄은 책의 집필과 출판만 그렸다 — 유율법 자체는 1665~66년에 진전됐다 [2].</text>
<text class="warn" x="56" y="515">⚠ 「65년」은 노트의 말이다. 괄호는 1671 띠 가운데부터 1736 띠 가운데까지 그렸다.</text>
<text class="warn" x="56" y="532">⚠ 해는 노트의 출처 [1] MacTutor History of Mathematics, Isaac Newton · [3] 네이버 지식백과, 아이작 뉴턴을 따랐다.</text>
<text class="warn" x="56" y="549">⚠ 『유율법』의 해는 [4] Wikipedia, Method of Fluxions를 따랐다.</text>
<text class="warn" x="56" y="566">⚠ 1665~66은 [2] Stanford Encyclopedia of Philosophy, Isaac Newton을 따랐다.</text>
</svg>
