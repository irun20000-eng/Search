  <line class="lane" x1="200" y1="220" x2="640" y2="220"/>
  <text class="grp" x="56.0" y="224" text-anchor="start">『프린키피아』</text>
  <line class="lane" x1="200" y1="300" x2="640" y2="300"/>
  <text class="grp" x="56.0" y="304" text-anchor="start">『광학』</text>
  <rect class="write" x="235.2" y="134" width="5.9" height="12" rx="2"/>
  <line class="wait" x1="241.1" y1="140" x2="616.5" y2="140"/>
  <rect class="print" x="616.5" y="134" width="5.9" height="12" rx="2"/>
  <text class="ev" x="235.2" y="126" text-anchor="start">1671 집필 [4]</text>
  <text class="ev" x="622.4" y="126" text-anchor="end">1736 출판 — 사후 [4]</text>
  <path class="brk" d="M238.1,158 V164 H619.5 V158"/>
  <text class="ev" x="428.8" y="180" text-anchor="middle">65년</text>
  <rect class="write" x="311.5" y="214" width="17.6" height="12" rx="2"/>
  <rect class="print" x="329.1" y="214" width="5.9" height="12" rx="2"/>
  <text class="ev" x="311.5" y="206" text-anchor="start">1684~86 집필</text>
  <text class="ev" x="329.1" y="244" text-anchor="start">1687 출판 [3]</text>
  <rect class="print" x="428.8" y="294" width="5.9" height="12" rx="2"/>
  <text class="ev" x="428.8" y="324" text-anchor="start">1704 출판 [1]</text>
  <circle class="hooke" cx="425.9" cy="380" r="4"/>
  <text class="ev" x="425.9" y="368" text-anchor="middle">1703 훅이 죽다 [1]</text>
  <circle class="pt" cx="566.7" cy="380" r="4"/>
  <text class="ev" x="566.7" y="368" text-anchor="middle">1727 뉴턴이 죽다 [1]</text>
  <line class="axis" x1="200.0" y1="380" x2="200.0" y2="385"/>
  <line class="axis" x1="229.3" y1="380" x2="229.3" y2="385"/>
  <text class="yr" x="229.3" y="398" text-anchor="middle">1670</text>
  <line class="axis" x1="258.7" y1="380" x2="258.7" y2="385"/>
  <line class="axis" x1="288.0" y1="380" x2="288.0" y2="385"/>
  <text class="yr" x="288.0" y="398" text-anchor="middle">1680</text>
  <line class="axis" x1="317.3" y1="380" x2="317.3" y2="385"/>
  <line class="axis" x1="346.7" y1="380" x2="346.7" y2="385"/>
  <text class="yr" x="346.7" y="398" text-anchor="middle">1690</text>
  <line class="axis" x1="376.0" y1="380" x2="376.0" y2="385"/>
  <line class="axis" x1="405.3" y1="380" x2="405.3" y2="385"/>
  <text class="yr" x="405.3" y="398" text-anchor="middle">1700</text>
  <line class="axis" x1="434.7" y1="380" x2="434.7" y2="385"/>
  <line class="axis" x1="464.0" y1="380" x2="464.0" y2="385"/>
  <text class="yr" x="464.0" y="398" text-anchor="middle">1710</text>
  <line class="axis" x1="493.3" y1="380" x2="493.3" y2="385"/>
