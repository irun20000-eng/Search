<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 590" width="700" height="590" role="img" aria-label="그림 위쪽에 「집필과 출판 사이 — 뉴턴」이라는 표제가 있고 그 아래에 빈 띠는 집필, 찬 띠는 출판, 점선은 그 사이, 검은 동그라미는 뉴턴이 죽은 해, 빈 동그라미는 훅이 죽은 해라는 부호표가 있다. 가로축은 눈금 숫자가 1670부터 1740까지이고, 줄이 셋 있다. 줄 이름은 왼쪽 끝에 『유율법』, 『프린키피아』, 『광학』이라고 적혀 있다. 첫째 줄에는 1671년에 빈 띠가 있고 그 위에 1671 집필이라고 적혀 있다. 거기서 점선이 1736년까지 이어져 찬 띠에 닿고, 그 위 왼쪽에 1736 출판 — 사후라고 적혀 있다. 줄 아래에는 1671 띠에서 1736 띠까지 걸친 괄호가 있고 그 아래에 65년이라고 적혀 있다. 둘째 줄에는 1684년부터 1686년까지 빈 띠가 있고 그 위에 1684~86 집필이라고 적혀 있다. 바로 이어 1687년에 찬 띠가 있고 그 아래에 1687 출판이라고 적혀 있다. 셋째 줄에는 1704년에 찬 띠 하나만 있고 그 아래에 1704 출판이라고 적혀 있다. 가로축 위에는 동그라미가 둘 있다. 1703년 자리의 빈 동그라미 위에 1703 훅이 죽다, 1727년 자리의 검은 동그라미 위에 1727 뉴턴이 죽다라고 적혀 있다. 아래에 단서가 아홉 줄 있다. 첫째, 띠는 해로만 그렸고, 두 동그라미는 노트가 해만 적어 죽은 해의 가운데에 찍었다. 둘째, 1684~86은 노트 표의 해이고, 출처가 받치는 것은 1684 핼리의 방문뿐이다. 셋째, 『프린키피아』의 두 띠가 붙어 있어도 곧바로 이어졌다는 뜻은 아니다. 넷째, 『광학』의 집필 해는 노트의 표가 비워 두어 그리지 않았다. 다섯째, 줄은 책의 집필과 출판만 그렸고, 유율법 자체는 1665~66년에 진전됐다. 여섯째, 65년은 노트의 말이고, 괄호는 1671 띠 가운데부터 1736 띠 가운데까지 그렸다. 일곱째, 해는 노트의 출처 1번 MacTutor History of Mathematics, Isaac Newton, 3번 네이버 지식백과, 아이작 뉴턴을 따랐다. 여덟째, 『유율법』의 해는 4번 Wikipedia, Method of Fluxions를 따랐다. 아홉째, 1665~66은 2번 Stanford Encyclopedia of Philosophy, Isaac Newton을 따랐다.">
<title>집필과 출판 사이 뉴턴</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .write{fill:#FFFDF7;stroke:#9C5A2C;stroke-width:1.2;}
    .print{fill:#9C5A2C;stroke:#9C5A2C;stroke-width:1;}
    .wait{stroke:#9C5A2C;stroke-width:1;stroke-dasharray:2 3;}
    .hooke{fill:#FFFDF7;stroke:#221E18;stroke-width:1.4;}
    .pt{fill:#221E18;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="590"/>
<text class="h1" x="56" y="44">집필과 출판 사이 — 뉴턴</text>
<text class="h2" x="56" y="66">빈 띠 = 집필 · 찬 띠 = 출판 · 점선 = 그 사이 · ● = 뉴턴이 죽은 해 · ○ = 훅이 죽은 해</text>
  <line class="axis" x1="200" y1="380" x2="640" y2="380"/>
