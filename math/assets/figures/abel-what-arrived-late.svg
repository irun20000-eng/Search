<text class="h2" x="56" y="66">갈색 점 = 그가 보낸 것 · 푸른 점 = 그에게 온 것 · 검은 점 = 아벨이 죽은 날 · 칸 = 산 해</text>
<text class="h3" x="56" y="100" text-anchor="start">살아 있던 해 가까이 — 한 해가 넓다 (1824~1831)</text>
