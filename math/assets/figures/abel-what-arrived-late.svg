<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 668" width="700" height="668" role="img" aria-label="그림 위쪽에 「늦게 도착한 것들 — 아벨」이라는 표제가 있고 그 아래에 갈색 점은 그가 보낸 것, 푸른 점은 그에게 온 것, 검은 점은 아벨이 죽은 날, 칸은 산 해라는 부호표가 있다. 그림은 위아래 두 칸이다. 위 칸에는 살아 있던 해 가까이, 한 해가 넓다, 1824에서 1831이라는 제목이 있고, 가로축은 1824년부터 1831년까지 한 해마다 눈금이 있다. 줄이 둘 있고 줄 이름은 왼쪽 끝에 보낸 것, 온 것이라고 적혀 있다. 보낸 것 줄에는 갈색 점이 셋 있다. 1824년 점 위에 1824 5차 불가능성 소책자, 자비 여섯 쪽, 1826년 초 점 아래에 1826 초 크렐레 학술지 첫 글, 증명 확장판, 1826년 10월 말 점 그 아래 줄에 1826.10 말 파리 논문 제출이라고 적혀 있다. 가로축 위 1829년 4월 6일 자리에 검은 점이 있고 그 왼쪽 위에 1829.4.6 아벨이 죽다라고 적혀 있다. 그 점에서 점선이 위로 올라가 온 것 줄의 푸른 점에 닿는다. 그 푸른 점 왼쪽 위에 두 줄로 1829.4.8 크렐레의 편지, 베를린 임용, 이틀 뒤 쓰이다라고 적혀 있다. 온 것 줄 1830년 가운데에도 푸른 점이 있고 그 아래에 1830 학사원 대상이라고 적혀 있다. 아래 칸에는 그 뒤, 두 세기를 한 줄에, 1800에서 2020, 눈금이 다르다라는 제목이 있고, 가로축은 1800년부터 2020년까지 스무 해마다 눈금이 있다. 줄이 둘 있고 줄 이름은 산 해, 온 것이다. 산 해 줄에는 1802년부터 1829년까지 칸이 있고 그 위에 1802~1829 아벨이 산 해라고 적혀 있다. 온 것 줄에는 푸른 점이 여섯 있다. 1839년 점 왼쪽 위에 1839 전집, 파리 논문 빠짐, 1841년 점 오른쪽 아래에 1841 첫 인쇄, 1899년 점 왼쪽 위 높이 올린 자리에 1899 아벨 기금 중단, 1905년 점 오른쪽 아래에 1905 금메달 구상 끝, 1952년 점 오른쪽 위에 1952 원고가 피렌체에서, 2002년 점 아래에 2002 아벨상이라고 적혀 있다. 가로축 위 1829년 자리에 검은 점이 있고, 그 점부터 2002년 자리까지 걸친 괄호 위에 아벨상까지 173년이라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 위 칸과 아래 칸은 눈금이 다르고 위는 일곱 해, 아래는 두 세기 남짓을 같은 폭에 담았다. 둘째, 해만 아는 일은 해의 가운데에, 1826 초는 해의 앞쪽에 찍었고 1829.4.6, 4.8, 10월 말은 날짜 자리다. 셋째, 4월 8일은 편지를 쓴 날이고 국내 자료 둘은 그날 닿았다고 적는다. 넷째, 파리 논문을 다시 찾은 해는 1829와 1830으로 자료가 갈려 그리지 않았다. 다섯째, 173년은 그림이 잰 해의 차다. 여섯째, 해와 날짜는 1번 MacTutor와 5번부터 7번까지 아벨상 전기를, 2002는 2번과 7번을 따랐다">
<title>늦게 도착한 것들 아벨</title>
