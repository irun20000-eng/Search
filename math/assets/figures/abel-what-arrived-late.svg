<text class="ev" x="525.0" y="224" text-anchor="end">— 베를린 임용, 이틀 뒤 쓰이다 [1][6]</text>
<circle class="bl" cx="608.6" cy="232" r="3.5"/>
<text class="ev" x="608.6" y="252" text-anchor="middle">1830 학사원 대상 [1]</text>
