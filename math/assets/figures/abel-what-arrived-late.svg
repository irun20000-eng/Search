<text class="warn" x="56" y="570">⚠ 위 칸과 아래 칸은 눈금이 다르다 — 위는 일곱 해, 아래는 두 세기 남짓을 같은 폭에 담았다.</text>
<text class="warn" x="56" y="586">⚠ 해만 아는 일은 해의 가운데에, 1826 초는 해의 앞쪽에 찍었다 — 1829.4.6 · 4.8 · 10월 말은 날짜 자리다.</text>
<text class="warn" x="56" y="602">⚠ 4월 8일은 편지를 쓴 날이다 [1][6] — 국내 자료 둘은 그날 닿았다고 적는다 [2][3] (노트 §8).</text>
<text class="warn" x="56" y="618">⚠ 파리 논문을 다시 찾은 해는 1829 와 1830 으로 자료가 갈려 그리지 않았다 (노트 §8).</text>
<text class="warn" x="56" y="634">⚠ 「173년」은 그림이 잰 해의 차다.</text>
<text class="warn" x="56" y="650">⚠ 해와 날짜는 [1] MacTutor 와 [5]~[7] 아벨상 전기를, 2002 는 [2][7] 을 따랐다.</text>
