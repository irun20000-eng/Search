<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="수직으로 쌓은 카드 더미와 옆으로 민 카드 더미의 부피가 같다">
  <title>카발리에리의 원리 — 카드 더미</title>
  <rect width="600" height="250" fill="#FFFDF7"/>
  <!-- 왼쪽: 수직으로 쌓은 더미 -->
  <rect x="70.0" y="196.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="70.0" y="177.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="70.0" y="158.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="70.0" y="139.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="70.0" y="120.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="70.0" y="101.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="70.0" y="82.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="70.0" y="63.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="70.0" y="44.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <!-- 오른쪽: 옆으로 민 더미 (부피는 그대로) -->
  <rect x="330.0" y="196.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="335.5" y="177.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="341.0" y="158.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="346.5" y="139.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="352.0" y="120.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="357.5" y="101.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="363.0" y="82.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="368.5" y="63.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <rect x="374.0" y="44.0" width="150" height="16" rx="2" fill="#F0E7D6" stroke="#221E18" stroke-width="1.3"/>
  <!-- 같은 높이에서 자른 자리 -->
  <line x1="45" y1="128.0" x2="565" y2="128.0" stroke="#9C5A2C" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="275" y="120.0" font-family="EB Garamond, Georgia, serif" font-size="13" fill="#9C5A2C" text-anchor="middle">같은 높이</text>
  <line x1="70.0" y1="128.0" x2="220.0" y2="128.0" stroke="#9C5A2C" stroke-width="3.4"/>
  <line x1="352.0" y1="128.0" x2="502.0" y2="128.0" stroke="#9C5A2C" stroke-width="3.4"/>
  <text x="145" y="232" font-family="EB Garamond, Georgia, serif" font-size="14" fill="#221E18" text-anchor="middle">수직으로 쌓는다</text>
  <text x="430" y="232" font-family="EB Garamond, Georgia, serif" font-size="14" fill="#221E18" text-anchor="middle">옆으로 민다</text>
  <text x="300" y="26" font-family="EB Garamond, Georgia, serif" font-size="15" fill="#221E18" text-anchor="middle">단면이 같으면 부피가 같다</text>
</svg>
