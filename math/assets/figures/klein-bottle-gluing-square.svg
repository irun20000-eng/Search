<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 416" role="img" aria-label="그림 위쪽에 「클라인 병 — 화살표 한 쌍을 뒤집으면 한쪽 면만 남는다」라는 표제가 있고 그 아래에 정사각형의 마주 보는 변을 붙이는 규칙만 다르며 깃발이 한 바퀴 돌아오는 모습이 그 차이라고 적혀 있다. 아래에 같은 크기의 정사각형 둘이 나란히 있다. 왼쪽 것의 제목은 토러스이고 좌우를 그대로 붙인다고 적혀 있으며, 위 변과 아래 변의 화살촉은 둘 다 오른쪽을 향하고 왼쪽 변과 오른쪽 변의 화살촉은 둘 다 아래를 향한다. 사각형 위쪽에 깃대가 하나 서 있고 깃발이 위에 달려 있으며, 거기서 오른쪽 변까지 파선 화살표가 그어져 있다. 왼쪽 변 가까이 같은 높이에 같은 모양의 깃대가 하나 더 있고 그 깃대 아래 오른쪽에 돌아온 자리라고 적혀 있으며, 거기서도 짧은 파선 화살표가 오른쪽으로 나간다. 사각형 아래에 같은 높이로 깃발도 그대로 돌아온다고 적혀 있다. 오른쪽 것의 제목은 클라인 병이고 좌우를 뒤집어 붙인다고 적혀 있으며, 위 변과 아래 변의 화살촉은 둘 다 오른쪽을 향하는데 왼쪽 변은 아래를 오른쪽 변은 위를 향한다. 사각형 위쪽에 깃대가 하나 서 있고 깃발이 위에 달려 있으며, 거기서 오른쪽 변까지 파선 화살표가 그어져 있다. 돌아온 깃대는 사각형의 아래쪽 반대 높이에 있으며 깃발이 아래에 달려 있고 그 깃대 아래 오른쪽에 돌아온 자리라고 적혀 있으며, 거기서도 짧은 파선 화살표가 오른쪽으로 나간다. 사각형 아래에 반대쪽 높이로 깃발이 뒤집혀 돌아온다고, 그리고 한 바퀴 돌면 방향이 뒤집히므로 앞뒤를 정할 수 없다고 적혀 있다. 맨 아래에는 단서가 셋 있다. 첫째는 흔히 보는 유리병 모양 그림이 이 규칙을 3차원에 밀어 넣은 것이라 자기를 뚫고 지나가며 그 교차는 물체의 성질이 아니라는 것이고, 둘째는 이 도식에는 교차가 없으며 교차 없이 놓으려면 4차원이 있어야 하는데 이 도식은 그 4차원을 보이지 않는다는 것이고, 셋째는 도식이 붙이는 규칙만 말하며 곡면의 크기도 굽은 정도도 이 그림이 정하지 않는다는 것이다">
  <title>클라인 병 — 화살표 한 쌍을 뒤집으면 한쪽 면만 남는다</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .sq{fill:#F4EADC;stroke:#221E18;stroke-width:1.4;}
    .arr{fill:#221E18;} .arr2{fill:#3A5C77;} .arrt{fill:#9C5A2C;}
    .trip{stroke:#9C5A2C;stroke-width:1.2;stroke-dasharray:4 3;}
    .glyph{stroke:#221E18;stroke-width:1.6;fill:none;} .glyphf{fill:#221E18;}
  </style>
  <rect width="700" height="416" fill="#FFFDF7"/>
  <text x="56" y="30" font-size="16">클라인 병 — 화살표 한 쌍을 뒤집으면 한쪽 면만 남는다</text>
  <text x="56" y="52" font-size="12" class="dim">정사각형의 마주 보는 변을 붙이는 규칙만 다르다. 깃발이 한 바퀴 돌아오는 모습이 그 차이다.</text>
  <text x="92" y="92" font-size="12.5">토러스</text>
  <text x="92" y="110" font-size="11" class="ax">좌우를 그대로 붙인다</text>
  <rect x="92.0" y="122.0" width="150" height="150" class="sq"/>
  <path d="M 173.0 122.0 L 161.0 126.3 L 161.0 117.7 Z" class="arr"/>
  <path d="M 173.0 272.0 L 161.0 276.3 L 161.0 267.7 Z" class="arr"/>
  <path d="M 92.0 203.0 L 87.7 191.0 L 96.3 191.0 Z" class="arr2"/>
  <path d="M 242.0 203.0 L 237.7 191.0 L 246.3 191.0 Z" class="arr2"/>
  <line x1="158.0" y1="167.0" x2="242.0" y2="167.0" class="trip"/>
  <path d="M 239.0 167.0 L 227.0 171.3 L 227.0 162.7 Z" class="arrt"/>
  <path d="M 150.0 157.0 L 150.0 177.0" class="glyph"/>
  <path d="M 150.0 157.0 L 163.0 154.0 L 150.0 149.0 Z" class="glyphf"/>
  <path d="M 98.0 157.0 L 98.0 177.0" class="glyph"/>
  <path d="M 98.0 157.0 L 111.0 154.0 L 98.0 149.0 Z" class="glyphf"/>
  <line x1="98.0" y1="167.0" x2="119.0" y2="167.0" class="trip"/>
  <path d="M 116.0 167.0 L 104.0 171.3 L 104.0 162.7 Z" class="arrt"/>
  <text x="118.0" y="201.0" font-size="10.5" class="ax">돌아온 자리</text>
  <text x="392" y="92" font-size="12.5">클라인 병</text>
  <text x="392" y="110" font-size="11" class="sien">좌우를 뒤집어 붙인다</text>
  <rect x="392.0" y="122.0" width="150" height="150" class="sq"/>
  <path d="M 473.0 122.0 L 461.0 126.3 L 461.0 117.7 Z" class="arr"/>
  <path d="M 473.0 272.0 L 461.0 276.3 L 461.0 267.7 Z" class="arr"/>
  <path d="M 392.0 203.0 L 387.7 191.0 L 396.3 191.0 Z" class="arr2"/>
  <path d="M 542.0 191.0 L 546.3 203.0 L 537.7 203.0 Z" class="arr2"/>
  <line x1="458.0" y1="167.0" x2="542.0" y2="167.0" class="trip"/>
  <path d="M 539.0 167.0 L 527.0 171.3 L 527.0 162.7 Z" class="arrt"/>
  <path d="M 450.0 157.0 L 450.0 177.0" class="glyph"/>
  <path d="M 450.0 157.0 L 463.0 154.0 L 450.0 149.0 Z" class="glyphf"/>
  <path d="M 398.0 217.0 L 398.0 237.0" class="glyph"/>
  <path d="M 398.0 237.0 L 411.0 240.0 L 398.0 245.0 Z" class="glyphf"/>
  <line x1="398.0" y1="227.0" x2="419.0" y2="227.0" class="trip"/>
  <path d="M 416.0 227.0 L 404.0 231.3 L 404.0 222.7 Z" class="arrt"/>
  <text x="418.0" y="261.0" font-size="10.5" class="ax">돌아온 자리</text>
  <text x="92" y="294" font-size="11" class="ax">같은 높이로, 깃발도 그대로 돌아온다</text>
  <text x="392" y="294" font-size="11" class="sien">반대쪽 높이로, 깃발이 뒤집혀 돌아온다</text>
  <text x="392" y="312" font-size="11" class="sien">한 바퀴 돌면 방향이 뒤집힌다 — 앞뒤를 정할 수 없다</text>
  <text x="56" y="338" font-size="10.5" class="ax">⚠ 흔히 보는 유리병 모양 그림은 이 규칙을 3차원에 밀어 넣은 것이라 자기를 뚫고 지나간다. 그 교차는 물체의 성질이 아니다.</text>
  <text x="56" y="356" font-size="10.5" class="ax">⚠ 이 도식에는 교차가 없다. 교차 없이 놓으려면 4차원이 있어야 한다 — 이 도식은 그 4차원을 보이지 않는다.</text>
  <text x="56" y="374" font-size="10.5" class="ax">⚠ 도식은 붙이는 규칙만 말한다 — 곡면의 크기도 굽은 정도도 이 그림이 정하지 않는다.</text>
</svg>
