<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 452" role="img" aria-label="그림 위쪽에 「같은 곡선, 세 가지 자르기 — 교과서·리만·다르부」라는 표제가 있고 그 아래에 나누는 방식과 높이를 무엇으로 잡느냐가 다르다고 적혀 있다. 아래에 같은 크기로 셋이 나란히 그려져 있고, 셋 모두 같은 곡선이 그려져 있다. 왼쪽 것의 제목은 교과서 구분구적이고 n등분에 끝점이라고 적혀 있으며, 폭이 모두 같은 직사각형 여섯 개가 서 있고 각 직사각형의 윗변이 그 칸의 오른쪽 끝에서 곡선에 닿는다. 가운데 것의 제목은 리만이고 1854년, 임의 분할에 임의 점이라고 적혀 있으며, 폭이 고르지 않은 직사각형 여섯 개가 서 있고 칸마다 찍힌 점에서 곡선의 높이를 가져왔다. 그 점들은 칸의 왼쪽에도 가운데에도 오른쪽에도 있다. 오른쪽 것의 제목은 다르부이고 1875년, 임의 분할에 최소와 최대라고 적혀 있으며, 가운데 것과 같은 분할 위에 직사각형이 칸마다 둘씩 그려져 있다. 낮은 쪽은 칠해져 있고 높은 쪽은 테두리만 있는데, 칠한 것이 하합이고 테두리가 상합이다. 그 아래에 가운데와 오른쪽은 같은 분할을 쓴 것이며 다른 것은 높이를 어디서 가져오느냐뿐이라고 적혀 있다. 맨 아래에는 단서가 셋 있다. 첫째는 곡선과 분할이 차이를 보이려고 고른 것이며 실제 값과는 무관하다는 것이고, 둘째는 세 방식이 같은 값을 주는 조건인 적분가능성은 이 그림이 말하지 않는다는 것이고, 셋째는 다르부 쪽이 상합과 하합을 한 그림에 겹쳐 그린 것이며 본래는 두 값이라는 것이다">
  <title>같은 곡선, 세 가지 자르기 — 교과서·리만·다르부</title>
