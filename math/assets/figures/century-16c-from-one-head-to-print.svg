<text class="sm" x="110.0" y="84" text-anchor="end">아는 사람</text>
<path class="step" d="M154.7,336 H250.0"/>
<path class="unk" d="M250.0,336 V302 H336.7"/>
<path class="step" d="M336.7,302 H432.0 V234 H510.0 V200 H544.7 V166 H596.7"/>
<line class="step" x1="596.7" y1="166" x2="596.7" y2="104" marker-end="url(#ah)"/>
<circle class="pt" cx="154.7" cy="336" r="3.4"/>
<text class="ev" x="160.7" y="349" text-anchor="start">1494 파치올리 「아마 불가능」</text>
<text class="ev" x="330.7" y="294" text-anchor="end">1505~1515 사이 델 페로가 풀다</text>
<text class="ev" x="426.0" y="226" text-anchor="end">늦어도 1526 · 조수 피오르, 사위 나베</text>
<text class="ev" x="504.0" y="192" text-anchor="end">1535 타르탈리아가 피오르를 이기다</text>
<text class="ev" x="538.7" y="158" text-anchor="end">1539 시로 카르다노에게 — 맹세</text>
<text class="ev" x="590.7" y="98" text-anchor="end">1545 『아르스 마그나』 — 인쇄</text>
<circle class="mk" cx="553.3" cy="166" r="3.2"/>
<circle class="mk" cx="579.3" cy="166" r="3.2"/>
