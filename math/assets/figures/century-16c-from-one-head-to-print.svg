<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 571" width="700" height="571" role="img" aria-label="그림 위쪽에 「한 사람의 머릿속에서 인쇄까지 — 30년」이라는 표제가 있고 그 아래에 계단은 해법을 알게 된 사람의 누계, 파선은 출처가 무렵으로 적은 것, 화살표는 인쇄되어 누구나라는 부호표가 있다. 가로축은 1490년부터 1550년까지의 해이고, 세로축은 해법을 아는 사람의 수로 0부터 4까지 눈금이 있으며 그 위에 끊김 표시를 두고 누구나라는 칸이 따로 있다. 세로축 맨 위에 아는 사람이라고 적혀 있다. 1494년 0의 높이에 점이 있고 파치올리 아마 불가능이라고 적혀 있다. 선은 0의 높이로 오른쪽으로 가다가 1515년에 파선으로 1로 올라가고 옆에 1515 무렵 델 페로가 풀고 감추다라고 적혀 있다. 이어 1526년에 2로 올라가며 임종 무렵 피오르에게, 1535년에 3으로 올라가며 타르탈리아가 스스로 이르다, 1539년에 4로 올라가며 시 스물다섯 줄과 맹세라고 적혀 있다. 4의 높이에 1540과 1543 자리에 작은 동그라미 둘이 있고 각각 1번, 2번이 붙어 있다. 그 번호의 풀이는 그림 오른쪽 아래, 0과 1 눈금 사이에 적혀 있다 — 1번은 1540 페라리가 사차를 풀다, 낼 수 없음, 2번은 1543 볼로냐에서 델 페로 유고 확인. 1545년에 선이 4에서 누구나 칸까지 화살표로 치솟고 1545 아르스 마그나 인쇄라고 적혀 있다. 가로축 아래에 1515에서 1545까지를 묶는 괄호가 있어 30년이라고 적혀 있고, 그 바로 아래 같은 폭의 옅은 띠에 그 30년 내내 인쇄기는 있었다고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 세로축은 노트 4절 표의 사람 수이고 해법을 알게 된 사람의 누계라서 1526년에 죽은 델 페로도 센다. 둘째, 계단은 표가 수를 적은 해에만 올렸고 그사이 따로 알게 된 사람이 있었는지는 모른다. 셋째, 1515년 계단만 파선인 것은 출처가 무렵으로 적기 때문이다. 넷째, 페라리의 사차 풀이는 삼차 위에 섰으니 그도 알았지만 표가 수를 적지 않아 계단을 올리지 않았을 뿐이고, 1540년부터의 4는 적게 잡은 값이다. 다섯째, 맨 위 누구나는 수가 아니어서 눈금 간격과 맞지 않는다. 여섯째, 해는 노트의 출처 11번부터 14번과 21번, MacTutor와 Encyclopedia.com을 따랐다.">
<title>한 사람의 머릿속에서 인쇄까지 30년</title>
