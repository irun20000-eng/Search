  </style>
<rect class="bg" x="0" y="0" width="700" height="571"/>
<text class="h1" x="56" y="44">한 사람의 머릿속에서 인쇄까지 — 30년</text>
<text class="h2" x="56" y="66">계단 = 해법을 알게 된 사람의 누계 · 파선 = 출처가 「무렵」 · 화살표 = 인쇄되어 누구나</text>
  <line class="grid" x1="120" y1="336" x2="640" y2="336"/>
  <text class="yr" x="110.0" y="340" text-anchor="end">0</text>
  <line class="grid" x1="120" y1="296" x2="640" y2="296"/>
  <text class="yr" x="110.0" y="300" text-anchor="end">1</text>
  <line class="grid" x1="120" y1="256" x2="640" y2="256"/>
  <text class="yr" x="110.0" y="260" text-anchor="end">2</text>
  <line class="grid" x1="120" y1="216" x2="640" y2="216"/>
  <text class="yr" x="110.0" y="220" text-anchor="end">3</text>
  <line class="grid" x1="120" y1="176" x2="640" y2="176"/>
  <text class="yr" x="110.0" y="180" text-anchor="end">4</text>
  <text class="yr" x="110.0" y="124" text-anchor="end">누구나</text>
  <line class="axis" x1="108" y1="148" x2="116" y2="142"/>
  <line class="axis" x1="108" y1="154" x2="116" y2="148"/>
  <text class="sm" x="110.0" y="100" text-anchor="end">아는 사람</text>
  <path class="step" d="M154.7,336 H336.7"/>
  <line class="unk" x1="336.7" y1="336" x2="336.7" y2="296"/>
  <path class="step" d="M336.7,296 H432.0 V256 H510.0 V216 H544.7 V176 H596.7"/>
  <line class="step" x1="596.7" y1="176" x2="596.7" y2="124" marker-end="url(#ah)"/>
  <circle class="pt" cx="154.7" cy="336" r="3.4"/>
  <text class="ev" x="150.7" y="324" text-anchor="start">1494 파치올리 「아마 불가능」</text>
  <text class="ev" x="330.7" y="288" text-anchor="end">1515 무렵 델 페로가 풀고 감추다</text>
  <text class="ev" x="426.0" y="248" text-anchor="end">1526 임종 무렵 피오르에게</text>
  <text class="ev" x="504.0" y="208" text-anchor="end">1535 타르탈리아가 스스로 이르다</text>
  <text class="ev" x="538.7" y="168" text-anchor="end">1539 시 스물다섯 줄 — 맹세</text>
  <text class="ev" x="590.7" y="118" text-anchor="end">1545 『아르스 마그나』 — 인쇄</text>
  <circle class="mk" cx="553.3" cy="176" r="3.2"/>
  <circle class="mk" cx="579.3" cy="176" r="3.2"/>
  <text class="tiny" x="551.3" y="193" text-anchor="start">①</text>
  <text class="tiny" x="579.3" y="168" text-anchor="middle">②</text>
  <text class="sm" x="640.0" y="314" text-anchor="end">① 1540 · 페라리가 사차를 풀다 — 낼 수 없음</text>
  <text class="sm" x="640.0" y="329" text-anchor="end">② 1543 · 볼로냐에서 델 페로 유고 확인</text>
  <line class="axis" x1="120" y1="356" x2="640" y2="356"/>
  <line class="axis" x1="120.0" y1="356" x2="120.0" y2="361"/>
  <text class="yr" x="120.0" y="374" text-anchor="middle">1490</text>
  <line class="axis" x1="206.7" y1="356" x2="206.7" y2="361"/>
  <text class="yr" x="206.7" y="374" text-anchor="middle">1500</text>
  <line class="axis" x1="293.3" y1="356" x2="293.3" y2="361"/>
  <text class="yr" x="293.3" y="374" text-anchor="middle">1510</text>
  <line class="axis" x1="380.0" y1="356" x2="380.0" y2="361"/>
