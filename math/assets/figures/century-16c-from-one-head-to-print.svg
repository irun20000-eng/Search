<path class="brk" d="M336.7,383 V388 H596.7 V383"/>
<text class="ev" x="466.7" y="403" text-anchor="middle">카르다노는 1545년에 「거의 서른 해 전」이라 적었다</text>
<rect class="press" x="336.7" y="416" width="260.0" height="16" rx="2"/>
<text class="sm" x="466.7" y="428" text-anchor="middle">그동안 내내 인쇄기는 있었다</text>
<text class="warn" x="56" y="462">⚠ 세로축은 노트 §4 표의 사람 수다 — 해법을 알게 된 사람의 누계라서 1526년에 죽은 델 페로도 센다.</text>
<text class="warn" x="56" y="479">⚠ 계단은 표가 수를 적은 해에만 올렸다. 그사이 따로 알게 된 사람이 있었는지는 모른다.</text>
<text class="warn" x="56" y="496">⚠ 파선은 델 페로가 푼 때의 폭이다 — 출처는 「1505~1515 사이 어느 때」라고만 적는다 [14].</text>
<text class="warn" x="56" y="513">⚠ 피오르가 들은 해는 출처가 적지 않는다 — 델 페로가 죽고 공책이 사위 나베에게 간 1526 까지로 묶었다 [14][24].</text>
<text class="warn" x="56" y="530">⚠ 페라리의 사차 풀이는 삼차 위에 섰으니 그도 알았다 — 표가 수를 적지 않아 올리지 않았을 뿐, 5는 적게 잡은 값이다.</text>
<text class="warn" x="56" y="547">⚠ 맨 위 「누구나」는 수가 아니다. 눈금 간격과 맞지 않는다.</text>
<text class="warn" x="56" y="564">⚠ 해는 노트의 출처 [11]~[14]·[21]·[22]·[24] MacTutor · Encyclopedia.com 을 따랐다.</text>
