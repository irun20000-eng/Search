<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img" aria-label="그림 위쪽에 「한 사람의 머릿속에서 인쇄까지」이라는 표제가 있고 그 아래에 계단은 해법을 알게 된 사람의 누계, 파선은 출처가 폭으로만 적은 때, 화살표는 인쇄되어 누구나라는 부호표가 있다. 가로축은 1490년부터 1550년까지의 해이고, 세로축은 해법을 아는 사람의 수로 0부터 5까지 눈금이 있으며 그 위에 끊김 표시를 두고 누구나라는 칸이 따로 있다. 세로축 맨 위에 아는 사람이라고 적혀 있다. 1494년 0의 높이에 점이 있고 그 오른쪽 아래에 1494 파치올리 아마 불가능이라고 적혀 있다. 선은 0의 높이로 오른쪽으로 가다가 1505년에 파선으로 1로 올라가 1515년까지 파선으로 이어지고, 그 끝 왼쪽 위에 1505~1515 사이 델 페로가 풀다라고 적혀 있다. 이어 1526년에 3으로 올라가며 늦어도 1526, 조수 피오르, 사위 나베, 1535년에 4로 올라가며 1535 타르탈리아가 피오르를 이기다, 1539년에 5로 올라가며 1539 시로 카르다노에게, 맹세라고 적혀 있다. 5의 높이에 1540과 1543 자리에 작은 동그라미 둘이 있고 각각 1번, 2번이 붙어 있다. 그 번호의 풀이는 그림 오른쪽 아래, 0과 1 눈금 사이에 적혀 있다 — 1번은 1540 페라리가 사차를 풀다, 낼 수 없음, 2번은 1543 볼로냐에서 델 페로 유고 확인. 1545년에 선이 5에서 누구나 칸까지 화살표로 치솟고 1545 아르스 마그나 인쇄라고 적혀 있다. 가로축 아래에 1515에서 1545까지를 묶는 괄호가 있어 카르다노는 1545년에 거의 서른 해 전이라 적었다고 적혀 있고, 그 바로 아래 같은 폭의 옅은 띠에 그동안 내내 인쇄기는 있었다고 적혀 있다. 아래에 단서가 일곱 줄 있다. 첫째, 세로축은 노트 4절 표의 사람 수이고 해법을 알게 된 사람의 누계라서 1526년에 죽은 델 페로도 센다. 둘째, 계단은 표가 수를 적은 해에만 올렸고 그사이 따로 알게 된 사람이 있었는지는 모른다. 셋째, 파선은 델 페로가 푼 때의 폭이고 출처는 1505~1515 사이 어느 때라고만 적는다. 넷째, 피오르가 들은 해는 출처가 적지 않아 델 페로가 죽고 공책이 사위 나베에게 간 1526 까지로 묶었다. 다섯째, 페라리의 사차 풀이는 삼차 위에 섰으니 그도 알았지만 표가 수를 적지 않아 계단을 올리지 않았을 뿐이고, 1540년부터의 5는 적게 잡은 값이다. 여섯째, 맨 위 누구나는 수가 아니어서 눈금 간격과 맞지 않는다. 일곱째, 해는 노트의 출처 11번부터 14번과 21번, 22번, 24번, MacTutor와 Encyclopedia.com을 따랐다.">
<title>한 사람의 머릿속에서 인쇄까지</title>
