<text class="tiny" x="579.3" y="158" text-anchor="middle">②</text>
<text class="sm" x="640.0" y="316" text-anchor="end">① 1540 · 페라리가 사차를 풀다 — 낼 수 없음</text>
<text class="sm" x="640.0" y="330" text-anchor="end">② 1543 · 볼로냐에서 델 페로 유고 확인</text>
