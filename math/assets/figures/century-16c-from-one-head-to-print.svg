  <text class="ev" x="466.7" y="403" text-anchor="middle">30년</text>
  <rect class="press" x="336.7" y="416" width="260.0" height="16" rx="2"/>
  <text class="sm" x="466.7" y="428" text-anchor="middle">그 30년 내내 인쇄기는 있었다</text>
<text class="warn" x="56" y="462">⚠ 세로축은 노트 §4 표의 사람 수다 — 해법을 알게 된 사람의 누계라서 1526년에 죽은 델 페로도 센다.</text>
<text class="warn" x="56" y="479">⚠ 계단은 표가 수를 적은 해에만 올렸다. 그사이 따로 알게 된 사람이 있었는지는 모른다.</text>
<text class="warn" x="56" y="496">⚠ 1515년 계단만 파선이다 — 출처가 「무렵」으로 적는다.</text>
<text class="warn" x="56" y="513">⚠ 페라리의 사차 풀이는 삼차 위에 섰으니 그도 알았다 — 표가 수를 적지 않아 올리지 않았을 뿐, 4는 적게 잡은 값이다.</text>
<text class="warn" x="56" y="530">⚠ 맨 위 「누구나」는 수가 아니다. 눈금 간격과 맞지 않는다.</text>
<text class="warn" x="56" y="547">⚠ 해는 노트의 출처 [11]~[14]·[21] MacTutor · Encyclopedia.com 을 따랐다.</text>
