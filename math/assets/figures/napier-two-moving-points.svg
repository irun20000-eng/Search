<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" role="img" aria-label="그림 위쪽에 「곱셈으로 줄고, 덧셈으로 는다 — 네이피어의 로그」라는 표제가 있고 그 아래에 밑이 아니라 두 점의 움직임으로 정의했다고 적혀 있다. 가운데에는 가로줄이 둘 있다. 위쪽 줄은 끝이 있는 선분이고, 느려지는 점이 같은 시간마다 남은 거리가 0.7 배로 줄어드는 식으로 움직인다고 적혀 있다. 그 위에 굵은 점 일곱 개가 찍혀 있는데 왼쪽은 사이가 넓고 오른쪽으로 갈수록 촘촘해진다. 선분 오른쪽 끝에는 끝점이라고 적혀 있다. 아래쪽 줄은 오른쪽 끝에 화살표가 달린 끝없는 직선이고, 일정한 점이 같은 시간마다 같은 거리만큼 나아간다고 적혀 있다. 그 위의 굵은 점 일곱 개는 사이가 모두 같다. 같은 걸음의 두 점은 가는 파선으로 이어져 있다. 맨 왼쪽 파선은 수직이고, 가운데로 갈수록 기울었다가 오른쪽 끝에서 다시 서서 간다. 그림 아래에는 부호 설명이 있다. 굵은 점이 같은 시각의 두 위치이고 파선이 그 짝이라는 것이다. 맨 아래에는 단서가 둘 있다. 하나는 비 0.7 과 걸음 간격이 이 그림이 고른 것이고 네이피어의 값은 다르다는 것이고, 다른 하나는 그가 밑으로 정의하지 않았고 이 그림도 밑을 쓰지 않고 그렸다는 것이다">
  <title>곱셈으로 줄고, 덧셈으로 는다 — 네이피어의 로그</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .blue{fill:#3A5C77;} .ax{fill:#8A7F6E;}
    .trk{stroke:#8A7F6E;stroke-width:1.4;fill:none;}
    .tie{stroke:#8A7F6E;stroke-width:0.8;stroke-dasharray:3 3;}
  </style>
  <rect width="700" height="352" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">곱셈으로 줄고, 덧셈으로 는다 — 네이피어의 로그</text>
  <text x="46" y="52" font-size="12" class="dim">밑이 아니라 두 점의 움직임으로 정의했다.</text>
  <line x1="90.0" y1="133.0" x2="90.0" y2="228.0" class="tie"/>
  <line x1="246.0" y1="133.0" x2="160.0" y2="228.0" class="tie"/>
  <line x1="355.2" y1="133.0" x2="230.0" y2="228.0" class="tie"/>
  <line x1="431.6" y1="133.0" x2="300.0" y2="228.0" class="tie"/>
  <line x1="485.1" y1="133.0" x2="370.0" y2="228.0" class="tie"/>
  <line x1="522.6" y1="133.0" x2="440.0" y2="228.0" class="tie"/>
  <line x1="548.8" y1="133.0" x2="510.0" y2="228.0" class="tie"/>
  <text x="90" y="104" font-size="12" class="sien">느려지는 점 — 같은 시간마다 남은 거리가 0.7 배로 줄어든다</text>
  <line x1="90.0" y1="126.0" x2="610.0" y2="126.0" class="trk"/>
  <line x1="610.0" y1="120.0" x2="610.0" y2="132.0" stroke="#8A7F6E" stroke-width="1.4"/>
  <circle cx="90.0" cy="126.0" r="4" fill="#9C5A2C"/>
  <circle cx="246.0" cy="126.0" r="4" fill="#9C5A2C"/>
  <circle cx="355.2" cy="126.0" r="4" fill="#9C5A2C"/>
  <circle cx="431.6" cy="126.0" r="4" fill="#9C5A2C"/>
  <circle cx="485.1" cy="126.0" r="4" fill="#9C5A2C"/>
  <circle cx="522.6" cy="126.0" r="4" fill="#9C5A2C"/>
  <circle cx="548.8" cy="126.0" r="4" fill="#9C5A2C"/>
  <text x="616" y="130" font-size="12" class="ax">끝점</text>
  <line x1="90.0" y1="235.0" x2="650" y2="235.0" class="trk"/>
  <polygon points="656,235.0 644,230.5 644,239.5" fill="#8A7F6E"/>
  <circle cx="90.0" cy="235.0" r="4" fill="#3A5C77"/>
  <circle cx="160.0" cy="235.0" r="4" fill="#3A5C77"/>
  <circle cx="230.0" cy="235.0" r="4" fill="#3A5C77"/>
  <circle cx="300.0" cy="235.0" r="4" fill="#3A5C77"/>
  <circle cx="370.0" cy="235.0" r="4" fill="#3A5C77"/>
  <circle cx="440.0" cy="235.0" r="4" fill="#3A5C77"/>
  <circle cx="510.0" cy="235.0" r="4" fill="#3A5C77"/>
  <text x="90" y="262" font-size="12" class="blue">일정한 점 — 같은 시간마다 같은 거리만큼 나아간다</text>
  <text x="46" y="300" font-size="13" class="dim">굵은 점이 같은 시각의 두 위치이고, 파선이 그 짝이다.</text>
  <text x="46" y="320" font-size="12" class="sien">⚠ 비 0.7 과 걸음 간격은 이 그림이 고른 것이다 — 네이피어의 값은 다르다.</text>
  <text x="46" y="336" font-size="12" class="sien">⚠ 그는 「밑」으로 정의하지 않았다 — 이 그림도 밑을 쓰지 않고 그렸다.</text>
</svg>
