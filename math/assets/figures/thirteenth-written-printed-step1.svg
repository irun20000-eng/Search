<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" role="img" aria-label="1단계, 라틴 서방의 책 세 권. 그림 위쪽에 「쓴 해와 찍힌 해 13세기의 책들」이라는 표제가 있고 그 아래에 갈색은 쓴 해, 푸른색은 처음 찍힌 해, 빈 점은 필사·수록·남은 판이며 옅은 띠는 찍히기까지 기다린 시간이라고 적혀 있다. 그 아래 제목은 1200~1880, 한 해가 0.88px 이고, 줄 아래 가로축에 1200부터 1800까지 백 년마다 눈금이 있다. 첫 줄 『산반서』 피사의 레오나르도에는 1202년 갈색 점과 1228년 빈 갈색 점이 있고 1202 · 1228 2판이라고 적혀 있으며, 옅은 띠가 오른쪽 끝 1857년 푸른 점까지 이어지고 1857 첫 인쇄라고 적혀 있다. 둘째 줄 『천구론』 사크로보스코에는 1220년 갈색 점과 1230년 빈 갈색 점에 1220(MacTutor) · 1230 무렵(위키백과)이라고 적혀 있고, 띠가 1472년 푸른 점까지 가며 1472 페라라 첫 인쇄라고 적혀 있다. 셋째 줄 『원론』 라틴어판 캄파누스에는 1260년 갈색 점에 1260 무렵(MacTutor) · 1255~59(위키백과)라고 적혀 있고, 띠가 1482년 푸른 점까지 가며 1482 라트돌트, MacTutor 본문은 1485 라고 적혀 있다. 맨 아래에 단서가 둘 있다. 첫째, 빈 점은 인쇄본이 아니거나 처음이 아닌 판이고 「무렵」·범위로만 아는 해는 대표 해 하나에 두었다. 둘째, 띠의 길이는 이 노트가 쓴 해와 처음 찍힌 해의 차로 그렸고 1482 와 1485 는 너무 가까워 한 점으로 그렸다">
  <title>쓴 해와 찍힌 해 — 13세기의 책들</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;} .blue{fill:#3A5C77;}
    .axis{stroke:#8A7F6E;stroke-width:1;} .tick{stroke:#8A7F6E;stroke-width:1;}
    .row{stroke:#C9BBA6;stroke-width:1;fill:none;}
    .wait{fill:#F4EADC;stroke:none;}
    .cd{fill:#3A5C77;} .cring{fill:#FFFDF7;stroke:#3A5C77;stroke-width:1.4;}
    .sd{fill:#9C5A2C;} .sring{fill:#FFFDF7;stroke:#9C5A2C;stroke-width:1.4;}
  </style>
  <rect width="720" height="382" fill="#FFFDF7"/>
  <text x="30" y="30" font-size="16">쓴 해와 찍힌 해 — 13세기의 책들</text>
  <text x="30" y="50" font-size="11" class="dim">갈색은 쓴 해, 푸른색은 처음 찍힌 해, 빈 점은 필사·수록·남은 판. 옅은 띠는 찍히기까지 기다린 시간이다.</text>
  <text x="30" y="74" font-size="12">1200~1880 — 한 해가 0.88px</text>

  <g transform="translate(0,0)">
  <text x="30" y="103" font-size="10" class="dim">『산반서』 — 피사의 레오나르도</text>
  <line x1="60" y1="125" x2="658" y2="125" class="row"/>
  <rect x="61.76" y="122" width="576.40" height="6" class="wait"/>
  <circle cx="61.76" cy="125" r="4.5" class="sd"/><circle cx="84.64" cy="125" r="4" class="sring"/>
  <circle cx="638.16" cy="125" r="4.5" class="cd"/>
  <text x="56" y="143" font-size="10.5" class="sien">1202 · 1228 2판</text>
  <text x="658" y="143" font-size="10.5" class="blue" text-anchor="end">1857 첫 인쇄</text>

  <text x="30" y="165" font-size="10" class="dim">『천구론』 — 사크로보스코</text>
  <line x1="60" y1="187" x2="658" y2="187" class="row"/>
  <rect x="77.6" y="184" width="221.76" height="6" class="wait"/>
  <circle cx="77.6" cy="187" r="4.5" class="sd"/><circle cx="86.4" cy="187" r="4" class="sring"/>
  <circle cx="299.36" cy="187" r="4.5" class="cd"/>
  <text x="72" y="205" font-size="10.5" class="sien">1220(MacTutor) · 1230 무렵(위키백과)</text>
  <text x="306" y="178" font-size="10.5" class="blue">1472 페라라 첫 인쇄</text>

  <text x="30" y="227" font-size="10" class="dim">『원론』 라틴어판 — 캄파누스</text>
  <line x1="60" y1="249" x2="658" y2="249" class="row"/>
  <rect x="112.8" y="246" width="195.36" height="6" class="wait"/>
  <circle cx="112.8" cy="249" r="4.5" class="sd"/>
  <circle cx="308.16" cy="249" r="4.5" class="cd"/>
  <text x="107" y="267" font-size="10.5" class="sien">1260 무렵(MacTutor) · 1255~59(위키백과)</text>
  <text x="315" y="240" font-size="10.5" class="blue">1482 라트돌트 — MacTutor 본문은 1485</text>

  </g>
  <g transform="translate(0,-180)">
  <line x1="60" y1="480" x2="658" y2="480" class="axis"/>
  <line x1="60" y1="476" x2="60" y2="484" class="tick"/><text x="60" y="497" font-size="10" class="ax" text-anchor="middle">1200</text>
  <line x1="148" y1="476" x2="148" y2="484" class="tick"/><text x="148" y="497" font-size="10" class="ax" text-anchor="middle">1300</text>
  <line x1="236" y1="476" x2="236" y2="484" class="tick"/><text x="236" y="497" font-size="10" class="ax" text-anchor="middle">1400</text>
  <line x1="324" y1="476" x2="324" y2="484" class="tick"/><text x="324" y="497" font-size="10" class="ax" text-anchor="middle">1500</text>
  <line x1="412" y1="476" x2="412" y2="484" class="tick"/><text x="412" y="497" font-size="10" class="ax" text-anchor="middle">1600</text>
  <line x1="500" y1="476" x2="500" y2="484" class="tick"/><text x="500" y="497" font-size="10" class="ax" text-anchor="middle">1700</text>
  <line x1="588" y1="476" x2="588" y2="484" class="tick"/><text x="588" y="497" font-size="10" class="ax" text-anchor="middle">1800</text>
  </g>
  <text x="30" y="350" font-size="10" class="ax">⚠ 빈 점은 인쇄본이 아니거나 처음이 아닌 판이다. 「무렵」·범위로만 아는 해는 대표 해 하나에 두었다.</text>
  <text x="30" y="366" font-size="10" class="ax">⚠ 띠의 길이는 이 노트가 쓴 해와 처음 찍힌 해의 차로 그렸다. 1482 와 1485 는 너무 가까워 한 점으로 그렸다.</text>
</svg>
