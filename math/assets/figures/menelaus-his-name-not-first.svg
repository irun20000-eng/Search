<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="그림 위쪽에 「그의 이름이 붙은 정리, 그가 처음은 아니다 메넬라오스」라는 표제가 있고 그 아래에 갈색은 메넬라오스 자신, 푸른색은 그 뒤 사람들이 한 일, 빈 점은 해가 어림이거나 출처에 해가 없는 자리라고 적혀 있다. 가로축에 0부터 1800까지 300년마다 눈금이 있다. 줄이 셋 있다. 첫 줄 『구면론』이 남은 길에는 98 로마 관측 갈색 점, 10세기 아랍 목록 빈 점(그 아래에 그리스어 원문은 없고 아랍어 번역만), 16세기 마우롤리코 빈 점, 1758 핼리 라틴어판 푸른 점이 있다. 둘째 줄 「메넬라오스의 정리」에는 맨 앞에 평면판은 그 앞에도라는 빈 점, 100 무렵 『구면론』 3권 1명제 갈색 점, 10세기 자리의 이슬람 「할선 도형」 빈 점, 1678 자리의 서양에서 체바가 다시 찾다 빈 점이 있다. 셋째 줄 쌍둥이 「체바의 정리」에는 11세기 알무타만 빈 점과 1678 체바 푸른 점이 있다. 맨 아래에 단서가 셋 있다. 첫째, 「10세기」「16세기」「11세기」는 세기만 아는 일이라 그 세기 가운데에, 「평면판은 그 앞에도」는 해가 없어 그의 앞쪽에 두었다. 둘째, 「할선 도형」 점은 해가 없어 아랍 목록과 같은 자리에 두었고 체바가 메넬라오스 정리를 다시 찾은 해는 출처에 없어 1678 에 빈 점이다. 셋째, 1758 은 위키백과 그림의 판 해이고 98 관측이 별 하나인지 둘인지는 자료가 갈린다(본문 §2)">
  <title>그의 이름이 붙은 정리, 그가 처음은 아니다 — 메넬라오스</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;} .blue{fill:#3A5C77;}
    .axis{stroke:#8A7F6E;stroke-width:1;} .tick{stroke:#8A7F6E;stroke-width:1;}
    .row{stroke:#C9BBA6;stroke-width:1;fill:none;}
    .sd{fill:#9C5A2C;} .bd{fill:#3A5C77;} .ring{fill:#FFFDF7;stroke:#5B5245;stroke-width:1.4;}
  </style>
  <rect width="720" height="500" fill="#FFFDF7"/>
  <text x="30" y="30" font-size="16">그의 이름이 붙은 정리, 그가 처음은 아니다 — 메넬라오스</text>
  <text x="30" y="50" font-size="11" class="dim">갈색은 메넬라오스 자신, 푸른색은 그 뒤 사람들이 한 일, 빈 점은 해가 어림이거나 출처에 해가 없는 자리다.</text>

  <text x="30" y="104" font-size="11">『구면론』이 남은 길</text>
  <line x1="60" y1="140" x2="650" y2="140" class="row"/>
  <circle cx="92.01" cy="140" r="5" class="sd"/><text x="92.01" y="128" font-size="10" class="sien" text-anchor="start">98 로마 관측</text>
  <circle cx="370.27" cy="140" r="5" class="ring"/><text x="370.27" y="128" font-size="10" class="blue" text-anchor="middle">10세기 아랍 목록</text>
  <text x="370.27" y="162" font-size="10" class="dim" text-anchor="middle">그리스어 원문은 없고 아랍어 번역만</text>
  <circle cx="566.23" cy="140" r="5" class="ring"/><text x="566.23" y="128" font-size="10" class="blue" text-anchor="end">16세기 마우롤리코</text>
  <circle cx="634.16" cy="140" r="5" class="bd"/><text x="634.16" y="162" font-size="10" class="blue" text-anchor="end">1758 핼리 라틴어판</text>

  <text x="30" y="214" font-size="11">「메넬라오스의 정리」</text>
  <line x1="60" y1="250" x2="650" y2="250" class="row"/>
  <circle cx="66.53" cy="250" r="5" class="ring"/><text x="66.53" y="272" font-size="10" class="dim" text-anchor="start">평면판은 그 앞에도</text>
  <circle cx="92.66" cy="250" r="5" class="sd"/><text x="92.66" y="238" font-size="10" class="sien" text-anchor="start">『구면론』 3권 1명제</text>
  <circle cx="370.27" cy="250" r="5" class="ring"/><text x="370.27" y="238" font-size="10" class="blue" text-anchor="middle">이슬람 「할선 도형」</text>
  <circle cx="608.03" cy="250" r="5" class="ring"/><text x="608.03" y="272" font-size="10" class="blue" text-anchor="end">서양에서 체바가 다시 찾다</text>

  <text x="30" y="314" font-size="11">쌍둥이 「체바의 정리」</text>
  <line x1="60" y1="350" x2="650" y2="350" class="row"/>
  <circle cx="402.93" cy="350" r="5" class="ring"/><text x="402.93" y="338" font-size="10" class="blue" text-anchor="middle">11세기 알무타만</text>
  <circle cx="608.03" cy="350" r="5" class="bd"/><text x="608.03" y="338" font-size="10" class="blue" text-anchor="end">1678 체바</text>

  <line x1="60" y1="410" x2="650" y2="410" class="axis"/>
  <line x1="60" y1="406" x2="60" y2="414" class="tick"/><text x="60" y="427" font-size="10" class="ax" text-anchor="middle">0</text>
  <line x1="157.98" y1="406" x2="157.98" y2="414" class="tick"/><text x="157.98" y="427" font-size="10" class="ax" text-anchor="middle">300</text>
  <line x1="255.96" y1="406" x2="255.96" y2="414" class="tick"/><text x="255.96" y="427" font-size="10" class="ax" text-anchor="middle">600</text>
  <line x1="353.94" y1="406" x2="353.94" y2="414" class="tick"/><text x="353.94" y="427" font-size="10" class="ax" text-anchor="middle">900</text>
  <line x1="451.92" y1="406" x2="451.92" y2="414" class="tick"/><text x="451.92" y="427" font-size="10" class="ax" text-anchor="middle">1200</text>
  <line x1="549.9" y1="406" x2="549.9" y2="414" class="tick"/><text x="549.9" y="427" font-size="10" class="ax" text-anchor="middle">1500</text>
  <line x1="647.88" y1="406" x2="647.88" y2="414" class="tick"/><text x="647.88" y="427" font-size="10" class="ax" text-anchor="middle">1800</text>

  <text x="30" y="456" font-size="10" class="ax">⚠ 「10세기」「16세기」「11세기」는 세기만 아는 일이라 그 세기 가운데에, 「평면판은 그 앞에도」는 해가 없어 그의 앞쪽에 두었다.</text>
  <text x="30" y="472" font-size="10" class="ax">⚠ 「할선 도형」 점은 해가 없어 아랍 목록과 같은 자리에 두었다. 체바가 메넬라오스 정리를 다시 찾은 해는 출처에 없어 1678 에 빈 점이다.</text>
  <text x="30" y="488" font-size="10" class="ax">⚠ 1758 은 위키백과 그림의 판 해다. 98 관측이 별 하나인지 둘인지는 자료가 갈린다(본문 §2).</text>
</svg>
