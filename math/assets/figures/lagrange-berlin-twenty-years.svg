<text class="warn" x="56" y="402">⚠ 세 칸은 노트 표의 해와 나이로 그렸다. 취임일(1766.11.6)과 파리로 옮긴 날(1787.5.18)은 라벨에만 적었다 [1].</text>
<text class="warn" x="56" y="419">⚠ 「20년」은 [4]의 말이다 — 표의 해는 1766~1787이다.</text>
<text class="warn" x="56" y="436">⚠ 1766 오일러가 베를린을 떠난 해는 [9]를, 나머지 해와 날짜는 [1]을 따랐다.</text>
<text class="warn" x="56" y="453">⚠ 출처는 노트의 [1] MacTutor, Joseph-Louis Lagrange · [4] 네이버 지식백과, 라그랑주 · [9] MacTutor, Leonhard Euler다.</text>
