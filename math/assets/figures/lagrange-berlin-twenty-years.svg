<text class="warn" x="56" y="416">⚠ 칸 끝은 노트의 날짜로 그렸고(1755.9.28 · 1766.11.6 · 1787.5.18 · 1813.4.10 [1]), 칸 밑의 해와 나이는 노트 표를 옮겼다.</text>
<text class="warn" x="56" y="433">⚠ 토리노 칸은 표를 따라 1755(포병학교 교수)부터 그렸다 — 그는 1736년 토리노에서 태어났다 [1].</text>
<text class="warn" x="56" y="450">⚠ 「20년」은 [4] 네이버 지식백과, 라그랑주의 말이다. 괄호는 그림이 취임일부터 파리로 옮긴 날까지 그렸다.</text>
<text class="warn" x="56" y="467">⚠ 갈색 점은 해만 알아 해의 가운데에 찍었다.</text>
<text class="warn" x="56" y="484">⚠ 1766 오일러가 떠난 해는 [9] MacTutor History of Mathematics, Leonhard Euler를 따랐다.</text>
<text class="warn" x="56" y="501">⚠ 나머지 해와 날짜는 [1] MacTutor History of Mathematics, Joseph-Louis Lagrange를 따랐다.</text>
