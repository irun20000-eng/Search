<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 525" width="700" height="525" role="img" aria-label="그림 위쪽에 「베를린 20년 — 라그랑주」라는 표제가 있고 그 아래에 칸은 곳(해 · 나이), 진한 칸은 베를린, 갈색 점은 그 사이의 일, 검은 점은 라그랑주가 죽은 날이라는 부호표가 있다. 가로축은 눈금 숫자가 1750부터 1810까지이고, 줄이 둘 있다. 줄 이름은 왼쪽 끝에 곳, 그 사이의 일이라고 적혀 있다. 위 줄에는 칸이 셋 이어져 있다. 1755년 9월 28일부터 1766년 11월 6일까지 토리노, 거기부터 1787년 5월 18일까지 진한 칸의 베를린, 거기부터 1813년 4월 10일까지 파리다. 각 칸 아래에 1755~1766 · 19~30, 1766~1787 · 30~51, 1787~1813 · 51~77이라고 적혀 있다. 그 아래 둘째 줄에 베를린 칸 왼쪽 끝부터 1766.11.6 수학부장, 파리 칸 왼쪽 끝부터 1787.5.18 파리로 — 계약에 강의 의무 없음이라고 적혀 있다. 베를린 칸 위에는 칸 양 끝에 걸친 괄호가 있고 그 위에 20년이라고 적혀 있다. 아래 줄에는 갈색 점이 셋 있다. 1766년 점 왼쪽 위에 1766 오일러가 떠나다, 1783년 점 아래 왼쪽에 두 줄로 1783 아내가 죽다, 깊은 우울, 1786년 점 오른쪽 위에 1786 프리드리히 2세가 죽다라고 적혀 있다. 가로축 위 1813년 자리, 파리 칸 끝 아래에 검은 점이 있고 그 왼쪽 위에 1813.4.10 라그랑주가 죽다라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 칸 끝은 노트의 날짜로 그렸고 칸 밑의 해와 나이는 노트 표를 옮겼다. 둘째, 토리노 칸은 표를 따라 1755, 포병학교 교수부터 그렸고, 그는 1736년 토리노에서 태어났다. 셋째, 20년은 4번 네이버 지식백과, 라그랑주의 말이고, 괄호는 그림이 취임일부터 파리로 옮긴 날까지 그렸다. 넷째, 갈색 점은 해만 알아 해의 가운데에 찍었다. 다섯째, 1766 오일러가 떠난 해는 9번 MacTutor History of Mathematics, Leonhard Euler를 따랐다. 여섯째, 나머지 해와 날짜는 1번 MacTutor History of Mathematics, Joseph-Louis Lagrange를 따랐다.">
<title>베를린 20년 라그랑주</title>
