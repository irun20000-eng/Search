<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 477" width="700" height="477" role="img" aria-label="그림 위쪽에 「베를린 20년 — 라그랑주」라는 표제가 있고 그 아래에 칸은 머문 곳(해 · 나이), 진한 칸은 이 절의 곳, 갈색 점은 그 사이의 일(해의 가운데), 검은 점은 죽은 날이라는 부호표가 있다. 가로축은 1750년부터 1815년까지의 해이고, 줄이 둘 있다. 줄 이름은 왼쪽 끝에 머문 곳, 그 사이의 일이라고 적혀 있다. 위 줄에는 칸이 셋 이어져 있다. 1755년부터 1766년까지 토리노, 1766년부터 1787년까지 진한 칸의 베를린, 1787년부터 1813년까지 파리다. 각 칸 아래에 1755~1766 · 19~30, 1766~1787 · 30~51, 1787~1813 · 51~77이라고 적혀 있다. 그 아래 둘째 줄에 베를린 칸 왼쪽 끝부터 1766.11.6 수학부장, 파리 칸 왼쪽 끝부터 1787.5.18 파리로 — 강의 의무 없음이라고 적혀 있다. 베를린 칸 위에는 칸 양 끝에 걸친 괄호가 있고 그 위에 20년이라고 적혀 있다. 아래 줄에는 갈색 점이 셋 있다. 1766년 점 위 오른쪽에 1766 오일러가 떠나다, 1783년 점 아래 왼쪽에 1783 아내가 죽다 — 깊은 우울, 1786년 점 위 오른쪽에 1786 프리드리히 2세가 죽다라고 적혀 있다. 가로축 위 1813년 자리에 검은 점이 있고 그 위에 1813.4.10 죽다라고 적혀 있다. 아래에 단서가 네 줄 있다. 첫째, 세 칸은 노트 표의 해와 나이로 그렸고, 취임일(1766.11.6)과 파리로 옮긴 날(1787.5.18)은 라벨에만 적었다. 둘째, 20년은 출처 4번의 말이고, 표의 해는 1766~1787이다. 셋째, 1766 오일러가 베를린을 떠난 해는 출처 9번을, 나머지 해와 날짜는 출처 1번을 따랐다. 넷째, 출처는 노트의 1번 MacTutor, Joseph-Louis Lagrange, 4번 네이버 지식백과, 라그랑주, 9번 MacTutor, Leonhard Euler다.">
<title>베를린 20년 라그랑주</title>
