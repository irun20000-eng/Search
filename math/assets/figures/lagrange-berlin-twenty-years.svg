  <text class="yr" x="335.4" y="384" text-anchor="middle">1770</text>
  <line class="axis" x1="369.2" y1="366" x2="369.2" y2="371"/>
  <line class="axis" x1="403.1" y1="366" x2="403.1" y2="371"/>
  <text class="yr" x="403.1" y="384" text-anchor="middle">1780</text>
