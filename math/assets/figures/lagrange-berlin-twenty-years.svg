  <line class="axis" x1="267.7" y1="352" x2="267.7" y2="357"/>
  <text class="yr" x="267.7" y="370" text-anchor="middle">1760</text>
  <line class="axis" x1="301.5" y1="352" x2="301.5" y2="357"/>
