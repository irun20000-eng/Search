  <line class="axis" x1="369.2" y1="352" x2="369.2" y2="357"/>
  <line class="axis" x1="403.1" y1="352" x2="403.1" y2="357"/>
  <text class="yr" x="403.1" y="370" text-anchor="middle">1780</text>
  <line class="axis" x1="436.9" y1="352" x2="436.9" y2="357"/>
