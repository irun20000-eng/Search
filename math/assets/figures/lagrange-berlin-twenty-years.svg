  <text class="yr" x="470.8" y="370" text-anchor="middle">1790</text>
  <line class="axis" x1="504.6" y1="352" x2="504.6" y2="357"/>
  <line class="axis" x1="538.5" y1="352" x2="538.5" y2="357"/>
