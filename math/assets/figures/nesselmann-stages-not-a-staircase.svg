<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 512" width="700" height="512" role="img" aria-label="그림 위쪽에 「깔끔한 계단이 아니다 — 네셀만의 세 단계를 시간 위에 얹으면」이라는 표제가 있고 그 아래에 1842년 네셀만이 나눈 세 단계를 연도 위에 놓으면 뒤에 온 사람이 더 아래 단계에 앉는다고 적혀 있다. 가운데에 가로로 연도 축이 있고 그 위로 세 칸이 층층이 놓여 있다. 가로축 눈금은 300과 600과 900과 1,200과 1,500이고, 세로로는 아래부터 1번 수사적, 2번 생략적, 3번 기호적 세 칸이 있으며 각 칸에 옅은 가로줄이 그어져 있다. 점이 셋 찍혀 있고 선으로 이어져 있다. 왼쪽 끝 3세기 자리에 디오판토스가 2번 생략적 칸에 있고, 그보다 오른쪽인 9세기 자리에 알콰리즈미가 한 칸 아래인 1번 수사적 칸에 있는데 이름이 선에 가리지 않도록 점 아래에 적혀 있다. 둘을 잇는 선은 내려가며, 내려가는 그 구간만 굵은 갈색으로 그어져 있다. 오른쪽 끝 1591년 자리에 비에트가 맨 위 3번 기호적 칸에 있고, 알콰리즈미에서 비에트로 가는 파란 선은 두 칸을 올라간다. 알콰리즈미와 비에트 사이, 1번 칸 바로 위에 이 사이가 770년이라고 적혀 있다. 맨 아래에는 단서가 넷 있다. 첫째는 세기만 아는 두 사람 가운데 디오판토스를 3세기 가운데에 놓았고 알콰리즈미는 노트가 적은 770년에서 거꾸로 잡아 1591년에서 770을 뺀 해에 놓았다는 것이고, 둘째는 이것이 한 줄기의 발전이 아니라 두 전통이 따로 자라 서로 닿지 않은 것이라는 점이고, 셋째는 세 단계 구분이 1842년에 뒤돌아보며 그은 선이지 당대 사람들의 자각이 아니라는 것이고, 넷째는 이 그림이 세 사람만 찍은 표본이며 단계가 시간 순서를 보장하지 않는다는 것을 보일 뿐 각 단계의 폭을 재지는 않는다는 것이다">
<title>깔끔한 계단이 아니다 — 네셀만의 세 단계를 시간 위에 얹으면</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .ax{font-size:10.5px;fill:#5B5245;} .nm{font-size:12px;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;fill:none;}
    .path{stroke:#3A5C77;stroke-width:2;fill:none;}
    .down{stroke:#9C5A2C;stroke-width:2.6;fill:none;}
    .dot{fill:#221E18;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="512"/>
<text class="h1" x="56" y="44">깔끔한 계단이 아니다 — 네셀만의 세 단계를 시간 위에 얹으면</text>
<text class="h2" x="56" y="66">1842년 네셀만이 나눈 세 단계를 연도 위에 놓으면 뒤에 온 사람이 더 아래 단계에 앉는다.</text>
  <line class="lane" x1="96.0" y1="122.0" x2="600.0" y2="122.0"/>
  <text class="ax" x="86.0" y="125.5" text-anchor="end">③ 기호적</text>
  <line class="lane" x1="96.0" y1="203.0" x2="600.0" y2="203.0"/>
  <text class="ax" x="86.0" y="206.5" text-anchor="end">② 생략적</text>
  <line class="lane" x1="96.0" y1="284.0" x2="600.0" y2="284.0"/>
  <text class="ax" x="86.0" y="287.5" text-anchor="end">① 수사적</text>
  <line class="axis" x1="96.0" y1="336.0" x2="600.0" y2="336.0"/>
  <line class="axis" x1="135.8" y1="336.0" x2="135.8" y2="341.0"/>
  <text class="ax" x="135.8" y="354.0" text-anchor="middle">300</text>
  <line class="axis" x1="235.3" y1="336.0" x2="235.3" y2="341.0"/>
  <text class="ax" x="235.3" y="354.0" text-anchor="middle">600</text>
  <line class="axis" x1="334.7" y1="336.0" x2="334.7" y2="341.0"/>
  <text class="ax" x="334.7" y="354.0" text-anchor="middle">900</text>
  <line class="axis" x1="434.2" y1="336.0" x2="434.2" y2="341.0"/>
  <text class="ax" x="434.2" y="354.0" text-anchor="middle">1,200</text>
  <line class="axis" x1="533.7" y1="336.0" x2="533.7" y2="341.0"/>
  <text class="ax" x="533.7" y="354.0" text-anchor="middle">1,500</text>
  <text class="ax" x="348.0" y="371.0" text-anchor="middle">연도</text>
  <polyline class="path" points="308.5,284.0 563.9,122.0"/>
  <polyline class="down" points="119.2,203.0 308.5,284.0"/>
  <circle class="dot" cx="119.2" cy="203.0" r="4"/>
  <text class="nm" x="119.2" y="189.0" text-anchor="middle">디오판토스</text>
  <text class="ax" x="119.2" y="173.0" text-anchor="middle">3세기</text>
  <circle class="dot" cx="308.5" cy="284.0" r="4"/>
  <text class="nm" x="308.5" y="308.0" text-anchor="middle">알콰리즈미</text>
  <text class="ax" x="308.5" y="325.0" text-anchor="middle">9세기</text>
  <circle class="dot" cx="563.9" cy="122.0" r="4"/>
  <text class="nm" x="563.9" y="108.0" text-anchor="middle">비에트</text>
  <text class="ax" x="563.9" y="92.0" text-anchor="middle">1591</text>
  <text class="ax" x="436.2" y="274.0" text-anchor="middle">이 사이가 770년</text>
<text class="warn" x="56" y="402.0">⚠ 세기만 아는 자리는 이렇게 놓았다 — 디오판토스는 3세기 가운데, 알콰리즈미는 노트가 적은 「770년」에서 거꾸로 잡아 1591 − 770 에.</text>
<text class="warn" x="56" y="421.0">⚠ 한 줄기의 발전이 아니다. 두 전통이 따로 자랐고 서로 닿지 않았을 뿐이다.</text>
<text class="warn" x="56" y="440.0">⚠ 세 단계 구분은 1842년에 뒤돌아보며 그은 선이지 당대 사람들의 자각이 아니다.</text>
<text class="warn" x="56" y="459.0">⚠ 세 사람만 찍은 표본이다 — 단계가 시간 순서를 보장하지 않는다는 것만 보이고, 각 단계의 폭은 재지 않는다.</text>
</svg>