<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" role="img" aria-label="그림 위쪽에 「적분을 바꾼 논문은 대학 밖에서 — 르베그」라는 표제가 있고 그 아래에 옅은 칸은 대학 밖 리세, 진한 칸은 대학 자리, 갈색 점은 쓴 것, 검은 점은 르베그가 죽은 날이라는 부호표가 있다. 가로축은 1895년부터 1945년까지 다섯 해마다 눈금이 있고 열 해마다 숫자가 적혀 있다. 줄이 둘 있고 줄 이름은 왼쪽 끝에 쓴 것, 자리라고 적혀 있다. 쓴 것 줄에는 갈색 점이 셋 있다. 1901년 4월 29일 점 왼쪽 위에 두 줄로 1901.4.29 콩트 랑뒤, 새 적분, 1902년 점 오른쪽 아래에 두 줄로 1902 학위논문 적분 · 길이 · 넓이, 1922년 점 오른쪽 아래에 1922 Notice, 90편 가까운 저작이라고 적혀 있다. 1901년 4월 29일 점에서 점선이 아래로 내려와 자리 줄의 옅은 칸에 닿는다. 자리 줄에는 칸이 다섯 이어져 있다. 1899년부터 1902년까지 옅은 칸이 있고 그 아래 왼쪽에 낭시 리세라고 적혀 있다. 이어서 진한 칸이 1902년부터 1906년까지 렌, 1906년부터 1910년까지 푸아티에, 1910년부터 1921년까지 소르본, 1921년부터 1941년 7월 26일까지 콜레주 드 프랑스이고, 각 칸 아래에 이름이 적혀 있다. 가로축 위 1941년 7월 26일 자리에 검은 점이 있고 그 왼쪽 위에 1941.7.26 르베그가 죽다라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 칸 끝은 해만 알아 해의 첫머리에, 갈색 점은 해의 가운데에 놓았고 1901.4.29, 1941.7.26 은 날짜 자리다. 둘째, 1918 소르본 안의 승진과, 1927~1937 다른 두 학교 겸임은 칸으로 그리지 않았다. 셋째, 쓴 것은 셋만 골랐고 1904, 1906 강의 7번을 비롯해 1922 까지 90편 가까이 썼다. 넷째, 1899 앞 자리 줄이 빈 것은 고등사범과 그 도서관에서 공부한 시기다. 다섯째, 국내 인명사전 16번은 자리의 해를 일부 다르게 적고, 그림은 5번과 8번을 따랐다. 여섯째, 해와 자리는 1번부터 10번까지 MacTutor, Henri Léon Lebesgue 를 따랐다">
<title>적분을 바꾼 논문은 대학 밖에서 르베그</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .seg{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .seg2{fill:#E6CDAE;stroke:#9C5A2C;stroke-width:1;}
    .mk{fill:#9C5A2C;} .bl{fill:#3A5C77;} .pt{fill:#221E18;}
    .dash{stroke:#5B5245;stroke-width:1;stroke-dasharray:3 3;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="500"/>
<text class="h1" x="56" y="44" text-anchor="start">적분을 바꾼 논문은 대학 밖에서 — 르베그</text>
<text class="h2" x="56" y="66" text-anchor="start">옅은 칸 = 대학 밖(리세) · 진한 칸 = 대학 자리 · 갈색 점 = 쓴 것 · 검은 점 = 르베그가 죽은 날</text>
<line class="lane" x1="200" y1="160" x2="640" y2="160"/>
<text class="grp" x="56" y="164" text-anchor="start">쓴 것</text>
<line class="lane" x1="200" y1="250" x2="640" y2="250"/>
<text class="grp" x="56" y="254" text-anchor="start">자리</text>
<circle class="mk" cx="255.6" cy="160" r="3.5"/>
<text class="ev" x="251.6" y="131" text-anchor="end">1901.4.29 『콩트 랑뒤』</text>
<text class="ev" x="251.6" y="148" text-anchor="end">새 적분 [3]</text>
<line class="dash" x1="255.6" y1="165" x2="255.6" y2="240"/>
<circle class="mk" cx="266.0" cy="160" r="3.5"/>
<text class="ev" x="272.0" y="182" text-anchor="start">1902 학위논문</text>
<text class="ev" x="272.0" y="199" text-anchor="start">『적분 · 길이 · 넓이』 [4]</text>
<circle class="mk" cx="442.0" cy="160" r="3.5"/>
<text class="ev" x="446.0" y="182" text-anchor="start">1922 『Notice』 — 90편 가까운 저작 [10]</text>
<rect class="seg" x="235.2" y="241" width="26.4" height="18"/>
<rect class="seg2" x="261.6" y="241" width="35.2" height="18"/>
<rect class="seg2" x="296.8" y="241" width="35.2" height="18"/>
<rect class="seg2" x="332.0" y="241" width="96.8" height="18"/>
<rect class="seg2" x="428.8" y="241" width="181.0" height="18"/>
<text class="ev" x="261.6" y="276" text-anchor="end">낭시 리세 [3]</text>
<text class="ev" x="279.2" y="293" text-anchor="middle">렌 [5]</text>
<text class="ev" x="314.4" y="276" text-anchor="middle">푸아티에 [8]</text>
<text class="ev" x="380.4" y="293" text-anchor="middle">소르본 [8]</text>
<text class="ev" x="519.3" y="276" text-anchor="middle">콜레주 드 프랑스 [8]</text>
<circle class="pt" cx="609.8" cy="350" r="4"/>
<text class="ev" x="603.8" y="338" text-anchor="end">1941.7.26 르베그가 죽다 [1]</text>
<line class="axis" x1="200" y1="350" x2="640" y2="350"/>
<line class="axis" x1="200.0" y1="350" x2="200.0" y2="355"/>
<text class="yr" x="200.0" y="368" text-anchor="middle">1895</text>
<line class="axis" x1="244.0" y1="350" x2="244.0" y2="355"/>
<line class="axis" x1="288.0" y1="350" x2="288.0" y2="355"/>
<text class="yr" x="288.0" y="368" text-anchor="middle">1905</text>
<line class="axis" x1="332.0" y1="350" x2="332.0" y2="355"/>
<line class="axis" x1="376.0" y1="350" x2="376.0" y2="355"/>
<text class="yr" x="376.0" y="368" text-anchor="middle">1915</text>
<line class="axis" x1="420.0" y1="350" x2="420.0" y2="355"/>
<line class="axis" x1="464.0" y1="350" x2="464.0" y2="355"/>
<text class="yr" x="464.0" y="368" text-anchor="middle">1925</text>
<line class="axis" x1="508.0" y1="350" x2="508.0" y2="355"/>
<line class="axis" x1="552.0" y1="350" x2="552.0" y2="355"/>
<text class="yr" x="552.0" y="368" text-anchor="middle">1935</text>
<line class="axis" x1="596.0" y1="350" x2="596.0" y2="355"/>
<line class="axis" x1="640.0" y1="350" x2="640.0" y2="355"/>
<text class="yr" x="640.0" y="368" text-anchor="middle">1945</text>
<text class="warn" x="56" y="396">⚠ 칸 끝은 해만 알아 해의 첫머리에, 갈색 점은 해의 가운데에 놓았다 — 1901.4.29 · 1941.7.26 은 날짜 자리다.</text>
<text class="warn" x="56" y="413">⚠ 1918 소르본 안의 승진과, 1927~1937 다른 두 학교 겸임은 칸으로 그리지 않았다 (노트 §11).</text>
<text class="warn" x="56" y="430">⚠ 쓴 것은 셋만 골랐다 — 1904 · 1906 『강의』 [7] 를 비롯해 1922 까지 90편 가까이 썼다 [10].</text>
<text class="warn" x="56" y="447">⚠ 1899 앞 자리 줄이 빈 것은 고등사범과 그 도서관에서 공부한 시기다 [2].</text>
<text class="warn" x="56" y="464">⚠ 국내 인명사전 [16] 은 자리의 해를 일부 다르게 적는다 — 그림은 [5][8] 을 따랐다.</text>
<text class="warn" x="56" y="481">⚠ 해와 자리는 [1]~[10] MacTutor, Henri Léon Lebesgue 를 따랐다.</text>
</svg>
