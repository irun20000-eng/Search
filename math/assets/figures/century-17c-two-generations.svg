<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 541" width="700" height="541" role="img" aria-label="그림 위쪽에 「한 세기 안에서 세대가 두 번 바뀐다」라는 표제가 있고 그 아래에 막대는 생몰, 세로 파선은 그 책이 나온 해, 점은 몰년 모름이라는 부호표가 있다. 가로축은 1540년부터 1740년까지의 해이고, 가로 막대가 사람마다 하나씩 태어난 해부터 죽은 해까지 뻗어 있다. 위쪽 유럽 묶음에는 위에서부터 네이피어 1550에서 1617, 데카르트 1596에서 1650, 페르마 1601에서 1665, 파스칼 1623에서 1662, 뉴턴 1643에서 1727, 라이프니츠 1646에서 1716의 막대가 있다. 아래 같은 시기 조선 묶음에는 최석정 1646에서 1715의 막대가 있고, 홍정하는 1684에 점 하나만 있으며 몰년 자리에 물음표가 있다. 그 점은 1687 세로 파선의 바로 왼쪽에 있고 선에 닿지 않는다. 라이프니츠 막대의 왼쪽 끝과 최석정 막대의 왼쪽 끝이 세로 점선으로 이어져 같은 해 출생이라고 적혀 있다. 세로 파선 둘이 모든 줄을 가로지른다. 왼쪽 1637 기하학 선에는 데카르트, 페르마, 파스칼의 막대만 걸리고 뉴턴과 라이프니츠의 막대는 아직 시작하지 않았다. 오른쪽 1687 프린키피아 선에는 유럽 여섯 가운데 뉴턴과 라이프니츠의 막대만 걸리고, 조선의 최석정 막대도 걸린다. 아래에 단서가 여섯 줄 있다. 첫째, 막대는 태어난 해부터 죽은 해까지이고 해 단위라 한 해 안의 앞뒤는 그리지 않는다. 둘째, 뉴턴의 1643은 오늘의 달력이고 당시 잉글랜드 달력으로는 1642년 12월 25일이다. 셋째, 세로 파선 둘은 기하학과 프린키피아가 나온 해이고 세대를 가르는 선은 이 그림이 고른 것이다. 넷째, 홍정하는 몰년을 출처가 적지 않아 막대가 아니라 점이다. 다섯째, 같은 축에 둔 것은 시기를 맞대려는 것뿐이고 두 전통 사이의 접촉은 이 그림이 다루지 않는다. 여섯째, 생몰은 노트 10절 표와 각 인물 노트를, 조선 두 사람은 출처 15번과 17번을 따랐다.">
<title>한 세기 안에서 세대가 두 번 바뀐다</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11px;fill:#9C5A2C;}
    .ev{font-size:11px;} .sm{font-size:10.5px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .bar{fill:#3A5C77;}
    .kbar{fill:#9C5A2C;}
    .kpt{fill:#9C5A2C;}
    .tie{stroke:#5B5245;stroke-width:1;stroke-dasharray:2 2;}
    .cut{stroke:#221E18;stroke-width:1.1;stroke-dasharray:5 4;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="541"/>
<text class="h1" x="56" y="44">한 세기 안에서 세대가 두 번 바뀐다</text>
<text class="h2" x="56" y="66">막대 = 생몰 · 세로 파선 = 그 책이 나온 해 · 점 = 몰년 모름</text>
  <text class="grp" x="56.0" y="110" text-anchor="start">유럽</text>
  <text class="grp" x="56.0" y="304" text-anchor="start">같은 시기, 조선</text>
  <text class="ev" x="112.0" y="132" text-anchor="end">네이피어</text>
  <text class="sm" x="182.0" y="132" text-anchor="end">1550–1617</text>
  <rect class="bar" x="218.0" y="122" width="154.1" height="12" rx="2"/>
  <text class="ev" x="112.0" y="160" text-anchor="end">데카르트</text>
  <text class="sm" x="182.0" y="160" text-anchor="end">1596–1650</text>
  <rect class="bar" x="323.8" y="150" width="124.2" height="12" rx="2"/>
  <text class="ev" x="112.0" y="188" text-anchor="end">페르마</text>
  <text class="sm" x="182.0" y="188" text-anchor="end">1601–1665</text>
  <rect class="bar" x="335.3" y="178" width="147.2" height="12" rx="2"/>
  <text class="ev" x="112.0" y="216" text-anchor="end">파스칼</text>
  <text class="sm" x="182.0" y="216" text-anchor="end">1623–1662</text>
  <rect class="bar" x="385.9" y="206" width="89.7" height="12" rx="2"/>
  <text class="ev" x="112.0" y="244" text-anchor="end">뉴턴</text>
  <text class="sm" x="182.0" y="244" text-anchor="end">1643–1727</text>
  <rect class="bar" x="431.9" y="234" width="193.2" height="12" rx="2"/>
  <text class="ev" x="112.0" y="272" text-anchor="end">라이프니츠</text>
  <text class="sm" x="182.0" y="272" text-anchor="end">1646–1716</text>
  <rect class="bar" x="438.8" y="262" width="161.0" height="12" rx="2"/>
  <text class="ev" x="112.0" y="328" text-anchor="end">최석정</text>
  <text class="sm" x="182.0" y="328" text-anchor="end">1646–1715</text>
  <rect class="kbar" x="438.8" y="318" width="158.7" height="12" rx="2"/>
  <text class="ev" x="112.0" y="356" text-anchor="end">홍정하</text>
  <text class="sm" x="182.0" y="356" text-anchor="end">1684–?</text>
  <circle class="kpt" cx="526.2" cy="352" r="4"/>
  <line class="tie" x1="438.8" y1="274" x2="438.8" y2="318"/>
  <text class="sm" x="443.8" y="300" text-anchor="start">같은 해 출생</text>
  <line class="cut" x1="418.1" y1="112" x2="418.1" y2="364"/>
  <text class="ev" x="418.1" y="106" text-anchor="middle">1637 『기하학』</text>
  <line class="cut" x1="533.1" y1="112" x2="533.1" y2="364"/>
  <text class="ev" x="533.1" y="106" text-anchor="middle">1687 『프린키피아』</text>
  <line class="axis" x1="195" y1="382" x2="655" y2="382"/>
  <line class="axis" x1="195.0" y1="382" x2="195.0" y2="387"/>
  <text class="yr" x="195.0" y="400" text-anchor="middle">1540</text>
  <line class="axis" x1="241.0" y1="382" x2="241.0" y2="387"/>
  <text class="yr" x="241.0" y="400" text-anchor="middle">1560</text>
  <line class="axis" x1="287.0" y1="382" x2="287.0" y2="387"/>
  <text class="yr" x="287.0" y="400" text-anchor="middle">1580</text>
  <line class="axis" x1="333.0" y1="382" x2="333.0" y2="387"/>
  <text class="yr" x="333.0" y="400" text-anchor="middle">1600</text>
  <line class="axis" x1="379.0" y1="382" x2="379.0" y2="387"/>
  <text class="yr" x="379.0" y="400" text-anchor="middle">1620</text>
  <line class="axis" x1="425.0" y1="382" x2="425.0" y2="387"/>
  <text class="yr" x="425.0" y="400" text-anchor="middle">1640</text>
  <line class="axis" x1="471.0" y1="382" x2="471.0" y2="387"/>
  <text class="yr" x="471.0" y="400" text-anchor="middle">1660</text>
  <line class="axis" x1="517.0" y1="382" x2="517.0" y2="387"/>
  <text class="yr" x="517.0" y="400" text-anchor="middle">1680</text>
  <line class="axis" x1="563.0" y1="382" x2="563.0" y2="387"/>
  <text class="yr" x="563.0" y="400" text-anchor="middle">1700</text>
  <line class="axis" x1="609.0" y1="382" x2="609.0" y2="387"/>
  <text class="yr" x="609.0" y="400" text-anchor="middle">1720</text>
  <line class="axis" x1="655.0" y1="382" x2="655.0" y2="387"/>
  <text class="yr" x="655.0" y="400" text-anchor="middle">1740</text>
<text class="warn" x="56" y="432">⚠ 막대는 태어난 해부터 죽은 해까지다. 해 단위라 한 해 안의 앞뒤는 그리지 않는다.</text>
<text class="warn" x="56" y="449">⚠ 뉴턴의 1643은 오늘의 달력이다 — 당시 잉글랜드 달력으로는 1642년 12월 25일.</text>
<text class="warn" x="56" y="466">⚠ 세로 파선 둘은 『기하학』과 『프린키피아』가 나온 해다. 세대를 가르는 선은 이 그림이 고른 것이다.</text>
<text class="warn" x="56" y="483">⚠ 홍정하는 몰년을 출처가 적지 않는다 — 그래서 막대가 아니라 점이다.</text>
<text class="warn" x="56" y="500">⚠ 같은 축에 둔 것은 시기를 맞대려는 것뿐이다. 두 전통 사이의 접촉은 이 그림이 다루지 않는다.</text>
<text class="warn" x="56" y="517">⚠ 생몰은 노트 §10 표와 각 인물 노트를, 조선 두 사람은 출처 [15]·[17]을 따랐다.</text>
</svg>
