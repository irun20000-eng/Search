<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="그림 위쪽에 「같은 돈을 두 가지 순서로 센다 — 르베그의 비유」라는 표제가 있다. 그 아래 왼쪽과 오른쪽에 같은 화폐를 두 가지로 늘어놓았다. 왼쪽에는 손에 잡히는 순서대로 라고 적혀 있고 출처 1 표시가 붙어 있다. 둥근 원 여섯이 한 줄로 놓였고 원 안의 수가 차례로 500, 100, 500, 50, 100, 50 이다. 원 아래에는 건넨 차례를 1 부터 6 까지 적었다. 그 아래에 합이 1300 이라고 적혀 있다. 오른쪽에는 같은 액면끼리 모아 라고 적혀 있고 출처 1 표시가 붙어 있다. 같은 원 여섯이 액면별로 세로 두 장씩 세 쌓기로 모였다. 500 짜리 쌓기 아래에 합 1000, 100 짜리 쌓기 아래에 합 200, 50 짜리 쌓기 아래에 합 100 이라고 적혀 있고, 그 아래에 합이 1300 이라고 적혀 있다. 양쪽의 합이 같다. 그림 아래에는 부호 설명이 있다. 왼쪽은 둥근 원이 화폐 한 장이고 원 안의 수가 액면이며 원 아래 수가 건넨 차례라는 것, 오른쪽은 같은 액면끼리 세로로 쌓았고 쌓기 아래 수가 그 쌓기의 합이라는 것이다. 맨 아래에는 단서가 있다. 액면과 개수는 이 노트가 고른 것이며 르베그의 말에는 수가 없다는 것이다">
  <title>같은 돈을 두 가지 순서로 센다 — 르베그의 비유</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
  </style>
  <rect width="700" height="360" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">같은 돈을 두 가지 순서로 센다 — 르베그의 비유</text>
  <text x="46" y="76" font-size="13" class="sien">손에 잡히는 순서대로 [1]</text>
  <circle cx="70" cy="130" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="70" y="135" font-size="12" text-anchor="middle">500</text><text x="70" y="176" font-size="11" text-anchor="middle" class="ax">1</text><circle cx="116" cy="130" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="116" y="135" font-size="12" text-anchor="middle">100</text><text x="116" y="176" font-size="11" text-anchor="middle" class="ax">2</text><circle cx="162" cy="130" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="162" y="135" font-size="12" text-anchor="middle">500</text><text x="162" y="176" font-size="11" text-anchor="middle" class="ax">3</text><circle cx="208" cy="130" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="208" y="135" font-size="12" text-anchor="middle">50</text><text x="208" y="176" font-size="11" text-anchor="middle" class="ax">4</text><circle cx="254" cy="130" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="254" y="135" font-size="12" text-anchor="middle">100</text><text x="254" y="176" font-size="11" text-anchor="middle" class="ax">5</text><circle cx="300" cy="130" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="300" y="135" font-size="12" text-anchor="middle">50</text><text x="300" y="176" font-size="11" text-anchor="middle" class="ax">6</text>
  <text x="46" y="230" font-size="13" class="blue">합 1300</text>
  <text x="392" y="76" font-size="13" class="sien">같은 액면끼리 모아 [1]</text>
  <circle cx="440" cy="112" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="440" y="117" font-size="12" text-anchor="middle">500</text><circle cx="440" cy="154" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="440" y="159" font-size="12" text-anchor="middle">500</text><text x="440" y="196" font-size="11" text-anchor="middle" class="ax">합 1000</text><circle cx="530" cy="112" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="530" y="117" font-size="12" text-anchor="middle">100</text><circle cx="530" cy="154" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="530" y="159" font-size="12" text-anchor="middle">100</text><text x="530" y="196" font-size="11" text-anchor="middle" class="ax">합 200</text><circle cx="620" cy="112" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="620" y="117" font-size="12" text-anchor="middle">50</text><circle cx="620" cy="154" r="19" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1.3"/><text x="620" y="159" font-size="12" text-anchor="middle">50</text><text x="620" y="196" font-size="11" text-anchor="middle" class="ax">합 100</text>
  <text x="392" y="230" font-size="13" class="blue">합 1300</text>
  <text x="46" y="292" font-size="13" class="dim">왼쪽 — 둥근 원이 화폐 한 장, 원 안의 수가 액면, 원 아래 수가 건넨 차례다.</text>
  <text x="46" y="314" font-size="13" class="dim">오른쪽 — 같은 액면끼리 세로로 쌓았고, 쌓기 아래 수가 그 쌓기의 합이다.</text>
  <text x="46" y="340" font-size="13" class="sien">⚠ 액면과 개수는 이 노트가 고른 것이다 — 르베그의 말에는 수가 없다.</text>
</svg>
