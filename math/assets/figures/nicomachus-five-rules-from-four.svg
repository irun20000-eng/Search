<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="그림 위쪽에 「네 개에서 세운 다섯 규칙 니코마코스」라는 표제가 있고 그 아래 두 줄에 6 · 28 · 496 · 8128 넷만 알던 100년 무렵의 다섯 주장이 어떻게 됐나, 갈색 점은 그의 주장, 푸른 점은 틀렸거나 일부가 증명된 때, 빈 점은 해가 「무렵」이거나 알려지지 않은 채 묻힌 기록이라고 적혀 있다. 가로축은 0 부터 1800 까지 300 년마다 눈금이 있고, 다섯 줄 모두 100 자리에 갈색 점이 있다. 첫 줄 (1) n번째는 n자리에는 1220 과 1458 자리에 빈 점, 1536 자리에 푸른 점이 있고 위에 1200년대 이븐 팔루스 표 · 1456~61 사본, 아래에 1536 레기우스, 다섯째는 8자리라고 적혀 있다. 둘째 줄 (2) 모두 짝수에는 갈색 점에서 오른쪽 끝까지 갈색 점선이 이어지고 아직 열려 있음이라고 적혀 있다. 셋째 줄 (3) 끝자리 6·8 번갈아에는 1220 과 1555 와 1603 자리에 빈 점, 1588 자리에 푸른 점이 있고 위에 여섯째도 6으로 끝남, 1588 · 1603 카탈디, 아래에 1555 쇼이블이라고 적혀 있다. 넷째 줄 (4) 모두 2ᵏ⁻¹(2ᵏ−1) 꼴에는 1000 자리에 빈 점과 1000 무렵 이븐 알하이삼 (조건부), 1750 자리에 빈 점과 18세기 오일러 (짝수만)가 있고 아래에 홀수 완전수는 열려 있음이라고 적혀 있다. 다섯째 줄 (5) 무한히 많다에는 갈색 점선이 끝까지 이어지고 아직 열려 있음이라고 적혀 있다. 맨 아래에 단서가 넷 있다. 첫째, 다섯 주장의 번호와 목록은 MacTutor 「완전수」를 따랐고 국내 수학콘서트는 (1) · (3) · (2) 셋을, 수학백과는 (1)(구간 표현) · (3) 을 든다. 둘째, 여섯째 완전수는 위키백과가 1588 카탈디, MacTutor 가 1603 카탈디로 적고 MacTutor 는 1555 쇼이블과 1460 직후 사본도 든다. 셋째, 이븐 팔루스의 표에는 다섯째 · 여섯째가 모두 있고 생몰은 1194~1239(MacTutor) · 1194~1252(위키백과)라 1220 에 두었다. 넷째, (2) · (5) 와 홀수 완전수는 오늘도 풀리지 않았고 18세기는 세기만 알아 1750 에 두었다">
  <title>네 개에서 세운 다섯 규칙 — 니코마코스</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .dim{fill:#5B5245;} .ax{fill:#8A7F6E;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;}
    .row{stroke:#C9BBA6;stroke-width:1;} .axis{stroke:#8A7F6E;stroke-width:1;} .tick{stroke:#8A7F6E;stroke-width:1;}
    .sd{fill:#9C5A2C;} .bd{fill:#3A5C77;} .ring{fill:#FFFDF7;stroke:#3A5C77;stroke-width:1.4;}
    .open{stroke:#9C5A2C;stroke-width:1;stroke-dasharray:4 3;}
  </style>
  <rect width="720" height="520" fill="#FFFDF7"/>
  <text x="30" y="30" font-size="16">네 개에서 세운 다섯 규칙 — 니코마코스</text>
  <text x="30" y="50" font-size="11" class="dim">6 · 28 · 496 · 8128 넷만 알던 100년 무렵의 다섯 주장이 어떻게 됐나. 갈색 점은 그의 주장,</text>
  <text x="30" y="66" font-size="11" class="dim">푸른 점은 틀렸거나 일부가 증명된 때, 빈 점은 해가 「무렵」이거나 알려지지 않은 채 묻힌 기록이다.</text>
  <text x="30" y="124" font-size="11" class="" text-anchor="start">(1) n번째는 n자리</text><line x1="200" y1="120" x2="650" y2="120" class="row"/><circle cx="225" cy="120" r="4.5" class="sd"/><text x="30" y="184" font-size="11" class="" text-anchor="start">(2) 모두 짝수</text><text x="566" y="108" font-size="10" class="blue" text-anchor="end">1200년대 이븐 팔루스 표 · 1456~61 사본</text><text x="650" y="143" font-size="10" class="blue" text-anchor="end">1536 레기우스 — 다섯째는 8자리</text><line x1="200" y1="180" x2="650" y2="180" class="row"/><circle cx="225" cy="180" r="4.5" class="sd"/><text x="30" y="244" font-size="11" class="" text-anchor="start">(3) 끝자리 6·8 번갈아</text><line x1="200" y1="240" x2="650" y2="240" class="row"/><circle cx="225" cy="240" r="4.5" class="sd"/><text x="30" y="304" font-size="11" class="" text-anchor="start">(4) 모두 2ᵏ⁻¹(2ᵏ−1) 꼴</text><line x1="200" y1="300" x2="650" y2="300" class="row"/><circle cx="225" cy="300" r="4.5" class="sd"/><text x="30" y="364" font-size="11" class="" text-anchor="start">(5) 무한히 많다</text><line x1="200" y1="360" x2="650" y2="360" class="row"/><circle cx="225" cy="360" r="4.5" class="sd"/><circle cx="505" cy="120" r="4.5" class="ring"/><circle cx="564.5" cy="120" r="4.5" class="ring"/><circle cx="584" cy="120" r="4.5" class="bd"/><line x1="231" y1="180" x2="650" y2="180" class="open"/><text x="650" y="172" font-size="10" class="dim" text-anchor="end">아직 열려 있음</text><circle cx="505" cy="240" r="4.5" class="ring"/><circle cx="588.75" cy="240" r="4.5" class="ring"/><circle cx="597" cy="240" r="4.5" class="bd"/><circle cx="600.75" cy="240" r="4.5" class="ring"/><text x="560" y="256" font-size="10" class="blue" text-anchor="end">1555 쇼이블</text><text x="650" y="228" font-size="10" class="blue" text-anchor="end">1588 · 1603 카탈디</text><text x="545" y="228" font-size="10" class="blue" text-anchor="end">여섯째도 6으로 끝남</text><circle cx="450" cy="300" r="4.5" class="ring"/><text x="450" y="288" font-size="10" class="blue" text-anchor="middle">1000 무렵 이븐 알하이삼 (조건부)</text><circle cx="637.5" cy="300" r="4.5" class="ring"/><text x="637.5" y="288" font-size="10" class="blue" text-anchor="end">18세기 오일러 (짝수만)</text><text x="650" y="316" font-size="10" class="dim" text-anchor="end">홀수 완전수는 열려 있음</text><line x1="231" y1="360" x2="650" y2="360" class="open"/><text x="650" y="352" font-size="10" class="dim" text-anchor="end">아직 열려 있음</text>
  <line x1="200" y1="400" x2="650" y2="400" class="axis"/>
  <line x1="200" y1="396" x2="200" y2="404" class="tick"/><text x="200" y="417" font-size="10" class="ax" text-anchor="middle">0</text><line x1="275" y1="396" x2="275" y2="404" class="tick"/><text x="275" y="417" font-size="10" class="ax" text-anchor="middle">300</text><line x1="350" y1="396" x2="350" y2="404" class="tick"/><text x="350" y="417" font-size="10" class="ax" text-anchor="middle">600</text><line x1="425" y1="396" x2="425" y2="404" class="tick"/><text x="425" y="417" font-size="10" class="ax" text-anchor="middle">900</text><line x1="500" y1="396" x2="500" y2="404" class="tick"/><text x="500" y="417" font-size="10" class="ax" text-anchor="middle">1200</text><line x1="575" y1="396" x2="575" y2="404" class="tick"/><text x="575" y="417" font-size="10" class="ax" text-anchor="middle">1500</text><line x1="650" y1="396" x2="650" y2="404" class="tick"/><text x="650" y="417" font-size="10" class="ax" text-anchor="middle">1800</text>
  <text x="30" y="452" font-size="10" class="ax">⚠ 다섯 주장의 번호와 목록은 MacTutor 「완전수」를 따랐다. 국내 수학콘서트는 (1) · (3) · (2) 셋을, 수학백과는 (1)(구간 표현) · (3) 을 든다.</text>
  <text x="30" y="468" font-size="10" class="ax">⚠ 여섯째 완전수는 위키백과가 1588 카탈디, MacTutor 가 1603 카탈디로 적고, MacTutor 는 1555 쇼이블과 1460 직후 사본도 든다.</text>
  <text x="30" y="484" font-size="10" class="ax">⚠ 이븐 팔루스의 표에는 다섯째 · 여섯째가 모두 있다. 생몰은 1194~1239(MacTutor) · 1194~1252(위키백과)라 1220 에 두었다.</text>
  <text x="30" y="500" font-size="10" class="ax">⚠ (2) · (5) 와 홀수 완전수는 오늘도 풀리지 않았다. 18세기는 세기만 알아 1750 에 두었다.</text>
</svg>
