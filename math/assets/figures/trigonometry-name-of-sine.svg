<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="그림 위쪽에 「반의 현에서 sinus 까지 사인이라는 이름의 길」이라는 표제가 있고 그 아래에 갈색 칸은 산스크리트와 아랍어 쪽, 푸른 칸은 라틴어이며 칸 위 회색 글은 한 칸에서 다음 칸으로 넘어간 방식이라고, 그리고 사인(sine)은 라틴어 sinus 를 영어식으로 바꾼 말이라고 적혀 있다. 가운데에 칸 다섯이 왼쪽에서 오른쪽으로 화살표로 이어진다. jyā-ardha (산스크리트, 반의 현), jiba (아랍어, 소리만 옮김), jb (아랍 글자, 모음을 안 씀), jaib (아랍어, 뜻 있는 말), sinus (라틴어, 같은 뜻으로)이고, 칸 사이 위쪽에 소리로, 글자로, 다시 읽음, 뜻으로라고 적혀 있다. 그 아래 「jb 를 무엇으로, 누가 읽었나」에 네 줄이 있다. MacTutor 는 jaib 는 「주름」이고 뒤의 아랍 저자들이 jiba 를 그렇게 바꿔 썼다, 위키백과는 jayb 는 「가슴 · 주머니 · 주름」이고 모음 없는 jb 를 뒤 저자들이 읽은 것, 수학산책은 jaib 는 「만(灣)」이고 jb 를 본 유럽인들이 착각했다, 수학백과는 jaib 는 「작은 만」이고 그 이후의 저자들이 오역했다고 적혀 있다. 그 아래 「라틴어로 옮긴 사람」에 크레모나의 제라르도, 1150년 무렵 (수학백과)과 12세기 제라르도, 그보다 앞에 체스터의 로버트가 있었던 듯 (위키백과)이 적혀 있다. 맨 아래에 단서가 셋 있다. 첫째, jyā → jiba → jaib → sinus 의 순서는 네 자료가 같고 jb 칸은 MacTutor 에 없으며, 갈리는 것은 jaib 의 뜻과 처음 그렇게 읽은 사람(뒤의 아랍 저자인가, 유럽인인가)이다. 둘째, MacTutor 는 옮긴 사람을 「유럽 저자들」로만 적고 sinus 를 퍼뜨린 것으로 피보나치의 sinus rectus arcus 를 든다. 셋째, 해는 자료가 적은 것만 적었고 칸과 화살표는 이 노트가 그렸다">
  <title>반의 현에서 sinus 까지 — 사인이라는 이름의 길</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;} .blue{fill:#3A5C77;}
    .box{fill:#FFFDF7;stroke:#9C5A2C;stroke-width:1.2;} .boxb{fill:#FFFDF7;stroke:#3A5C77;stroke-width:1.2;}
    .arr{stroke:#5B5245;stroke-width:1;fill:none;} .row{stroke:#C9BBA6;stroke-width:1;}
  </style>
  <rect width="720" height="520" fill="#FFFDF7"/>
  <text x="30" y="30" font-size="16">반의 현에서 sinus 까지 — 사인이라는 이름의 길</text>
  <text x="30" y="50" font-size="11" class="dim">갈색 칸은 산스크리트와 아랍어 쪽, 푸른 칸은 라틴어다. 칸 위 회색 글은 한 칸에서 다음 칸으로 넘어간 방식이다.</text>
  <text x="30" y="70" font-size="11" class="dim">사인(sine)은 라틴어 sinus 를 영어식으로 바꾼 말이다.</text>
  <rect x="30" y="110" width="104" height="72" rx="2" class="box"/>
  <text x="82" y="136" font-size="15" text-anchor="middle">jyā-ardha</text>
  <text x="82" y="156" font-size="10.5" class="dim" text-anchor="middle">산스크리트</text>
  <text x="82" y="172" font-size="10.5" class="sien" text-anchor="middle">반의 현</text>
  <line x1="136" y1="146" x2="146" y2="146" class="arr"/><path d="M144,143 L150,146 L144,149" class="arr"/>
  <rect x="152" y="110" width="104" height="72" rx="2" class="box"/>
  <text x="204" y="136" font-size="15" text-anchor="middle">jiba</text>
  <text x="204" y="156" font-size="10.5" class="dim" text-anchor="middle">아랍어</text>
  <text x="204" y="172" font-size="10.5" class="sien" text-anchor="middle">소리만 옮김</text>
  <line x1="258" y1="146" x2="268" y2="146" class="arr"/><path d="M266,143 L272,146 L266,149" class="arr"/>
  <rect x="274" y="110" width="104" height="72" rx="2" class="box"/>
  <text x="326" y="136" font-size="15" text-anchor="middle">jb</text>
  <text x="326" y="156" font-size="10.5" class="dim" text-anchor="middle">아랍 글자</text>
  <text x="326" y="172" font-size="10.5" class="sien" text-anchor="middle">모음을 안 씀</text>
  <line x1="380" y1="146" x2="390" y2="146" class="arr"/><path d="M388,143 L394,146 L388,149" class="arr"/>
  <rect x="396" y="110" width="104" height="72" rx="2" class="box"/>
  <text x="448" y="136" font-size="15" text-anchor="middle">jaib</text>
  <text x="448" y="156" font-size="10.5" class="dim" text-anchor="middle">아랍어</text>
  <text x="448" y="172" font-size="10.5" class="sien" text-anchor="middle">뜻 있는 말</text>
  <line x1="502" y1="146" x2="512" y2="146" class="arr"/><path d="M510,143 L516,146 L510,149" class="arr"/>
  <rect x="518" y="110" width="104" height="72" rx="2" class="boxb"/>
  <text x="570" y="136" font-size="15" text-anchor="middle">sinus</text>
  <text x="570" y="156" font-size="10.5" class="dim" text-anchor="middle">라틴어</text>
  <text x="570" y="172" font-size="10.5" class="blue" text-anchor="middle">같은 뜻으로</text>
  <text x="143" y="100" font-size="10" class="ax" text-anchor="middle">소리로</text><text x="265" y="100" font-size="10" class="ax" text-anchor="middle">글자로</text><text x="387" y="100" font-size="10" class="ax" text-anchor="middle">다시 읽음</text><text x="509" y="100" font-size="10" class="ax" text-anchor="middle">뜻으로</text>
  <text x="30" y="232" font-size="11">jb 를 무엇으로, 누가 읽었나</text><text x="30" y="256" font-size="10.5" class="blue">MacTutor</text><text x="104" y="256" font-size="10.5">jaib 는 「주름」 — 뒤의 아랍 저자들이 jiba 를 그렇게 바꿔 썼다</text><text x="30" y="278" font-size="10.5" class="blue">위키백과</text><text x="104" y="278" font-size="10.5">jayb 는 「가슴 · 주머니 · 주름」 — 모음 없는 jb 를 뒤 저자들이 읽은 것</text><text x="30" y="300" font-size="10.5" class="blue">수학산책</text><text x="104" y="300" font-size="10.5">jaib 는 「만(灣)」 — jb 를 본 유럽인들이 착각했다</text><text x="30" y="322" font-size="10.5" class="blue">수학백과</text><text x="104" y="322" font-size="10.5">jaib 는 「작은 만」 — 그 이후의 저자들이 오역했다</text><text x="30" y="362" font-size="11">라틴어로 옮긴 사람</text>
  <text x="30" y="384" font-size="10.5">크레모나의 제라르도, 1150년 무렵 (수학백과)</text>
  <text x="30" y="402" font-size="10.5">12세기 제라르도, 그보다 앞에 체스터의 로버트가 있었던 듯 (위키백과)</text>
  <text x="30" y="440" font-size="10" class="ax">⚠ jyā → jiba → jaib → sinus 의 순서는 네 자료가 같다. jb 칸은 MacTutor 에 없다.</text>
  <text x="30" y="454" font-size="10" class="ax">   갈리는 것은 jaib 의 뜻과, 처음 그렇게 읽은 사람(뒤의 아랍 저자인가, 유럽인인가)이다.</text>
  <text x="30" y="472" font-size="10" class="ax">⚠ MacTutor 는 옮긴 사람을 「유럽 저자들」로만 적고,</text>
  <text x="30" y="486" font-size="10" class="ax">   sinus 를 퍼뜨린 것으로 피보나치의 sinus rectus arcus 를 든다.</text>
  <text x="30" y="504" font-size="10" class="ax">⚠ 해는 자료가 적은 것만 적었다. 칸과 화살표는 이 노트가 그렸다.</text>
</svg>

