<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="원기둥에 꼭 맞게 들어간 구 — 부피도 겉넓이도 원기둥의 3분의 2">
  <title>구와 원기둥 — 두 비가 똑같이 2 대 3</title>
  <rect width="600" height="250" fill="#FFFDF7"/>

  <!-- 외접 원기둥 -->
  <path d="M96 66 L96 174 M204 66 L204 174" stroke="#8A7F6E" stroke-width="1.6" fill="none"/>
  <ellipse cx="150" cy="174" rx="54" ry="15" fill="none" stroke="#8A7F6E" stroke-width="1.6"/>
  <path d="M96 66 A 54 15 0 0 0 204 66" fill="none" stroke="#8A7F6E" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M96 66 A 54 15 0 0 1 204 66" fill="none" stroke="#8A7F6E" stroke-width="1.6"/>

  <!-- 꼭 맞게 들어간 구 -->
  <circle cx="150" cy="120" r="54" fill="#9C5A2C" fill-opacity="0.13" stroke="#221E18" stroke-width="2.2"/>
  <ellipse cx="150" cy="120" rx="54" ry="15" fill="none" stroke="#221E18" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4 3"/>

  <text x="150" y="212" font-family="EB Garamond, Georgia, serif" font-size="13.5" fill="#221E18" text-anchor="middle">구가 원기둥에 꼭 맞게 들어간다</text>
  <text x="150" y="230" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#8A7F6E" text-anchor="middle">밑면 지름 = 높이 = 구의 지름</text>

  <text x="328" y="56" font-family="EB Garamond, Georgia, serif" font-size="13.5" fill="#221E18" text-anchor="end">부피</text>
  <rect x="336" y="64" width="80" height="19" fill="#9C5A2C" fill-opacity="0.28" stroke="#9C5A2C" stroke-width="1.1"/>
  <text x="328" y="78" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#8A7F6E" text-anchor="end">구</text>
  <text x="423" y="78" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#221E18">2</text>
  <rect x="336" y="88" width="120" height="19" fill="#8A7F6E" fill-opacity="0.28" stroke="#9C5A2C" stroke-width="1.1"/>
  <text x="328" y="102" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#8A7F6E" text-anchor="end">원기둥</text>
  <text x="463" y="102" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#221E18">3</text>

  <text x="328" y="140" font-family="EB Garamond, Georgia, serif" font-size="13.5" fill="#221E18" text-anchor="end">겉넓이</text>
  <rect x="336" y="148" width="80" height="19" fill="#9C5A2C" fill-opacity="0.28" stroke="#9C5A2C" stroke-width="1.1"/>
  <text x="328" y="162" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#8A7F6E" text-anchor="end">구</text>
  <text x="423" y="162" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#221E18">2</text>
  <rect x="336" y="172" width="120" height="19" fill="#8A7F6E" fill-opacity="0.28" stroke="#9C5A2C" stroke-width="1.1"/>
  <text x="328" y="186" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#8A7F6E" text-anchor="end">원기둥</text>
  <text x="463" y="186" font-family="EB Garamond, Georgia, serif" font-size="12.5" fill="#221E18">3</text>

  <text x="336" y="216" font-family="EB Garamond, Georgia, serif" font-size="13.5" fill="#9C5A2C">두 비가 똑같이 2 : 3</text>
</svg>
