<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 596" width="700" height="596" role="img" aria-label="그림 위쪽에 「확률이 길이가 되다 — 콜모고로프」라는 표제가 있고 그 아래에 위는 길이 1인 선분 위의 사건으로 든 보기, 아래는 해, 띠는 그 해, 괄호는 해의 차라는 부호표가 있다. 위 판의 제목은 확률을 길이로 읽는 보기이고, 줄이 셋 있다. 줄 이름은 왼쪽 끝에 사건, Ω, A ∪ B라고 적혀 있다. 사건 줄에는 갈색 막대 A가 선분의 0에서 0.3까지, 푸른 막대 B가 0.5에서 0.7까지 놓여 있고, 위에 각각 A 길이 0.3, B 길이 0.2라고 적혀 있다. Ω 줄에는 0에서 1까지 옅은 막대가 하나 있고, 양 끝 눈금에 0과 1이 적혀 있으며, 그 아래에 전체의 길이가 1이므로 P(Ω) = 1, 공리 2라고 적혀 있다. A ∪ B 줄에는 A와 B의 막대가 같은 자리에 다시 놓여 있고, 그 아래에 두 줄로 겹치지 않으니 길이가 더해진다, 0.3 + 0.2이므로 P(A ∪ B) = P(A) + P(B), 공리 3, 그리고 길이는 음수가 없으므로 P(A) ≥ 0, 공리 1이라고 적혀 있다. 아래 판의 제목은 도구와 쓸 곳이 만난 해이고, 가로축은 1895년부터 1940년까지다. 1901년 띠 아래에 1901 르베그 측도론, 1933년 푸른 띠 아래 오른쪽에 1933 확률론의 기초 개념, 그 아래 줄에 1931 모스크바대 교수라고 적혀 있고, 1931년 띠는 1933년 띠 바로 왼쪽에 있다. 1901년 띠 가운데에서 1933년 띠 가운데까지 괄호가 걸쳐 있고 32년이라고 적혀 있다. 아래에 단서가 다섯 줄 있다. 첫째, 위 판의 0.3과 0.2는 보기로 든 수이고 어떤 실제 사건의 확률도 아니다. 둘째, 위 판은 2번 출처의 길이나 넓이 부피 등을 계산하는 것과 같은 원리를 선분으로 옮긴 보기이고 책의 그림이 아니다. 셋째, 공리 3은 상호배반인 사건열에 대한 것이고 그림은 둘만 그렸다. 넷째, 32년은 노트가 해끼리 뺀 값이고 띠는 해만 아는 일이다. 다섯째, 공리는 노트의 출처 2번 수학백과 공리적 확률, 해는 1번 MacTutor 콜모고로프와 5번 MacTutor 르베그를 따랐다.">
<title>확률이 길이가 되다 콜모고로프</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;} .h3{font-size:13px;fill:#9C5A2C;}
    .grp{font-size:11.5px;fill:#9C5A2C;}
    .ev{font-size:11px;} .sm{font-size:10.5px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .omega{fill:#F4EADC;stroke:#8A7F6E;stroke-width:1;}
    .evA{fill:#9C5A2C;stroke:#9C5A2C;stroke-width:1;}
    .evB{fill:#3A5C77;stroke:#3A5C77;stroke-width:1;}
    .tick{stroke:#8A7F6E;stroke-width:1;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .band2{fill:#CEDCE6;stroke:#3A5C77;stroke-width:1;}
    .brk{stroke:#9C5A2C;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="596"/>
<text class="h1" x="56" y="44">확률이 길이가 되다 — 콜모고로프</text>
<text class="h2" x="56" y="66">위 = 길이 1 인 선분 위의 사건(보기) · 아래 = 해 · 띠 = 그 해 · 괄호 = 해의 차</text>
  <text class="h3" x="56.0" y="104" text-anchor="start">확률을 길이로 읽는 보기</text>
  <rect class="evA" x="150.0" y="144" width="138.0" height="12" rx="2"/>
  <text class="ev" x="219.0" y="138" text-anchor="middle">A — 길이 0.3</text>
  <rect class="evB" x="380.0" y="144" width="92.0" height="12" rx="2"/>
  <text class="ev" x="426.0" y="138" text-anchor="middle">B — 길이 0.2</text>
  <text class="grp" x="56.0" y="154" text-anchor="start">사건</text>
  <rect class="omega" x="150.0" y="190" width="460.0" height="12" rx="2"/>
  <line class="tick" x1="150.0" y1="202" x2="150.0" y2="207"/>
  <text class="yr" x="150.0" y="220" text-anchor="middle">0</text>
  <line class="tick" x1="610.0" y1="202" x2="610.0" y2="207"/>
  <text class="yr" x="610.0" y="220" text-anchor="middle">1</text>
  <text class="grp" x="56.0" y="200" text-anchor="start">Ω</text>
  <text class="ev" x="380.0" y="238" text-anchor="middle">전체의 길이가 1 → P(Ω) = 1 · 공리 2 [2]</text>
  <rect class="evA" x="150.0" y="260" width="138.0" height="12" rx="2"/>
  <rect class="evB" x="380.0" y="260" width="92.0" height="12" rx="2"/>
  <text class="grp" x="56.0" y="270" text-anchor="start">A ∪ B</text>
  <text class="ev" x="150.0" y="292" text-anchor="start">겹치지 않으니 길이가 더해진다: 0.3 + 0.2 → P(A ∪ B) = P(A) + P(B) · 공리 3 [2]</text>
  <text class="ev" x="150.0" y="310" text-anchor="start">길이는 음수가 없다 → P(A) ≥ 0 · 공리 1 [2]</text>
  <text class="h3" x="56.0" y="348" text-anchor="start">도구와 쓸 곳이 만난 해</text>
  <line class="lane" x1="210" y1="398" x2="640" y2="398"/>
  <rect class="band" x="267.3" y="392" width="9.6" height="12" rx="2"/>
  <rect class="band" x="554.0" y="392" width="9.6" height="12" rx="2"/>
  <rect class="band2" x="573.1" y="392" width="9.6" height="12" rx="2"/>
  <text class="ev" x="272.1" y="420" text-anchor="middle">1901 르베그 — 측도론 [5]</text>
  <text class="ev" x="680.0" y="420" text-anchor="end">1933 『확률론의 기초 개념』 [1]</text>
  <text class="sm" x="563.6" y="438" text-anchor="end">1931 모스크바대 교수 [1]</text>
  <path class="brk" d="M272.1,382 V376 H577.9 V382"/>
  <text class="ev" x="425.0" y="369" text-anchor="middle">32년</text>
  <line class="axis" x1="210" y1="454" x2="640" y2="454"/>
  <line class="axis" x1="257.8" y1="454" x2="257.8" y2="459"/>
  <text class="yr" x="257.8" y="472" text-anchor="middle">1900</text>
  <line class="axis" x1="353.3" y1="454" x2="353.3" y2="459"/>
  <text class="yr" x="353.3" y="472" text-anchor="middle">1910</text>
  <line class="axis" x1="448.9" y1="454" x2="448.9" y2="459"/>
  <text class="yr" x="448.9" y="472" text-anchor="middle">1920</text>
  <line class="axis" x1="544.4" y1="454" x2="544.4" y2="459"/>
  <text class="yr" x="544.4" y="472" text-anchor="middle">1930</text>
  <line class="axis" x1="640.0" y1="454" x2="640.0" y2="459"/>
  <text class="yr" x="640.0" y="472" text-anchor="middle">1940</text>
<text class="warn" x="56" y="504">⚠ 위 판의 0.3 · 0.2 는 보기로 든 수다 — 어떤 실제 사건의 확률도 아니다.</text>
<text class="warn" x="56" y="521">⚠ 위 판은 [2]의 「길이나 넓이 부피 등을 계산하는 것과 같은 원리」를 선분으로 옮긴 보기다(책의 그림이 아니다).</text>
<text class="warn" x="56" y="538">⚠ 공리 3은 상호배반인 사건열에 대한 것이다 [2] — 그림은 둘만 그렸다.</text>
<text class="warn" x="56" y="555">⚠ 「32년」은 노트가 해끼리 뺀 값이다(1933−1901). 띠는 해만 아는 일이다.</text>
<text class="warn" x="56" y="572">⚠ 공리는 노트의 출처 [2] 수학백과 공리적 확률, 해는 [1] MacTutor 콜모고로프 · [5] MacTutor 르베그를 따랐다.</text>
</svg>
