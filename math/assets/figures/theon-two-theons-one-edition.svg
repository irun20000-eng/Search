<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="그림 위쪽에 「이름이 같은 두 사람, 하나만 남은 판 알렉산드리아의 테온」이라는 표제가 있고 그 아래에 위는 두 테온이 산 때(해에 비례), 아래는 『원론』 그리스어 본이 이어진 순서(해에 비례하지 않음)이며 갈색은 알렉산드리아의 테온, 푸른색은 다른 사람의 일, 빈 점은 자료마다 해가 다른 자리라고 적혀 있다. 위쪽에는 100부터 400까지 백 년마다 눈금이 있는 가로축이 있다. 스미르나의 테온 줄에는 135 무렵 흉상이라는 푸른 점이 있다. 알렉산드리아의 테온 줄에는 335 무렵부터 405 무렵까지 옅은 갈색 띠가 있고 그 안 364 에 364 두 번의 식이라는 갈색 점, 띠 오른쪽 415 에 415 히파티아 죽음이라는 푸른 점이 있다. 아래쪽 『원론』 그리스어 본의 길에는 왼쪽부터 유클리드(원래 글) 푸른 점, 테온의 판(4세기 · 학생용) 갈색 점, Vat.gr.190(10세기에 옮겨 씀) 푸른 점, 바티칸에서 찾다(1808 페라르 · 또는 19세기 후반) 빈 점, 크노르 1996(「참된 본은 없을 것」) 푸른 점이 같은 간격으로 놓이고, 그 아래에 테온의 판이 표준이 되어 앞의 판은 거의 다 사라졌다라고 적혀 있다. 맨 아래에 단서가 넷 있다. 첫째, 위 띠의 335~405 는 MacTutor · 위키백과의 「무렵」이고 364 의 두 식과 372 집정관 목록이 그가 일한 해의 근거다. 둘째, 바티칸 본을 찾은 때를 위키백과는 1808 년 페라르로, MacTutor 는 19세기 후반으로 적어 빈 점으로 두었다. 셋째, 아래 줄의 간격은 순서만 보이고 스미르나의 테온은 다른 사람으로 이 서가의 2세기 노트가 다룬다. 넷째, 테온의 판에 딸 히파티아가 도왔다는 것은 MacTutor 의 「여겨진다」이다">
  <title>이름이 같은 두 사람, 하나만 남은 판 — 알렉산드리아의 테온</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;} .blue{fill:#3A5C77;}
    .axis{stroke:#8A7F6E;stroke-width:1;} .tick{stroke:#8A7F6E;stroke-width:1;}
    .row{stroke:#C9BBA6;stroke-width:1;fill:none;}
    .life{fill:#9C5A2C;opacity:0.3;}
    .sd{fill:#9C5A2C;} .bd{fill:#3A5C77;} .ring{fill:#FFFDF7;stroke:#3A5C77;stroke-width:1.4;}
  </style>
  <rect width="720" height="520" fill="#FFFDF7"/>
  <text x="30" y="30" font-size="16">이름이 같은 두 사람, 하나만 남은 판 — 알렉산드리아의 테온</text>
  <text x="30" y="50" font-size="11" class="dim">위는 두 테온이 산 때(해에 비례), 아래는 『원론』 그리스어 본이 이어진 순서(해에 비례하지 않음).</text>
  <text x="30" y="66" font-size="11" class="dim">갈색은 알렉산드리아의 테온, 푸른색은 다른 사람의 일, 빈 점은 자료마다 해가 다른 자리다.</text>

  <text x="30" y="98" font-size="11" class="blue">스미르나의 테온</text>
  <circle cx="185.38" cy="120" r="5" class="bd"/><text x="185.38" y="140" font-size="10" class="blue" text-anchor="middle">135 무렵 흉상</text>
  <text x="30" y="158" font-size="11" class="sien">알렉산드리아의 테온</text>
  <rect x="480.38" y="174" width="103.25" height="12" class="life"/>
  <text x="480.38" y="202" font-size="10" class="sien" text-anchor="start">335 무렵</text><text x="583.63" y="202" font-size="10" class="sien" text-anchor="end">405 무렵</text>
  <circle cx="523.15" cy="180" r="4.5" class="sd"/><text x="523.15" y="168" font-size="10" class="sien" text-anchor="end">364 두 번의 식</text>
  <circle cx="598.38" cy="180" r="4.5" class="bd"/><text x="668" y="168" font-size="10" class="blue" text-anchor="end">415 히파티아 죽음</text>
  <line x1="60" y1="235" x2="650" y2="235" class="axis"/>
  <line x1="133.75" y1="231" x2="133.75" y2="239" class="tick"/><text x="133.75" y="252" font-size="10" class="ax" text-anchor="middle">100</text>
  <line x1="281.25" y1="231" x2="281.25" y2="239" class="tick"/><text x="281.25" y="252" font-size="10" class="ax" text-anchor="middle">200</text>
  <line x1="428.75" y1="231" x2="428.75" y2="239" class="tick"/><text x="428.75" y="252" font-size="10" class="ax" text-anchor="middle">300</text>
  <line x1="576.25" y1="231" x2="576.25" y2="239" class="tick"/><text x="576.25" y="252" font-size="10" class="ax" text-anchor="middle">400</text>

  <text x="30" y="290" font-size="11">『원론』 그리스어 본의 길</text>
  <line x1="70" y1="330" x2="590" y2="330" class="row"/>
  <circle cx="70" cy="330" r="5" class="bd"/><text x="70" y="318" font-size="10" class="blue" text-anchor="middle">유클리드</text><text x="70" y="350" font-size="10" class="dim" text-anchor="middle">원래 글</text>
  <circle cx="200" cy="330" r="5" class="sd"/><text x="200" y="318" font-size="10" class="sien" text-anchor="middle">테온의 판</text><text x="200" y="350" font-size="10" class="dim" text-anchor="middle">4세기 · 학생용</text>
  <circle cx="330" cy="330" r="5" class="bd"/><text x="330" y="318" font-size="10" class="blue" text-anchor="middle">Vat.gr.190</text><text x="330" y="350" font-size="10" class="dim" text-anchor="middle">10세기에 옮겨 씀</text>
  <circle cx="460" cy="330" r="5" class="ring"/><text x="460" y="318" font-size="10" class="blue" text-anchor="middle">바티칸에서 찾다</text><text x="460" y="366" font-size="10" class="dim" text-anchor="middle">1808 페라르 · 또는 19세기 후반</text>
  <circle cx="590" cy="330" r="5" class="bd"/><text x="600" y="318" font-size="10" class="blue" text-anchor="end">크노르 1996</text><text x="600" y="350" font-size="10" class="dim" text-anchor="end">「참된 본은 없을 것」</text>
  <text x="200" y="396" font-size="10.5" class="sien" text-anchor="start">테온의 판이 표준이 되어 앞의 판은 거의 다 사라졌다</text>

  <text x="30" y="440" font-size="10" class="ax">⚠ 위 띠의 335~405 는 MacTutor · 위키백과의 「무렵」이다. 364 의 두 식과 372 집정관 목록이 그가 일한 해의 근거다.</text>
  <text x="30" y="456" font-size="10" class="ax">⚠ 바티칸 본을 찾은 때를 위키백과는 1808 년 페라르로, MacTutor 는 19세기 후반으로 적는다. 빈 점으로 두었다.</text>
  <text x="30" y="472" font-size="10" class="ax">⚠ 아래 줄의 간격은 순서만 보인다. 스미르나의 테온은 다른 사람이다 — 이 서가의 2세기 노트가 다룬다.</text>
  <text x="30" y="488" font-size="10" class="ax">⚠ 테온의 판에 딸 히파티아가 도왔다는 것은 MacTutor 의 「여겨진다」이다.</text>
</svg>
