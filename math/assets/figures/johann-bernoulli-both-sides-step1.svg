<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 442" width="700" height="442" role="img" aria-label="1단계, 로피탈 건. 그림 위쪽에 「한 번은 당하는 쪽으로, 한 번은 하는 쪽으로 — 요한 베르누이」라는 표제가 있고 그 아래에 띠는 그 해, 빈 띠는 책에 적힌 날짜, 파선 띠는 무렵, 화살표는 무엇이 어디로 갔나라는 부호표가 있다. 판에는 줄이 둘 있고, 줄 이름은 왼쪽 끝에 적혀 있다. 요한의 띠는 옅은 갈색, 상대의 띠는 옅은 푸른색이다. 이 단계 판의 제목은 로피탈 건, 요한이 당하는 쪽이고 가로축은 1688년부터 1700년까지다. 요한 줄의 1691년 띠 위에 1691 제네바 강의, 파리로라고 적혀 있다. 그 띠의 오른쪽 끝에서 화살표가 오른쪽 아래로 내려가 로피탈 줄의 1696년 띠에 닿고, 화살표 왼쪽 아래에 세 줄로 수업, 우크 시골집, 보수는 후했다, 그리고 바젤로 돌아간 뒤엔 편지로, 그리고 그 값은 교수 봉급의 절반이라고 적혀 있다. 1696년 띠 아래에 1696 무한소 해석, 로피탈의 이름으로, 그 아래 오른쪽에 서문엔 베르누이 씨들의 … 착상에 빚졌다, 특히 … 젊은 베르누이 씨에게라고 적혀 있다. 아래에 단서가 다섯 줄 있다. 첫째, 위와 아래는 축이 다르다. 위는 1688년부터 1700년, 아래는 1729년부터 1741년이고 눈금 간격은 같다. 둘째, 띠는 해만 아는 일이라 띠 안 어디인지는 모른다. 셋째, 수업이 언제 시작해 언제 끝났는지는 노트가 적지 않아, 위 화살표는 기간이 아니라 수업에서 책으로의 이어짐이다. 넷째, 로피탈 건은 뒤에 기록 연구가 요한의 주장을 정당화해, 같은 출처가 두 건에 다른 결론을 낸다. 다섯째, 해와 판정은 모두 노트의 출처 1번 MacTutor 요한 베르누이를 따랐다">
<title>한 번은 당하는 쪽으로 한 번은 하는 쪽으로 요한 베르누이</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C5A2C"/></marker></defs>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;} .h3{font-size:13px;fill:#9C5A2C;}
    .grp{font-size:11.5px;fill:#9C5A2C;}
    .ev{font-size:11px;} .sm{font-size:10.5px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .band2{fill:#CEDCE6;stroke:#3A5C77;stroke-width:1;}
    .hollow{fill:#FFFDF7;stroke:#9C5A2C;stroke-width:1.4;}
    .maybe{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1.2;stroke-dasharray:3 2;}
    .arr{stroke:#9C5A2C;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="442"/>
<text class="h1" x="56" y="44">한 번은 당하는 쪽으로, 한 번은 하는 쪽으로 — 요한 베르누이</text>
<text class="h2" x="56" y="66">띠 = 그 해 · 빈 띠 = 책에 적힌 날짜 · 파선 띠 = 무렵 · 화살표 = 무엇이 어디로 갔나</text>
  <text class="h3" x="56.0" y="102" text-anchor="start">로피탈 건 — 요한이 당하는 쪽</text>
  <line class="lane" x1="210" y1="142" x2="640" y2="142"/>
  <text class="grp" x="56.0" y="146" text-anchor="start">요한</text>
  <line class="lane" x1="210" y1="252" x2="640" y2="252"/>
  <text class="grp" x="56.0" y="256" text-anchor="start">로피탈</text>
  <rect class="band" x="317.5" y="136" width="35.8" height="12" rx="2"/>
  <text class="ev" x="335.4" y="130" text-anchor="middle">1691 제네바 강의, 파리로 [1]</text>
  <rect class="band2" x="496.7" y="246" width="35.8" height="12" rx="2"/>
  <text class="ev" x="514.6" y="274" text-anchor="middle">1696 『무한소 해석』 — 로피탈의 이름으로 [1]</text>
  <text class="sm" x="680.0" y="290" text-anchor="end">서문엔 「베르누이 씨들의 … 착상에 빚졌다 — 특히 … 젊은 베르누이 씨에게」 [1]</text>
  <line class="arr" x1="353.3" y1="150" x2="514.6" y2="243" marker-end="url(#ah)"/>
  <text class="sm" x="426.0" y="212" text-anchor="end">수업 — 우크 시골집, 보수는 후했다 [1]</text>
  <text class="sm" x="426.0" y="228" text-anchor="end">바젤로 돌아간 뒤엔 편지로 [1]</text>
  <text class="sm" x="426.0" y="242" text-anchor="end">그 값은 교수 봉급의 절반 [1]</text>
  <line class="axis" x1="210" y1="308" x2="640" y2="308"/>
  <line class="axis" x1="210.0" y1="308" x2="210.0" y2="313"/>
  <text class="yr" x="210.0" y="326" text-anchor="middle">1688</text>
  <line class="axis" x1="281.7" y1="308" x2="281.7" y2="313"/>
  <text class="yr" x="281.7" y="326" text-anchor="middle">1690</text>
  <line class="axis" x1="353.3" y1="308" x2="353.3" y2="313"/>
  <text class="yr" x="353.3" y="326" text-anchor="middle">1692</text>
  <line class="axis" x1="425.0" y1="308" x2="425.0" y2="313"/>
  <text class="yr" x="425.0" y="326" text-anchor="middle">1694</text>
  <line class="axis" x1="496.7" y1="308" x2="496.7" y2="313"/>
  <text class="yr" x="496.7" y="326" text-anchor="middle">1696</text>
  <line class="axis" x1="568.3" y1="308" x2="568.3" y2="313"/>
  <text class="yr" x="568.3" y="326" text-anchor="middle">1698</text>
  <line class="axis" x1="640.0" y1="308" x2="640.0" y2="313"/>
  <text class="yr" x="640.0" y="326" text-anchor="middle">1700</text>
<text class="warn" x="56" y="360">⚠ 위와 아래는 축이 다르다 — 위는 1688~1700년, 아래는 1729~1741년. 눈금 간격은 같다.</text>
<text class="warn" x="56" y="376">⚠ 띠는 해만 아는 일이다 — 띠 안 어디인지는 모른다.</text>
<text class="warn" x="56" y="392">⚠ 수업이 언제 시작해 언제 끝났는지는 노트가 적지 않는다 — 위 화살표는 기간이 아니라 「수업 → 책」의 이어짐이다.</text>
<text class="warn" x="56" y="408">⚠ 로피탈 건은 뒤에 기록 연구가 요한의 주장을 정당화했다 [1] — 같은 출처가 두 건에 다른 결론을 낸다.</text>
<text class="warn" x="56" y="424">⚠ 해와 판정은 모두 노트의 출처 [1] MacTutor 요한 베르누이를 따랐다.</text>
</svg>
