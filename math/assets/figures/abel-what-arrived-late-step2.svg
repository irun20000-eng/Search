<text class="ev" x="287.0" y="476" text-anchor="start">1841 첫 인쇄 [1][7]</text>
<text class="ev" x="395.0" y="426" text-anchor="end">1899 아벨 기금 중단 [7]</text>
<text class="ev" x="415.0" y="476" text-anchor="start">1905 금메달</text>
<text class="ev" x="415.0" y="493" text-anchor="start">구상 끝 [7]</text>
<text class="ev" x="509.0" y="425" text-anchor="start">1952 원고가</text>
<text class="ev" x="509.0" y="442" text-anchor="start">피렌체에서 [1]</text>
<text class="ev" x="605.0" y="476" text-anchor="middle">2002 아벨상 [2][7]</text>
<circle class="pt" cx="258.5" cy="540" r="4"/>
<path class="brk" d="M258.5,526 V520 H605.0 V526"/>
<text class="ev" x="431.8" y="514" text-anchor="middle">아벨상까지 173년</text>
<line class="axis" x1="200" y1="540" x2="640" y2="540"/>
<line class="axis" x1="200.0" y1="540" x2="200.0" y2="545"/>
<text class="yr" x="200.0" y="558" text-anchor="middle">1800</text>
<line class="axis" x1="240.0" y1="540" x2="240.0" y2="545"/>
<line class="axis" x1="280.0" y1="540" x2="280.0" y2="545"/>
<text class="yr" x="280.0" y="558" text-anchor="middle">1840</text>
<line class="axis" x1="320.0" y1="540" x2="320.0" y2="545"/>
<line class="axis" x1="360.0" y1="540" x2="360.0" y2="545"/>
<text class="yr" x="360.0" y="558" text-anchor="middle">1880</text>
<line class="axis" x1="400.0" y1="540" x2="400.0" y2="545"/>
<line class="axis" x1="440.0" y1="540" x2="440.0" y2="545"/>
<text class="yr" x="440.0" y="558" text-anchor="middle">1920</text>
<line class="axis" x1="480.0" y1="540" x2="480.0" y2="545"/>
<line class="axis" x1="520.0" y1="540" x2="520.0" y2="545"/>
<text class="yr" x="520.0" y="558" text-anchor="middle">1960</text>
<line class="axis" x1="560.0" y1="540" x2="560.0" y2="545"/>
<line class="axis" x1="600.0" y1="540" x2="600.0" y2="545"/>
<text class="yr" x="600.0" y="558" text-anchor="middle">2000</text>
<line class="axis" x1="640.0" y1="540" x2="640.0" y2="545"/>
</g>
<text class="warn" x="56" y="348">⚠ 위 칸과 아래 칸은 눈금이 다르다 — 위는 일곱 해, 아래는 두 세기 남짓을 같은 폭에 담았다.</text>
<text class="warn" x="56" y="364">⚠ 파리 논문을 다시 찾은 해는 1829 와 1830 으로 자료가 갈려 그리지 않았다 (노트 §8).</text>
<text class="warn" x="56" y="380">⚠ 「173년」은 그림이 잰 해의 차다.</text>
<text class="warn" x="56" y="396">⚠ 해와 날짜는 [1] MacTutor, Niels Henrik Abel 과 [5]~[7] The Abel Prize, The Biography of Niels Henrik Abel 을 따랐다.</text>
<text class="warn" x="56" y="412">⚠ 생몰은 [8] The Abel Prize, About Niels Henrik Abel 도 받친다.</text>
<text class="warn" x="56" y="428">⚠ 2002 는 [2] 네이버 지식백과(과학인물백과, 송성수), 닐스 헨리크 아벨과 [7] 을 따랐다.</text>
