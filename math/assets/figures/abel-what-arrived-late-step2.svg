<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 446" width="700" height="446" role="img" aria-label="2단계, 그 뒤 두 세기. 그림 위쪽에 「늦게 도착한 것들 — 아벨」이라는 표제가 있고 그 아래에 갈색 점은 그가 보낸 것, 푸른 점은 그에게 온 것, 검은 점은 아벨이 죽은 날, 칸은 산 해라는 부호표가 있다. 이 단계 칸에는 그 뒤, 두 세기를 한 줄에, 1800에서 2020, 눈금이 다르다라는 제목이 있고, 가로축은 스무 해마다 눈금이 있으며 1800부터 2000까지 마흔 해마다 숫자가 적혀 있다. 줄이 둘 있고 줄 이름은 산 해, 온 것이다. 산 해 줄에는 1802년부터 1829년까지 칸이 있고 그 위에 1802~1829 아벨이 산 해라고 적혀 있다. 온 것 줄에는 푸른 점이 여섯 있다. 1839년 점 왼쪽 위에 1839 전집, 파리 논문 빠짐, 1841년 점 오른쪽 아래에 1841 첫 인쇄, 1899년 점 왼쪽 위 높이 올린 자리에 1899 아벨 기금 중단, 1905년 점 오른쪽 아래에 두 줄로 1905 금메달 구상 끝, 1952년 점 오른쪽 위에 두 줄로 1952 원고가 피렌체에서, 2002년 점 아래에 2002 아벨상이라고 적혀 있다. 가로축 위 1829년 자리에 검은 점이 있고, 그 점부터 2002년 자리까지 걸친 괄호 위에 아벨상까지 173년이라고 적혀 있다. 아래에 단서가 여섯 줄 있다. 첫째, 위 칸과 아래 칸은 눈금이 다르고 위는 일곱 해, 아래는 두 세기 남짓을 같은 폭에 담았다. 둘째, 파리 논문을 다시 찾은 해는 1829와 1830으로 자료가 갈려 그리지 않았다. 셋째, 173년은 그림이 잰 해의 차다. 넷째, 해와 날짜는 1번 MacTutor, Niels Henrik Abel과 5번부터 7번까지 The Abel Prize, The Biography of Niels Henrik Abel을 따랐다. 다섯째, 생몰은 8번 The Abel Prize, About Niels Henrik Abel도 받친다. 여섯째, 2002는 2번 네이버 지식백과(과학인물백과, 송성수), 닐스 헨리크 아벨과 7번을 따랐다">
<title>늦게 도착한 것들 아벨</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;} .h3{font-size:12.5px;}
    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .seg{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .mk{fill:#9C5A2C;} .bl{fill:#3A5C77;} .pt{fill:#221E18;}
    .dash{stroke:#5B5245;stroke-width:1;stroke-dasharray:3 3;}
    .brk{stroke:#5B5245;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="446"/>
<text class="h1" x="56" y="44">늦게 도착한 것들 — 아벨</text>
<text class="h2" x="56" y="66">갈색 점 = 그가 보낸 것 · 푸른 점 = 그에게 온 것 · 검은 점 = 아벨이 죽은 날 · 칸 = 산 해</text>
<g transform="translate(0,-244)">
<text class="h3" x="56" y="344" text-anchor="start">그 뒤 — 두 세기를 한 줄에 (1800~2020, 눈금이 다르다)</text>
