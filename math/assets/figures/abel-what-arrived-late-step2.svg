<line class="lane" x1="200" y1="454" x2="640" y2="454"/>
<text class="grp" x="56" y="458">온 것</text>
<rect class="seg" x="205.2" y="385" width="53.3" height="18"/>
<text class="ev" x="205.2" y="379" text-anchor="start">1802~1829 아벨이 산 해 [1][8]</text>
<circle class="bl" cx="279.0" cy="454" r="3.5"/>
<circle class="bl" cx="283.0" cy="454" r="3.5"/>
