<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 489" width="700" height="489" role="img" aria-label="그림 위쪽에 「생전 출판 0편 — 베이즈」라는 표제가 있고 그 아래에 띠는 해, 점선 띠는 「무렵」, 점은 죽은 날, 가는 점선은 빈 칸이라는 부호표가 있다. 가로축은 1730년부터 1770년까지의 해이고, 줄이 셋 있다. 줄 이름은 왼쪽 끝에 생전에 쓴 글, 왕립학회, 그의 이름으로 나온 글이라고 적혀 있다. 첫째 줄에는 1736년에 띠가 있고 그 위 오른쪽에 1736 버클리에 맞선 미적분 옹호 — 익명이라고 적혀 있다. 1756년에는 점선 띠가 있고 그 아래 왼쪽에 1756 무렵 심프슨을 반박하는 편지라고 적혀 있다. 둘째 줄에는 1742년에 띠가 있고 그 위 오른쪽에 1742 회원이 되다 — 출판된 수학 저작 0편이라고 적혀 있다. 셋째 줄 바로 위에는 왼쪽 끝에서 죽은 날까지 가는 점선이 그어져 있고 그 위에 생전 — 자기 이름으로 0편이라고 적혀 있다. 셋째 줄에는 1763년과 1764년에 띠가 나란히 있고 그 아래 왼쪽에 1763 왕립학회에서 낭독 · 1764 『철학회보』라고 적혀 있다. 가로축 위 1761년 자리에 검은 점이 있고 그 위에 1761.4.17 죽다라고 적혀 있다. 아래에 단서가 네 줄 있다. 첫째, 띠는 해로만 그렸고 점은 날짜까지 그렸다. 가로축은 1730부터이고, 그는 1702년에 태어났다. 둘째, 생전 — 자기 이름으로 0편은 출처 1번의 말이다. 1736 옹호문은 나왔으나 익명이었다. 셋째, 1763 낭독과 1764 게재는 친구 리처드 프라이스가 주선했다. 넷째, 해와 날짜는 노트의 출처 1번 MacTutor History of Mathematics, Thomas Bayes, 2번 Wikipedia, Thomas Bayes를 따랐다.">
<title>생전 출판 0편 베이즈</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#5B5245;}
    .ev{font-size:11px;} .sm{font-size:11px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .pt{fill:#221E18;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .dash{fill:#F4EADC;fill-opacity:.5;stroke:#9C5A2C;stroke-width:1;stroke-dasharray:4 3;}
    .empty{stroke:#8A7F6E;stroke-width:1;stroke-dasharray:2 3;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="489"/>
<text class="h1" x="56" y="44">생전 출판 0편 — 베이즈</text>
<text class="h2" x="56" y="66">띠 = 해 · 점선 띠 = 「무렵」 · 점 = 죽은 날 · 가는 점선 = 빈 칸</text>
  <line class="lane" x1="200" y1="132" x2="640" y2="132"/>
  <text class="grp" x="56.0" y="136" text-anchor="start">생전에 쓴 글</text>
  <line class="lane" x1="200" y1="204" x2="640" y2="204"/>
  <text class="grp" x="56.0" y="208" text-anchor="start">왕립학회</text>
  <line class="lane" x1="200" y1="282" x2="640" y2="282"/>
  <text class="grp" x="56.0" y="286" text-anchor="start">그의 이름으로 나온 글</text>
  <rect class="band" x="266.0" y="126" width="11.0" height="12" rx="2"/>
  <text class="ev" x="266.0" y="118" text-anchor="start">1736 버클리에 맞선 미적분 옹호 — 익명 [1]</text>
  <rect class="dash" x="486.0" y="126" width="11.0" height="12" rx="2"/>
  <text class="ev" x="497.0" y="156" text-anchor="end">1756 무렵 심프슨을 반박하는 편지 [1]</text>
  <rect class="band" x="332.0" y="198" width="11.0" height="12" rx="2"/>
  <text class="ev" x="332.0" y="190" text-anchor="start">1742 회원이 되다 — 출판된 수학 저작 0편 [1]</text>
  <path class="empty" d="M200.0,272 H544.2"/>
  <text class="sm" x="372.1" y="266" text-anchor="middle">생전 — 자기 이름으로 0편 [1]</text>
  <rect class="band" x="563.0" y="276" width="11.0" height="12" rx="2"/>
  <rect class="band" x="574.0" y="276" width="11.0" height="12" rx="2"/>
  <text class="ev" x="585.0" y="306" text-anchor="end">1763 왕립학회에서 낭독 · 1764 『철학회보』 [1][2]</text>
  <circle class="pt" cx="544.2" cy="364" r="4"/>
  <text class="ev" x="544.2" y="352" text-anchor="middle">1761.4.17 죽다 [1]</text>
  <line class="axis" x1="200" y1="364" x2="640" y2="364"/>
  <line class="axis" x1="200.0" y1="364" x2="200.0" y2="369"/>
  <text class="yr" x="200.0" y="382" text-anchor="middle">1730</text>
  <line class="axis" x1="255.0" y1="364" x2="255.0" y2="369"/>
  <line class="axis" x1="310.0" y1="364" x2="310.0" y2="369"/>
  <text class="yr" x="310.0" y="382" text-anchor="middle">1740</text>
  <line class="axis" x1="365.0" y1="364" x2="365.0" y2="369"/>
  <line class="axis" x1="420.0" y1="364" x2="420.0" y2="369"/>
  <text class="yr" x="420.0" y="382" text-anchor="middle">1750</text>
  <line class="axis" x1="475.0" y1="364" x2="475.0" y2="369"/>
  <line class="axis" x1="530.0" y1="364" x2="530.0" y2="369"/>
  <text class="yr" x="530.0" y="382" text-anchor="middle">1760</text>
  <line class="axis" x1="585.0" y1="364" x2="585.0" y2="369"/>
  <line class="axis" x1="640.0" y1="364" x2="640.0" y2="369"/>
  <text class="yr" x="640.0" y="382" text-anchor="middle">1770</text>
<text class="warn" x="56" y="414">⚠ 띠는 해로만 그렸고, 점은 날짜까지 그렸다. 가로축은 1730부터다 — 그는 1702년에 태어났다 [1].</text>
<text class="warn" x="56" y="431">⚠ 「생전 — 자기 이름으로 0편」은 [1]의 말이다. 1736 옹호문은 나왔으나 익명이었다 [1].</text>
<text class="warn" x="56" y="448">⚠ 1763 낭독과 1764 게재는 친구 리처드 프라이스가 주선했다 [2].</text>
<text class="warn" x="56" y="465">⚠ 해와 날짜는 노트의 출처 [1] MacTutor History of Mathematics, Thomas Bayes · [2] Wikipedia, Thomas Bayes를 따랐다.</text>
</svg>
