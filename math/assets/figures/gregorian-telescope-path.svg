<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" role="img" aria-label="그림 위쪽에 「빛이 지나는 길 — 그레고리식 반사망원경」이라는 표제가 있다. 가운데를 가로지르는 가로 축이 있고 왼쪽에서 별빛이 축과 나란히 둘 들어온다. 오른쪽 끝에 큰 거울이 하나 서 있는데 왼쪽으로 오목하고 가운데가 끊겨 구멍이 나 있으며 주경이라고 적혀 있다. 들어온 두 빛줄기는 주경에 닿아 꺾여 왼쪽으로 모이고 축 위 한 점에서 만난 뒤 서로 엇갈려 계속 간다. 그 점에는 작은 점이 찍히고 가는 지시선으로 초점이라는 이름이 붙어 있다. 왼쪽에 작은 거울이 하나 있는데 오른쪽으로 오목하고 부경이라고 적혀 있다. 엇갈린 두 빛줄기는 이 부경에 닿아 다시 오른쪽으로 꺾이고, 주경 가운데 구멍을 지나 오른쪽 바깥의 접안 자리에서 다시 모인다. 주경은 오목 포물면, 부경은 오목 타원면이라고 적혀 있다. 그림 아래에는 부호 설명이 있다. 가는 선이 빛이 지나는 길이고 굵은 호 둘이 거울이며 주경 가운데 끊긴 자리가 구멍이라는 것이다. 맨 아래에는 단서가 있다. 이 그림은 노트가 적은 차례를 나타낸 모식도이며 곡률과 초점거리는 실제 값이 아니라는 것이다">
  <title>빛이 지나는 길 — 그레고리식 반사망원경</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .ray{stroke:#3A5C77;stroke-width:1.5;fill:none;}
    .mir{stroke:#9C5A2C;stroke-width:4;fill:none;stroke-linecap:round;}
    .axis{stroke:#8A7F6E;stroke-width:1;stroke-dasharray:5 4;}
  </style>
  <rect width="700" height="372" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">빛이 지나는 길 — 그레고리식 반사망원경</text>

  <line x1="50" y1="200" x2="680" y2="200" class="axis"/>

  <!-- 들어오는 빛 → 주경 -->
  <line x1="50" y1="140" x2="600" y2="140" class="ray"/>
  <line x1="50" y1="260" x2="600" y2="260" class="ray"/>
  <polygon points="150,140 138,135.5 138,144.5" fill="#3A5C77"/>
  <polygon points="150,260 138,255.5 138,264.5" fill="#3A5C77"/>
  <text x="56" y="128" font-size="12" class="dim">별빛</text>

  <!-- 주경에서 꺾여 초점으로, 엇갈려 부경으로 -->
  <line x1="600" y1="140" x2="200" y2="228.9" class="ray"/>
  <line x1="600" y1="260" x2="200" y2="171.1" class="ray"/>
  <circle cx="330" cy="200" r="3.5" fill="#9C5A2C"/>
  <line x1="333" y1="204" x2="340" y2="226" stroke="#9C5A2C" stroke-width="0.9"/>
  <text x="336" y="244" font-size="11" class="sien">초점</text>

  <!-- 부경에서 되꺾여 구멍을 지나 접안으로 -->
  <line x1="200" y1="228.9" x2="670" y2="200" class="ray"/>
  <line x1="200" y1="171.1" x2="670" y2="200" class="ray"/>
  <circle cx="670" cy="200" r="3.5" fill="#9C5A2C"/>

  <!-- 주경 — 왼쪽으로 오목, 가운데 구멍 -->
  <path d="M596,112 Q614,150 600,188" class="mir"/>
  <path d="M600,212 Q614,250 596,288" class="mir"/>
  <text x="596" y="104" font-size="13" class="sien">주경</text>
  <text x="608" y="312" font-size="12" class="ax">오목 포물면</text>
  <line x1="606" y1="200" x2="620" y2="184" stroke="#8A7F6E" stroke-width="0.9"/>
  <text x="622" y="180" font-size="11" class="dim">구멍</text>

  <!-- 부경 — 오른쪽으로 오목 -->
  <path d="M204,162 Q190,200 204,238" class="mir"/>
  <text x="168" y="154" font-size="13" class="sien">부경</text>
  <text x="140" y="292" font-size="12" class="ax">오목 타원면</text>

  <text x="644" y="228" font-size="12" class="dim">접안</text>

  <text x="46" y="348" font-size="13" class="dim">가는 선이 빛이 지나는 길, 굵은 호 둘이 거울, 주경 가운데 끊긴 자리가 구멍이다.</text>
  <text x="46" y="368" font-size="13" class="sien">⚠ 노트가 적은 차례를 나타낸 모식도다 — 곡률·초점거리는 실제 값이 아니다.</text>
</svg>
