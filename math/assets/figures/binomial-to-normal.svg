  <text x="468" y="258" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#5C5346">막대 위에 곡선이 얹힌다</text>

  <!-- 곡선 라벨 -->
  <line x1="466" y1="78" x2="466" y2="83" stroke="#221E18" stroke-width="1.2"/>
  <text x="466" y="72" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#221E18">정규곡선</text>

  <text x="310" y="278" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" fill="#8A7F6E">세로 축척은 두 그림이 각각 가장 높은 막대에 맞춘 것이라 패널끼리 높이를 견줄 수 없다</text>
  <text x="310" y="296" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12.5" fill="#221E18">세는 문제의 답이 재는 문제의 언어로 나왔다.</text>
