  <g transform="translate(296,0)">
    <text x="44" y="80" font-family="EB Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#221E18">n = 32</text>
    <g fill="#9C5A2C" fill-opacity="0.20" stroke="#9C5A2C" stroke-width="1">
      <rect x="44.60" y="211.76" width="13.86" height="2.24"/>
