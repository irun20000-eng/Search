    <rect x="144.6" y="111.6" width="18.8" height="102.4"/>
    <rect x="164.6" y="162.8" width="18.8" height="51.2"/>
    <rect x="184.6" y="199.4" width="18.8" height="14.6"/>
    <rect x="204.6" y="212.2" width="18.8" height="1.8"/>
  </g>
  <line x1="36" y1="214" x2="232" y2="214" stroke="#221E18" stroke-width="1.6"/>
  <text x="134" y="234" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-style="italic" font-size="13" fill="#5C5346">k</text>
  <text x="134" y="258" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#5C5346">막대 9개 — 아직 계단이 보인다</text>

