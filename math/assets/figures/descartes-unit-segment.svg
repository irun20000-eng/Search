<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" role="img" aria-label="그림 위쪽에 「차원의 벽과 단위 선분」이라는 표제가 있고 그 아래에 길이와 넓이는 더할 수 없었는데 길이 1을 하나 놓자 더할 수 있게 됐다고 적혀 있다. 아래에 상자가 둘 나란히 있다. 왼쪽 상자의 제목은 비에트까지이고, 한 변이 x 인 정사각형과 길이가 x 인 선분이 더하기 기호를 사이에 두고 놓여 있다. 정사각형 안에는 위에 x 제곱, 아래에 넓이라고 적혀 있고, 선분에는 위에 x, 아래에 길이라고 적혀 있다. 그 아래에 넓이 더하기 길이이므로 더할 수 없다고 적혀 있고, 그 밑에 x 제곱 더하기 x 와 가위표가 있다. 오른쪽 상자의 제목은 데카르트이고, 제목 옆에 길이가 짧은 선분 하나와 단위 1 이라는 말이 있다. 상자 안에는 같은 정사각형과, 가로가 x 이고 세로가 그 단위 1 인 직사각형이 더하기 기호를 사이에 두고 놓여 있다. 직사각형 안에는 x 곱하기 1 이라고 적혀 있고 그 아래 바깥에 넓이라고 적혀 있으며, 가로변 위에 x, 세로변 옆에 1 이 표시돼 있다. 그 아래에 넓이 더하기 넓이이므로 더할 수 있다고 적혀 있고, 그 밑에 x 제곱 더하기 x 곱하기 1 과 동그라미가 있다. 두 정사각형은 크기가 같고, 오른쪽 직사각형은 정사각형과 가로는 같으나 세로가 삼분의 일이다. 맨 아래에는 단서가 셋 있다. 첫째는 데카르트가 이런 그림을 그렸다는 것이 아니라 그가 단위 길이를 암묵적으로 두었다는 출처 1 이 붙어 있으며 이 그림은 그 조작을 옮긴 것이라는 것이고, 둘째는 차원을 올리는 쪽만 그렸으며 내리는 쪽인 x 세제곱을 1로 나누어 넓이로 낮추는 것은 그리지 않았다는 것이고, 셋째는 x 를 단위의 세 배로 그렸으며 비를 아무렇게나 잡아도 x 곱하기 1 이 넓이가 되는 것은 같다는 것이다">
  <title>차원의 벽과 단위 선분</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .pan{fill:none;stroke:#D8CDBB;stroke-width:1;}
    .sq{fill:#F4EADC;stroke:#221E18;stroke-width:1.4;}
    .rc{fill:#E6D5BD;stroke:#221E18;stroke-width:1.4;}
    .seg{stroke:#221E18;stroke-width:2.4;stroke-linecap:round;}
    .unit{stroke:#9C5A2C;stroke-width:2.4;stroke-linecap:round;}
    .edge{stroke:#9C5A2C;stroke-width:1.4;stroke-linecap:round;}
  </style>
  <rect width="700" height="404" fill="#FFFDF7"/>
  <text x="56" y="30" font-size="16">차원의 벽과 단위 선분</text>
  <text x="56" y="52" font-size="12" class="dim">길이와 넓이는 더할 수 없었다. 길이 1을 하나 놓자 더할 수 있게 됐다.</text>
  <rect x="56.0" y="72.0" width="280.0" height="250.0" rx="4" class="pan"/>
  <rect x="364.0" y="72.0" width="280.0" height="250.0" rx="4" class="pan"/>
  <text x="72.0" y="98.0" font-size="13">비에트까지</text>
  <rect x="80.0" y="112.0" width="96.0" height="96.0" class="sq"/>
  <text x="128.0" y="158.0" font-size="15" text-anchor="middle">x²</text>
  <text x="128.0" y="176.0" font-size="11" text-anchor="middle" class="ax">넓이</text>
  <text x="191.0" y="166.0" font-size="17" text-anchor="middle" class="sien">+</text>
  <line x1="206.0" y1="160.0" x2="302.0" y2="160.0" class="seg"/>
  <text x="254.0" y="148.0" font-size="15" text-anchor="middle">x</text>
  <text x="254.0" y="180.0" font-size="11" text-anchor="middle" class="ax">길이</text>
  <text x="72.0" y="250.0" font-size="12" class="dim">넓이 + 길이 — 더할 수 없다</text>
  <text x="72.0" y="288.0" font-size="17">x² + x</text>
  <text x="160.0" y="288.0" font-size="17" class="sien">✗</text>
  <text x="380.0" y="98.0" font-size="13">데카르트</text>
  <line x1="460.0" y1="94.0" x2="492.0" y2="94.0" class="unit"/>
  <text x="500.0" y="98.0" font-size="12" class="sien">단위 1</text>
  <rect x="388.0" y="112.0" width="96.0" height="96.0" class="sq"/>
  <text x="436.0" y="158.0" font-size="15" text-anchor="middle">x²</text>
  <text x="436.0" y="176.0" font-size="11" text-anchor="middle" class="ax">넓이</text>
  <text x="499.0" y="166.0" font-size="17" text-anchor="middle" class="sien">+</text>
  <rect x="514.0" y="144.0" width="96.0" height="32.0" class="rc"/>
  <text x="562.0" y="165.0" font-size="14" text-anchor="middle">x · 1</text>
  <text x="562.0" y="194.0" font-size="11" text-anchor="middle" class="ax">넓이</text>
  <line x1="514.0" y1="134.0" x2="610.0" y2="134.0" class="edge"/>
  <text x="562.0" y="128.0" font-size="12" text-anchor="middle">x</text>
  <line x1="620.0" y1="144.0" x2="620.0" y2="176.0" class="edge"/>
  <text x="626.0" y="164.0" font-size="12">1</text>
  <text x="380.0" y="250.0" font-size="12" class="dim">넓이 + 넓이 — 더할 수 있다</text>
  <text x="380.0" y="288.0" font-size="17">x² + x · 1</text>
  <text x="496.0" y="288.0" font-size="17" class="sien">○</text>
  <text x="56" y="348.0" font-size="11" class="ax">⚠ 데카르트가 이런 그림을 그렸다는 것이 아니다. 그는 단위 길이를 암묵적으로 두었고[1], 이 그림은 그 조작을 옮긴 것이다.</text>
  <text x="56" y="366.0" font-size="11" class="ax">⚠ 차원을 올리는 쪽만 그렸다. 내리는 쪽(x 세제곱을 1로 나누어 넓이로 낮추는 것)은 그리지 않았다.</text>
  <text x="56" y="384.0" font-size="11" class="ax">⚠ x 를 단위의 세 배로 그렸다. 비를 아무렇게나 잡아도 x · 1 이 넓이가 되는 것은 같다.</text>
</svg>
