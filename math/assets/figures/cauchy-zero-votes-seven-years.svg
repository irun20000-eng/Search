<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 485" width="700" height="485" role="img" aria-label="그림 위쪽에 「53표 중 0표에서 일곱 해 — 코시」라는 표제가 있고 그 아래에 빈 띠는 떨어진 자리, 갈색 띠는 얻은 자리, 푸른 띠는 쓴 것·받은 것, 괄호는 해의 차라는 부호표가 있다. 가로축은 1813년부터 1823년까지의 해이고, 줄이 둘 있다. 줄 이름은 왼쪽 끝에 자리, 쓴 것 · 받은 것이라고 적혀 있다. 위 줄 자리에는 1814년부터 1817년까지 띠 넷이 붙어 있다. 1814년 띠는 속이 비어 있고 그 위 왼쪽에 두 줄로 1814 학사원 역학 부문, 53표 중 0표라고 적혀 있다. 1815년 띠는 갈색이고 그 아래 왼쪽에 두 줄로 1815 역학 강좌는 비네에게, 대신 해석학 조교수라고 적혀 있다. 1816년 띠는 갈색이고 그 위 오른쪽에 두 줄로 1816 학사원 입성, 카르노·몽주가 실각해 쫓겨나며 생긴 자리라고 적혀 있다. 1817년 띠는 갈색이고 그 아래 오른쪽에 두 줄로 1817 콜레주 드 프랑스, 비오 대신이라고 적혀 있다. 아래 줄 쓴 것 · 받은 것에는 1816년 푸른 띠 위에 1816 과학원 대상, 파도 연구라고 적혀 있고, 1821년 푸른 띠 아래에 두 줄로 1821 해석학 강의, 극한을 앞세워 미적분을 다시 세우다라고 적혀 있다. 위 줄 위에는 1814년 띠 가운데에서 1821년 띠 가운데까지 걸친 괄호가 있고 일곱 해라고 적혀 있으며, 괄호의 오른쪽 끝에서 점선이 아래 줄의 1821년 띠까지 내려온다. 아래에 단서가 여섯 줄 있다. 첫째, 띠는 해만 아는 일이라 띠 안 어디인지는 모른다. 둘째, 앞의 두 낙선, 곧 경도국에 르장드르가 임명되고 학사원 기하 부문에 푸앵소가 임명된 일은 출처가 연도를 주지 않아 그리지 않았다. 셋째, 1815년에는 역학 강좌에서 밀린 일과 해석학 조교수가 된 일이 함께 있어 한 띠에 두 줄로 적었다. 넷째, 국내 인명사전은 1816년부터 모교 교수였다고 적고, 자리는 1번을 따랐다. 다섯째, 일곱 해는 노트가 해끼리 뺀 값이다. 여섯째, 해는 노트의 출처 1번 MacTutor 코시, 2번 인명사전, 3번 수학백과 해석학을 따랐다.">
<title>53표 중 0표에서 일곱 해 코시</title>
<style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .h1{font-size:19px;} .h2{font-size:12.5px;fill:#5B5245;}
    .grp{font-size:11.5px;fill:#9C5A2C;}
    .ev{font-size:11px;} .sm{font-size:10.5px;fill:#5B5245;} .yr{font-size:11px;fill:#5B5245;}
    .bg{fill:#FFFDF7;}
    .lane{stroke:#D8CDBB;stroke-width:1;}
    .band{fill:#F4EADC;stroke:#9C5A2C;stroke-width:1;}
    .band2{fill:#CEDCE6;stroke:#3A5C77;stroke-width:1;}
    .hollow{fill:#FFFDF7;stroke:#9C5A2C;stroke-width:1.4;}
    .guide{stroke:#8A7F6E;stroke-width:1;stroke-dasharray:2 2;}
    .brk{stroke:#9C5A2C;stroke-width:1.2;fill:none;}
    .axis{stroke:#8A7F6E;stroke-width:1;}
    .warn{font-size:10.5px;fill:#5B5245;}
  </style>
<rect class="bg" x="0" y="0" width="700" height="485"/>
<text class="h1" x="56" y="44">53표 중 0표에서 일곱 해 — 코시</text>
<text class="h2" x="56" y="66">빈 띠 = 떨어진 자리 · 갈색 띠 = 얻은 자리 · 푸른 띠 = 쓴 것·받은 것 · 괄호 = 해의 차</text>
  <line class="lane" x1="210" y1="176" x2="640" y2="176"/>
  <text class="grp" x="56.0" y="180" text-anchor="start">자리</text>
  <line class="lane" x1="210" y1="256" x2="640" y2="256"/>
  <text class="grp" x="56.0" y="260" text-anchor="start">쓴 것 · 받은 것</text>
  <rect class="hollow" x="253.0" y="170" width="43.0" height="12" rx="2"/>
  <text class="ev" x="292.0" y="146" text-anchor="end">1814 학사원 역학 부문</text>
  <text class="ev" x="292.0" y="164" text-anchor="end">53표 중 0표 [1]</text>
  <rect class="band" x="296.0" y="170" width="43.0" height="12" rx="2"/>
  <text class="ev" x="335.0" y="198" text-anchor="end">1815 역학 강좌는 비네에게 [1]</text>
  <text class="ev" x="335.0" y="216" text-anchor="end">대신 해석학 조교수 [1]</text>
  <rect class="band" x="339.0" y="170" width="43.0" height="12" rx="2"/>
  <text class="ev" x="341.0" y="146" text-anchor="start">1816 학사원 입성 [1]</text>
  <text class="sm" x="341.0" y="164" text-anchor="start">카르노·몽주가 실각해 쫓겨나며 생긴 자리 [1]</text>
  <rect class="band" x="382.0" y="170" width="43.0" height="12" rx="2"/>
  <text class="ev" x="384.0" y="198" text-anchor="start">1817 콜레주 드 프랑스</text>
  <text class="ev" x="384.0" y="216" text-anchor="start">비오 대신 [1]</text>
  <rect class="band2" x="339.0" y="250" width="43.0" height="12" rx="2"/>
  <text class="ev" x="360.5" y="244" text-anchor="middle">1816 과학원 대상 — 파도 연구 [1]</text>
  <rect class="band2" x="554.0" y="250" width="43.0" height="12" rx="2"/>
  <text class="ev" x="575.5" y="278" text-anchor="middle">1821 『해석학 강의』 [1]</text>
  <text class="sm" x="575.5" y="296" text-anchor="middle">극한을 앞세워 미적분을 다시 세우다 [1][3]</text>
  <path class="brk" d="M274.5,126 V118 H575.5 V126"/>
  <line class="guide" x1="575.5" y1="126" x2="575.5" y2="248"/>
  <text class="ev" x="425.0" y="111" text-anchor="middle">일곱 해</text>
  <line class="axis" x1="210" y1="326" x2="640" y2="326"/>
  <line class="axis" x1="210.0" y1="326" x2="210.0" y2="331"/>
  <text class="yr" x="210.0" y="344" text-anchor="middle">1813</text>
  <line class="axis" x1="253.0" y1="326" x2="253.0" y2="331"/>
  <line class="axis" x1="296.0" y1="326" x2="296.0" y2="331"/>
  <text class="yr" x="296.0" y="344" text-anchor="middle">1815</text>
  <line class="axis" x1="339.0" y1="326" x2="339.0" y2="331"/>
  <line class="axis" x1="382.0" y1="326" x2="382.0" y2="331"/>
  <text class="yr" x="382.0" y="344" text-anchor="middle">1817</text>
  <line class="axis" x1="425.0" y1="326" x2="425.0" y2="331"/>
  <line class="axis" x1="468.0" y1="326" x2="468.0" y2="331"/>
  <text class="yr" x="468.0" y="344" text-anchor="middle">1819</text>
  <line class="axis" x1="511.0" y1="326" x2="511.0" y2="331"/>
  <line class="axis" x1="554.0" y1="326" x2="554.0" y2="331"/>
  <text class="yr" x="554.0" y="344" text-anchor="middle">1821</text>
  <line class="axis" x1="597.0" y1="326" x2="597.0" y2="331"/>
  <line class="axis" x1="640.0" y1="326" x2="640.0" y2="331"/>
  <text class="yr" x="640.0" y="344" text-anchor="middle">1823</text>
<text class="warn" x="56" y="376">⚠ 띠는 해만 아는 일이다 — 띠 안 어디인지는 모른다.</text>
<text class="warn" x="56" y="393">⚠ 앞의 두 낙선(경도국 — 르장드르 임명, 학사원 기하 부문 — 푸앵소 임명)은 출처가 연도를 주지 않아 그리지 않았다 [1].</text>
<text class="warn" x="56" y="410">⚠ 1815년에는 역학 강좌에서 밀린 일과 해석학 조교수가 된 일이 함께 있어 한 띠에 두 줄로 적었다 [1].</text>
<text class="warn" x="56" y="427">⚠ 국내 인명사전은 1816년부터 모교 교수였다고 적는다 [2] — 자리는 [1]을 따랐다.</text>
<text class="warn" x="56" y="444">⚠ 「일곱 해」는 노트가 해끼리 뺀 값이다(1821−1814).</text>
<text class="warn" x="56" y="461">⚠ 해는 노트의 출처 [1] MacTutor 코시 · [2] 인명사전 · [3] 수학백과 해석학을 따랐다.</text>
</svg>
