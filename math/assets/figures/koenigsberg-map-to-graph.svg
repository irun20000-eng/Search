<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-label="왼쪽은 쾨니히스베르크의 약도다. 위와 아래에 강변 땅이 가로로 길게 있고 그 사이 강에 섬이 둘 있는데 왼쪽 섬이 더 크다. 땅과 섬을 잇는 다리가 일곱 개 그려져 있다. 위 강변과 큰 섬 사이에 둘, 아래 강변과 큰 섬 사이에 둘, 위 강변과 작은 섬 사이에 하나, 아래 강변과 작은 섬 사이에 하나, 두 섬 사이에 하나다. 오른쪽은 같은 것을 점과 선으로 바꾼 그림이다. 점이 넷이고 선이 일곱이며 배치가 왼쪽 약도와 같다. 위 점과 큰 섬 점 사이에 선이 둘이라 두 줄로 휘어 그렸고 아래도 마찬가지다. 점마다 붙은 선의 개수가 적혀 있는데 위 점 3, 왼쪽 점 5, 오른쪽 점 3, 아래 점 3 이고 넷 다 홀수라고 표시되어 있다. 그림 아래에는 버린 것과 남은 것을 적었다. 다리의 길이와 섬의 모양과 거리와 방향을 버리면 어느 땅이 어느 땅과 몇 개의 다리로 이어져 있는가만 남는다는 것, 그리고 홀수 점이 넷이라 0개도 2개도 아니므로 불가능하다는 것이다. 홀수 점이 0개나 2개여야 한다는 판정 기준은 출처 2와 7 에서 온 것이다">
  <title>버려서 얻는다 — 쾨니히스베르크의 약도와 그래프</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .land{fill:#E6D5BD;stroke:#9C5A2C;stroke-width:1.2;}
    .bridge{stroke:#9C5A2C;stroke-width:4.5;stroke-linecap:round;}
    .edge{stroke:#3A5C77;stroke-width:1.8;fill:none;}
  </style>
  <rect width="700" height="430" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">버려서 얻는다 — 같은 문제를 두 번 그린다</text>

  <!-- ══ 왼쪽: 약도 ══ -->
  <rect x="50" y="62" width="280" height="46" class="land"/>
  <rect x="50" y="292" width="280" height="46" class="land"/>
  <ellipse cx="150" cy="200" rx="55" ry="30" class="land"/>
  <ellipse cx="270" cy="200" rx="38" ry="22" class="land"/>
  <line x1="115" y1="108" x2="115" y2="178" class="bridge"/>
  <line x1="185" y1="108" x2="185" y2="178" class="bridge"/>
  <line x1="115" y1="292" x2="115" y2="222" class="bridge"/>
  <line x1="185" y1="292" x2="185" y2="222" class="bridge"/>
  <line x1="270" y1="108" x2="270" y2="178" class="bridge"/>
  <line x1="270" y1="292" x2="270" y2="222" class="bridge"/>
  <line x1="205" y1="200" x2="232" y2="200" class="bridge"/>
  <text x="58" y="90" font-size="12" class="dim">강변</text>
  <text x="58" y="320" font-size="12" class="dim">강변</text>
  <text x="128" y="205" font-size="12" class="dim">섬</text>
  <text x="258" y="205" font-size="12" class="dim">섬</text>
  <text x="50" y="364" font-size="13" class="sien">다리 일곱, 땅 넷</text>

  <!-- ══ 오른쪽: 그래프 ══ -->
  <path d="M520,110 Q466,151 445,215" class="edge"/>
  <path d="M520,110 Q499,174 445,215" class="edge"/>
  <path d="M520,320 Q499,254 445,215" class="edge"/>
  <path d="M520,320 Q466,281 445,215" class="edge"/>
  <line x1="520" y1="110" x2="595" y2="215" class="edge"/>
  <line x1="520" y1="320" x2="595" y2="215" class="edge"/>
  <line x1="445" y1="215" x2="595" y2="215" class="edge"/>
  <circle cx="520" cy="110" r="7" fill="#3A5C77"/>
  <circle cx="445" cy="215" r="7" fill="#3A5C77"/>
  <circle cx="595" cy="215" r="7" fill="#3A5C77"/>
  <circle cx="520" cy="320" r="7" fill="#3A5C77"/>
  <text x="533" y="106" font-size="13" class="blue">3 · 홀수</text>
  <text x="378" y="212" font-size="13" class="blue">5 · 홀수</text>
  <text x="608" y="212" font-size="13" class="blue">3 · 홀수</text>
  <text x="533" y="330" font-size="13" class="blue">3 · 홀수</text>
  <text x="380" y="364" font-size="13" class="blue">점 넷, 선 일곱 — 같은 문제다</text>

  <text x="46" y="396" font-size="13" class="dim">길이도 모양도 거리도 방향도 버리면, 어느 땅이 어느 땅과 몇 개의 다리로 이어져 있는가만 남는다.</text>
  <text x="46" y="418" font-size="13" class="sien">그리고 홀수 점이 넷이다 — 0개도 2개도 아니다. 그래서 불가능하다 [2][7]</text>
</svg>
