<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 434" role="img" aria-label="왼쪽은 쾨니히스베르크의 약도다. 위와 아래에 강변 땅이 가로로 길게 있고 그 사이를 옅은 청색 띠로 칠한 강이 지난다. 강 안에 섬이 둘 있는데 왼쪽 섬이 더 크다. 네 땅에 각각 A, B, C, D 라고 적혀 있다. A 는 위 강변, B 는 큰 섬, C 는 아래 강변, D 는 작은 섬이다. 땅과 땅을 잇는 갈색 막대가 일곱 개 있다. A 와 B 사이에 둘, C 와 B 사이에 둘, A 와 D 사이에 하나, C 와 D 사이에 하나, B 와 D 사이에 하나다. 막대는 서로 다른 자리에 놓여 하나씩 셀 수 있다. 오른쪽은 같은 것을 점과 선으로 바꾼 그림이다. 점이 넷이고 왼쪽 약도와 같은 자리에 A, B, C, D 로 놓였다. 점을 잇는 파란 선이 일곱이며, 선이 둘인 자리는 두 줄로 휘어 그렸다. 점 옆에 그 점에 붙은 선의 개수가 적혀 있는데 A 는 3, B 는 5, C 는 3, D 는 3 이다. 그림 아래에는 부호 설명이 있다. 왼쪽은 갈색 막대가 다리, 옅은 청색 띠가 강, 글자 A B C D 가 네 땅이라는 것이고, 오른쪽은 파란 선이 같은 다리, 점이 같은 땅, 점 옆의 수가 그 점에 붙은 선의 개수라는 것이다. 그림 맨 아래에는 단서가 있다. 다리 배치는 널리 쓰이는 그림을 따라 이 노트가 재구성한 것이며, 배치를 직접 밝히는 출처는 아직 없다는 것이다">
  <title>버려서 얻는다 — 쾨니히스베르크의 약도와 그래프</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .land{fill:#E6D5BD;stroke:#9C5A2C;stroke-width:1.2;}
    .bridge{stroke:#9C5A2C;stroke-width:4.5;stroke-linecap:round;}
    .edge{stroke:#3A5C77;stroke-width:1.8;fill:none;}
  </style>
  <rect width="700" height="434" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">버려서 얻는다 — 같은 문제를 두 번 그린다</text>

  <!-- ══ 왼쪽: 약도 ══ -->
  <rect x="50" y="108" width="280" height="184" fill="#E3EAEF"/>
  <rect x="50" y="62" width="280" height="46" class="land"/>
  <rect x="50" y="292" width="280" height="46" class="land"/>
  <ellipse cx="150" cy="200" rx="55" ry="30" class="land"/>
  <ellipse cx="270" cy="200" rx="38" ry="22" class="land"/>
  <line x1="108" y1="108" x2="108" y2="181" class="bridge"/>
  <line x1="178" y1="108" x2="178" y2="174" class="bridge"/>
  <line x1="124" y1="292" x2="124" y2="226" class="bridge"/>
  <line x1="196" y1="292" x2="196" y2="217" class="bridge"/>
  <line x1="262" y1="108" x2="262" y2="178" class="bridge"/>
  <line x1="280" y1="292" x2="280" y2="221" class="bridge"/>
  <line x1="205" y1="200" x2="232" y2="200" class="bridge"/>
  <text x="60" y="92" font-size="14" class="dim">A</text>
  <text x="60" y="322" font-size="14" class="dim">C</text>
  <text x="140" y="206" font-size="14" class="dim">B</text>
  <text x="264" y="206" font-size="14" class="dim">D</text>

  <!-- ══ 오른쪽: 그래프 ══ -->
  <path d="M520,110 Q466,151 445,215" class="edge"/>
  <path d="M520,110 Q499,174 445,215" class="edge"/>
  <path d="M520,320 Q499,254 445,215" class="edge"/>
  <path d="M520,320 Q466,281 445,215" class="edge"/>
  <line x1="520" y1="110" x2="595" y2="215" class="edge"/>
  <line x1="520" y1="320" x2="595" y2="215" class="edge"/>
  <line x1="445" y1="215" x2="595" y2="215" class="edge"/>
  <circle cx="520" cy="110" r="7" fill="#3A5C77"/>
  <circle cx="445" cy="215" r="7" fill="#3A5C77"/>
  <circle cx="595" cy="215" r="7" fill="#3A5C77"/>
  <circle cx="520" cy="320" r="7" fill="#3A5C77"/>
  <text x="533" y="106" font-size="13" class="blue">A · 3</text>
  <text x="392" y="212" font-size="13" class="blue">B · 5</text>
  <text x="608" y="212" font-size="13" class="blue">D · 3</text>
  <text x="533" y="330" font-size="13" class="blue">C · 3</text>

  <text x="46" y="368" font-size="13" class="dim">왼쪽 — 갈색 막대가 다리, 옅은 청색 띠가 강, 글자 A B C D 가 네 땅이다.</text>
  <text x="46" y="392" font-size="13" class="dim">오른쪽 — 파란 선이 같은 다리, 점이 같은 땅, 점 옆의 수가 그 점에 붙은 선의 개수다.</text>
  <text x="46" y="418" font-size="13" class="sien">⚠ 다리 배치는 널리 쓰이는 그림을 따라 이 노트가 재구성한 것이다 — 배치를 직접 밝히는 출처는 아직 없다.</text>
</svg>
