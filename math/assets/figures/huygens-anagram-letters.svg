<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 422" role="img" aria-label="그림 위쪽에 「세어 보면 답이 나온다 — 하위헌스의 아나그램」이라는 표제가 있다. 그 아래에 뒤섞어 실은 글자를 세면 3년 뒤 공개한 문장의 글자와 낱낱이 같다는 설명이 있다. 가운데에는 가로선 위에 작은 네모를 쌓아 올린 기둥이 열일곱 개 서 있다. 기둥마다 아래에 알파벳이 하나씩 붙어 있고 왼쪽부터 a, c, d, e, g, h, i, l, m, n, o, p, q, r, s, t, u 순이다. 네모의 개수가 그 글자가 나오는 횟수이며 a 일곱, c 다섯, d 하나, e 다섯, g 하나, h 하나, i 일곱, l 넷, m 둘, n 아홉, o 넷, p 둘, q 하나, r 둘, s 하나, t 다섯, u 다섯이다. h 의 네모 하나와 글자 h 자체가 진한 색이고 그 아래에 h 는 하나이고 b 는 없다고 적혀 있다. 오른쪽에는 글자가 열일곱 가지이고 모두 62개라고 적혀 있다. 그 아래에 1659년 『토성의 체계』에서 풀어 보인 라틴어 문장이 기울인 글씨로 적혀 있고, 이 문장의 글자를 세면 위 그림과 낱낱이 같다는 설명이 붙어 있다. 이어서 다른 철자로 적으면 어떻게 어긋나는지가 두 줄 적혀 있다. cobaerente 로 적으면 목록에 없는 b 를 쓰게 되고, coherente 로 적으면 a 가 하나 모자라 61개가 된다는 것이다. 맨 아래에는 단서가 있다. 이 노트의 출처는 소문자 엘 넷 가운데 둘을 대문자 아이로 옮겼으며 소문자 엘로 읽어야 수가 맞는다는 것이다">
  <title>세어 보면 답이 나온다 — 하위헌스의 아나그램</title>
