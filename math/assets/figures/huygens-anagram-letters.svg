  <text x="210.0" y="236" font-size="13" text-anchor="middle" class="ax">g</text>
  <rect x="241.0" y="203.0" width="11" height="11" rx="1.5" class="tileh"/>
  <text x="246.5" y="236" font-size="13" text-anchor="middle" class="sien">h</text>
  <rect x="277.5" y="203.0" width="11" height="11" rx="1.5" class="tile"/>
  <rect x="277.5" y="190.0" width="11" height="11" rx="1.5" class="tile"/>
  <rect x="277.5" y="177.0" width="11" height="11" rx="1.5" class="tile"/>
