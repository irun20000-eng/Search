    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
    .tile{fill:#E6D5BD;stroke:#9C5A2C;stroke-width:0.8;}
    .tileh{fill:#9C5A2C;stroke:#9C5A2C;stroke-width:0.8;}
  </style>
