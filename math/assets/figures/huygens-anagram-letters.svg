  <text x="246.5" y="264" font-size="12" text-anchor="middle" class="sien">h 는 하나, b 는 없다</text>
  <text x="656" y="264" font-size="12" text-anchor="end" class="dim">글자 열일곱 가지 · 모두 62개</text>
  <text x="46" y="300" font-size="12" class="ax">1659년 『토성의 체계』에서 풀어 보인 문장</text>
  <text x="46" y="322" font-size="14" font-style="italic">Annulo cingitur, tenui, plano, nusquam cohaerente, ad eclipticam inclinato.</text>
  <text x="46" y="346" font-size="13" class="dim">이 문장의 글자를 세면 위 그림과 낱낱이 같다 — 그래서 뒤섞기가 풀린다.</text>
  <text x="46" y="368" font-size="12" class="ax">cobaerente 로 적으면 목록에 없는 b 를 쓰게 된다.</text>
  <text x="46" y="386" font-size="12" class="ax">coherente 로 적으면 a 가 하나 모자라 61개가 된다.</text>
  <text x="46" y="408" font-size="12" class="sien">⚠ 이 노트의 출처는 소문자 엘(l) 넷 가운데 둘을 대문자 아이(I)로 옮겼다 — 엘로 읽어야 수가 맞는다 [4].</text>
</svg>
