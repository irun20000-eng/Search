<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 296" role="img" aria-label="정수 지수는 풀려 있고 반정수 자리는 비어 있는 지수 눈금">
  <title>월리스의 보간 — 정수 자리를 늘어놓고 사이를 메운다</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
  </style>
  <rect width="700" height="296" fill="#FFFDF7"/>

  <text x="60" y="30" font-size="16">∫₀¹ (1 − x²)ⁿ dx — 지수 n 을 정수 밖으로</text>

  <!-- 눈금 -->
  <line x1="90" y1="118" x2="612" y2="118" stroke="#8A7F6E" stroke-width="1.4"/>
  <text x="632" y="122" font-size="14" font-style="italic" class="ax">n</text>

  <!-- 정수 자리 — 카발리에리 위에서 풀린다 -->
  <circle cx="90"  cy="118" r="6.5" fill="#221E18"/>
  <circle cx="264" cy="118" r="6.5" fill="#221E18"/>
  <circle cx="438" cy="118" r="6.5" fill="#221E18"/>
  <circle cx="612" cy="118" r="6.5" fill="#221E18"/>
  <text x="90"  y="96" font-size="15" text-anchor="middle">0</text>
  <text x="264" y="96" font-size="15" text-anchor="middle">1</text>
  <text x="438" y="96" font-size="15" text-anchor="middle">2</text>
  <text x="612" y="96" font-size="15" text-anchor="middle">3</text>
  <text x="90"  y="150" font-size="13" text-anchor="middle" class="dim">풀림</text>
  <text x="264" y="150" font-size="13" text-anchor="middle" class="dim">풀림</text>
  <text x="438" y="150" font-size="13" text-anchor="middle" class="dim">풀림</text>
  <text x="612" y="150" font-size="13" text-anchor="middle" class="dim">풀림</text>

  <!-- 반정수 자리 — 비어 있다. 그중 1/2 이 그가 원한 값이다 -->
  <circle cx="177" cy="118" r="6.5" fill="#FFFDF7" stroke="#9C5A2C" stroke-width="2" stroke-dasharray="3 2.5"/>
  <circle cx="351" cy="118" r="6.5" fill="#FFFDF7" stroke="#3A5C77" stroke-width="2" stroke-dasharray="3 2.5"/>
  <circle cx="525" cy="118" r="6.5" fill="#FFFDF7" stroke="#3A5C77" stroke-width="2" stroke-dasharray="3 2.5"/>
  <text x="177" y="96" font-size="15" text-anchor="middle" class="sien">1/2</text>
  <text x="351" y="96" font-size="15" text-anchor="middle" class="blue">3/2</text>
  <text x="525" y="96" font-size="15" text-anchor="middle" class="blue">5/2</text>
  <text x="177" y="150" font-size="15" text-anchor="middle" class="sien">?</text>
  <text x="351" y="150" font-size="15" text-anchor="middle" class="blue">?</text>
  <text x="525" y="150" font-size="15" text-anchor="middle" class="blue">?</text>

  <!-- 사이를 메운다 -->
  <line x1="90" y1="186" x2="612" y2="186" stroke="#8A7F6E" stroke-width="1.1" stroke-dasharray="5 4"/>
  <line x1="90" y1="180" x2="90" y2="192" stroke="#8A7F6E" stroke-width="1.1"/>
  <line x1="612" y1="180" x2="612" y2="192" stroke="#8A7F6E" stroke-width="1.1"/>
  <text x="351" y="210" font-size="13.5" text-anchor="middle" class="ax">사이를 메운다 = 보간(interpolation) — 그 낱말을 그가 이 책에서 도입했다</text>

  <text x="60" y="252" font-size="13" class="sien">그가 원한 값이 하필 빈칸에 있었다 — n = 1/2 의 적분이 곧 사분원의 넓이(π/4)다.</text>
  <text x="60" y="274" font-size="13" class="dim">정수 자리의 규칙이 사이에서도 이어진다고 본 것이라, 오늘 기준으로는 증명이 아니라 귀납이다.</text>
</svg>
