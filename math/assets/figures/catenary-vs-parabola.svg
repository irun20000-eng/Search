  <text x="56.0" y="420.0" font-size="12" class="dim">가장 벌어지는 곳에서도 처짐의 <tspan font-weight="600">2.0%</tspan> 뿐이다.</text>
  <text x="56" y="448.0" font-size="11" class="ax">⚠ 포물선은 같은 두 끝점·같은 처짐에 맞춰 골랐다. 다른 포물선을 고르면 차이도 달라진다.</text>
  <text x="56" y="466.0" font-size="11" class="ax">⚠ 아래 틀의 차이는 20배로 늘린 것이다. 실제로는 선 굵기보다 얇다.</text>
  <text x="56" y="484.0" font-size="11" class="ax">⚠ 이 그림은 둘이 다르다는 것만 보인다. 그 곡선이 무엇인지는 본문 5절의 세 사람이 미분방정식으로 했다.</text>
