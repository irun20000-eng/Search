  <text x="56" y="30" font-size="16">늘어진 사슬은 포물선인가 — 겹쳐 놓고 차이를 늘려 본다</text>
  <text x="56" y="52" font-size="12" class="dim">같은 두 끝점에 같은 처짐으로 맞춰 그렸다.</text>
