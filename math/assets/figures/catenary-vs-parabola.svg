<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 502" role="img" aria-label="그림 위쪽에 「늘어진 사슬은 포물선인가 — 겹쳐 놓고 차이를 늘려 본다」라는 표제가 있고 그 아래에 같은 두 끝점에 같은 처짐으로 맞춰 그렸다고 적혀 있다. 위쪽 틀에는 양 끝이 위로 올라가고 가운데가 처진 곡선이 그려져 있다. 실선과 파선 두 곡선이 겹쳐 있는데 거의 구별되지 않는다. 실선은 사슬이 그리는 곡선이고 파선은 포물선이며, 두 곡선은 양 끝과 한가운데에서 만나고 그 사이에서는 사슬이 더 처진다고 적혀 있다. 그 아래쪽 틀에는 두 곡선의 차이만 따로 그렸는데, 가로선에서 아래로 처진 골이 둘 있고 스무 배로 늘린 것이며 아래로 그린 것이 사슬이 더 처진 만큼이다. 가운데를 기준으로 좌우 대칭이고, 골이 가장 깊은 두 자리에 점이 찍혀 있다. 그 옆에 가장 벌어지는 곳에서도 처짐의 2.0퍼센트뿐이라고 적혀 있다. 맨 아래에는 단서가 셋 있다. 첫째는 포물선을 같은 두 끝점과 같은 처짐에 맞춰 골랐으며 다른 포물선을 고르면 차이도 달라진다는 것이고, 둘째는 아래 틀의 차이가 스무 배로 늘린 것이고 실제로는 선 굵기보다 얇다는 것이고, 셋째는 이 그림이 둘이 다르다는 것만 보일 뿐 그 곡선이 무엇인지는 말하지 않으며 그것은 본문 5절의 세 사람이 미분방정식으로 한 일이라는 것이다">
  <title>늘어진 사슬은 포물선인가 — 겹쳐 놓고 차이를 늘려 본다</title>
