<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="그림 위쪽에 「빈칸을 남긴 표 브리그스」라는 표제가 있고 그 아래에 가로축은 로그를 실은 자연수(1~100,000)이며 갈색은 소수 14자리, 푸른색은 소수 10자리, 점선 칸은 비워 둔 자리라고 적혀 있다. 줄이 넷 있다. 첫 줄 1617 『최초의 천 개 로그』 1~1,000 에는 왼쪽 끝에 아주 가는 갈색 막대가 있고 1,000 까지, 막대가 가늘다라고 적혀 있다. 둘째 줄 1624 『로그 산술』 1~20,000 과 90,000~100,000 에는 왼쪽 0~20,000 과 오른쪽 90,000~100,000 에 갈색 막대가 있고 그 사이는 갈색 점선 칸이며 그 아래에 비워 둔 70,000개, 「여럿이 나눠 셈하자」라고 적혀 있다. 셋째 줄 1627 더 데커르 · 1628 플라크 1~100,000 (빈칸을 채움)에는 처음부터 끝까지 푸른 막대가 이어진다. 넷째 줄에는 막대 없이 1630.1.26 브리그스가 죽다 · 1633 『영국의 삼각법』(죽은 뒤, 겔리브랜드)이라고 적혀 있다. 가로축에 0부터 100,000까지 20,000마다 눈금이 있다. 맨 아래에 단서가 셋 있다. 첫째, 범위 · 자릿수 · 해는 1번(MacTutor)과 3번 · 4번(플라크)을 따랐고 국내 수학산책은 두 번째 표를 「10년 뒤」로 적는다. 둘째, 1627 표는 더 데커르의 이름으로 나왔고 1628 판은 플라크의 이름이며 누가 셈했는지는 자료가 갈린다(본문 §5). 셋째, 『영국의 삼각법』은 MacTutor 가 1633 런던, 위키백과가 1631 하우다 인쇄 · 1633 출간으로 적고 막대 길이는 이 노트가 그렸다">
  <title>빈칸을 남긴 표 — 브리그스</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;fill:#221E18;}
    .dim{fill:#5B5245;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;} .blue{fill:#3A5C77;}
    .axis{stroke:#8A7F6E;stroke-width:1;} .tick{stroke:#8A7F6E;stroke-width:1;}
    .row{stroke:#C9BBA6;stroke-width:1;fill:none;}
    .b14{fill:#9C5A2C;} .b10{fill:#3A5C77;} .gap{fill:none;stroke:#9C5A2C;stroke-width:1;stroke-dasharray:4 3;}
  </style>
  <rect width="720" height="520" fill="#FFFDF7"/>
  <text x="30" y="30" font-size="16">빈칸을 남긴 표 — 브리그스</text>
  <text x="30" y="50" font-size="11" class="dim">가로축은 로그를 실은 자연수(1~100,000). 갈색은 소수 14자리, 푸른색은 소수 10자리, 점선 칸은 비워 둔 자리다.</text>
  <text x="30" y="108" font-size="11" class="sien">1617 『최초의 천 개 로그』 — 1~1,000</text>
  <line x1="60" y1="130" x2="650" y2="130" class="row"/>
  <rect x="60" y="123" width="5.90" height="14" class="b14"/>
  <text x="73.9" y="152" font-size="10.5" class="dim">1,000 까지 — 막대가 가늘다</text>

  <text x="30" y="178" font-size="11" class="sien">1624 『로그 산술』 — 1~20,000 과 90,000~100,000</text>
  <line x1="60" y1="200" x2="650" y2="200" class="row"/>
  <rect x="60" y="193" width="118.00" height="14" class="b14"/>
  <rect x="178" y="193" width="413.00" height="14" class="gap"/>
  <rect x="591" y="193" width="59.00" height="14" class="b14"/>
  <text x="384.50" y="224" font-size="10.5" class="sien" text-anchor="middle">비워 둔 70,000개 — 「여럿이 나눠 셈하자」</text>

  <text x="30" y="248" font-size="11" class="blue">1627 더 데커르 · 1628 플라크 — 1~100,000 (빈칸을 채움)</text>
  <line x1="60" y1="270" x2="650" y2="270" class="row"/>
  <rect x="60" y="263" width="590" height="14" class="b10"/>

  <text x="30" y="318" font-size="11" class="dim">1630.1.26 브리그스가 죽다 · 1633 『영국의 삼각법』(죽은 뒤, 겔리브랜드)</text>
  <line x1="60" y1="340" x2="650" y2="340" class="row"/>

  <line x1="60" y1="380" x2="650" y2="380" class="axis"/>
  <line x1="60" y1="376" x2="60" y2="384" class="tick"/><text x="60" y="397" font-size="10" class="ax" text-anchor="middle">0</text>
  <line x1="178" y1="376" x2="178" y2="384" class="tick"/><text x="178" y="397" font-size="10" class="ax" text-anchor="middle">20,000</text>
  <line x1="296" y1="376" x2="296" y2="384" class="tick"/><text x="296" y="397" font-size="10" class="ax" text-anchor="middle">40,000</text>
  <line x1="414" y1="376" x2="414" y2="384" class="tick"/><text x="414" y="397" font-size="10" class="ax" text-anchor="middle">60,000</text>
  <line x1="532" y1="376" x2="532" y2="384" class="tick"/><text x="532" y="397" font-size="10" class="ax" text-anchor="middle">80,000</text>
  <line x1="650" y1="376" x2="650" y2="384" class="tick"/><text x="650" y="397" font-size="10" class="ax" text-anchor="middle">100,000</text>

  <text x="30" y="440" font-size="10" class="ax">⚠ 범위 · 자릿수 · 해는 1번(MacTutor)과 3번 · 4번(플라크)을 따랐다. 국내 수학산책은 두 번째 표를 「10년 뒤」로 적는다.</text>
  <text x="30" y="456" font-size="10" class="ax">⚠ 1627 표는 더 데커르의 이름으로 나왔고, 1628 판은 플라크의 이름이다. 누가 셈했는지는 자료가 갈린다(본문 §5).</text>
  <text x="30" y="472" font-size="10" class="ax">⚠ 『영국의 삼각법』은 MacTutor 가 1633 런던, 위키백과가 1631 하우다 인쇄 · 1633 출간으로 적는다. 막대 길이는 이 노트가 그렸다.</text>
</svg>
