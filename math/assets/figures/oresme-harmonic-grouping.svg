<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" role="img" aria-label="조화급수의 첫 열여섯 항을 막대로 그린 그림. 두 번째 항부터 항을 1개, 2개, 4개, 8개씩 묶었고, 묶음마다 그 안의 가장 작은 항 높이로 깎은 파선 직사각형이 겹쳐져 있다. 직사각형의 넓이는 묶음마다 정확히 이분의 일이므로 어느 묶음의 합도 이분의 일 아래로 내려가지 않는다. 묶음을 계속 늘리면 합은 얼마든지 커진다">
  <title>오렘의 묶음 — 조화급수가 발산하는 이유</title>
  <style>
    text{font-family:EB Garamond, Georgia, 'Noto Serif KR', 'Noto Serif CJK KR', NanumMyeongjo, Batang, AppleMyungjo, serif;
         font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;fill:#221E18;}
    .dim{fill:#5B5245;} .blue{fill:#3A5C77;} .sien{fill:#9C5A2C;} .ax{fill:#8A7F6E;}
  </style>
  <rect width="700" height="392" fill="#FFFDF7"/>
  <text x="46" y="30" font-size="16">항을 1, 2, 4, 8개씩 묶으면 어느 묶음도 ½ 아래로 내려가지 않는다</text>

  <rect x="62.0" y="100.0" width="33.0" height="200.0" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="99.0" y="200.0" width="33.0" height="100.0" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="136.0" y="233.3" width="33.0" height="66.7" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="173.0" y="250.0" width="33.0" height="50.0" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="210.0" y="260.0" width="33.0" height="40.0" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="247.0" y="266.7" width="33.0" height="33.3" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="284.0" y="271.4" width="33.0" height="28.6" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="321.0" y="275.0" width="33.0" height="25.0" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="358.0" y="277.8" width="33.0" height="22.2" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="395.0" y="280.0" width="33.0" height="20.0" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="432.0" y="281.8" width="33.0" height="18.2" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="469.0" y="283.3" width="33.0" height="16.7" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="506.0" y="284.6" width="33.0" height="15.4" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="543.0" y="285.7" width="33.0" height="14.3" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="580.0" y="286.7" width="33.0" height="13.3" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="617.0" y="287.5" width="33.0" height="12.5" fill="#E6D5BD" stroke="#9C5A2C" stroke-width="1"/>
  <rect x="99.0" y="200.0" width="33.0" height="100.0" fill="none" stroke="#3A5C77" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="136.0" y="250.0" width="70.0" height="50.0" fill="none" stroke="#3A5C77" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="210.0" y="275.0" width="144.0" height="25.0" fill="none" stroke="#3A5C77" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="358.0" y="287.5" width="292.0" height="12.5" fill="none" stroke="#3A5C77" stroke-width="1.6" stroke-dasharray="5 3"/>
  <line x1="55" y1="300" x2="690" y2="300" stroke="#8A7F6E" stroke-width="1.3"/>
  <line x1="78.5" y1="300" x2="78.5" y2="305" stroke="#8A7F6E" stroke-width="1"/>
  <text x="78.5" y="90.0" font-size="12" text-anchor="middle" class="ax">1/1</text>
  <line x1="115.5" y1="300" x2="115.5" y2="305" stroke="#8A7F6E" stroke-width="1"/>
  <text x="115.5" y="190.0" font-size="12" text-anchor="middle" class="ax">1/2</text>
  <line x1="189.5" y1="300" x2="189.5" y2="305" stroke="#8A7F6E" stroke-width="1"/>
  <text x="189.5" y="240.0" font-size="12" text-anchor="middle" class="ax">1/4</text>
  <line x1="337.5" y1="300" x2="337.5" y2="305" stroke="#8A7F6E" stroke-width="1"/>
  <text x="337.5" y="265.0" font-size="12" text-anchor="middle" class="ax">1/8</text>
  <line x1="633.5" y1="300" x2="633.5" y2="305" stroke="#8A7F6E" stroke-width="1"/>
  <text x="633.5" y="277.5" font-size="12" text-anchor="middle" class="ax">1/16</text>
  <path d="M 99.0 310 L 99.0 316 L 132.0 316 L 132.0 310" fill="none" stroke="#8A7F6E" stroke-width="1.1"/>
  <path d="M 136.0 310 L 136.0 316 L 206.0 316 L 206.0 310" fill="none" stroke="#8A7F6E" stroke-width="1.1"/>
  <path d="M 210.0 310 L 210.0 316 L 354.0 316 L 354.0 310" fill="none" stroke="#8A7F6E" stroke-width="1.1"/>
  <path d="M 358.0 310 L 358.0 316 L 650.0 316 L 650.0 310" fill="none" stroke="#8A7F6E" stroke-width="1.1"/>
  <text x="115.5" y="333" font-size="13.5" text-anchor="middle" class="blue">≥ ½</text>
  <text x="171.0" y="333" font-size="13.5" text-anchor="middle" class="blue">≥ ½</text>
  <text x="282.0" y="333" font-size="13.5" text-anchor="middle" class="blue">≥ ½</text>
  <text x="504.0" y="333" font-size="13.5" text-anchor="middle" class="blue">≥ ½</text>

  <text x="330" y="118" font-size="13.5" class="blue">파선 직사각형 = 묶음 안의 가장 작은 항 높이로 깎은 것</text>
  <text x="330" y="139" font-size="13" class="dim">칸 수 × 그 높이 = ½ 이므로, 깎고도 ½ 이다</text>
  <text x="330" y="167" font-size="14">그래서 첫 16항의 합은 3보다 크다</text>
  <text x="330" y="188" font-size="13" class="dim">묶음을 하나 늘릴 때마다 ½ 씩 더 커진다</text>

  <text x="46" y="360" font-size="13" class="dim">막대 높이가 1/1, 1/2, …, 1/16 이다. 첫 항은 묶지 않고 그대로 둔다.</text>
  <text x="46" y="380" font-size="13" class="dim">묶음은 1/2 하나, 1/3~1/4 둘, 1/5~1/8 넷, 1/9~1/16 여덟 개씩이다.</text>
</svg>