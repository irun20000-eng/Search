    images: [parent12_01.webp, parent12_02.webp, parent12_03.webp, parent12_04.webp, parent12_05.webp, parent12_06.webp, parent12_07.webp, parent12_08.webp, parent12_09.webp, parent12_10.webp]
    caption: "깨진 컵도 구겨진 시험지도 늘 나중에야 알게 됩니다.\n\n아이는 실수가 아니라 그때의 반응을 기억합니다.\n\"왜 그랬어\"는 묻는 말처럼 들리지만 아이에게는 판정으로 닿습니다.\n확인 · 분리 · 복구. 덮을 이유가 줄어야 다음 실수를 먼저 말하게 됩니다.\n\n저장해두고 말이 먼저 나오려 할 때 다시 꺼내 보세요.\n\n#부모노트 #실수 #훈육 #육아 #신뢰"
  - folder: 일머리노트_03_집중력
    date: 2026-08-20
    series: work
    title: "집중력을 관리하는 법"
    angle: "의지가 아니라 환경을 설계한다"
    layout: C
    images: [work03_01.webp, work03_02.webp, work03_03.webp, work03_04.webp, work03_05.webp, work03_06.webp, work03_07.webp, work03_08.webp, work03_09.webp, work03_10.webp]
    caption: "붙잡을수록 흩어지는 이유가 있습니다.\n\n집중은 의지의 문제가 아니라 환경의 문제입니다. 매번 다잡는 대신, 주의를 끄는 것을 먼저 치우고 방해 없는 시간을 한 덩어리로 묶어 두면 됩니다.\n치우기 · 묶기 · 신호 — 한 번 설계해 두면 다음엔 저절로 굴러갑니다.\n\n저장해두고 주의가 자꾸 샐 때 다시 꺼내 보세요.\n\n#일머리노트 #집중력 #환경설계 #생산성 #직장인"

  - folder: 숫자노트_04_기저율
    date: 2026-08-25
    series: number
    title: "기저율의 함정"
    angle: "99% 정확한 검사도 대부분 틀릴 수 있다"
    layout: A
    images: [number04_01.webp, number04_02.webp, number04_03.webp, number04_04.webp, number04_05.webp, number04_06.webp, number04_07.webp, number04_08.webp, number04_09.webp, number04_10.webp]
    caption: "'정확도 99%'라는 말은 내 확률이 아닙니다.\n\n1000명 중 환자가 1명인 병을 오류율 5%짜리 검사로 걸러 보면, 양성은 51명쯤 나오는데 그중 진짜 환자는 1명입니다. 계산은 틀리지 않았습니다. 틀릴 사람이 999명이라서 그렇습니다.\n기저율 · 사람 수로 세기 · 나란히 두기 — 양성을 만났을 때 확인할 셋입니다.\n\n저장해두고 '정확도 99%'라는 말을 만날 때 다시 꺼내 보세요.\n\n#숫자노트 #기저율 #베이즈정리 #양성예측도 #데이터리터러시"

  - folder: 발견노트_03_브라에스역설
    date: 2026-08-27
    series: discovery
    title: "브라에스의 역설"
    angle: "길을 늘렸는데 더 막힌다"
    layout: C
    images: [discovery03_01.webp, discovery03_02.webp, discovery03_03.webp, discovery03_04.webp, discovery03_05.webp, discovery03_06.webp, discovery03_07.webp, discovery03_08.webp, discovery03_09.webp, discovery03_10.webp]
    caption: "길을 하나 더 놓았더니 모두가 늦어졌습니다.\n\n4,000대가 두 갈래로 나뉘어 65분에 가던 길에, 두 길을 잇는 짧은 샛길을 냈습니다. 처음 그 길을 탄 사람은 25분을 벌었지만, 결국 모두가 그리로 옮겨 타 전원이 80분이 됐습니다. 혼자 빠져나오면 85분이라 되돌아갈 수도 없습니다.\n1968년 수학자 브라에스가 논문 한 편으로 보인 이야기입니다. 아무도 잘못 고르지 않았는데 전체는 나빠집니다.\n\n저장해두고 무언가를 늘리려 할 때 다시 꺼내 보세요.\n\n#발견노트 #브라에스의역설 #내시균형 #네트워크 #교양"

  - folder: 부모노트_13_친구문제
    date: 2026-09-01
    series: parent
    title: "친구 문제로 힘들어할 때"
    angle: "듣는 자리와 고치는 자리는 다르다"
    layout: A
    images: [parent13_01.webp, parent13_02.webp, parent13_03.webp, parent13_04.webp, parent13_05.webp, parent13_06.webp, parent13_07.webp, parent13_08.webp, parent13_09.webp, parent13_10.webp]
    caption: "친구 이야기는 대개 한 줄로 시작해서 그대로 닫힙니다.\n\n누가 잘못했는지 가리고 대신 해결해 주면 문제는 줄어도 말이 줄어듭니다. 아이가 찾는 것은 답이 아니라 말할 자리입니다.\n듣기 · 정리 · 선택 — 다음에 할 일을 아이가 고르게 두면 다음 이야기도 꺼내집니다.\n\n저장해두고 아이가 말을 꺼낼 때 다시 꺼내 보세요.\n\n#부모노트 #친구관계 #또래관계 #경청 #육아"

  - folder: 일머리노트_04_동시에벌이면
    date: 2026-09-03
    series: work
    title: "동시에 벌이면 늦어진다"
    angle: "벌여 놓은 개수가 곧 기다림의 길이다"
    layout: A
    images: [work04_01.webp, work04_02.webp, work04_03.webp, work04_04.webp, work04_05.webp, work04_06.webp, work04_07.webp, work04_08.webp, work04_09.webp, work04_10.webp]
    caption: "하루 종일 붙잡고 있었는데 끝난 것은 하나도 없습니다.\n\n일을 더 시작해도 끝내는 속도는 그대로입니다. 그러면 늘어난 것은 성과가 아니라 줄 서 있는 시간입니다. 동시에 12건을 붙잡고 한 주에 3건을 끝내는 팀은, 새로 들어온 일이 4주 뒤에 끝납니다. 12 나누기 3입니다.\n1961년 존 리틀이 증명한 식이 이것을 말합니다 — 기다림은 개수 나누기 속도입니다. 속도를 두 배로 올리는 것과 개수를 절반으로 줄이는 것은 같은 크기의 손잡이인데, 뒤의 것은 오늘 할 수 있습니다.\n세기 · 나누기 · 줄이기 — 새로 시작하기 전에 하나를 끝내는 것부터입니다.\n\n저장해두고 일이 자꾸 밀릴 때 다시 꺼내 보세요.\n\n#일머리노트 #리틀의법칙 #리드타임 #WIP #생산성"

