<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>카드뉴스 — 이룬 서재</title>
<meta name="description" content="한 장씩 넘겨 보는 짧은 노트. 부모 노트 · 일머리 노트 · 숫자 노트 · 발견 노트." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/topbar.css" />
<link rel="stylesheet" href="../assets/basket.css" />
<style>
  :root{
    --bg:#FFF8F0; --card:#FFFFFF; --line:#EFE6DA; --line2:#F1E9DD;
    --ink:#2B2622; --muted:#8A7E72; --accent:#E8743B; --accent-soft:#FCEDE1;
    --chip:#F7F1E8; --maxw:1080px;
    --shadow:0 6px 22px rgba(120,90,60,.08);
    --barbg:rgba(255,248,240,.92);
  }
  :root[data-theme=dark]{
    --bg:#1a1613; --card:#241f1a; --line:#3a322a; --line2:#332c25;
    --ink:#f0e8de; --muted:#a99d8e; --accent:#F2894C; --accent-soft:#3a2a1e;
    --chip:#2c251e;
    --shadow:0 6px 22px rgba(0,0,0,.35);
    --barbg:rgba(26,22,19,.92);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Nunito,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7}
  a{color:inherit}
  .tbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:5px 12px;font:inherit;font-size:.8rem;cursor:pointer}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:32px 20px 60px}
  h1{font-size:2rem;margin:0 0 6px;letter-spacing:-.02em}
  .lead{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  .sbar{display:flex;gap:8px;align-items:center;margin:0 0 14px}
  .sbar input{flex:1;min-width:0;border:1.4px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:.9rem}
  .sbar input:focus{outline:none;border-color:var(--accent)}
  .sbar .cnt{font-size:.82rem;color:var(--muted);white-space:nowrap}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
  .f{border:1.4px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}
  .f.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .ec{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;
    cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;
    box-shadow:var(--shadow);transition:transform .14s,border-color .14s}
  .ec:hover{transform:translateY(-3px);border-color:var(--accent)}
  .ec .thumb{aspect-ratio:1080/1350;background:var(--chip);overflow:hidden;border-bottom:1.5px solid var(--line)}
  .ec .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ec .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .sbadge{font-size:.71rem;font-weight:800;border-radius:999px;padding:2px 9px;
    align-self:flex-start;color:#fff}
  .ec h3{margin:0;font-size:1rem;font-weight:800;line-height:1.4;letter-spacing:-.01em}
  .ec .ang{font-size:.82rem;color:var(--muted);line-height:1.5}
  .ec .n{font-size:.74rem;color:var(--muted);margin-top:2px}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  /* ── 뷰어 ── */
  .ov{position:fixed;inset:0;z-index:60;background:rgba(20,14,8,.62);backdrop-filter:blur(3px);
    display:none;overflow:auto;padding:22px 14px}
  .ov.on{display:block}
  .sheet{max-width:640px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);
    border-radius:20px;padding:18px 18px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .shead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .shead .t{flex:1}
  .shead h2{margin:2px 0 3px;font-size:1.12rem;line-height:1.4}
  .shead .ang{font-size:.84rem;color:var(--muted)}
  .close{border:1px solid var(--line);background:var(--bg);color:var(--muted);
    border-radius:999px;width:34px;height:34px;font-size:1.1rem;cursor:pointer;line-height:1;flex:none}
  .stage{position:relative;background:var(--chip);border-radius:14px;overflow:hidden;
    aspect-ratio:1080/1350;touch-action:pan-y}
  .stage img{width:100%;height:100%;object-fit:contain;display:block}
  .nav{position:absolute;top:50%;transform:translateY(-50%);border:none;
    background:rgba(0,0,0,.42);color:#fff;width:40px;height:40px;border-radius:999px;
    font-size:1.2rem;cursor:pointer;line-height:1}
  .nav:disabled{opacity:.25;cursor:default}
  .nav.prev{left:8px} .nav.next{right:8px}
  .dots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:999px;background:var(--line);border:none;padding:0;cursor:pointer}
  .dot.on{background:var(--accent);width:20px}
  .idx{text-align:center;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
  .capwrap{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
  .capbtn{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;
    padding:5px 13px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
  .cap{display:none;white-space:pre-wrap;font-size:.9rem;color:var(--ink);margin-top:10px;
    background:var(--chip);border-radius:12px;padding:13px 15px}
  .cap.on{display:block}
  .studylink{display:inline-block;margin-top:12px;font-size:.85rem;font-weight:700;
    color:var(--accent);text-decoration:none;border:1.4px solid var(--accent);
    border-radius:999px;padding:5px 14px}
  footer{border-top:1px solid var(--line);color:var(--muted);font-size:.83rem;
    padding:22px 20px 40px;text-align:center}
  footer code{background:var(--chip);border-radius:5px;padding:1px 5px}
  @media(max-width:640px){.wrap{padding:24px 15px 50px}h1{font-size:1.6rem}}
  /* 담기는 카드 내용 길이와 무관하게 늘 카드 오른쪽 아래 같은 자리에 온다.
     grid 는 같은 행의 카드 높이를 맞춰 주므로 margin-top:auto 면 눈높이가 맞는다. */
  .cardfoot{display:flex;justify-content:flex-end;align-items:center;
    margin-top:auto;padding-top:10px}
  .fspacer{flex:1}
</style>
</head>
<body>
<script src="../assets/topbar.js" data-section="cardnews" data-root="../"></script>
<span data-itb-slot><button class="tbtn" id="tbtn" onclick="toggleTheme()">🌙 다크</button></span>

<div class="wrap">
  <h1>카드뉴스</h1>
  <p class="lead">한 장씩 넘겨 보는 짧은 노트. 한 편은 10장으로 끝납니다.</p>
  <div class="sbar"><input id="sq" type="search" placeholder="이 서가에서 찾기 — 제목·앵글" aria-label="카드뉴스 검색"><span class="cnt" id="scnt"></span></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">해당하는 편이 없습니다.</div>
</div>

<footer>편별 컷은 <code>cardnews/assets/&lt;폴더&gt;/</code>에 있고, 이 페이지는 <code>cardnews/manifest.json</code>을 읽어 카드·필터를 산출합니다. 카피 정본은 <code>studio/contents/</code>입니다.</footer>

<div class="ov" id="ov" onclick="if(event.target===this)closeEp()">
  <div class="sheet">
    <div class="shead">
      <div class="t">
        <span class="sbadge" id="vbadge"></span>
        <h2 id="vtitle"></h2>
        <div class="ang" id="vang"></div>
      </div>
      <button class="close" onclick="closeEp()">✕</button>
    </div>
    <div class="stage">
      <img id="vimg" alt="" />
      <button class="nav prev" id="vprev" onclick="step(-1)" aria-label="이전 장">‹</button>
      <button class="nav next" id="vnext" onclick="step(1)" aria-label="다음 장">›</button>
    </div>
    <div class="dots" id="vdots"></div>
    <div class="idx" id="vidx"></div>
    <div class="capwrap">
      <button class="capbtn" onclick="toggleCap()" id="capbtn">캡션 보기</button>
      <div class="cap" id="vcap"></div>
      <div id="vstudy"></div>
    </div>
  </div>
</div>

<script src="../assets/basket.js"></script>
<script>
/* 테마 저장 키는 이룬 서재 전체가 stTheme 하나로 통일돼 있다(CLAUDE.md). */
function applyTheme(t){
  var de=document.documentElement;
  if(t==="dark"){ de.setAttribute("data-theme","dark"); } else { de.removeAttribute("data-theme"); }
  var b=document.getElementById("tbtn"); if(b) b.textContent=(t==="dark"?"☀️ 라이트":"🌙 다크");
}
function initTheme(){ var t="light"; try{ t=localStorage.getItem("stTheme")||"light"; }catch(e){} applyTheme(t); }
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
  var nt=cur==="dark"?"light":"dark";
  try{ localStorage.setItem("stTheme",nt); }catch(e){}
  applyTheme(nt);
}
initTheme();
Basket.init({section:"cardnews", root:"../"});

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var EPS=[], SERIES=[], SMAP={}, filt="all", cur=null, at=0;

function cardHTML(e){
  var s=SMAP[e.series]||{label:e.series,c1:"#888"};
  return '<div class="ec" role="button" tabindex="0" data-f="'+esc(e.folder)+'">'+
    '<div class="thumb"><img loading="lazy" src="assets/'+esc(e.folder)+'/'+esc(e.images[0])+'" alt=""></div>'+
    '<div class="body"><span class="sbadge" style="background:'+esc(s.c1)+'">'+esc(s.label)+'</span>'+
    '<h3>'+esc(e.title)+'</h3>'+
    '<div class="ang">'+esc(e.angle)+'</div>'+
    '<div class="n">'+e.images.length+'장'+(e.study?' · 이해편 있음':'')+'</div>'+
    '<div class="cardfoot">'+Basket.button({k:e.folder})+'</div>'+
    '</div></div>';
}

function matches(e, q){
  if(!q) return true;
  var s=SMAP[e.series]||{};
  var hay=(e.title+" "+e.angle+" "+(s.label||"")).toLowerCase();
  return hay.indexOf(q)>=0;
}
function paint(){
  var q=(document.getElementById("sq").value||"").trim().toLowerCase();
  var list = (filt==="all" ? EPS : EPS.filter(function(e){return e.series===filt}))
             .filter(function(e){ return matches(e,q); });
  var c=document.getElementById("scnt");
  c.textContent = q ? list.length+"편" : "";
  document.getElementById("grid").innerHTML=list.map(cardHTML).join("");
  var em=document.getElementById("empty");
  em.textContent = q ? '"'+q+'" — 찾는 편이 없습니다' : "해당하는 편이 없습니다.";
  em.style.display=list.length?"none":"";
  Array.prototype.forEach.call(document.querySelectorAll(".ec"),function(b){
    b.addEventListener("click",function(){ openEp(b.dataset.f); });
  });
  Basket.keyable(document, ".ec");
  Basket.wire(document, function(k){
    var e=EPS.filter(function(x){return x.folder===k})[0];
    if(!e) return null;
    var s=SMAP[e.series]||{};
    return { t:e.title, m:(s.label||"")+(e.date?" · "+e.date:""),
             u:"cardnews/#c="+k, kind:"cuts", cap:e.caption,
             imgs:e.images.map(function(i){ return "cardnews/assets/"+k+"/"+i; }) };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".f"),function(b){
    b.classList.toggle("on", b.dataset.k===filt);
  });
}

function show(i){
  if(!cur) return;
  at=Math.max(0,Math.min(cur.images.length-1,i));
  document.getElementById("vimg").src="assets/"+cur.folder+"/"+cur.images[at];
  document.getElementById("vidx").textContent=(at+1)+" / "+cur.images.length;
  document.getElementById("vprev").disabled=(at===0);
  document.getElementById("vnext").disabled=(at===cur.images.length-1);
  Array.prototype.forEach.call(document.querySelectorAll(".dot"),function(d,j){
    d.classList.toggle("on", j===at);
  });
}
function step(d){ show(at+d); }

function toggleCap(){
  var c=document.getElementById("vcap"), b=document.getElementById("capbtn");
  var on=c.classList.toggle("on");
  b.textContent = on ? "캡션 접기" : "캡션 보기";
}

function openEp(folder){
  var e=EPS.filter(function(x){return x.folder===folder})[0];
  if(!e) return;
  cur=e;
  var s=SMAP[e.series]||{label:e.series,c1:"#888"};
  var badge=document.getElementById("vbadge");
  badge.textContent=s.label; badge.style.background=s.c1;
  document.getElementById("vtitle").textContent=e.title;
  document.getElementById("vang").textContent=e.angle;
  document.getElementById("vdots").innerHTML=e.images.map(function(_,j){
    return '<button class="dot" data-i="'+j+'" aria-label="'+(j+1)+'장"></button>';}).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".dot"),function(d){
    d.addEventListener("click",function(){ show(+d.dataset.i); });
  });
  var cap=document.getElementById("vcap");
  cap.textContent=e.caption||""; cap.classList.remove("on");
  document.getElementById("capbtn").textContent="캡션 보기";
  document.getElementById("capbtn").style.display=e.caption?"":"none";
  document.getElementById("vstudy").innerHTML = e.study
    ? '<a class="studylink" href="../concept/#n='+esc(e.study)+'">이해편 읽기 →</a>' : "";
  document.getElementById("ov").classList.add("on");
  document.body.style.overflow="hidden";
  location.hash="c="+folder;
  show(0);
}
function closeEp(){
  document.getElementById("ov").classList.remove("on");
  document.body.style.overflow=""; cur=null;
  if(location.hash.indexOf("#c=")===0) history.replaceState(null,"",location.pathname);
}

document.addEventListener("keydown",function(e){
  if(!cur) return;
  if(e.key==="Escape") closeEp();
  else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="ArrowRight") step(1);
});

/* 모바일 스와이프 */
(function(){
  var x0=null;
  var st=document.querySelector(".stage");
  st.addEventListener("touchstart",function(e){ x0=e.touches[0].clientX; },{passive:true});
  st.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>44) step(dx<0?1:-1);
  },{passive:true});
})();

/* 뒤로가기·앞으로가기로 해시가 바뀌면 따라간다 */
window.addEventListener("hashchange",function(){
  var h=location.hash;
  if(h.indexOf("#c=")===0){ openEp(decodeURIComponent(h.slice(3))); }
  else if(document.getElementById("ov").classList.contains("on")){
    document.getElementById("ov").classList.remove("on");
    document.body.style.overflow=""; cur=null;
  }
});

document.getElementById("sq").addEventListener("input", paint);
/* / 를 누르면 검색창으로 — 허브와 같은 규약 */
document.addEventListener("keydown", function(e){
  if(e.key!=="/" || e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA") return;
  e.preventDefault(); document.getElementById("sq").focus();
});

fetch("manifest.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
  EPS=d.episodes||[]; SERIES=d.series||[];
  SERIES.forEach(function(s){ SMAP[s.key]=s; });
  document.getElementById("filters").innerHTML=
    '<button class="f on" data-k="all">전체 '+EPS.length+'</button>'+
    SERIES.map(function(s){
      var n=EPS.filter(function(e){return e.series===s.key}).length;
      return '<button class="f" data-k="'+esc(s.key)+'">'+esc(s.label)+' '+n+'</button>';
    }).join("");
  document.getElementById("filters").addEventListener("click",function(e){
    var b=e.target.closest(".f"); if(!b) return;
    filt=b.dataset.k; paint();
  });
  paint();
  var h=location.hash;
  if(h.indexOf("#c=")===0) openEp(decodeURIComponent(h.slice(3)));
}).catch(function(){
  document.getElementById("grid").innerHTML='<p class="empty">manifest.json 을 불러오지 못했습니다.</p>';
});
</script>
</body>
</html>
